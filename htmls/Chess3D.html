    this.board.addEventListener('click', (e) => this.handlers.onSquareClick(this.squareAt(e.clientX, e.clientY)));
    this.board.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') this.handlers.onSquareHover(this.squareAt(e.clientX, e.clientY)); });
    this.board.addEventListener('pointerleave', () => this.handlers.onSquareHover(-1));
    if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(wrap);
    this._relabel();
  }

  /** Creates and appends a full-board layer. */
  _layer(className) {
    const layer = document.createElement('div');
    layer.className = 'b2d-layer ' + className;
    this.board.appendChild(layer);
    return layer;
  }

  /** Creates the 64 square elements. */
  _buildSquares() {
    for (let square = 0; square < 64; square++) {
      const el = document.createElement('div');
      const isDark = (engine.fileOf(square) + engine.rankOf(square)) % 2 === 0;
      el.className = 'b2d-square ' + (isDark ? 'dark' : 'light');
      this.squaresLayer.appendChild(el);
      this.squareElements.push(el);
    }
  }

  /** @param {number} square - Square index. @returns {{col:number,row:number}} Display cell for the current orientation. */
  cellOf(square) {
    const file = engine.fileOf(square); const rank = engine.rankOf(square);
    return this.orientation === Color.WHITE ? { col: file, row: 7 - rank } : { col: 7 - file, row: rank };
  }

  /** Positions every square and coordinate label for the current orientation. */
  _relabel() {
    for (let square = 0; square < 64; square++) {
      const el = this.squareElements[square];
      const { col, row } = this.cellOf(square);
      el.style.left = col * 12.5 + '%'; el.style.top = row * 12.5 + '%';
      const showFile = row === 7; const showRank = col === 0;
      el.dataset.file = showFile ? 'abcdefgh'[engine.fileOf(square)] : '';
      el.dataset.rank = showRank ? String(engine.rankOf(square) + 1) : '';
    }
    this._applyOverlays();
  }

  /** Re-places overlays after orientation changes. */
  _applyOverlays() {
    Object.keys(this.overlaySquares).forEach((name) => {
      const square = this.overlaySquares[name];
      const el = this.overlayElements[name];
      el.style.display = square >= 0 ? 'block' : 'none';
      if (square >= 0) { const { col, row } = this.cellOf(square); el.style.left = col * 12.5 + '%'; el.style.top = row * 12.5 + '%'; }
    });
  }

  /**
   * Sizes the board to the available space.
   * @returns {void}
   */
  resize() {
    const size = Math.floor(Math.min(this.wrap.clientWidth, this.wrap.clientHeight));
    if (size < 40) return;
    this.board.style.width = this.board.style.height = size + 'px';
    this.board.style.setProperty('--cell', size / 8 + 'px');
  }

  /**
   * Finds the board square under a screen position.
   * @param {number} clientX - Pointer x.
   * @param {number} clientY - Pointer y.
   * @returns {number} Square index or -1.
   */
  squareAt(clientX, clientY) {
    const rect = this.board.getBoundingClientRect();
    const col = Math.floor(((clientX - rect.left) / rect.width) * 8);
    const row = Math.floor(((clientY - rect.top) / rect.height) * 8);
    if (col < 0 || col > 7 || row < 0 || row > 7) return -1;
    const file = this.orientation === Color.WHITE ? col : 7 - col;
    const rank = this.orientation === Color.WHITE ? 7 - row : row;
    return rank * 8 + file;
  }

  /**
   * Screen centre of a square.
   * @param {number} square - Square index.
   * @returns {{x:number,y:number,cell:number}} Pixel centre and square size.
   */
  centerOf(square) {
    const rect = this.board.getBoundingClientRect();
    const { col, row } = this.cellOf(square);
    return { x: rect.left + (col + 0.5) * rect.width / 8, y: rect.top + (row + 0.5) * rect.height / 8, cell: rect.width / 8 };
  }

  /**
   * Screen position for a rating icon (top-right corner of a square).
   * @param {number} square - Square index.
   * @returns {{x:number,y:number}} Pixel position.
   */
  getScreenPoint(square) {
    const c = this.centerOf(square);
    return { x: c.x + c.cell * 0.34, y: c.y - c.cell * 0.34 };
  }

  /** @returns {void} Shows the board. */
  activate() { this.wrap.style.display = 'flex'; this.resize(); this.fx.shakeElement = this.board; }
  /** @returns {void} Hides the board. */
  deactivate() { this.wrap.style.display = 'none'; this.board.style.transform = ''; }

  /**
   * Sets which side is at the bottom.
   * @param {number} color - Color shown at the bottom.
   * @returns {void}
   */
  setOrientation(color) {
    this.orientation = color;
    this._relabel();
    this.pieces.forEach((piece) => this._place(piece.el, piece.square));
  }

  /** @param {boolean} enabled - Ignored in 2D (no idle camera). @returns {void} */
  setIdleRotate(enabled) { this.idle = enabled; }

  /** Moves a piece element to a square's cell. */
  _place(el, square) {
    const { col, row } = this.cellOf(square);
    el.style.transform = 'translate(' + col * 100 + '%,' + row * 100 + '%)';
  }

  /**
   * Rebuilds pieces and highlights from the game state.
   * @param {Position} position - Position to display.
   * @param {{from:number,to:number}|null} lastMove - Last move or null.
   * @param {number} checkSquare - King square in check or -1.
   * @returns {void}
   */
  showPosition(position, lastMove, checkSquare) {
    this.piecesLayer.innerHTML = '';
    this.pieces.clear();
    this.selectedPiece = null;
    for (let square = 0; square < 64; square++) {
      const code = position.board[square];
      if (code !== 0) this._addPiece(engine.getPieceType(code), engine.getPieceColor(code), square);
    }
    this.clearSelection();
    this.setHover(-1);
    this.setLastMove(lastMove ? lastMove.from : -1, lastMove ? lastMove.to : -1);
    this.setCheck(checkSquare);
  }

  /** Creates one piece element. */
  _addPiece(type, color, square) {
    const el = document.createElement('div');
    el.className = 'b2d-piece ' + (color === Color.WHITE ? 'white' : 'black');
    const glyph = document.createElement('span');
    glyph.className = 'b2d-glyph'; glyph.textContent = PIECE_GLYPHS_2D[type];
    el.appendChild(glyph);
    this._place(el, square);
    this.piecesLayer.appendChild(el);
    const piece = { el, glyph, type, color, square };
    this.pieces.set(square, piece);
    return piece;
  }

  /**
   * Selects a piece and shows its destinations.
   * @param {number} square - Selected square.
   * @param {Array<{square:number,isCapture:boolean}>} targets - Legal destinations.
   * @returns {void}
   */
  select(square, targets) {
    this.clearSelection();
    const piece = this.pieces.get(square);
    if (piece) { piece.el.classList.add('selected'); this.selectedPiece = piece; const c = this.centerOf(square); this.fx.selectionSparkle(c.x, c.y, c.cell); }
    this.overlaySquares.selected = square; this._applyOverlays();
    targets.forEach(({ square: target, isCapture }) => {
      const marker = document.createElement('div');
      marker.className = 'b2d-marker' + (isCapture ? ' capture' : '');
      const { col, row } = this.cellOf(target);
      marker.style.left = col * 12.5 + '%'; marker.style.top = row * 12.5 + '%';
      this.markerLayer.appendChild(marker);
    });
  }

  /** Clears selection highlights and markers. @returns {void} */
  clearSelection() {
    if (this.selectedPiece) this.selectedPiece.el.classList.remove('selected');
    this.selectedPiece = null;
    this.markerLayer.innerHTML = '';
    this.overlaySquares.selected = -1; this._applyOverlays();
  }

  /** @param {number} square - Hovered square or -1. @returns {void} */
  setHover(square) { this.overlaySquares.hover = square; this._applyOverlays(); }
  /** @param {number} from - Origin or -1. @param {number} to - Destination or -1. @returns {void} */
  setLastMove(from, to) { this.overlaySquares.lastFrom = from; this.overlaySquares.lastTo = to; this._applyOverlays(); }
  /** @param {number} square - King square in check or -1. @returns {void} */
  setCheck(square) { this.overlaySquares.check = square; this._applyOverlays(); }
  /** @param {number} from - Suggested move origin or -1. @param {number} to - Suggested destination or -1. @returns {void} */
  setHint(from, to) { this.overlaySquares.hintFrom = from; this.overlaySquares.hintTo = to; this._applyOverlays(); }

  /**
   * Slides a piece element to a square.
   * @param {Object} piece - Piece record from `pieces`.
   * @param {number} toSquare - Destination.
   * @param {Object} [options] - { delaySeconds, onProgress(progress) }.
   * @returns {Promise<void>} Resolves on arrival.
   */
  async _slide(piece, toSquare, options = {}) {
    const anim = CONFIG.animation;
    if (this.pieces.get(piece.square) === piece) this.pieces.delete(piece.square);
    const from = this.cellOf(piece.square); const to = this.cellOf(toSquare);
    const distance = Math.hypot(to.col - from.col, to.row - from.row);
    const duration = Math.min(anim.moveMaxSeconds, anim.moveBaseSeconds + anim.moveSecondsPerSquare * distance);
    const bulge = piece.type === PieceType.KNIGHT ? 0.35 : 0.12;
    if (options.delaySeconds) await this.tweener.start({ durationSeconds: options.delaySeconds, onUpdate: () => {}, easing: easeLinear });
    piece.el.style.zIndex = 6;
    await this.tweener.start({
      durationSeconds: duration,
      onUpdate: (t, linear) => {
        piece.el.style.transform = 'translate(' + lerp(from.col, to.col, t) * 100 + '%,' + lerp(from.row, to.row, t) * 100 + '%)';
        piece.glyph.style.transform = 'scale(' + (1 + bulge * Math.sin(Math.PI * t)) + ')';
        if (options.onProgress) options.onProgress(linear);
      },
    });
    piece.glyph.style.transform = '';
    piece.el.style.zIndex = '';
    piece.square = toSquare;
    this._place(piece.el, toSquare);
    this.pieces.set(toSquare, piece);
  }

  /**
   * Animates a legal move with captures, castling, promotion, effects and sounds.
   * @param {Object} move - Legal move about to be played.
   * @param {number} moverColor - Color moving.
   * @returns {Promise<void>} Resolves when everything has settled.
   */
  async playMove(move, moverColor) {
    this.clearSelection();
    this.setHover(-1);
    const mover = this.pieces.get(move.from);
    const isEnPassant = (move.flags & MoveFlag.EN_PASSANT) !== 0;
    const victimSquare = isEnPassant ? move.to + (moverColor === Color.WHITE ? -8 : 8) : move.to;
    const victim = (move.flags & MoveFlag.CAPTURE) ? this.pieces.get(victimSquare) : null;
    let destroyed = false;
    const destroyVictim = () => {
      if (!victim || destroyed) return;
      destroyed = true;
      const tier = CONFIG.effects.explosionTiers[PIECE_KEYS[victim.type]];
      const c = this.centerOf(victimSquare);
      this.fx.explode(c.x, c.y, tier, victim.color, c.cell);
      this.audio.playCapture();
      this.audio.playExplosion(tier.audioScale);
      victim.el.remove();
      if (this.pieces.get(victimSquare) === victim) this.pieces.delete(victimSquare);
    };
    const tasks = [this._slide(mover, move.to, { onProgress: (p) => { if (p >= CONFIG.animation.captureTriggerProgress) destroyVictim(); } })];
    const castled = (move.flags & (MoveFlag.CASTLE_KING | MoveFlag.CASTLE_QUEEN)) !== 0;
    if (castled) {
      const kingSide = (move.flags & MoveFlag.CASTLE_KING) !== 0;
      const rook = this.pieces.get(kingSide ? move.to + 1 : move.to - 2);
      tasks.push(this._slide(rook, kingSide ? move.to - 1 : move.to + 1, { delaySeconds: CONFIG.animation.castlingRookDelaySeconds }));
    }
    await Promise.all(tasks);
    destroyVictim();
    const landing = this.centerOf(move.to);
    if (!victim) {
      if (castled) this.audio.playCastle(); else this.audio.playMove();
      this.fx.landingDust(landing.x, landing.y, landing.cell);
    }
    if (move.promotion) {
      mover.type = move.promotion;
      mover.glyph.textContent = PIECE_GLYPHS_2D[move.promotion];
      this.fx.promotionSparkles(landing.x, landing.y, landing.cell);
      delay(victim ? 350 : 120).then(() => this.audio.playPromotion());
    }
  }

  /**
   * Checkmate finale: the losing king explodes, and the winner gets fireworks.
   * @param {number} kingSquare - Square of the checkmated king.
   * @param {number} loserColor - Color of the checkmated side.
   * @param {boolean} humanWon - True if the player delivered the mate.
   * @returns {void}
   */
  playFinale(kingSquare, loserColor, humanWon) {
    delay(350).then(() => {
      const king = this.pieces.get(kingSquare);
      if (king) {
        const tier = CONFIG.effects.explosionTiers.king;
        const c = this.centerOf(kingSquare);
        this.fx.explode(c.x, c.y, tier, loserColor, c.cell);
        this.audio.playExplosion(tier.audioScale);
        king.el.remove(); this.pieces.delete(kingSquare);
      }
      if (humanWon) this.fx.fireworks(this.board.getBoundingClientRect());
    });
  }
}


/* ============================================================================
 * SECTION 6c — TIC-TAC-TOE BOARD VIEW (DOM)
 * ========================================================================== */

/** Renders the 3x3 board, marks, highlights and the winning line. */
class TicTacToeView {
  /**
   * @param {HTMLElement} wrap - Container that sizes the board.
   * @param {Effects2D} fx - Canvas effects (dust, fireworks).
   * @param {Object} handlers - { onCellClick(cell), onCellHover(cell) }.
   */
  constructor(wrap, fx, handlers) {
    this.wrap = wrap;
    this.fx = fx;
    this.handlers = handlers;
    this.board = document.createElement('div');
    this.board.className = 'ttt-board';
    this.cells = [];
    for (let cell = 0; cell < 9; cell++) {
      const el = document.createElement('div');
      el.className = 'ttt-cell';
      el.dataset.name = tttEngine.cellName(cell);
      el.addEventListener('click', () => this.handlers.onCellClick(cell));
      el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') this.handlers.onCellHover(cell); });
      this.board.appendChild(el);
      this.cells.push(el);
    }
    this.board.addEventListener('pointerleave', () => this.handlers.onCellHover(-1));
    wrap.appendChild(this.board);
    if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(wrap);
  }

  /** Sizes the board to the available space. @returns {void} */
  resize() {
    const size = Math.floor(Math.min(this.wrap.clientWidth, this.wrap.clientHeight));
    if (size < 40) return;
    this.board.style.width = this.board.style.height = size + 'px';
    this.board.style.setProperty('--cell', size / 3 + 'px');
  }

  /** Makes the board visible. @returns {void} */
  activate() { this.resize(); }
  /** Hides the board (the page stylesheet controls visibility). @returns {void} */
  deactivate() { /* visibility handled by the body.game-ttt class */ }

  /**
   * Redraws the whole board.
   * @param {ArrayLike<number>} board - 9 cells (0 empty, 1 X, 2 O).
   * @param {number} lastCell - Last move cell or -1.
   * @param {number[]|null} winLine - Winning line cells or null.
   * @returns {void}
   */
  showPosition(board, lastCell, winLine) {
    for (let cell = 0; cell < 9; cell++) {
      const el = this.cells[cell];
      el.innerHTML = '';
      el.className = 'ttt-cell';
      if (board[cell] !== 0) el.appendChild(this._createMark(board[cell], false));
    }
    this.setLastMove(lastCell);
    if (winLine) this.showWin(winLine);
  }

  /** Builds a mark element. */
  _createMark(mark, animate) {
    const el = document.createElement('div');
    el.className = 'ttt-mark ' + (mark === tttEngine.Mark.X ? 'x' : 'o') + (animate ? ' pop' : '');
    return el;
  }

  /**
   * Places a mark with a pop animation and a dust puff.
   * @param {number} cell - Cell index.
   * @param {number} mark - Mark.X or Mark.O.
   * @returns {void}
   */
  placeMark(cell, mark) {
    const el = this.cells[cell];
    el.innerHTML = '';
    el.appendChild(this._createMark(mark, true));
    const c = this.centerOf(cell);
    this.fx.landingDust(c.x, c.y, c.cell);
  }

  /** @param {number} cell - Highlighted last-move cell or -1. @returns {void} */
  setLastMove(cell) { this.cells.forEach((el, i) => el.classList.toggle('last', i === cell)); }
  /** @param {number} cell - Hovered playable cell or -1. @returns {void} */
  setHover(cell) { this.cells.forEach((el, i) => el.classList.toggle('hover', i === cell)); }
  /** @param {number} from - Ignored (kept for the shared view interface). @param {number} to - Suggested cell or -1. @returns {void} */
  setHint(from, to) { this.cells.forEach((el, i) => el.classList.toggle('hint', i === to)); }

  /**
   * Highlights the winning line.
   * @param {number[]} line - Three cell indices.
   * @returns {void}
   */
  showWin(line) { line.forEach((cell) => this.cells[cell].classList.add('win')); }

  /**
   * Celebratory fireworks over the board.
   * @returns {void}
   */
  celebrate() { this.fx.fireworks(this.board.getBoundingClientRect()); }

  /**
   * @param {number} cell - Cell index.
   * @returns {{x:number,y:number,cell:number}} Screen centre of the cell and its size.
   */
  centerOf(cell) {
    const rect = this.board.getBoundingClientRect();
    const size = rect.width / 3;
    return { x: rect.left + ((cell % 3) + 0.5) * size, y: rect.top + (Math.floor(cell / 3) + 0.5) * size, cell: size };
  }

  /**
   * Screen position for a rating icon (top-right corner of a cell).
   * @param {number} cell - Cell index.
   * @returns {{x:number,y:number}} Pixel position.
   */
  getScreenPoint(cell) {
    const c = this.centerOf(cell);
    return { x: c.x + c.cell * 0.36, y: c.y - c.cell * 0.36 };
  }
}


/* ============================================================================
 * SECTION 7 — VISUAL EFFECTS
 * Pooled, allocation-free particle systems driven by the game loop.
 * ========================================================================== */

/** CPU-simulated point-sprite particles rendered in a single draw call. */
class ParticleSystem {
  /**
   * @param {THREE.Scene} scene - Scene to add the points object to.
   * @param {number} capacity - Maximum simultaneous particles.
   * @param {number} blending - THREE blending constant.
   * @param {number} softness - Sprite edge falloff exponent.
   */
  constructor(scene, capacity, blending, softness) {
    this.capacity = capacity;
    this.count = 0;
    /** name -> [stride, Float32Array] simulation state, copied together on removal. */
    this.state = {};
    const layout = { position: 3, velocity: 3, age: 1, life: 1, sizeStart: 1, sizeEnd: 1, colorStart: 3, colorEnd: 3, alphaStart: 1, alphaEnd: 1, gravity: 1, drag: 1 };
    Object.keys(layout).forEach((name) => { this.state[name] = { stride: layout[name], data: new Float32Array(capacity * layout[name]) }; });
    this.geometry = new THREE.BufferGeometry();
    this.outPosition = new THREE.BufferAttribute(new Float32Array(capacity * 3), 3).setUsage(THREE.DynamicDrawUsage);
    this.outColor = new THREE.BufferAttribute(new Float32Array(capacity * 3), 3).setUsage(THREE.DynamicDrawUsage);
    this.outSize = new THREE.BufferAttribute(new Float32Array(capacity), 1).setUsage(THREE.DynamicDrawUsage);
    this.outAlpha = new THREE.BufferAttribute(new Float32Array(capacity), 1).setUsage(THREE.DynamicDrawUsage);
    this.geometry.setAttribute('position', this.outPosition);
    this.geometry.setAttribute('aColor', this.outColor);
    this.geometry.setAttribute('aSize', this.outSize);
    this.geometry.setAttribute('aAlpha', this.outAlpha);
    this.geometry.setDrawRange(0, 0);
    this.points = new THREE.Points(this.geometry, createPointMaterial(blending, softness));
    this.points.frustumCulled = false;
    this.points.renderOrder = 5;
    scene.add(this.points);
  }

  /**
   * Spawns one particle (silently ignored when the pool is full).
   * @param {Object} p - { position:Vector3, velocity:Vector3, life, sizeStart, sizeEnd, colorStart:Color, colorEnd:Color, alphaStart, alphaEnd, gravity, drag }.
   * @returns {void}
   */
  emit(p) {
    if (this.count >= this.capacity) return;
    const i = this.count++;
    const s = this.state;
    s.position.data.set([p.position.x, p.position.y, p.position.z], i * 3);
    s.velocity.data.set([p.velocity.x, p.velocity.y, p.velocity.z], i * 3);
    s.age.data[i] = 0;
    s.life.data[i] = p.life;
    s.sizeStart.data[i] = p.sizeStart;
    s.sizeEnd.data[i] = p.sizeEnd;
    p.colorStart.toArray(s.colorStart.data, i * 3);
    p.colorEnd.toArray(s.colorEnd.data, i * 3);
    s.alphaStart.data[i] = p.alphaStart;
    s.alphaEnd.data[i] = p.alphaEnd;
    s.gravity.data[i] = p.gravity || 0;
    s.drag.data[i] = p.drag || 0;
  }

  /** Copies particle `from` over particle `to` (swap-remove helper). */
  _copy(from, to) {
    Object.values(this.state).forEach(({ stride, data }) => {
      for (let k = 0; k < stride; k++) data[to * stride + k] = data[from * stride + k];
    });
  }

  /**
   * Integrates particles and uploads GPU buffers.
   * @param {number} dt - Frame time in seconds.
   * @returns {void}
   */
  update(dt) {
    const s = this.state;
    const pos = s.position.data; const vel = s.velocity.data;
    let i = 0;
    while (i < this.count) {
      s.age.data[i] += dt;
      if (s.age.data[i] >= s.life.data[i]) { this._copy(this.count - 1, i); this.count--; continue; }
      const damping = Math.max(0, 1 - s.drag.data[i] * dt);
      vel[i * 3] *= damping; vel[i * 3 + 1] = vel[i * 3 + 1] * damping + s.gravity.data[i] * dt; vel[i * 3 + 2] *= damping;
      pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
      i++;
    }
    const outP = this.outPosition.array; const outC = this.outColor.array;
    for (let n = 0; n < this.count; n++) {
      const t = s.age.data[n] / s.life.data[n];
      outP[n * 3] = pos[n * 3]; outP[n * 3 + 1] = pos[n * 3 + 1]; outP[n * 3 + 2] = pos[n * 3 + 2];
      for (let k = 0; k < 3; k++) outC[n * 3 + k] = lerp(s.colorStart.data[n * 3 + k], s.colorEnd.data[n * 3 + k], t);
      this.outSize.array[n] = lerp(s.sizeStart.data[n], s.sizeEnd.data[n], t);
      this.outAlpha.array[n] = lerp(s.alphaStart.data[n], s.alphaEnd.data[n], t);
    }
    this.geometry.setDrawRange(0, this.count);
    [this.outPosition, this.outColor, this.outSize, this.outAlpha].forEach((a) => { a.needsUpdate = true; });
  }
}

/** Instanced shards that tumble, bounce on the board and shrink away. */
class DebrisSystem {
  /**
   * @param {THREE.Scene} scene - Scene to add the instanced meshes to.
   * @param {THREE.Material[]} colorMaterials - Materials indexed by Color (white, black).
   * @param {number} capacityPerColor - Max live shards per colour.
   */
  constructor(scene, colorMaterials, capacityPerColor) {
    this.capacity = capacityPerColor;
    this.dummy = new THREE.Object3D();
    const geometry = new THREE.TetrahedronGeometry(0.12);
    this.pools = colorMaterials.map((material) => {
      const mesh = new THREE.InstancedMesh(geometry, material, capacityPerColor);
      mesh.frustumCulled = false; mesh.castShadow = true;
      this.dummy.scale.setScalar(0); this.dummy.updateMatrix();
      for (let i = 0; i < capacityPerColor; i++) mesh.setMatrixAt(i, this.dummy.matrix);
      scene.add(mesh);
      return { mesh, shards: [], free: Array.from({ length: capacityPerColor }, (_, i) => i) };
    });
  }

  /**
   * Throws shards outward from a point.
   * @param {THREE.Vector3} origin - Burst centre.
   * @param {number} color - Color of the piece that broke.
   * @param {number} count - Shard count.
   * @param {number} speed - Typical launch speed.
   * @returns {void}
   */
  spawn(origin, color, count, speed) {
    const pool = this.pools[color];
    for (let n = 0; n < count && pool.free.length > 0; n++) {
      const angle = Math.random() * Math.PI * 2;
      const lateral = randomBetween(0.3, 1) * speed;
      pool.shards.push({
        index: pool.free.pop(), life: randomBetween(2, 3.6), age: 0,
        position: origin.clone(), velocity: new THREE.Vector3(Math.cos(angle) * lateral, randomBetween(0.4, 1) * speed * 1.4, Math.sin(angle) * lateral),
        rotation: new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6),
        spin: new THREE.Vector3(randomBetween(-12, 12), randomBetween(-12, 12), randomBetween(-12, 12)),
        scale: new THREE.Vector3(randomBetween(0.6, 1.6), randomBetween(0.4, 1.2), randomBetween(0.6, 1.6)),
      });
    }
  }

  /**
   * Simulates gravity and bounces.
   * @param {number} dt - Frame time in seconds.
   * @returns {void}
   */
  update(dt) {
    this.pools.forEach((pool) => {
      if (pool.shards.length === 0) return;
      pool.shards = pool.shards.filter((shard) => {
        shard.age += dt;
        const dead = shard.age >= shard.life;
        if (!dead) {
          shard.velocity.y -= 14 * dt;
          shard.position.addScaledVector(shard.velocity, dt);
          const onBoard = Math.abs(shard.position.x) < 4.6 && Math.abs(shard.position.z) < 4.6;
          const floorY = onBoard ? 0.04 : CONFIG.board.baseBottomY + 0.04;
          if (shard.position.y < floorY) {
            shard.position.y = floorY;
            shard.velocity.y *= -0.35; shard.velocity.x *= 0.7; shard.velocity.z *= 0.7;
            shard.spin.multiplyScalar(0.6);
          }
          shard.rotation.x += shard.spin.x * dt; shard.rotation.y += shard.spin.y * dt; shard.rotation.z += shard.spin.z * dt;
          const shrink = Math.min(1, (shard.life - shard.age) / 0.6);
          this.dummy.position.copy(shard.position);
          this.dummy.rotation.copy(shard.rotation);
          this.dummy.scale.copy(shard.scale).multiplyScalar(shrink);
        } else {
          this.dummy.scale.setScalar(0);
          pool.free.push(shard.index);
        }
        this.dummy.updateMatrix();
        pool.mesh.setMatrixAt(shard.index, this.dummy.matrix);
        return !dead;
      });
      pool.mesh.instanceMatrix.needsUpdate = true;
    });
  }
}

/** Pool of expanding, fading ground rings. */
class ShockwavePool {
  /**
   * @param {THREE.Scene} scene - Scene to add rings to.
   * @param {number} size - Number of pooled rings.
   */
  constructor(scene, size) {
    const geometry = new THREE.RingGeometry(0.88, 1, 64).rotateX(-Math.PI / 2);
    this.rings = Array.from({ length: size }, () => {
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
      mesh.visible = false; mesh.renderOrder = 4;
      scene.add(mesh);
      return { mesh, age: 0, duration: 1, maxRadius: 1, delay: 0, active: false };
    });
  }

  /**
   * Starts a ring.
   * @param {THREE.Vector3} position - Centre (y is forced to just above the board).
   * @param {number} maxRadius - Final radius.
   * @param {number} duration - Seconds to expand.
   * @param {THREE.Color} color - HDR ring colour.
   * @param {number} [delay] - Seconds before it starts.
   * @returns {void}
   */
  spawn(position, maxRadius, duration, color, delay = 0) {
    const ring = this.rings.find((r) => !r.active);
    if (!ring) return;
    Object.assign(ring, { age: -delay, duration, maxRadius, active: true });
    ring.mesh.position.set(position.x, 0.03, position.z);
    ring.mesh.material.color.copy(color);
    ring.mesh.visible = false;
  }

  /** @param {number} dt - Frame time in seconds. @returns {void} */
  update(dt) {
    this.rings.forEach((ring) => {
      if (!ring.active) return;
      ring.age += dt;
      if (ring.age < 0) return;
      const t = ring.age / ring.duration;
      if (t >= 1) { ring.active = false; ring.mesh.visible = false; return; }
      ring.mesh.visible = true;
      ring.mesh.scale.setScalar(Math.max(0.05, easeOutCubic(t) * ring.maxRadius));
      ring.mesh.material.opacity = (1 - t) * (1 - t);
    });
  }
}

/** Single pre-allocated point light that flashes during explosions (avoids shader recompiles). */
class FlashLight {
  /** @param {THREE.PointLight} light - The light owned by LightingRig. */
  constructor(light) {
    this.light = light;
    this.intensity = 0;
    this.decayPerSecond = 6;
    this.peak = 0;
  }

  /**
   * Triggers a flash.
   * @param {THREE.Vector3} position - World position.
   * @param {THREE.Color} color - Light colour.
   * @param {number} intensity - Peak intensity.
   * @param {number} range - Light distance.
   * @returns {void}
   */
  flash(position, color, intensity, range) {
    this.light.position.copy(position).y += 1.2;
    this.light.color.copy(color);
    this.light.distance = range;
    this.intensity = Math.max(this.intensity, intensity);
  }

  /** @param {number} dt - Frame time in seconds. @returns {void} */
  update(dt) {
    this.intensity *= Math.exp(-this.decayPerSecond * dt);
    if (this.intensity < 0.01) this.intensity = 0;
    this.light.intensity = this.intensity;
  }
}

/** GPU-animated rain: every drop's position is computed in the vertex shader. */
class RainEffect {
  /**
   * @param {THREE.Scene} scene - Scene to add rain to.
   * @param {Object} effectsConfig - CONFIG.effects.
   */
  constructor(scene, effectsConfig) {
    const count = effectsConfig.rainDropCount;
    const half = effectsConfig.rainAreaHalfSize;
    const positions = new Float32Array(count * 6);
    const ends = new Float32Array(count * 2);
    const speeds = new Float32Array(count * 2);
    for (let i = 0; i < count; i++) {
      const x = randomBetween(-half, half); const y = randomBetween(0, effectsConfig.rainHeight); const z = randomBetween(-half, half);
      const speed = randomBetween(14, 22);
      positions.set([x, y, z, x, y, z], i * 6);
      ends[i * 2 + 1] = 1;
      speeds[i * 2] = speeds[i * 2 + 1] = speed;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aEnd', new THREE.BufferAttribute(ends, 1));
    geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
    this.material = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uHeight: { value: effectsConfig.rainHeight }, uStreak: { value: 0.7 }, uTilt: { value: 0.08 }, uOpacity: { value: effectsConfig.rainOpacity }, uColor: { value: new THREE.Color(0.55, 0.7, 1.0) } },
      vertexShader: `attribute float aEnd; attribute float aSpeed; uniform float uTime, uHeight, uStreak, uTilt; varying float vFade;
        void main() { float y = mod(position.y - uTime * aSpeed, uHeight); vec3 p = vec3(position.x + (y + aEnd * uStreak) * uTilt, y + aEnd * uStreak, position.z);
          vFade = smoothstep(0.0, 1.5, y) * (1.0 - aEnd * 0.8); gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
      fragmentShader: 'uniform vec3 uColor; uniform float uOpacity; varying float vFade; void main(){ gl_FragColor = vec4(uColor, uOpacity * vFade); }',
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.lines = new THREE.LineSegments(geometry, this.material);
    this.lines.frustumCulled = false;
    scene.add(this.lines);
  }

  /** @param {boolean} enabled - Show or hide the rain. @returns {void} */
  setEnabled(enabled) { this.lines.visible = enabled; }
  /** @param {number} elapsedSeconds - Total time. @returns {void} */
  update(elapsedSeconds) { this.material.uniforms.uTime.value = elapsedSeconds; }
}

/** Public effects API used by the game: explosions, sparkles, fireworks, rain, shake. */
class EffectsManager {
  /**
   * @param {GraphicsEngine} graphics - Provides scene, lights and camera shake.
   * @param {THREE.Material[]} pieceMaterials - Metal materials by Color (for debris).
   */
  constructor(graphics, pieceMaterials) {
    this.config = CONFIG.effects;
    this.graphics = graphics;
    const scene = graphics.scene;
    this.glow = new ParticleSystem(scene, this.config.glowParticleCapacity, THREE.AdditiveBlending, 1.6);
    this.smoke = new ParticleSystem(scene, this.config.smokeParticleCapacity, THREE.NormalBlending, 1.0);
    this.debris = new DebrisSystem(scene, pieceMaterials, this.config.debrisCapacityPerColor);
    this.shockwaves = new ShockwavePool(scene, 10);
    this.flashLight = new FlashLight(graphics.lighting.flashLight);
    this.rain = new RainEffect(scene, this.config);
    this.scheduled = [];
    this.timedEmitters = [];
    this.tmpPosition = new THREE.Vector3();
    this.tmpVelocity = new THREE.Vector3();
    this.fireStart = createLinearColor(this.config.fireColorStart).multiplyScalar(3);
    this.fireEnd = createLinearColor(this.config.fireColorEnd);
  }

  /** @param {boolean} enabled - Ambient rain on/off. @returns {void} */
  setRainEnabled(enabled) { this.rain.setEnabled(enabled); }

  /**
   * Runs a callback after a delay (advances with the game loop).
   * @param {number} delaySeconds - Delay.
   * @param {function(): void} callback - Work to do.
   * @returns {void}
   */
  schedule(delaySeconds, callback) { this.scheduled.push({ remaining: delaySeconds, callback }); }

  /** Random unit vector. */
  _randomDirection(target) {
    const theta = Math.random() * Math.PI * 2; const y = randomBetween(-0.2, 1);
    const r = Math.sqrt(1 - Math.min(1, y * y));
    return target.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
  }

  /**
   * Plays the explosion for a captured piece; bigger pieces explode harder.
   * @param {THREE.Vector3} position - World position of the piece's centre.
   * @param {number} type - PieceType of the destroyed piece.
   * @param {number} color - Color of the destroyed piece.
   * @returns {number} Audio scale (0..1.2) for the matching sound.
   */
  explode(position, type, color) {
    const tier = this.config.explosionTiers[PIECE_KEYS[type]];
    this._burst(position, tier, color, 1);
    this.debris.spawn(position, color, tier.debrisCount, 4 + tier.sparkSpeed * 0.7);
    this.graphics.cameraRig.addShake(tier.shake);
    for (let i = 0; i < tier.secondaryBursts; i++) {
      this.schedule(0.12 + i * 0.1, () => {
        const offset = position.clone().add(new THREE.Vector3(randomBetween(-0.8, 0.8), randomBetween(0, 1), randomBetween(-0.8, 0.8)));
        this._burst(offset, tier, color, 0.4);
        this.debris.spawn(offset, color, Math.round(tier.debrisCount * 0.25), 4 + tier.sparkSpeed * 0.6);
        this.graphics.cameraRig.addShake(tier.shake * 0.25);
      });
    }
    return tier.audioScale;
  }

  /** Emits fire, sparks, smoke, rings and a light flash scaled by `strength`. */
  _burst(position, tier, color, strength) {
    const accent = createLinearColor(color === Color.WHITE ? this.config.whiteAccent : this.config.blackAccent).multiplyScalar(2.5);
    const sparkColor = new THREE.Color(3, 2.3, 1.1).lerp(accent, 0.3);
    const dir = new THREE.Vector3();
    const fireCount = Math.round(tier.fireCount * strength);
    for (let i = 0; i < fireCount; i++) {
      this._randomDirection(dir);
      this.glow.emit({
        position: this.tmpPosition.copy(position).addScaledVector(dir, 0.15), velocity: this.tmpVelocity.copy(dir).multiplyScalar(randomBetween(0.3, 1) * tier.fireSpeed),
        life: randomBetween(0.45, 1) * tier.life, sizeStart: tier.fireSize * randomBetween(0.5, 1), sizeEnd: 0.05,
        colorStart: this.fireStart, colorEnd: this.fireEnd, alphaStart: 0.9, alphaEnd: 0, drag: 2.2, gravity: 1.5,
      });
    }
    const sparkCount = Math.round(tier.sparkCount * strength);
    for (let i = 0; i < sparkCount; i++) {
      this._randomDirection(dir);
      this.glow.emit({
        position, velocity: this.tmpVelocity.copy(dir).multiplyScalar(randomBetween(0.3, 1) * tier.sparkSpeed),
        life: randomBetween(0.6, 1.5), sizeStart: randomBetween(0.05, 0.12), sizeEnd: 0.01,
        colorStart: sparkColor, colorEnd: this.fireEnd, alphaStart: 1, alphaEnd: 0, gravity: -9, drag: 0.6,
      });
    }
    const smokeCount = Math.round(tier.smokeCount * strength);
    const smokeColor = new THREE.Color(0.05, 0.05, 0.06);
    for (let i = 0; i < smokeCount; i++) {
      this._randomDirection(dir);
      this.smoke.emit({
        position: this.tmpPosition.copy(position).addScaledVector(dir, 0.2), velocity: this.tmpVelocity.copy(dir).multiplyScalar(randomBetween(0.2, 0.9) * tier.fireSpeed * 0.5).setY(randomBetween(0.4, 1.4)),
        life: randomBetween(1.4, 2.6), sizeStart: tier.fireSize * 0.6, sizeEnd: tier.fireSize * 2.2,
        colorStart: smokeColor, colorEnd: smokeColor, alphaStart: 0.45, alphaEnd: 0, drag: 1.2, gravity: 0.2,
      });
    }
    const ringColor = new THREE.Color(2.6, 1.5, 0.6).lerp(accent, 0.25);
    for (let i = 0; i < tier.shockwaves; i++) {
      this.shockwaves.spawn(position, tier.shockwaveRadius * strength * (1 - i * 0.2), 0.6 + i * 0.15, ringColor, i * 0.07);
    }
    this.flashLight.flash(position, new THREE.Color(1, 0.62, 0.3), tier.flashIntensity * strength, tier.flashRange);
  }

  /**
   * Small dust puff where a piece lands.
   * @param {THREE.Vector3} position - Landing point.
   * @returns {void}
   */
  landingDust(position) {
    const dust = new THREE.Color(0.35, 0.33, 0.3);
    for (let i = 0; i < 6; i++) {
      const angle = Math.random() * Math.PI * 2;
      this.smoke.emit({
        position: this.tmpPosition.set(position.x, 0.05, position.z), velocity: this.tmpVelocity.set(Math.cos(angle) * 0.6, 0.15, Math.sin(angle) * 0.6),
        life: 0.7, sizeStart: 0.18, sizeEnd: 0.5, colorStart: dust, colorEnd: dust, alphaStart: 0.22, alphaEnd: 0, drag: 2,
      });
    }
  }

  /**
   * Gold sparkles that spiral upward for a short time (promotion).
   * @param {THREE.Vector3} position - Base position.
   * @returns {void}
   */
  promotionSparkles(position) {
    const gold = createLinearColor(this.config.promotionColor).multiplyScalar(3);
    this.timedEmitters.push({
      remaining: 1.0, emit: (progress, dt) => {
        const n = Math.ceil(dt * 160);
        for (let i = 0; i < n; i++) {
          const angle = progress * 14 + Math.random() * 0.6;
          const radius = randomBetween(0.15, 0.5);
          this.glow.emit({
            position: this.tmpPosition.set(position.x + Math.cos(angle) * radius, 0.1, position.z + Math.sin(angle) * radius),
            velocity: this.tmpVelocity.set(Math.cos(angle + 1.6) * 0.8, randomBetween(1.5, 3.2), Math.sin(angle + 1.6) * 0.8),
            life: randomBetween(0.6, 1.2), sizeStart: randomBetween(0.06, 0.14), sizeEnd: 0.01,
            colorStart: gold, colorEnd: new THREE.Color(1, 0.4, 0.05), alphaStart: 1, alphaEnd: 0, drag: 0.5,
          });
        }
      },
    });
    this.flashLight.flash(position, new THREE.Color(1, 0.85, 0.4), 4, 9);
  }

  /**
   * Tiny sparkle ring when a piece is picked up.
   * @param {THREE.Vector3} position - Piece position.
   * @returns {void}
   */
  selectionSparkle(position) {
    const blue = new THREE.Color(0.5, 1.2, 2.6);
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      this.glow.emit({
        position: this.tmpPosition.set(position.x + Math.cos(angle) * 0.35, 0.05, position.z + Math.sin(angle) * 0.35),
        velocity: this.tmpVelocity.set(0, randomBetween(0.6, 1.4), 0), life: 0.6, sizeStart: 0.07, sizeEnd: 0.01,
        colorStart: blue, colorEnd: blue, alphaStart: 0.9, alphaEnd: 0,
      });
    }
  }

  /**
   * Fireworks over the board after the player wins.
   * @returns {void}
   */
  victoryFireworks() {
    const palette = this.config.victoryColors.map((hex) => createLinearColor(hex).multiplyScalar(3));
    for (let i = 0; i < 9; i++) {
      this.schedule(i * 0.32, () => {
        const centre = new THREE.Vector3(randomBetween(-3, 3), randomBetween(3.5, 6.5), randomBetween(-3, 3));
        const color = palette[Math.floor(Math.random() * palette.length)];
        const dir = new THREE.Vector3();
        for (let n = 0; n < 90; n++) {
          dir.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
          this.glow.emit({
            position: centre, velocity: this.tmpVelocity.copy(dir).multiplyScalar(randomBetween(2.5, 4.5)),
            life: randomBetween(1.1, 1.8), sizeStart: 0.13, sizeEnd: 0.02, colorStart: color, colorEnd: color.clone().multiplyScalar(0.2),
            alphaStart: 1, alphaEnd: 0, gravity: -2.5, drag: 1.2,
          });
        }
        this.flashLight.flash(centre.clone().setY(0), color, 3, 14);
      });
    }
  }

  /**
   * Advances every effect.
   * @param {number} dt - Frame time in seconds.
   * @param {number} elapsedSeconds - Total time (rain animation).
   * @returns {void}
   */
  update(dt, elapsedSeconds) {
    this.scheduled = this.scheduled.filter((job) => { job.remaining -= dt; if (job.remaining <= 0) { job.callback(); return false; } return true; });
    this.timedEmitters = this.timedEmitters.filter((emitter) => {
      emitter.remaining -= dt;
      emitter.emit(1 - Math.max(0, emitter.remaining), dt);
      return emitter.remaining > 0;
    });
    this.glow.update(dt);
    this.smoke.update(dt);
    this.debris.update(dt);
    this.shockwaves.update(dt);
    this.flashLight.update(dt);
    this.rain.update(elapsedSeconds);
  }
}


/* ============================================================================
 * SECTION 7b — 3D VIEW ADAPTER
 * Wraps the three.js board, effects and camera behind the shared view interface
 * (showPosition, select, clearSelection, setHover, setLastMove, setCheck, playMove, playFinale...).
 * ========================================================================== */

/** Adapter that lets the game controller drive the 3D scene. */
class View3D {
  /**
   * @param {Object} deps - { graphics, boardView, director, effects }.
   */
  constructor({ graphics, boardView, director, effects }) {
    this.graphics = graphics;
    this.boardView = boardView;
    this.director = director;
    this.effects = effects;
  }

  /**
   * Screen position for a rating icon above a square.
   * @param {number} square - Square index.
   * @returns {{x:number,y:number}} Pixel position.
   */
  getScreenPoint(square) {
    const point = squareToWorld(square);
    point.x += 0.3; point.y = 0.9; point.z -= 0.3;
    point.project(this.graphics.cameraRig.camera);
    return { x: (point.x * 0.5 + 0.5) * window.innerWidth, y: (-point.y * 0.5 + 0.5) * window.innerHeight };
  }

  /** Makes the canvas visible. @returns {void} */
  activate() { this.graphics.canvas.style.visibility = 'visible'; this.graphics.resize(); }
  /** Hides the canvas (rendering is skipped by the main loop). @returns {void} */
  deactivate() { this.graphics.canvas.style.visibility = 'hidden'; }

  /**
   * Points the camera behind a side.
   * @param {number} color - Side whose pieces face the camera.
   * @param {boolean} animated - Swing smoothly instead of jumping.
   * @returns {void}
   */
  setOrientation(color, animated) {
    if (animated) this.graphics.cameraRig.swingToSide(color); else this.graphics.cameraRig.placeOnSide(color);
  }

  /** @param {boolean} enabled - Slow idle orbit on/off. @returns {void} */
  setIdleRotate(enabled) { this.graphics.cameraRig.setAutoRotate(enabled); }

  /**
   * Rebuilds pieces and highlights.
   * @param {Position} position - Position to show.
   * @param {{from:number,to:number}|null} lastMove - Last move or null.
   * @param {number} checkSquare - King square in check or -1.
   * @returns {void}
   */
  showPosition(position, lastMove, checkSquare) {
    this.boardView.resetPieces(position);
    this.clearSelection();
    this.setHover(-1);
    this.setLastMove(lastMove ? lastMove.from : -1, lastMove ? lastMove.to : -1);
    this.setCheck(checkSquare);
  }

  /**
   * Lifts a piece and shows its destinations.
   * @param {number} square - Selected square.
   * @param {Array<{square:number,isCapture:boolean}>} targets - Legal destinations.
   * @returns {void}
   */
  select(square, targets) {
    const view = this.boardView.getPieceViewAt(square);
    this.boardView.setSelectedPiece(view);
    this.boardView.highlighter.setSelected(square);
    this.boardView.highlighter.setTargets(targets);
    if (view) this.effects.selectionSparkle(squareToWorld(square));
  }

  /** Clears selection visuals. @returns {void} */
  clearSelection() {
    this.boardView.setSelectedPiece(null);
    this.boardView.highlighter.setSelected(-1);
    this.boardView.highlighter.setTargets([]);
  }

  /** @param {number} square - Hovered square or -1. @returns {void} */
  setHover(square) { this.boardView.highlighter.setHover(square); }
  /** @param {number} from - Origin or -1. @param {number} to - Destination or -1. @returns {void} */
  setLastMove(from, to) { this.boardView.highlighter.setLastMove(from, to); }
  /** @param {number} square - King square in check or -1. @returns {void} */
  setCheck(square) { this.boardView.highlighter.setCheck(square); }
  /** @param {number} from - Suggested move origin or -1. @param {number} to - Suggested destination or -1. @returns {void} */
  setHint(from, to) { this.boardView.highlighter.setHint(from, to); }

  /**
   * Animates a move (with effects and sounds).
   * @param {Object} move - Legal move.
   * @param {number} moverColor - Color moving.
   * @returns {Promise<void>} Resolves when settled.
   */
  playMove(move, moverColor) { return this.director.playMove(move, moverColor); }

  /**
   * Checkmate finale.
   * @param {number} kingSquare - Checkmated king's square.
   * @param {number} loserColor - Checkmated side.
   * @param {boolean} humanWon - True if the player delivered mate.
   * @returns {void}
   */
  playFinale(kingSquare, loserColor, humanWon) {
    const kingView = this.boardView.getPieceViewAt(kingSquare);
    this.effects.schedule(0.35, () => {
      if (kingView) {
        const centre = squareToWorld(kingSquare); centre.y = 0.7;
        this.director.audio.playExplosion(this.effects.explode(centre, PieceType.KING, loserColor));
        this.boardView.removePiece(kingView);
      }
      if (humanWon) this.effects.victoryFireworks();
    });
  }
}

const PIECE_GLYPHS = ['', '\u265F\uFE0E', '\u265E', '\u265D', '\u265C', '\u265B', '\u265A'];

const THUMB_UP_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 21h4V9H2v12zm20-11c0-1.1-.9-2-2-2h-6.3l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L13.17 1 7.59 6.59C7.22 6.95 7 7.45 7 8v11c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>';

/**
 * Formats an evaluation as a signed value from White's point of view ("+0.4", "-1.2", "M3", "-M2").
 * @param {{kind:string, centipawns:number, winner:number, mateIn:number}} info - Evaluation record.
 * @returns {string} Short label.
 */
function formatSignedEvaluation(info) {
  if (info.kind === 'mate') return (info.winner === Color.WHITE ? '' : '-') + 'M' + info.mateIn;
  if (info.kind === 'checkmate') return info.winner === Color.WHITE ? '1-0' : '0-1';
  if (info.kind === 'draw') return '=';
  const pawns = info.centipawns / 100;
  return (pawns >= 0 ? '+' : '-') + Math.abs(pawns).toFixed(1);
}

/**
 * Builds the small coloured icon that represents a move rating.
 * @param {string} key - Rating key (blunder, mistake, ... checkmate).
 * @returns {HTMLElement} Badge element.
 */
let ratingContext = 'chess';

/**
 * Chooses which game's wording rating tooltips use.
 * @param {string} context - 'chess' or 'ttt'.
 * @returns {void}
 */
function setRatingContext(context) { ratingContext = context; }

function createRatingBadge(key) {
  const style = CONFIG.moveRating.badges[key];
  const badge = document.createElement('span');
  badge.className = 'rating-badge rating-' + key;
  badge.style.background = style.background;
  badge.style.color = style.foreground;
  if (style.symbol === 'thumb') badge.innerHTML = THUMB_UP_SVG; else badge.textContent = style.symbol;
  badge.title = t(key === 'checkmate' && ratingContext === 'ttt' ? 'rating.winTtt' : 'rating.' + key);
  return badge;
}

/** Builds the tabbed settings dialog from SETTINGS_SCHEMA. */
class SettingsPanel {
  /**
   * @param {HTMLElement} overlay - The settings overlay element.
   * @param {SettingsStore} settings - Settings store to bind to.
   * @param {function(boolean): void} onVisibilityChange - Called when opened/closed.
   */
  constructor(overlay, settings, onVisibilityChange) {
    this.overlay = overlay;
    this.settings = settings;
    this.onVisibilityChange = onVisibilityChange;
    this.tabButtons = overlay.querySelector('#settings-tabs');
    this.body = overlay.querySelector('#settings-body');
    this.controlUpdaters = [];
    this._build();
    overlay.querySelector('#settings-close').addEventListener('click', () => this.close());
    overlay.querySelector('#settings-reset').addEventListener('click', () => { settings.resetToDefaults(); this._refreshControls(); });
    overlay.addEventListener('pointerdown', (e) => { if (e.target === overlay) this.close(); });
  }

  /** Opens the dialog. @returns {void} */
  open() { this.overlay.classList.add('visible'); this.onVisibilityChange(true); }
  /** Closes the dialog. @returns {void} */
  close() { this.overlay.classList.remove('visible'); this.onVisibilityChange(false); }

  /** Creates tabs and controls from the schema. */
  _build() {
    SETTINGS_SCHEMA.forEach((tab, index) => {
      const button = document.createElement('button');
      button.className = 'tab-button'; button.textContent = t(tab.titleKey); button.dataset.tab = tab.id;
      button.addEventListener('click', () => this._selectTab(tab.id));
      this.tabButtons.appendChild(button);
      const page = document.createElement('div');
      page.className = 'tab-page'; page.id = 'tab-' + tab.id;
      tab.controls.forEach((control) => page.appendChild(this._createControl(control)));
      this.body.appendChild(page);
      if (index === 0) this._selectTab(tab.id);
    });
  }

  /** Shows one tab page. */
  _selectTab(id) {
    this.tabButtons.querySelectorAll('.tab-button').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
    this.body.querySelectorAll('.tab-page').forEach((p) => p.classList.toggle('active', p.id === 'tab-' + id));
  }

  /** Formats a numeric value for the readout next to a slider. */
  _format(format, value) {
    if (format === 'percent') return Math.round(value * 100) + '%';
    if (format === 'seconds') return value.toFixed(1) + 's';
    if (format === 'degrees') return Math.round(value) + '\u00B0';
    if (format === 'speed') return value > CONFIG.animationSpeed.maxMultiplier + 0.001 ? t('settings.instant') : String(+value.toFixed(2)) + 'x';
    return String(value);
  }

  /** Builds one labelled control row bound to a setting path. */
  _createControl(control) {
    const row = document.createElement('div');
    row.className = 'setting-row';
    const label = document.createElement('label');
    label.className = 'setting-label';
    const title = document.createElement('span');
    title.textContent = t(control.labelKey);
    label.appendChild(title);
    const readout = document.createElement('span');
    readout.className = 'setting-value';
    label.appendChild(readout);
    row.appendChild(label);
    let input;
    if (control.type === 'range') {
      input = document.createElement('input');
      input.type = 'range'; input.min = control.min; input.max = control.max; input.step = control.step;
      input.addEventListener('input', () => this.settings.set(control.path, Number(input.value)));
      this.controlUpdaters.push(() => { input.value = this.settings.get(control.path); readout.textContent = this._format(control.format, this.settings.get(control.path)); });
      this.settings.subscribe((path, value) => { if (path === control.path) readout.textContent = this._format(control.format, value); });
    } else if (control.type === 'toggle') {
      input = document.createElement('input');
      input.type = 'checkbox'; input.className = 'switch';
      input.addEventListener('change', () => this.settings.set(control.path, input.checked));
      this.controlUpdaters.push(() => { input.checked = this.settings.get(control.path); });
    } else {
      input = document.createElement('select');
      control.options.forEach((option) => { const o = document.createElement('option'); o.value = option.value; o.textContent = t(option.labelKey); input.appendChild(o); });
      input.addEventListener('change', () => this.settings.set(control.path, Number(input.value)));
      this.controlUpdaters.push(() => { input.value = this.settings.get(control.path); });
    }
    input.id = 'setting-' + control.path.replace('.', '-');
    label.htmlFor = input.id;
    row.appendChild(input);
    if (control.hintKey) {
      const hint = document.createElement('p'); hint.className = 'setting-hint'; hint.textContent = t(control.hintKey); row.appendChild(hint);
    }
    return row;
  }

  /** Re-reads every control's value from the store (after reset). */
  _refreshControls() { this.controlUpdaters.forEach((update) => update()); }

  /** Syncs controls with current settings; call once after construction. @returns {void} */
  syncControls() { this._refreshControls(); }
}
