    amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    let tail = osc;
    if (lowpass) {
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = lowpass;
      osc.connect(filter);
      tail = filter;
    }
    tail.connect(amp);
    amp.connect(bus);
    osc.start(start);
    osc.stop(start + duration + 0.05);
  }

  /**
   * Plays a filtered noise burst.
   * @param {Object} o - Options: filter, frequency, endFrequency, q, delay, duration, gain, attack, bus.
   * @returns {void}
   */
  _noise({ filter = 'lowpass', frequency = 1000, endFrequency = frequency, q = 0.7, delay = 0, duration = 0.2, gain = 0.3, attack = 0.002, bus = this.sfxBus }) {
    const ctx = this.context;
    const start = ctx.currentTime + delay;
    const source = ctx.createBufferSource();
    source.buffer = this.noiseBuffer;
    const biquad = ctx.createBiquadFilter();
    biquad.type = filter;
    biquad.Q.value = q;
    biquad.frequency.setValueAtTime(frequency, start);
    if (endFrequency !== frequency) biquad.frequency.exponentialRampToValueAtTime(Math.max(endFrequency, 20), start + duration);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, start);
    amp.gain.linearRampToValueAtTime(gain, start + attack);
    amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    source.connect(biquad);
    biquad.connect(amp);
    amp.connect(bus);
    source.start(start, Math.random() * 0.5);
    source.stop(start + duration + 0.05);
  }

  /** Wooden "thock" of a piece touching the board. @param {number} [delay] - Seconds to wait. @returns {void} */
  _thock(delay = 0, pitch = 1) {
    this._tone({ frequency: 240 * pitch, endFrequency: 110 * pitch, duration: 0.14, gain: 0.55, delay });
    this._noise({ filter: 'bandpass', frequency: 900 * pitch, q: 1.1, duration: 0.07, gain: 0.4, delay });
  }

  /** Soft click when a piece is picked up. @returns {void} */
  playSelect() {
    if (!this.context) return;
    this._tone({ frequency: 660, endFrequency: 1040, duration: 0.08, gain: 0.22, type: 'triangle' });
    this._noise({ filter: 'highpass', frequency: 3500, duration: 0.025, gain: 0.15 });
  }

  /** Plain move landing. @returns {void} */
  playMove() {
    if (!this.context) return;
    this._thock();
  }

  /** Capture impact (the explosion has its own sound). @returns {void} */
  playCapture() {
    if (!this.context) return;
    this._noise({ filter: 'lowpass', frequency: 2800, endFrequency: 300, duration: 0.25, gain: 0.55 });
    this._tone({ type: 'square', frequency: 150, endFrequency: 50, duration: 0.25, gain: 0.3, lowpass: 900 });
    this._tone({ frequency: 1800, endFrequency: 1300, duration: 0.35, gain: 0.12 });
    this._tone({ frequency: 2650, endFrequency: 2100, duration: 0.3, gain: 0.07 });
  }

  /** Castling: slide then two thocks. @returns {void} */
  playCastle() {
    if (!this.context) return;
    this._noise({ filter: 'bandpass', frequency: 400, endFrequency: 1400, q: 2, duration: 0.2, gain: 0.18 });
    this._thock(0.05, 1);
    this._thock(0.24, 1.2);
  }

  /** Pawn promotion: rising arpeggio with sparkle. @returns {void} */
  playPromotion() {
    if (!this.context) return;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((frequency, i) => {
      this._tone({ type: 'triangle', frequency, duration: 0.3, gain: 0.22, delay: i * 0.09 });
      this._tone({ frequency: frequency * 2, duration: 0.25, gain: 0.06, delay: i * 0.09 + 0.02 });
    });
    for (let i = 0; i < 6; i++) this._tone({ frequency: 2800 + Math.random() * 2500, duration: 0.12, gain: 0.05, delay: 0.1 + i * 0.09 });
    this._noise({ filter: 'highpass', frequency: 6000, duration: 0.7, gain: 0.07, delay: 0.1 });
  }

  /** The player gives check: bright rising pair. @returns {void} */
  playCheck() {
    if (!this.context) return;
    this._tone({ type: 'square', frequency: 740, duration: 0.1, gain: 0.14, lowpass: 3000 });
    this._tone({ type: 'square', frequency: 988, duration: 0.18, gain: 0.14, delay: 0.1, lowpass: 3000 });
  }

  /** The player is checked: ominous pulsing alarm. @returns {void} */
  playChecked() {
    if (!this.context) return;
    for (let i = 0; i < 3; i++) {
      this._tone({ type: 'sawtooth', frequency: 311, endFrequency: 294, duration: 0.17, gain: 0.2, delay: i * 0.2, lowpass: 1200 });
    }
    this._tone({ frequency: 98, endFrequency: 70, duration: 0.7, gain: 0.35 });
  }

  /** The player delivers checkmate: triumphant fanfare. @returns {void} */
  playCheckmateWin() {
    if (!this.context) return;
    const chords = [[523.25, 659.25, 783.99], [698.46, 880, 1046.5], [783.99, 987.77, 1174.66], [523.25, 659.25, 783.99, 1046.5]];
    const times = [0, 0.26, 0.52, 0.85];
    chords.forEach((chord, i) => chord.forEach((frequency) => {
      const duration = i === 3 ? 1.6 : 0.3;
      this._tone({ type: 'triangle', frequency, duration, gain: 0.16, delay: times[i] });
      this._tone({ type: 'sawtooth', frequency: frequency / 2, duration, gain: 0.05, delay: times[i], lowpass: 1500 });
    }));
    this._noise({ filter: 'highpass', frequency: 5000, duration: 1.4, gain: 0.07, delay: 0.85 });
  }

  /** The player is checkmated: slow descending minor line. @returns {void} */
  playCheckmateLoss() {
    if (!this.context) return;
    [440, 349.23, 293.66, 220].forEach((frequency, i) => {
      this._tone({ type: 'triangle', frequency, duration: 0.7, gain: 0.22, delay: i * 0.5 });
    });
    this._tone({ type: 'sawtooth', frequency: 55, endFrequency: 45, duration: 2.4, gain: 0.18, lowpass: 300 });
  }

  /** Neutral two-note cue for draws. @returns {void} */
  playDraw() {
    if (!this.context) return;
    this._tone({ type: 'triangle', frequency: 440, duration: 0.3, gain: 0.2 });
    this._tone({ type: 'triangle', frequency: 440, duration: 0.5, gain: 0.2, delay: 0.3 });
  }

  /**
   * Explosion whose weight scales with intensity.
   * @param {number} scale - 0..1.2; larger is longer, deeper and louder.
   * @returns {void}
   */
  playExplosion(scale) {
    if (!this.context) return;
    const bus = this.explosionBus;
    const duration = 0.5 + 1.5 * scale;
    this._noise({ filter: 'lowpass', frequency: 2500 + 2500 * scale, endFrequency: 70, q: 0.9, duration, gain: 0.55 + 0.4 * scale, bus });
    this._tone({ frequency: 100 + 20 * scale, endFrequency: 26, duration: duration * 0.9, gain: 0.35 + 0.65 * scale, bus });
    this._noise({ filter: 'highpass', frequency: 2500, duration: 0.12, gain: 0.3, bus });
    const crackles = Math.round(3 + scale * 10);
    for (let i = 0; i < crackles; i++) {
      this._noise({ filter: 'bandpass', frequency: 1200 + Math.random() * 3000, q: 3, duration: 0.05 + Math.random() * 0.06, gain: 0.18, delay: 0.05 + Math.random() * duration * 0.7, bus });
    }
    if (scale > 0.5) {
      this._noise({ filter: 'lowpass', frequency: 600, endFrequency: 50, duration: duration * 1.2, gain: 0.5 * scale, delay: 0.14, bus });
      this._tone({ frequency: 70, endFrequency: 24, duration: duration, gain: 0.5 * scale, delay: 0.14, bus });
    }
  }
}


/* ============================================================================
 * SECTION 4b — MOVE QUALITY RATING
 * Compares the evaluation before and after a move (plus a deeper hindsight search)
 * and classifies it from blunder to brilliant.
 * ========================================================================== */

/** Classifies played moves using engine evaluations. */
class MoveRater {
  /**
   * @param {EvaluationService} evaluation - Source of deep hindsight evaluations.
   * @param {Object} ratingConfig - CONFIG.moveRating.
   */
  constructor(evaluation, ratingConfig) {
    this.evaluation = evaluation;
    this.config = ratingConfig;
  }

  /**
   * Converts an evaluation to centipawns from White's point of view (mates become very large values).
   * @param {Object} info - Result of EvaluationService.evaluate.
   * @returns {number} Centipawns, positive favours White.
   */
  toCentipawns(info) {
    const mate = this.config.mateCentipawns;
    if (info.kind === 'checkmate') return info.winner === Color.WHITE ? mate : -mate;
    if (info.kind === 'mate') return (info.winner === Color.WHITE ? 1 : -1) * (mate - info.mateIn * 10);
    return info.centipawns;
  }

  /**
   * Converts centipawns to a 0..100 winning chance for the side the score favours.
   * @param {number} centipawns - Score from the point of view of the side in question.
   * @returns {number} Winning chance in percent.
   */
  winChance(centipawns) {
    return 50 + 50 * (2 / (1 + Math.exp(-this.config.winProbabilitySlope * centipawns)) - 1);
  }

  /**
   * Rates one move.
   * @param {Object} record - { mover, move:{from,to,promotion}, wasForced, deliveredMate, afterState }.
   * @param {Object} before - Evaluation of the position before the move.
   * @param {Object} after - Evaluation of the position after the move.
   * @returns {Promise<string>} One of: checkmate, forced, brilliant, best, excellent, okay, inaccuracy, mistake, blunder.
   */
  async rate(record, before, after) {
    const c = this.config;
    if (record.deliveredMate) return 'checkmate';
    if (record.wasForced) return 'forced';
    const sign = record.mover === Color.WHITE ? 1 : -1;
    const beforeCp = this.toCentipawns(before) * sign;
    const afterCp = this.toCentipawns(after) * sign;
    const best = before.bestMove;
    const playedBest = !!best && best.from === record.move.from && best.to === record.move.to && best.promotion === record.move.promotion;
    if (!playedBest && afterCp >= beforeCp - 30 && beforeCp < c.brilliantMaxBeforeCentipawns) {
      const deep = await this.evaluation.evaluate(Position.fromState(record.afterState), true);
      const deepCp = this.toCentipawns(deep) * sign;
      if (deepCp - beforeCp >= c.brilliantMarginCentipawns && deepCp >= c.brilliantMinAfterCentipawns) return 'brilliant';
    }
    if (playedBest) return 'best';
    const winBefore = this.winChance(beforeCp);
    const winAfter = this.winChance(afterCp);
    const loss = winBefore - this.winChance(Math.min(beforeCp, afterCp + c.toleranceCentipawns));
    if (loss > c.mistakeMaxLoss || (winBefore >= c.blunderTurnaroundBefore && winAfter <= c.blunderTurnaroundAfter && loss >= c.blunderTurnaroundMinLoss)) return 'blunder';
    if (loss > c.inaccuracyMaxLoss) return 'mistake';
    if (loss > c.okayMaxLoss) return 'inaccuracy';
    if (loss > c.excellentMaxLoss) return 'okay';
    return 'excellent';
  }
}


/* ============================================================================
 * SECTION 5 — GRAPHICS CORE
 * Post-processing, camera rig, lighting, environment.
 * ========================================================================== */

/** Uniforms shared by every point-sprite material (updated on resize). */
const SHARED_POINT_UNIFORMS = { uViewportHeight: { value: 1080 } };

const POINT_VERTEX_SHADER = `
  attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
  uniform float uViewportHeight;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    vColor = aColor; vAlpha = aAlpha;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = min(aSize * projectionMatrix[1][1] * uViewportHeight * 0.5 / max(gl_Position.w, 0.001), 300.0);
  }`;
const POINT_FRAGMENT_SHADER = `
  uniform float uSoftness;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    vec2 c = gl_PointCoord * 2.0 - 1.0;
    float d = dot(c, c);
    if (d > 1.0) discard;
    gl_FragColor = vec4(vColor, vAlpha * pow(1.0 - d, uSoftness));
  }`;

/**
 * Creates a soft round point-sprite material.
 * @param {number} blending - THREE blending constant.
 * @param {number} softness - Falloff exponent (higher = softer edge).
 * @returns {THREE.ShaderMaterial} Material using the shared viewport uniform.
 */
function createPointMaterial(blending, softness) {
  return new THREE.ShaderMaterial({
    uniforms: { uViewportHeight: SHARED_POINT_UNIFORMS.uViewportHeight, uSoftness: { value: softness } },
    vertexShader: POINT_VERTEX_SHADER,
    fragmentShader: POINT_FRAGMENT_SHADER,
    transparent: true, depthWrite: false, blending,
  });
}

/** Tiny full-screen triangle-pair renderer used by custom passes. */
class FullscreenQuad {
  /** @param {THREE.Material} material - Material drawn over the whole target. */
  constructor(material) {
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  }

  /** @param {THREE.WebGLRenderer} renderer - Renderer to draw with. @returns {void} */
  render(renderer) {
    renderer.render(this.mesh, this.camera);
  }
}

const VERTEX_PASSTHROUGH = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';

/** Depth-of-field: gathers a disc of samples whose radius follows distance from the focal plane. */
const DepthOfFieldShader = {
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: null },
    uNear: { value: 0.5 }, uFar: { value: 200 }, uFocus: { value: 15 },
    uHalfDepth: { value: 3.4 }, uRange: { value: 9 }, uMaxBlur: { value: 10 },
    uTexel: { value: new THREE.Vector2(1 / 1920, 1 / 1080) },
  },
  vertexShader: VERTEX_PASSTHROUGH,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D tDepth;
    uniform float uNear, uFar, uFocus, uHalfDepth, uRange, uMaxBlur; uniform vec2 uTexel;
    varying vec2 vUv;
    float cocAt(vec2 uv) {
      float z = texture2D(tDepth, uv).x * 2.0 - 1.0;
      float dist = (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
      return clamp((abs(dist - uFocus) - uHalfDepth) / uRange, 0.0, 1.0);
    }
    void main() {
      vec4 center = texture2D(tDiffuse, vUv);
      float coc = cocAt(vUv);
      if (coc < 0.02 || uMaxBlur < 0.5) { gl_FragColor = center; return; }
      vec3 sum = center.rgb; float weightSum = 1.0;
      for (int i = 1; i < 20; i++) {
        float r = sqrt(float(i) / 20.0);
        float a = float(i) * 2.39996323;
        vec2 uv = vUv + vec2(cos(a), sin(a)) * r * coc * uMaxBlur * uTexel;
        float w = 0.05 + cocAt(uv);
        sum += texture2D(tDiffuse, uv).rgb * w; weightSum += w;
      }
      gl_FragColor = vec4(sum / weightSum, center.a);
    }`,
};

/** Final colour grade: exposure, ACES tone mapping, vignette, gamma, dithering. */
const OutputShader = {
  uniforms: { tDiffuse: { value: null }, uExposure: { value: 1.1 }, uVignette: { value: 0.5 } },
  vertexShader: VERTEX_PASSTHROUGH,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uExposure; uniform float uVignette;
    varying vec2 vUv;
    vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    void main() {
      vec3 c = aces(texture2D(tDiffuse, vUv).rgb * uExposure);
      vec2 q = vUv - 0.5;
      c *= clamp(1.0 - dot(q, q) * uVignette * 2.0, 0.0, 1.0);
      c = pow(c, vec3(1.0 / 2.2));
      c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
      gl_FragColor = vec4(c, 1.0);
    }`,
};

/** Temporal-accumulation motion blur: blends each frame with the previous output. */
class MotionBlurPass {
  /** Creates the pass (disabled until strength > 0). */
  constructor() {
    this.enabled = true;
    this.needsSwap = true;
    this.clear = false;
    this.renderToScreen = false;
    this.historyWeight = 0.3;
    this.historyTargets = [null, null];
    this.historyIndex = 0;
    this.hasHistory = false;
    this.blendMaterial = new THREE.ShaderMaterial({
      uniforms: { tCurrent: { value: null }, tPrevious: { value: null }, uHistoryWeight: { value: 0.3 } },
      vertexShader: VERTEX_PASSTHROUGH,
      fragmentShader: 'uniform sampler2D tCurrent; uniform sampler2D tPrevious; uniform float uHistoryWeight; varying vec2 vUv; void main(){ gl_FragColor = mix(texture2D(tCurrent, vUv), texture2D(tPrevious, vUv), uHistoryWeight); }',
      depthTest: false, depthWrite: false,
    });
    this.copyMaterial = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: VERTEX_PASSTHROUGH,
      fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }',
      depthTest: false, depthWrite: false,
    });
    this.blendQuad = new FullscreenQuad(this.blendMaterial);
    this.copyQuad = new FullscreenQuad(this.copyMaterial);
  }

  /**
   * Re-creates the history buffers.
   * @param {number} width - Buffer width in pixels.
   * @param {number} height - Buffer height in pixels.
   * @returns {void}
   */
  setSize(width, height) {
    this.historyTargets.forEach((target) => target && target.dispose());
    const options = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: false };
    this.historyTargets = [new THREE.WebGLRenderTarget(width, height, options), new THREE.WebGLRenderTarget(width, height, options)];
    this.hasHistory = false;
  }

  /** Forgets accumulated frames (call when the pass is re-enabled). @returns {void} */
  resetHistory() {
    this.hasHistory = false;
  }

  /**
   * Composer entry point.
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @param {THREE.WebGLRenderTarget} writeBuffer - Destination buffer.
   * @param {THREE.WebGLRenderTarget} readBuffer - Source buffer.
   * @param {number} deltaTime - Frame time in seconds.
   * @returns {void}
   */
  render(renderer, writeBuffer, readBuffer, deltaTime) {
    const previous = this.historyTargets[this.historyIndex];
    const next = this.historyTargets[1 - this.historyIndex];
    const frameWeight = this.hasHistory ? Math.pow(this.historyWeight, Math.min(deltaTime, 0.1) * 60) : 0;
    this.blendMaterial.uniforms.tCurrent.value = readBuffer.texture;
    this.blendMaterial.uniforms.tPrevious.value = previous.texture;
    this.blendMaterial.uniforms.uHistoryWeight.value = frameWeight;
    renderer.setRenderTarget(next);
    this.blendQuad.render(renderer);
    this.copyMaterial.uniforms.tDiffuse.value = next.texture;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.copyQuad.render(renderer);
    this.historyIndex = 1 - this.historyIndex;
    this.hasHistory = true;
  }
}

/** Owns the EffectComposer and every post-processing pass. */
class PostProcessingPipeline {
  /**
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @param {THREE.Scene} scene - Scene to render.
   * @param {THREE.Camera} camera - Camera to render with.
   * @param {Object} postConfig - CONFIG.postProcessing.
   * @param {Object} cameraConfig - CONFIG.camera (near/far).
   */
  constructor(renderer, scene, camera, postConfig, cameraConfig) {
    this.postConfig = postConfig;
    this.width = 1;
    this.height = 1;
    this.pixelRatio = 1;
    this.depthOfFieldStrength = 0;

    const depthTexture = new THREE.DepthTexture(1, 1);
    depthTexture.format = THREE.DepthFormat;
    depthTexture.type = THREE.UnsignedIntType;
    const target = new THREE.WebGLRenderTarget(1, 1, {
      type: THREE.HalfFloatType, format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthTexture,
    });
    this.composer = new THREE.EffectComposer(renderer, target);
    // r128 clones share the depth texture; the second buffer needs its own to avoid a feedback loop.
    const secondDepthTexture = new THREE.DepthTexture(1, 1);
    secondDepthTexture.format = THREE.DepthFormat;
    secondDepthTexture.type = THREE.UnsignedIntType;
    this.composer.renderTarget2.depthTexture = secondDepthTexture;

    this.renderPass = new THREE.RenderPass(scene, camera);
    this.dofPass = new THREE.ShaderPass(DepthOfFieldShader);
    const dofRender = this.dofPass.render.bind(this.dofPass);
    this.dofPass.render = (...args) => { this.dofPass.uniforms.tDepth.value = args[2].depthTexture; dofRender(...args); };
    this.dofPass.uniforms.uNear.value = cameraConfig.near;
    this.dofPass.uniforms.uFar.value = cameraConfig.far;
    this.dofPass.uniforms.uHalfDepth.value = postConfig.dofFocusHalfDepth;
    this.dofPass.uniforms.uRange.value = postConfig.dofTransitionRange;
    this.bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.5, postConfig.bloomRadius, postConfig.bloomThreshold);
    this.outputPass = new THREE.ShaderPass(OutputShader);
    this.outputPass.uniforms.uExposure.value = postConfig.exposure;
    this.outputPass.uniforms.uVignette.value = postConfig.vignette;
    this.motionBlurPass = new MotionBlurPass();
    this.fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
    this.smaaPass = new THREE.SMAAPass(1, 1);

    [this.renderPass, this.dofPass, this.bloomPass, this.outputPass, this.motionBlurPass, this.fxaaPass, this.smaaPass]
      .forEach((pass) => this.composer.addPass(pass));
    this.setAntialiasingLevel(0);
    this.setMotionBlurStrength(0);
    this.setBloom(false, 0);
    this.setDepthOfField(false, 0);
  }

  /**
   * Resizes all buffers.
   * @param {number} width - CSS width.
   * @param {number} height - CSS height.
   * @param {number} pixelRatio - Effective render scale.
   * @returns {void}
   */
  setSize(width, height, pixelRatio) {
    this.width = width; this.height = height; this.pixelRatio = pixelRatio;
    this.composer.setPixelRatio(pixelRatio);
    this.composer.setSize(width, height);
    const w = Math.floor(width * pixelRatio);
    const h = Math.floor(height * pixelRatio);
    this.fxaaPass.material.uniforms.resolution.value.set(1 / w, 1 / h);
    this.dofPass.uniforms.uTexel.value.set(1 / w, 1 / h);
    this.dofPass.uniforms.uMaxBlur.value = this.depthOfFieldStrength * this.postConfig.dofMaxBlurPixels * pixelRatio;
  }

  /** @param {number} level - 0 off, 1 FXAA, 2/3 SMAA. @returns {void} */
  setAntialiasingLevel(level) {
    this.fxaaPass.enabled = level === 1;
    this.smaaPass.enabled = level >= 2;
  }

  /** @param {number} strength - 0..1; 0 disables the pass. @returns {void} */
  setMotionBlurStrength(strength) {
    const wasEnabled = this.motionBlurPass.enabled;
    this.motionBlurPass.enabled = strength > 0.001;
    this.motionBlurPass.historyWeight = strength * this.postConfig.motionBlurMaxHistoryWeight;
    if (this.motionBlurPass.enabled && !wasEnabled) this.motionBlurPass.resetHistory();
  }

  /** @param {boolean} enabled - Bloom on/off. @param {number} strength - Bloom strength. @returns {void} */
  setBloom(enabled, strength) {
    this.bloomPass.enabled = enabled && strength > 0;
    this.bloomPass.strength = strength;
  }

  /** @param {boolean} enabled - DOF on/off. @param {number} strength - 0..1 blur amount. @returns {void} */
  setDepthOfField(enabled, strength) {
    this.depthOfFieldStrength = enabled ? strength : 0;
    this.dofPass.enabled = enabled && strength > 0;
    this.dofPass.uniforms.uMaxBlur.value = this.depthOfFieldStrength * this.postConfig.dofMaxBlurPixels * this.pixelRatio;
  }

  /** @param {number} distance - World distance from camera to the sharp plane. @returns {void} */
  setFocusDistance(distance) {
    this.dofPass.uniforms.uFocus.value = distance;
  }

  /** @param {number} deltaSeconds - Frame time. @returns {void} */
  render(deltaSeconds) {
    this.composer.render(deltaSeconds);
  }
}

/** Orbit camera inside a shakeable rig, with animated side switching. */
class CameraRig {
  /**
   * @param {HTMLElement} domElement - Element receiving pointer input.
   * @param {Object} cameraConfig - CONFIG.camera.
   * @param {Tweener} tweener - Shared tween runner.
   */
  constructor(domElement, cameraConfig, tweener) {
    this.config = cameraConfig;
    this.tweener = tweener;
    this.rig = new THREE.Group();
    this.camera = new THREE.PerspectiveCamera(45, 1, cameraConfig.near, cameraConfig.far);
    this.rig.add(this.camera);
    this.target = new THREE.Vector3(...cameraConfig.target);
    this.trauma = 0;
    this.shakeScale = 1;
    this.defaultDistance = cameraConfig.initialDistance;
    this.controls = new THREE.OrbitControls(this.camera, domElement);
    this.controls.target.copy(this.target);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = cameraConfig.dampingFactor;
    this.controls.enablePan = false;
    this.controls.rotateSpeed = cameraConfig.rotateSpeed;
    this.controls.zoomSpeed = cameraConfig.zoomSpeed;
    this.controls.minDistance = cameraConfig.minDistance;
    this.controls.maxDistance = cameraConfig.maxDistance;
    this.controls.minPolarAngle = cameraConfig.minPolarAngle;
    this.controls.maxPolarAngle = cameraConfig.maxPolarAngle;
    this.controls.autoRotateSpeed = cameraConfig.menuAutoRotateSpeed;
    this.placeOnSide(Color.WHITE);
  }

  /**
   * Instantly positions the camera at default distance behind a side.
   * @param {number} color - Color whose pieces face the camera.
   * @returns {void}
   */
  placeOnSide(color) {
    this._applySpherical(new THREE.Spherical(this.defaultDistance, this.config.initialPolarAngle, color === Color.WHITE ? 0 : Math.PI));
  }

  /**
   * Smoothly swings the camera behind a side.
   * @param {number} color - Color whose pieces should face the camera.
   * @returns {Promise<void>} Resolves when finished.
   */
  swingToSide(color) {
    const from = new THREE.Spherical().setFromVector3(this.camera.position.clone().sub(this.target));
    const targetTheta = color === Color.WHITE ? 0 : Math.PI;
    const deltaTheta = Math.atan2(Math.sin(targetTheta - from.theta), Math.cos(targetTheta - from.theta));
    const initialDistance = this.defaultDistance;
    const { initialPolarAngle } = this.config;
    return this.tweener.start({
      durationSeconds: this.config.sideTransitionSeconds,
      onUpdate: (t) => this._applySpherical(new THREE.Spherical(
        lerp(from.radius, initialDistance, t), lerp(from.phi, initialPolarAngle, t), from.theta + deltaTheta * t)),
    });
  }

  /** Sets camera position from spherical coordinates around the target. */
  _applySpherical(spherical) {
    this.camera.position.setFromSpherical(spherical).add(this.target);
    this.controls.update();
  }

  /** @param {boolean} enabled - Slow idle orbit on/off. @returns {void} */
  setAutoRotate(enabled) {
    this.controls.autoRotate = enabled;
  }

  /** @param {number} degrees - Vertical field of view. @returns {void} */
  setFieldOfView(degrees) {
    this.camera.fov = degrees;
    this.camera.updateProjectionMatrix();
    this._updateFraming();
  }

  /**
   * Recomputes the default camera distance so the whole board fits tall, narrow screens.
   * The camera is pulled back to the new distance if the player hasn't zoomed away from the old default.
   */
  _updateFraming() {
    const halfBoardWidth = 6.4;
    const halfFov = THREE.MathUtils.degToRad(this.camera.fov) / 2;
    const fitDistance = halfBoardWidth / (Math.tan(halfFov) * Math.min(1, this.camera.aspect));
    const previous = this.defaultDistance;
    this.defaultDistance = Math.max(this.config.initialDistance, fitDistance);
    this.controls.maxDistance = Math.max(this.config.maxDistance, this.defaultDistance * 1.35);
    const radius = this.camera.position.distanceTo(this.target);
    if (Math.abs(radius - previous) < 0.05 && Math.abs(this.defaultDistance - previous) > 0.01) {
      const spherical = new THREE.Spherical().setFromVector3(this.camera.position.clone().sub(this.target));
      this._applySpherical(spherical.set(this.defaultDistance, spherical.phi, spherical.theta));
    }
  }

  /** @param {number} aspect - Width / height. @returns {void} */
  setAspect(aspect) {
    this.camera.aspect = aspect;
    this.camera.updateProjectionMatrix();
    this._updateFraming();
  }

  /** @param {number} amount - Trauma to add (0..1); shake grows with its square. @returns {void} */
  addShake(amount) {
    this.trauma = Math.min(1, this.trauma + amount);
  }

  /** @returns {number} Distance from camera to the board centre (DOF focus). */
  getFocusDistance() {
    return this.camera.position.distanceTo(this.controls.target);
  }

  /**
   * Updates damping controls and shake.
   * @param {number} deltaSeconds - Frame time.
   * @param {number} elapsedSeconds - Total time (noise phase).
   * @returns {void}
   */
  update(deltaSeconds, elapsedSeconds) {
    this.controls.update();
    const { traumaDecayPerSecond, maxTranslation, maxRotationRadians } = this.config.shake;
    this.trauma = Math.max(0, this.trauma - traumaDecayPerSecond * deltaSeconds);
    const power = this.trauma * this.trauma * this.shakeScale;
    const noise = (frequency, seed) => Math.sin(elapsedSeconds * frequency + seed) * 0.6 + Math.sin(elapsedSeconds * frequency * 1.73 + seed * 2.1) * 0.4;
    this.rig.position.set(noise(43, 1.3) * maxTranslation * power, noise(51, 4.1) * maxTranslation * power, noise(47, 7.7) * maxTranslation * power);
    this.rig.rotation.set(noise(39, 2.2) * maxRotationRadians * power, noise(41, 5.5) * maxRotationRadians * power, noise(37, 8.8) * maxRotationRadians * power);
  }
}

/** Builds and updates the scene's lights, including the pre-allocated explosion flash. */
class LightingRig {
  /**
   * @param {THREE.Scene} scene - Scene receiving the lights.
   * @param {Object} lightConfig - CONFIG.lighting.
   * @param {number[]} shadowMapSizes - CONFIG.shadowMapSizes.
   */
  constructor(scene, lightConfig, shadowMapSizes) {
    this.shadowMapSizes = shadowMapSizes;
    const c = lightConfig;
    this.keyLight = new THREE.SpotLight(c.keyColor, c.keyIntensity, 0, c.keyAngle, c.keyPenumbra, 1);
    this.keyLight.position.set(...c.keyPosition);
    this.keyLight.shadow.bias = c.shadowBias;
    this.keyLight.shadow.normalBias = c.shadowNormalBias;
    this.keyLight.shadow.camera.near = 5;
    this.keyLight.shadow.camera.far = 40;
    scene.add(this.keyLight, this.keyLight.target);

    const rimCool = new THREE.DirectionalLight(c.rimCoolColor, c.rimCoolIntensity);
    rimCool.position.set(...c.rimCoolPosition);
    const rimWarm = new THREE.DirectionalLight(c.rimWarmColor, c.rimWarmIntensity);
    rimWarm.position.set(...c.rimWarmPosition);
    const hemisphere = new THREE.HemisphereLight(c.hemisphereSky, c.hemisphereGround, c.hemisphereIntensity);
    scene.add(rimCool, rimWarm, hemisphere);

    this.flashLight = new THREE.PointLight(0xffaa55, 0, 12, 2);
    scene.add(this.flashLight);
  }

  /**
   * Applies a shadow quality level (0 = off).
   * @param {number} level - Index into the shadow map size table.
   * @param {THREE.Scene} scene - Scene whose materials must be refreshed.
   * @returns {void}
   */
  setShadowQuality(level, scene) {
    const size = this.shadowMapSizes[level];
    const wasCasting = this.keyLight.castShadow;
    this.keyLight.castShadow = size > 0;
    if (size > 0 && this.keyLight.shadow.mapSize.x !== size) {
      this.keyLight.shadow.mapSize.set(size, size);
      if (this.keyLight.shadow.map) { this.keyLight.shadow.map.dispose(); this.keyLight.shadow.map = null; }
    }
    if (wasCasting !== this.keyLight.castShadow) scene.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => { m.needsUpdate = true; }); });
  }
}

/** Creates the procedural studio environment map, backdrop, floor and bokeh lights. */
class EnvironmentBuilder {
  /**
   * @param {Object} envConfig - CONFIG.environment.
   */
  constructor(envConfig) {
    this.config = envConfig;
  }

  /**
   * Renders a studio of soft boxes into a PMREM cube for metal reflections.
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @returns {THREE.Texture} Pre-filtered environment texture.
   */
  createEnvironmentTexture(renderer) {
    const studio = new THREE.Scene();
    const skyGeometry = new THREE.SphereGeometry(50, 32, 16);
    const skyColors = [];
    const skyPositions = skyGeometry.attributes.position;
    for (let i = 0; i < skyPositions.count; i++) {
      const height = skyPositions.getY(i) / 50 * 0.5 + 0.5;
      const blend = THREE.MathUtils.smoothstep(height, 0.35, 1.0);
      skyColors.push(lerp(0.015, 0.18, blend), lerp(0.017, 0.21, blend), lerp(0.025, 0.3, blend));
    }
    skyGeometry.setAttribute('color', new THREE.Float32BufferAttribute(skyColors, 3));
    const sky = new THREE.Mesh(skyGeometry, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide }));
    studio.add(sky);
    const addPanel = (width, height, position, rgb) => {
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ color: new THREE.Color(rgb[0], rgb[1], rgb[2]), side: THREE.DoubleSide }));
      panel.position.set(...position);
      panel.lookAt(0, 0, 0);
      studio.add(panel);
    };
    addPanel(26, 9, [0, 24, 0], [2.2, 2.2, 2.2]);
    addPanel(14, 18, [-22, 9, 14], [1.9, 1.9, 1.9]);
    addPanel(6, 20, [22, 8, 8], [0.7, 1.0, 1.6]);
    addPanel(24, 5, [0, 7, -24], [1.0, 1.05, 1.2]);
    addPanel(5, 5, [14, 3, -16], [1.4, 1.3, 1.2]);
    const generator = new THREE.PMREMGenerator(renderer);
    const texture = generator.fromScene(studio, 0.03).texture;
    generator.dispose();
    studio.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    return texture;
  }

  /**
   * Adds fog, a gradient sky dome, bokeh city lights and a glossy floor.
   * @param {THREE.Scene} scene - Scene to populate.
   * @returns {void}
   */
  populate(scene) {
    const c = this.config;
    scene.fog = new THREE.FogExp2(c.fogColor, c.fogDensity);

    const dome = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vDir; void main(){ float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0); vec3 c = mix(vec3(0.004,0.005,0.008), vec3(0.012,0.018,0.04), smoothstep(0.4, 0.95, h)); c += vec3(0.02,0.012,0.02) * smoothstep(0.55, 0.45, abs(h-0.5)*2.0); gl_FragColor = vec4(c, 1.0); }',
    }));
    dome.renderOrder = -10;
    scene.add(dome);

    const count = c.bokehLightCount;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const alphas = new Float32Array(count);
    const warm = new THREE.Color(1.2, 0.7, 0.32);
    const cool = new THREE.Color(0.35, 0.6, 1.2);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = randomBetween(32, 58);
      positions.set([Math.cos(angle) * radius, randomBetween(0.5, 20), Math.sin(angle) * radius], i * 3);
      (Math.random() < 0.6 ? warm : cool).toArray(colors, i * 3);
      sizes[i] = randomBetween(0.9, 3.2);
      alphas[i] = randomBetween(0.35, 0.9);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
    const bokeh = new THREE.Points(geometry, createPointMaterial(THREE.AdditiveBlending, 0.6));
    bokeh.frustumCulled = false;
    scene.add(bokeh);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(70, 64).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: createLinearColor(c.floorColor), roughness: 0.8, metalness: 0.15, envMapIntensity: 0.08 }),
    );
    floor.position.y = CONFIG.board.baseBottomY;
    floor.receiveShadow = true;
    scene.add(floor);
  }
}

/**
 * Facade over renderer, scene, camera, lights and post-processing. Owns resizing
 * and the dynamic-resolution scale used to hold 60 fps.
 */
class GraphicsEngine {
  /**
   * @param {HTMLCanvasElement} canvas - Target canvas.
   * @param {Tweener} tweener - Shared tween runner.
   */
  constructor(canvas, tweener) {
    this.canvas = canvas;
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
    this.renderer.outputEncoding = THREE.LinearEncoding; // final grade done in OutputShader
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.setClearColor(0x030407);
    this.scene = new THREE.Scene();
    this.cameraRig = new CameraRig(canvas, CONFIG.camera, tweener);
    this.scene.add(this.cameraRig.rig);
    this.lighting = new LightingRig(this.scene, CONFIG.lighting, CONFIG.shadowMapSizes);
    const environment = new EnvironmentBuilder(CONFIG.environment);
    this.scene.environment = environment.createEnvironmentTexture(this.renderer);
    environment.populate(this.scene);
    this.pipeline = new PostProcessingPipeline(this.renderer, this.scene, this.cameraRig.camera, CONFIG.postProcessing, CONFIG.camera);
    this.dynamicScale = 1;
    this.supersample = false;
    this.resizeListeners = [];
    this.resize();
  }

  /** @returns {number} Effective pixel ratio after device, dynamic scale and supersampling. */
  computePixelRatio() {
    const perf = CONFIG.performance;
    const base = Math.min(window.devicePixelRatio || 1, perf.maxPixelRatio) * this.dynamicScale * (this.supersample ? 1.5 : 1);
    return clamp(base, 0.5, perf.maxEffectivePixelRatio);
  }

  /**
   * Resizes the canvas and all buffers to the window.
   * @returns {void}
   */
  resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const ratio = this.computePixelRatio();
    this.renderer.setPixelRatio(ratio);
    this.renderer.setSize(width, height, false);
    this.pipeline.setSize(width, height, ratio);
    this.cameraRig.setAspect(width / height);
    SHARED_POINT_UNIFORMS.uViewportHeight.value = height * ratio;
    this.resizeListeners.forEach((listener) => listener(width, height, ratio));
  }

  /**
   * Registers a callback invoked after each resize.
   * @param {function(number, number, number): void} listener - (width, height, pixelRatio).
   * @returns {void}
   */
  onResize(listener) {
    this.resizeListeners.push(listener);
  }

  /**
   * Changes the dynamic-resolution multiplier and resizes.
   * @param {number} scale - Multiplier (0.6..1).
   * @returns {void}
   */
  setDynamicScale(scale) {
    this.dynamicScale = scale;
    this.resize();
  }

  /**
   * Chooses the antialiasing level (3 additionally renders at 1.5x resolution).
   * @param {number} level - 0..3.
   * @returns {void}
   */
  setAntialiasing(level) {
    this.pipeline.setAntialiasingLevel(level);
    const wantsSupersample = level >= 3;
    if (wantsSupersample !== this.supersample) { this.supersample = wantsSupersample; this.resize(); }
  }

  /**
   * Renders one frame.
   * @param {number} deltaSeconds - Frame time.
   * @returns {void}
   */
  render(deltaSeconds) {
    this.pipeline.setFocusDistance(this.cameraRig.getFocusDistance());
    this.pipeline.render(deltaSeconds);
  }
}


/* ============================================================================
 * SECTION 6 — BOARD, PIECES, HIGHLIGHTS, INPUT
 * Board coordinates: file a..h along +x, rank 1..8 along -z, board top at y = 0.
 * ========================================================================== */

/**
 * Converts a square index to world coordinates.
 * @param {number} square - Square index 0..63.
 * @param {THREE.Vector3} [target] - Vector to fill.
 * @returns {THREE.Vector3} Square centre on the board surface.
 */
function squareToWorld(square, target = new THREE.Vector3()) {
  return target.set(engine.fileOf(square) - 3.5, 0, 3.5 - engine.rankOf(square));
}

/**
 * Converts world x/z to a square index.
 * @param {number} x - World x.
 * @param {number} z - World z.
 * @returns {number} Square index, or -1 if off the board.
 */
function worldToSquare(x, z) {
  const file = Math.floor(x + 4);
  const rank = Math.floor(4 - z);
  return file < 0 || file > 7 || rank < 0 || rank > 7 ? -1 : rank * 8 + file;
}

/** Builds merged, reusable geometry for each piece type. */
class PieceFactory {
  /**
   * @param {Object} pieceConfig - CONFIG.pieces.
   */
  constructor(pieceConfig) {
    this.config = pieceConfig;
    this.geometryCache = new Map();
    this.materials = [
      this._createMaterial(pieceConfig.whiteColor, pieceConfig.whiteRoughness),
      this._createMaterial(pieceConfig.blackColor, pieceConfig.blackRoughness),
    ];
    this.pickGeometry = new THREE.CylinderGeometry(0.42, 0.42, 1, 10).translate(0, 0.5, 0);
    this.pickMaterial = new THREE.MeshBasicMaterial({ visible: false });
  }

  /** Creates a polished metal material. */
  _createMaterial(hex, roughness) {
    return new THREE.MeshStandardMaterial({
      color: createLinearColor(hex), metalness: 1, roughness, envMapIntensity: this.config.envMapIntensity,
    });
  }

  /**
   * Gets (building on first use) the geometry of a piece type.
   * @param {number} type - PieceType.
   * @returns {THREE.BufferGeometry} Shared geometry (do not dispose).
   */
  getGeometry(type) {
    if (!this.geometryCache.has(type)) this.geometryCache.set(type, this._buildGeometry(type));
    return this.geometryCache.get(type);
  }

  /**
   * Creates a pickable piece node: root group > visual group > mesh, plus a hidden pick proxy.
   * @param {number} type - PieceType.
   * @param {number} color - Color.
   * @returns {{group: THREE.Group, visual: THREE.Group, mesh: THREE.Mesh, material: THREE.Material, pickProxy: THREE.Mesh}} Parts.
   */
  createPiece(type, color) {
    const material = this.materials[color].clone();
    const mesh = new THREE.Mesh(this.getGeometry(type), material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const visual = new THREE.Group();
    visual.add(mesh);
    visual.rotation.y = (color === Color.BLACK ? Math.PI : 0) + (type === PieceType.KNIGHT ? Math.PI / 4 : 0); // knights face the opponent, turned to show their profile
    const pickProxy = new THREE.Mesh(this.pickGeometry, this.pickMaterial);
    this.sizePickProxy(pickProxy, type);
    const group = new THREE.Group();
    group.add(visual, pickProxy);
    return { group, visual, mesh, material, pickProxy };
  }

  /**
   * Scales the pick proxy to a piece type's height.
   * @param {THREE.Mesh} proxy - Proxy mesh.
   * @param {number} type - PieceType.
   * @returns {void}
   */
  sizePickProxy(proxy, type) {
    proxy.scale.set(1, this.config.heights[PIECE_KEYS[type]], 1);
  }

  /** Builds one piece's merged geometry from lathe profiles and accessories. */
  _buildGeometry(type) {
    const seg = this.config.radialSegments;
    const lathe = (points) => new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), seg);
    const sphere = (radius, y, x = 0, z = 0) => new THREE.SphereGeometry(radius, 20, 14).translate(x, y, z);
    const parts = [];
    switch (type) {
      case PieceType.PAWN:
        parts.push(lathe([[0,0],[.33,0],[.34,.03],[.34,.07],[.30,.11],[.22,.15],[.17,.22],[.14,.34],[.15,.42],[.22,.44],[.22,.47],[.15,.5],[0,.5]]), sphere(0.19, 0.62));
        break;
      case PieceType.ROOK: {
        parts.push(lathe([[0,0],[.37,0],[.38,.04],[.38,.09],[.32,.13],[.25,.18],[.2,.3],[.19,.5],[.2,.58],[.28,.62],[.3,.64],[.3,.78],[0,.78]]));
        for (let i = 0; i < 6; i++) parts.push(new THREE.BoxGeometry(0.17, 0.14, 0.1).translate(0, 0.85, 0.235).rotateY((i / 6) * Math.PI * 2));
        break;
      }
      case PieceType.BISHOP:
        parts.push(lathe([[0,0],[.35,0],[.36,.04],[.36,.08],[.3,.12],[.2,.17],[.15,.3],[.13,.5],[.17,.56],[.24,.58],[.24,.62],[.17,.65],[.14,.7],[.19,.82],[.2,.9],[.17,1.0],[.1,1.08],[.03,1.14],[0,1.15]]), sphere(0.065, 1.2));
        break;
      case PieceType.QUEEN: {
        parts.push(lathe([[0,0],[.38,0],[.39,.04],[.39,.09],[.33,.13],[.22,.18],[.16,.32],[.14,.55],[.18,.62],[.27,.66],[.27,.7],[.18,.74],[.15,.82],[.2,.95],[.27,1.1],[.3,1.2],[.27,1.24],[0,1.24]]), sphere(0.085, 1.32));
        for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; parts.push(sphere(0.05, 1.27, Math.sin(a) * 0.27, Math.cos(a) * 0.27)); }
        break;
      }
      case PieceType.KING:
        parts.push(lathe([[0,0],[.39,0],[.4,.04],[.4,.09],[.34,.13],[.23,.18],[.17,.32],[.15,.58],[.19,.66],[.28,.7],[.28,.74],[.19,.78],[.16,.86],[.21,1.0],[.27,1.18],[.29,1.26],[.24,1.28],[0,1.28]]),
          new THREE.BoxGeometry(0.1, 0.38, 0.1).translate(0, 1.46, 0), new THREE.BoxGeometry(0.28, 0.09, 0.09).translate(0, 1.52, 0));
        break;
      case PieceType.KNIGHT: {
        parts.push(lathe([[0,0],[.37,0],[.38,.04],[.38,.09],[.32,.13],[.27,.2],[.26,.3],[0,.3]]));
        const s = new THREE.Shape();
        s.moveTo(-0.26, 0.25); s.lineTo(0.27, 0.25);
        s.quadraticCurveTo(0.31, 0.46, 0.2, 0.62);
        s.quadraticCurveTo(0.3, 0.64, 0.46, 0.68);
        s.lineTo(0.56, 0.74); s.lineTo(0.54, 0.86);
        s.quadraticCurveTo(0.42, 0.95, 0.3, 1.04);
        s.lineTo(0.2, 1.2); s.lineTo(0.08, 1.06);
        s.quadraticCurveTo(-0.14, 1.02, -0.24, 0.76);
        s.quadraticCurveTo(-0.32, 0.5, -0.26, 0.25);
        const head = new THREE.ExtrudeGeometry(s, { depth: 0.36, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3, curveSegments: 14 });
        parts.push(head.translate(-0.1, 0, -0.18).rotateY(Math.PI / 2));
        break;
      }
      default: throw new Error('Unknown piece type ' + type);
    }
    const mergeable = parts.map((g) => {
      const flat = g.index ? g.toNonIndexed() : g;
      Object.keys(flat.attributes).filter((n) => !['position', 'normal', 'uv'].includes(n)).forEach((n) => flat.deleteAttribute(n));
      return flat;
    });
    return THREE.BufferGeometryUtils.mergeBufferGeometries(mergeable);
  }
}

/** Runtime state and scene nodes of one piece on the board. */
class PieceView {
  /**
   * @param {number} type - PieceType.
   * @param {number} color - Color.
   * @param {number} square - Current square.
   * @param {Object} parts - Result of PieceFactory.createPiece.
   */
  constructor(type, color, square, parts) {
    Object.assign(this, parts);
    this.type = type;
    this.color = color;
    this.square = square;
    this.lift = 0;
    this.liftTarget = 0;
    this.pickProxy.userData.pieceView = this;
  }
}

/** Pooled square overlays and move-target markers (all additive/transparent, no per-frame allocation). */
class BoardHighlighter {
  /**
   * @param {THREE.Object3D} parent - Node to attach overlays to.
   */
  constructor(parent) {
    const flat = (geometry) => geometry.rotateX(-Math.PI / 2);
    const overlayGeometry = flat(new THREE.PlaneGeometry(0.98, 0.98));
    const makeOverlay = (rgb, opacity) => {
      const mesh = new THREE.Mesh(overlayGeometry, new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), transparent: true, opacity, depthWrite: false }));
      mesh.position.y = 0.006; mesh.renderOrder = 2; mesh.visible = false; mesh.userData.baseOpacity = opacity;
      parent.add(mesh);
      return mesh;
    };
    this.selectedOverlay = makeOverlay([0.1, 0.35, 1.2], 0.55);
    this.lastFromOverlay = makeOverlay([1.0, 0.7, 0.15], 0.28);
    this.lastToOverlay = makeOverlay([1.0, 0.7, 0.15], 0.38);
    this.checkOverlay = makeOverlay([2.2, 0.1, 0.05], 0.7);
    this.hoverOverlay = makeOverlay([0.6, 0.8, 1.2], 0.22);
    this.hintFromOverlay = makeOverlay([0.1, 1.4, 1.2], 0.35);
    this.hintToOverlay = makeOverlay([0.1, 1.8, 1.5], 0.6);

    const dotGeometry = flat(new THREE.CircleGeometry(0.15, 24));
    const ringGeometry = flat(new THREE.RingGeometry(0.36, 0.46, 32));
    const markerMaterial = (rgb) => new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending });
    const dotMaterial = markerMaterial([0.3, 1.9, 1.3]);
    const ringMaterial = markerMaterial([2.4, 0.35, 0.2]);
    this.dotPool = this._createPool(parent, dotGeometry, dotMaterial, 28);
    this.ringPool = this._createPool(parent, ringGeometry, ringMaterial, 16);
    this.activeMarkers = [];
  }

  /** Allocates a pool of hidden meshes. */
  _createPool(parent, geometry, material, size) {
    return Array.from({ length: size }, () => {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = 0.012; mesh.renderOrder = 3; mesh.visible = false;
      parent.add(mesh);
      return mesh;
    });
  }

  /** Shows an overlay on a square, or hides it for square < 0. */
  _place(overlay, square) {
    overlay.visible = square >= 0;
    if (square >= 0) { squareToWorld(square, overlay.position); overlay.position.y = 0.006; }
  }

  /** @param {number} square - Selected square or -1. @returns {void} */
  setSelected(square) { this._place(this.selectedOverlay, square); }
  /** @param {number} from - Origin square or -1. @param {number} to - Destination square or -1. @returns {void} */
  setLastMove(from, to) { this._place(this.lastFromOverlay, from); this._place(this.lastToOverlay, to); }
  /** @param {number} square - King square in check or -1. @returns {void} */
  setCheck(square) { this._place(this.checkOverlay, square); }
  /** @param {number} square - Hovered square or -1. @returns {void} */
  setHover(square) { this._place(this.hoverOverlay, square); }
  /** @param {number} from - Suggested move origin or -1. @param {number} to - Suggested destination or -1. @returns {void} */
  setHint(from, to) { this._place(this.hintFromOverlay, from); this._place(this.hintToOverlay, to); }

  /**
   * Shows markers for legal destinations.
   * @param {Array<{square:number, isCapture:boolean}>} targets - Destinations.
   * @returns {void}
   */
  setTargets(targets) {
    this.activeMarkers.forEach((m) => { m.visible = false; });
    this.activeMarkers = [];
    let dots = 0; let rings = 0;
    targets.forEach(({ square, isCapture }) => {
      const mesh = isCapture ? this.ringPool[rings++] : this.dotPool[dots++];
      if (!mesh) return;
      squareToWorld(square, mesh.position); mesh.position.y = 0.012; mesh.visible = true;
      this.activeMarkers.push(mesh);
    });
  }

  /**
   * Animates pulsing markers and the check overlay.
   * @param {number} elapsedSeconds - Total time.
   * @returns {void}
   */
  update(elapsedSeconds) {
    const pulse = 1 + Math.sin(elapsedSeconds * 5) * 0.12;
    this.activeMarkers.forEach((m) => m.scale.setScalar(pulse));
    this.checkOverlay.material.opacity = 0.45 + Math.sin(elapsedSeconds * 6) * 0.25;
  }
}

/** Builds the board geometry and manages piece views and their movement animation. */
class BoardView {
  /**
   * @param {THREE.Scene} scene - Scene to add the board to.
   * @param {Tweener} tweener - Shared tween runner.
   */
  constructor(scene, tweener) {
    this.config = CONFIG.board;
    this.tweener = tweener;
    this.root = new THREE.Group();
    scene.add(this.root);
    this.pieceFactory = new PieceFactory(CONFIG.pieces);
    this.pieceViews = new Map();
    this.selectedView = null;
    this.reflectionsEnabled = true;
    this.selectionEmissive = createLinearColor(CONFIG.pieces.selectionEmissive);
    this._buildBoard();
    this.highlighter = new BoardHighlighter(this.root);
    this.piecesRoot = new THREE.Group();
    this.root.add(this.piecesRoot);
  }

  /** Creates a canvas texture via a draw callback. */
  _canvasTexture(size, draw) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    draw(canvas.getContext('2d'), size);
    const texture = new THREE.CanvasTexture(canvas);
    texture.encoding = THREE.sRGBEncoding;
    texture.anisotropy = 4;
    return texture;
  }

  /** Subtle veined marble used on the squares. */
  _createMarbleTexture() {
    return this._canvasTexture(256, (ctx, size) => {
      ctx.fillStyle = '#e6e6e6'; ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 26; i++) {
        ctx.strokeStyle = 'rgba(80,80,90,' + (0.05 + Math.random() * 0.08) + ')';
        ctx.lineWidth = 0.5 + Math.random() * 1.5;
        ctx.beginPath(); ctx.moveTo(Math.random() * size, 0);
        ctx.bezierCurveTo(Math.random() * size, size * 0.3, Math.random() * size, size * 0.7, Math.random() * size, size);
        ctx.stroke();
      }
    });
  }

  /** Wood grain used on the frame. */
  _createWoodTexture() {
    return this._canvasTexture(256, (ctx, size) => {
      ctx.fillStyle = '#b9b9b9'; ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 90; i++) {
        const shade = 120 + Math.random() * 100;
        ctx.strokeStyle = 'rgba(' + shade + ',' + shade + ',' + shade + ',0.35)';
        ctx.lineWidth = 0.6 + Math.random() * 2;
        const y = Math.random() * size;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(size * 0.3, y + Math.random() * 8 - 4, size * 0.7, y + Math.random() * 8 - 4, size, y); ctx.stroke();
      }
    });
  }

  /** Creates a flat text label mesh (file letters / rank numbers). */
  _createLabel(text) {
    const texture = this._canvasTexture(64, (ctx, size) => {
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 44px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, size / 2, size / 2 + 2);
    });
    const material = new THREE.MeshBasicMaterial({ map: texture, color: createLinearColor(this.config.labelColor), transparent: true, depthWrite: false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4).rotateX(-Math.PI / 2), material);
    mesh.position.y = this.config.frameHeight + 0.003;
    return mesh;
  }

  /** Assembles base, frame, trim, labels, squares and the mirror plane. */
  _buildBoard() {
    const c = this.config;
    const woodMap = this._createWoodTexture();
    const frameMaterial = new THREE.MeshStandardMaterial({ color: createLinearColor(c.frameColor), map: woodMap, roughness: 0.5, metalness: 0.1, envMapIntensity: 0.3 });
    const outer = 8 + c.frameWidth * 2;
    const baseTop = -0.03;
    const base = new THREE.Mesh(new THREE.BoxGeometry(outer, baseTop - c.baseBottomY, outer), new THREE.MeshStandardMaterial({ color: createLinearColor(0x0c0d10), roughness: 0.6, metalness: 0.3 }));
    base.position.y = (baseTop + c.baseBottomY) / 2;
    base.receiveShadow = true;
    this.root.add(base);

    const frameThickness = c.frameWidth;
    const frameBoxHeight = c.frameHeight - baseTop;
    [[0, -4 - frameThickness / 2, outer, frameThickness], [0, 4 + frameThickness / 2, outer, frameThickness],
      [-4 - frameThickness / 2, 0, frameThickness, 8], [4 + frameThickness / 2, 0, frameThickness, 8]].forEach(([x, z, w, d]) => {
      const piece = new THREE.Mesh(new THREE.BoxGeometry(w, frameBoxHeight, d), frameMaterial);
      piece.position.set(x, baseTop + frameBoxHeight / 2, z);
      piece.castShadow = true; piece.receiveShadow = true;
      this.root.add(piece);
    });
    const trimMaterial = new THREE.MeshStandardMaterial({ color: createLinearColor(c.trimColor), metalness: 1, roughness: 0.25 });
    [[0, -4.02, 8.08, 0.04], [0, 4.02, 8.08, 0.04], [-4.02, 0, 0.04, 8], [4.02, 0, 0.04, 8]].forEach(([x, z, w, d]) => {
      const trim = new THREE.Mesh(new THREE.BoxGeometry(w, 0.012, d), trimMaterial);
      trim.position.set(x, c.frameHeight + 0.004, z);
      this.root.add(trim);
    });
    for (let i = 0; i < 8; i++) {
      const letter = 'abcdefgh'[i];
      const digit = String(i + 1);
      [-1, 1].forEach((side) => {
        const fileLabel = this._createLabel(letter); fileLabel.position.set(i - 3.5, fileLabel.position.y, side * (4 + c.frameWidth / 2)); this.root.add(fileLabel);
        const rankLabel = this._createLabel(digit); rankLabel.position.set(side * (4 + c.frameWidth / 2), rankLabel.position.y, 3.5 - i); this.root.add(rankLabel);
      });
    }

    const marble = this._createMarbleTexture();
    const makeSquareMaterial = (hex) => new THREE.MeshStandardMaterial({ color: createLinearColor(hex), map: marble, roughness: 0.45, metalness: 0.0, envMapIntensity: 0.2, transparent: true, opacity: c.squareOpacityWithReflection });
    this.squareMaterials = [makeSquareMaterial(c.lightSquareColor), makeSquareMaterial(c.darkSquareColor)];
    const squareGeometry = new THREE.BoxGeometry(1, c.squareThickness, 1);
    this.squaresGroup = new THREE.Group();
    const lightSquares = new THREE.InstancedMesh(squareGeometry, this.squareMaterials[0], 32);
    const darkSquares = new THREE.InstancedMesh(squareGeometry, this.squareMaterials[1], 32);
    const matrix = new THREE.Matrix4();
    let lightIndex = 0; let darkIndex = 0;
    for (let square = 0; square < 64; square++) {
      const position = squareToWorld(square);
      matrix.makeTranslation(position.x, -c.squareThickness / 2, position.z);
      const isDark = (engine.fileOf(square) + engine.rankOf(square)) % 2 === 0;
      if (isDark) darkSquares.setMatrixAt(darkIndex++, matrix); else lightSquares.setMatrixAt(lightIndex++, matrix);
    }
    [lightSquares, darkSquares].forEach((mesh) => { mesh.receiveShadow = true; mesh.frustumCulled = false; this.squaresGroup.add(mesh); });
    this.root.add(this.squaresGroup);

    this.reflector = new THREE.Reflector(new THREE.PlaneGeometry(8, 8), {
      clipBias: 0.003, textureWidth: 512, textureHeight: 512, color: new THREE.Color(0x808080),
    });
    this.reflector.rotation.x = -Math.PI / 2;
    this.reflector.position.y = -c.squareThickness - 0.001;
    const originalBeforeRender = this.reflector.onBeforeRender;
    this.reflector.onBeforeRender = (...args) => {
      this.squaresGroup.visible = false; // squares would otherwise hide the pieces in the mirror
      originalBeforeRender.apply(this.reflector, args);
      this.squaresGroup.visible = true;
    };
    this.root.add(this.reflector);
  }

  /**
   * Enables/disables mirror reflections.
   * @param {boolean} enabled - New state.
   * @returns {void}
   */
  setReflectionsEnabled(enabled) {
    this.reflectionsEnabled = enabled;
    this.reflector.visible = enabled;
    this.squareMaterials.forEach((m) => { m.transparent = enabled; m.opacity = enabled ? this.config.squareOpacityWithReflection : 1; });
  }

  /**
   * Resizes the mirror render target (called on window resize).
   * @param {number} width - Drawing buffer width.
   * @param {number} height - Drawing buffer height.
   * @returns {void}
   */
  resizeReflection(width, height) {
    const scale = this.config.reflectionResolutionScale;
    this.reflector.getRenderTarget().setSize(Math.max(256, Math.floor(width * scale)), Math.max(256, Math.floor(height * scale)));
  }

  /**
   * Removes all pieces and recreates them from a position.
   * @param {Position} position - Position to display.
   * @returns {void}
   */
  resetPieces(position) {
    this.pieceViews.forEach((view) => this.piecesRoot.remove(view.group));
    this.pieceViews.clear();
    this.selectedView = null;
    for (let square = 0; square < 64; square++) {
      const code = position.board[square];
      if (code !== 0) this.addPiece(engine.getPieceType(code), engine.getPieceColor(code), square);
    }
  }

  /**
   * Creates and places one piece.
   * @param {number} type - PieceType.
   * @param {number} color - Color.
   * @param {number} square - Target square.
   * @returns {PieceView} The new view.
   */
  addPiece(type, color, square) {
    const view = new PieceView(type, color, square, this.pieceFactory.createPiece(type, color));
    squareToWorld(square, view.group.position);
    this.piecesRoot.add(view.group);
    this.pieceViews.set(square, view);
    return view;
  }

  /**
   * @param {number} square - Square index.
   * @returns {PieceView|undefined} Piece standing on the square.
   */
  getPieceViewAt(square) {
    return this.pieceViews.get(square);
  }

  /**
   * Marks one piece as lifted/glowing (or clears selection with null).
   * @param {PieceView|null} view - Piece to select.
   * @returns {void}
   */
  setSelectedPiece(view) {
    if (this.selectedView) this.selectedView.liftTarget = 0;
    this.selectedView = view;
    if (view) view.liftTarget = CONFIG.pieces.selectionLift;
  }

  /**
   * Animates a piece to a square along an arc.
   * @param {PieceView} view - Piece to move.
   * @param {number} toSquare - Destination.
   * @param {Object} [options] - { delaySeconds, onProgress(progress) }.
   * @returns {Promise<void>} Resolves when the piece has landed.
   */
  async movePiece(view, toSquare, options = {}) {
    const anim = CONFIG.animation;
    const fromSquare = view.square;
    if (this.pieceViews.get(fromSquare) === view) this.pieceViews.delete(fromSquare);
    view.liftTarget = 0;
    const start = view.group.position.clone();
    const end = squareToWorld(toSquare);
    const distance = Math.hypot(engine.fileOf(toSquare) - engine.fileOf(fromSquare), engine.rankOf(toSquare) - engine.rankOf(fromSquare));
    const duration = Math.min(anim.moveMaxSeconds, anim.moveBaseSeconds + anim.moveSecondsPerSquare * distance);
    const arc = view.type === PieceType.KNIGHT ? anim.knightLiftHeight : anim.slideLiftHeight;
    if (options.delaySeconds) await this.tweener.start({ durationSeconds: options.delaySeconds, onUpdate: () => {}, easing: easeLinear });
    await this.tweener.start({
      durationSeconds: duration,
      onUpdate: (t, linear) => {
        view.group.position.set(lerp(start.x, end.x, t), Math.sin(Math.PI * t) * arc, lerp(start.z, end.z, t));
        if (options.onProgress) options.onProgress(linear);
      },
    });
    view.group.position.copy(end);
    view.square = toSquare;
    this.pieceViews.set(toSquare, view);
  }

  /**
   * Removes a captured piece from the scene.
   * @param {PieceView} view - Piece to remove.
   * @returns {void}
   */
  removePiece(view) {
    this.piecesRoot.remove(view.group);
    view.material.dispose();
    if (this.pieceViews.get(view.square) === view) this.pieceViews.delete(view.square);
    if (this.selectedView === view) this.selectedView = null;
  }

  /**
   * Turns a piece into another type (promotion).
   * @param {PieceView} view - Piece to change.
   * @param {number} newType - New PieceType.
   * @returns {void}
   */
  promotePiece(view, newType) {
    view.type = newType;
    view.mesh.geometry = this.pieceFactory.getGeometry(newType);
    this.pieceFactory.sizePickProxy(view.pickProxy, newType);
  }

  /**
   * Animates selection lift/glow.
   * @param {number} deltaSeconds - Frame time.
   * @param {number} elapsedSeconds - Total time.
   * @returns {void}
   */
  update(deltaSeconds, elapsedSeconds) {
    const follow = 1 - Math.exp(-deltaSeconds * 14);
    const emissive = this.selectionEmissive;
    this.pieceViews.forEach((view) => {
      view.lift += (view.liftTarget - view.lift) * follow;
      const bob = view === this.selectedView ? Math.sin(elapsedSeconds * 4) * CONFIG.pieces.selectionBobAmplitude : 0;
      view.visual.position.y = view.lift + bob * (view.lift > 0.01 ? 1 : 0);
      const glow = view === this.selectedView ? 0.45 + Math.sin(elapsedSeconds * 5) * 0.15 : 0;
      view.material.emissive.copy(emissive).multiplyScalar(glow);
    });
    this.highlighter.update(elapsedSeconds);
  }

  /** @returns {THREE.Mesh[]} Invisible pick proxies of all pieces. */
  getPickTargets() {
    return Array.from(this.pieceViews.values()).map((v) => v.pickProxy);
  }
}

/** Translates pointer events into board-square clicks and hovers. */
class BoardInput {
  /**
   * @param {HTMLElement} element - Canvas receiving events.
   * @param {THREE.Camera} camera - Camera used for picking.
   * @param {BoardView} boardView - Board to pick against.
   * @param {Object} handlers - { onSquareClick(square), onSquareHover(square) }.
   */
  constructor(element, camera, boardView, handlers) {
    this.element = element;
    this.camera = camera;
    this.boardView = boardView;
    this.handlers = handlers;
    this.raycaster = new THREE.Raycaster();
    this.boardPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    this.pointer = new THREE.Vector2();
    this.hitPoint = new THREE.Vector3();
    this.downPosition = null;
    element.addEventListener('pointerdown', (e) => { this.downPosition = { x: e.clientX, y: e.clientY }; });
    element.addEventListener('pointerup', (e) => {
      if (!this.downPosition) return;
      const moved = Math.hypot(e.clientX - this.downPosition.x, e.clientY - this.downPosition.y);
      this.downPosition = null;
      if (moved < 6) this.handlers.onSquareClick(this.pickSquare(e.clientX, e.clientY));
    });
    element.addEventListener('pointermove', (e) => {
      if (e.buttons === 0 && e.pointerType === 'mouse') this.handlers.onSquareHover(this.pickSquare(e.clientX, e.clientY));
    });
  }

  /**
   * Finds the square under a screen position (piece volumes first, then the board plane).
   * @param {number} clientX - Pointer x in CSS pixels.
   * @param {number} clientY - Pointer y in CSS pixels.
   * @returns {number} Square index or -1.
   */
  pickSquare(clientX, clientY) {
    const rect = this.element.getBoundingClientRect();
    this.pointer.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
    this.raycaster.setFromCamera(this.pointer, this.camera);
    const hits = this.raycaster.intersectObjects(this.boardView.getPickTargets(), false);
    if (hits.length > 0) return hits[0].object.userData.pieceView.square;
    if (this.raycaster.ray.intersectPlane(this.boardPlane, this.hitPoint)) return worldToSquare(this.hitPoint.x, this.hitPoint.z);
    return -1;
  }
}


/* ============================================================================
 * SECTION 6b — 2D VIEW (DOM board + canvas effects)
 * Implements the same "view" interface as View3D so the game logic is view-agnostic.
 * ========================================================================== */

const PIECE_GLYPHS_2D = ['', '\u265F\uFE0E', '\u265E\uFE0E', '\u265D\uFE0E', '\u265C\uFE0E', '\u265B\uFE0E', '\u265A\uFE0E'];

/** Canvas particle effects drawn over the 2D board: explosions, shrapnel, sparkles, fireworks, shake. */
class Effects2D {
  /**
   * @param {HTMLCanvasElement} canvas - Full-window transparent overlay canvas.
   * @param {HTMLElement} shakeElement - Element jolted by camera-shake equivalents.
   */
  constructor(canvas, shakeElement) {
    this.canvas = canvas;
    this.context = canvas.getContext('2d');
    this.shakeElement = shakeElement;
    this.particles = [];
    this.rings = [];
    this.flashes = [];
    this.scheduled = [];
    this.emitters = [];
    this.sprites = new Map();
    this.trauma = 0;
    this.shakeScale = 1;
    this.needsClear = false;
    this.resize();
  }

  /** Matches the canvas buffer to the window. @returns {void} */
  resize() {
    this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.floor(window.innerWidth * this.pixelRatio);
    this.canvas.height = Math.floor(window.innerHeight * this.pixelRatio);
    this.context.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
  }

  /**
   * Returns a cached soft radial sprite of one colour.
   * @param {number} r - Red 0..255.
   * @param {number} g - Green 0..255.
   * @param {number} b - Blue 0..255.
   * @returns {HTMLCanvasElement} 64px sprite.
   */
  _sprite(r, g, b) {
    const key = r + ',' + g + ',' + b;
    if (!this.sprites.has(key)) {
      const sprite = document.createElement('canvas');
      sprite.width = sprite.height = 64;
      const ctx = sprite.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
      gradient.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.55)');
      gradient.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
      ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
      this.sprites.set(key, sprite);
    }
    return this.sprites.get(key);
  }

  /** @param {number} amount - Trauma 0..1 added to the shake. @returns {void} */
  addShake(amount) { this.trauma = Math.min(1, this.trauma + amount); }

  /**
   * Runs a callback after a delay.
   * @param {number} seconds - Delay.
   * @param {function(): void} callback - Work to do.
   * @returns {void}
   */
  schedule(seconds, callback) { this.scheduled.push({ remaining: seconds, callback }); }

  /** Adds one particle with defaults. */
  _add(p) {
    this.particles.push(Object.assign({ age: 0, drag: 0, gravity: 0, rotation: 0, spin: 0, alpha0: 1, alpha1: 0 }, p));
  }

  /**
   * Explosion scaled by the destroyed piece type, with fast shrapnel.
   * @param {number} x - Screen x of the blast centre.
   * @param {number} y - Screen y of the blast centre.
   * @param {Object} tier - Entry of CONFIG.effects.explosionTiers.
   * @param {number} pieceColor - Color of the destroyed piece.
   * @param {number} cell - Board square size in pixels.
   * @param {number} [strength] - 1 for the main blast, less for secondary blasts.
   * @returns {void}
   */
  explode(x, y, tier, pieceColor, cell, strength = 1) {
    const accent = pieceColor === Color.WHITE ? [190, 215, 255] : [255, 120, 80];
    const fireSprite = this._sprite(255, 140, 50);
    const hotSprite = this._sprite(255, 235, 190);
    const sparkSprite = this._sprite(accent[0], accent[1], accent[2]);
    const smokeSprite = this._sprite(70, 70, 78);
    this.flashes.push({ x, y, age: 0, life: 0.28, radius: cell * (0.8 + tier.shockwaveRadius * 0.55), sprite: hotSprite });
    for (let i = 0; i < tier.shockwaves; i++) {
      this.rings.push({ x, y, age: -i * 0.07, life: 0.55 + i * 0.12, radius: cell * tier.shockwaveRadius * strength * (1 - i * 0.2) });
    }
    const speedUnit = cell;
    for (let i = 0; i < Math.round(tier.fireCount * strength); i++) {
      const a = Math.random() * Math.PI * 2; const v = randomBetween(0.2, 1) * tier.fireSpeed * speedUnit * 0.8;
      this._add({ kind: 'glow', sprite: Math.random() < 0.3 ? hotSprite : fireSprite, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 2.4, life: randomBetween(0.4, 1) * tier.life, size0: cell * tier.fireSize * randomBetween(0.5, 0.9), size1: cell * 0.1, alpha0: 0.9 });
    }
    for (let i = 0; i < Math.round(tier.sparkCount * strength); i++) {
      const a = Math.random() * Math.PI * 2; const v = randomBetween(0.25, 1) * tier.sparkSpeed * speedUnit;
      this._add({ kind: 'glow', sprite: sparkSprite, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 1.1, life: randomBetween(0.5, 1.4), size0: randomBetween(5, 11), size1: 1.5 });
    }
    const shardColor = pieceColor === Color.WHITE ? ['#e6e9f1', '#aab2c4'] : ['#2c2e3a', '#6b7088'];
    for (let i = 0; i < Math.round(tier.debrisCount * strength); i++) {
      const a = Math.random() * Math.PI * 2; const v = randomBetween(0.3, 1) * (4 + tier.sparkSpeed * 0.7) * speedUnit;
      this._add({ kind: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 1.5, life: randomBetween(1.1, 2.3), size0: randomBetween(0.08, 0.2) * cell, size1: 0, rotation: Math.random() * 6, spin: randomBetween(-18, 18), fill: shardColor[0], edge: shardColor[1] });
    }
    for (let i = 0; i < Math.round(tier.smokeCount * strength); i++) {
      const a = Math.random() * Math.PI * 2; const v = randomBetween(0.1, 0.5) * tier.fireSpeed * speedUnit * 0.5;
      this._add({ kind: 'smoke', sprite: smokeSprite, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 1.2, life: randomBetween(1.2, 2.2), size0: cell * 0.6, size1: cell * 2, alpha0: 0.4 });
    }
    if (strength === 1) {
      this.addShake(tier.shake);
      for (let i = 0; i < tier.secondaryBursts; i++) {
        this.schedule(0.12 + i * 0.1, () => {
          this.explode(x + randomBetween(-0.7, 0.7) * cell, y + randomBetween(-0.7, 0.7) * cell, tier, pieceColor, cell, 0.4);
          this.addShake(tier.shake * 0.25);
        });
      }
    }
  }

  /**
   * Small dust puff where a piece lands.
   * @param {number} x - Screen x.
   * @param {number} y - Screen y.
   * @param {number} cell - Square size in pixels.
   * @returns {void}
   */
  landingDust(x, y, cell) {
    const sprite = this._sprite(150, 145, 135);
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      this._add({ kind: 'smoke', sprite, x, y, vx: Math.cos(a) * cell * 0.6, vy: Math.sin(a) * cell * 0.6, drag: 2.2, life: 0.55, size0: cell * 0.25, size1: cell * 0.7, alpha0: 0.25 });
    }
  }

  /**
   * Gold sparkles rising around a square (promotion).
   * @param {number} x - Screen x.
   * @param {number} y - Screen y.
   * @param {number} cell - Square size in pixels.
   * @returns {void}
   */
  promotionSparkles(x, y, cell) {
    const sprite = this._sprite(255, 205, 100);
    this.emitters.push({ remaining: 1.0, emit: (dt) => {
      for (let i = 0; i < Math.ceil(dt * 150); i++) {
        const a = Math.random() * Math.PI * 2; const r = randomBetween(0.1, 0.5) * cell;
        this._add({ kind: 'glow', sprite, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, vx: Math.cos(a) * cell * 0.3, vy: -randomBetween(0.8, 2.2) * cell, drag: 0.4, life: randomBetween(0.6, 1.2), size0: randomBetween(5, 11), size1: 1 });
      }
    } });
    this.flashes.push({ x, y, age: 0, life: 0.4, radius: cell * 1.3, sprite: this._sprite(255, 220, 120) });
  }

  /**
   * Ring of blue sparkles when a piece is picked up.
   * @param {number} x - Screen x.
   * @param {number} y - Screen y.
   * @param {number} cell - Square size in pixels.
   * @returns {void}
   */
  selectionSparkle(x, y, cell) {
    const sprite = this._sprite(120, 190, 255);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      this._add({ kind: 'glow', sprite, x: x + Math.cos(a) * cell * 0.35, y: y + Math.sin(a) * cell * 0.35, vx: Math.cos(a) * cell * 0.4, vy: Math.sin(a) * cell * 0.4, drag: 2, life: 0.5, size0: 7, size1: 1 });
    }
  }

  /**
   * Fireworks over a screen rectangle (player victory).
   * @param {DOMRect} rect - Area to fill with bursts.
   * @returns {void}
   */
  fireworks(rect) {
    for (let i = 0; i < 9; i++) {
      this.schedule(i * 0.32, () => {
        const hex = CONFIG.effects.victoryColors[Math.floor(Math.random() * CONFIG.effects.victoryColors.length)];
        const sprite = this._sprite((hex >> 16) & 255, (hex >> 8) & 255, hex & 255);
        const cx = rect.left + randomBetween(0.15, 0.85) * rect.width;
        const cy = rect.top + randomBetween(0.15, 0.7) * rect.height;
        for (let n = 0; n < 90; n++) {
          const a = Math.random() * Math.PI * 2; const v = randomBetween(0.4, 1) * rect.width * 0.5;
          this._add({ kind: 'glow', sprite, x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 1.8, gravity: 120, life: randomBetween(1, 1.7), size0: 12, size1: 2 });
        }
        this.flashes.push({ x: cx, y: cy, age: 0, life: 0.3, radius: 90, sprite });
      });
    }
  }

  /**
   * Advances and draws everything.
   * @param {number} dt - Frame time in seconds.
   * @returns {void}
   */
  update(dt) {
    this.scheduled = this.scheduled.filter((job) => { job.remaining -= dt; if (job.remaining <= 0) { job.callback(); return false; } return true; });
    this.emitters = this.emitters.filter((e) => { e.remaining -= dt; e.emit(dt); return e.remaining > 0; });
    this._updateShake(dt);
    const active = this.particles.length + this.rings.length + this.flashes.length > 0;
    if (!active) {
      if (this.needsClear) { this.context.clearRect(0, 0, window.innerWidth, window.innerHeight); this.needsClear = false; }
      return;
    }
    this.needsClear = true;
    const ctx = this.context;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    this.particles = this.particles.filter((p) => {
      p.age += dt;
      if (p.age >= p.life) return false;
      const damping = Math.max(0, 1 - p.drag * dt);
      p.vx *= damping; p.vy = p.vy * damping + p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rotation += p.spin * dt;
      return true;
    });
    for (const kind of ['smoke', 'shard', 'glow']) {
      ctx.globalCompositeOperation = kind === 'glow' ? 'lighter' : 'source-over';
      for (const p of this.particles) {
        if (p.kind !== kind) continue;
        const t = p.age / p.life;
        const size = lerp(p.size0, p.size1, t);
        const alpha = lerp(p.alpha0, p.alpha1, t);
        ctx.globalAlpha = Math.max(0, alpha);
        if (kind === 'shard') {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
          ctx.fillStyle = p.fill; ctx.strokeStyle = p.edge; ctx.lineWidth = 1;
          const s = Math.max(1, p.size0 * (1 - t * 0.6));
          ctx.beginPath(); ctx.moveTo(-s, -s * 0.5); ctx.lineTo(s * 1.3, 0); ctx.lineTo(-s * 0.4, s); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
        } else {
          ctx.drawImage(p.sprite, p.x - size, p.y - size, size * 2, size * 2);
        }
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    this.flashes = this.flashes.filter((f) => {
      f.age += dt;
      if (f.age >= f.life) return false;
      const t = f.age / f.life;
      ctx.globalAlpha = (1 - t) * 0.9;
      const r = f.radius * (0.4 + t * 0.6);
      ctx.drawImage(f.sprite, f.x - r, f.y - r, r * 2, r * 2);
      return true;
    });
    this.rings = this.rings.filter((ring) => {
      ring.age += dt;
      if (ring.age >= ring.life) return false;
      if (ring.age < 0) return true;
      const t = ring.age / ring.life;
      ctx.globalAlpha = (1 - t) * (1 - t);
      ctx.strokeStyle = 'rgb(255,190,110)';
      ctx.lineWidth = Math.max(1, 10 * (1 - t));
      ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.radius * easeOutCubic(t), 0, Math.PI * 2); ctx.stroke();
      return true;
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /** Jolts the board element while trauma remains. */
  _updateShake(dt) {
    this.trauma = Math.max(0, this.trauma - 1.8 * dt);
    const power = this.trauma * this.trauma * this.shakeScale * 16;
    const now = performance.now() / 1000;
    this.shakeElement.style.transform = power < 0.05 ? '' :
      'translate(' + (Math.sin(now * 53) * power).toFixed(2) + 'px,' + (Math.sin(now * 67 + 2) * power).toFixed(2) + 'px) rotate(' + (Math.sin(now * 41 + 5) * power * 0.08).toFixed(3) + 'deg)';
  }
}

/** DOM-based top-down board with metallic glyph pieces; implements the shared view interface. */
class Board2DView {
  /**
   * @param {HTMLElement} wrap - Container element that sizes the board.
   * @param {Effects2D} fx - Canvas effects.
   * @param {AudioManager} audio - Sound effects.
   * @param {Tweener} tweener - Shared tween runner.
   * @param {Object} handlers - { onSquareClick(square), onSquareHover(square) }.
   */
  constructor(wrap, fx, audio, tweener, handlers) {
    this.wrap = wrap;
    this.fx = fx;
    this.audio = audio;
    this.tweener = tweener;
    this.handlers = handlers;
    this.orientation = Color.WHITE;
    this.pieces = new Map();
    this.overlaySquares = { hintFrom: -1, hintTo: -1, lastFrom: -1, lastTo: -1, selected: -1, check: -1, hover: -1 };
    this.selectedPiece = null;
    this.board = document.createElement('div');
    this.board.className = 'board2d';
    this.squaresLayer = this._layer('b2d-squares');
    this.overlayLayer = this._layer('b2d-overlays');
    this.markerLayer = this._layer('b2d-markers');
    this.piecesLayer = this._layer('b2d-pieces');
    wrap.appendChild(this.board);
    this.squareElements = [];
    this.overlayElements = {};
    this._buildSquares();
    Object.keys(this.overlaySquares).forEach((name) => {
      const el = document.createElement('div');
      el.className = 'b2d-overlay ' + name; el.style.display = 'none';
      this.overlayLayer.appendChild(el);
      this.overlayElements[name] = el;
    });
