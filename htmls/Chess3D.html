   * @returns {void}
   */
  setViewMode(mode, has3d) {
    document.body.classList.toggle('view-2d', mode === '2d');
    document.body.classList.toggle('view-3d', mode === '3d');
    this.el.view2d.setAttribute('aria-pressed', String(mode === '2d'));
    this.el.view3d.setAttribute('aria-pressed', String(mode === '3d'));
    this.el.view3d.style.display = has3d ? '' : 'none';
    this.el.viewToggle.style.display = has3d ? '' : 'none';
  }

  /**
   * Updates the evaluation bar.
   * @param {Object|null} info - Result of EvaluationService.evaluate, or null while analysing.
   * @param {number} bottomColor - Color shown at the bottom of the bar (the player's side).
   * @returns {void}
   */
  setEvaluation(info, bottomColor) {
    const el = this.el;
    el.evalBar.classList.toggle('flipped', bottomColor === Color.BLACK);
    if (!info) { el.evalBar.classList.add('pending'); return; }
    el.evalBar.classList.remove('pending');
    if (info.game === 'ttt') { this._setTttEvaluation(info); return; }
    const side = (color) => t(color === Color.WHITE ? 'side.white' : 'side.black');
    let whiteShare = 0.5; let label = ''; let leader = Color.WHITE; let tooltip = t('eval.equal');
    if (info.kind === 'checkmate' || info.kind === 'mate') {
      whiteShare = info.winner === Color.WHITE ? 1 : 0; leader = info.winner;
      label = info.kind === 'mate' ? 'M' + info.mateIn : (info.winner === Color.WHITE ? '1-0' : '0-1');
      tooltip = info.kind === 'mate' ? t('eval.mate', { side: side(info.winner), n: info.mateIn }) : t('eval.checkmate', { side: side(info.winner) });
    } else if (info.kind === 'draw') {
      label = '='; tooltip = t('eval.draw');
    } else {
      const pawns = info.centipawns / 100;
      whiteShare = 1 / (1 + Math.exp(-info.centipawns / CONFIG.evaluation.logisticScaleCentipawns));
      leader = info.centipawns >= 0 ? Color.WHITE : Color.BLACK;
      label = Math.abs(pawns) < 0.05 ? '0.0' : Math.abs(pawns).toFixed(1);
      const value = (pawns >= 0 ? '+' : '-') + Math.abs(pawns).toFixed(1);
      const size = Math.abs(info.centipawns);
      tooltip = size < 30 ? t('eval.equal') : t(size < 200 ? 'eval.better' : 'eval.winning', { side: side(leader), value });
    }
    el.evalWhite.style.setProperty('--share', whiteShare * 100 + '%');
    el.evalBlack.style.setProperty('--share', (1 - whiteShare) * 100 + '%');
    el.evalLabelWhite.textContent = leader === Color.WHITE || info.kind === 'draw' ? label : '';
    el.evalLabelBlack.textContent = leader === Color.BLACK && info.kind !== 'draw' ? label : '';
    el.evalBar.title = t('eval.title') + ': ' + tooltip;
    el.evalBar.setAttribute('aria-label', el.evalBar.title);
  }

  /**
   * Shows the engine's top moves as chips (or placeholders while analysing).
   * @param {Array<{from:number,to:number,san:string,label:string}>|null} lines - Lines to show, or null while analysing.
   * @param {function({from:number,to:number}|null): void} [onHint] - Called when a chip is toggled to show/hide the move on the board.
   * @returns {void}
   */
  setEngineLines(lines, onHint) {
    const box = this.el.engineLines;
    box.innerHTML = '';
    if (!lines) {
      for (let i = 0; i < CONFIG.evaluation.lineCount; i++) {
        const placeholder = document.createElement('span');
        placeholder.className = 'line-chip pending'; placeholder.textContent = i + 1 + '. \u2026';
        placeholder.title = t('lines.thinking');
        box.appendChild(placeholder);
      }
      return;
    }
    lines.forEach((line, index) => {
      const chip = document.createElement('button');
      chip.className = 'line-chip'; chip.title = t('lines.hintTitle');
      const rank = document.createElement('span'); rank.className = 'line-rank'; rank.textContent = String(index + 1);
      const san = document.createElement('span'); san.className = 'line-san'; san.textContent = line.san;
      const score = document.createElement('span'); score.className = 'line-eval'; score.textContent = line.label;
      chip.append(rank, san, score);
      chip.addEventListener('click', () => {
        const turnOn = !chip.classList.contains('active');
        box.querySelectorAll('.line-chip').forEach((c) => c.classList.remove('active'));
        if (turnOn) chip.classList.add('active');
        if (onHint) onHint(turnOn ? { from: line.from, to: line.to } : null);
      });
      box.appendChild(chip);
    });
  }

  /** @param {boolean} visible - Show the engine top-moves section. @returns {void} */
  setEngineLinesVisible(visible) { document.body.classList.toggle('lines-off', !visible); }

  /** @param {boolean} enabled - Whether Undo can be used right now. @returns {void} */
  setUndoEnabled(enabled) { this.el.undoButton.disabled = !enabled; }

  /** @param {boolean} active - Show the "custom starting position" note in the menu. @returns {void} */
  setCustomStartNote(active) { this.el.customNote.style.display = active ? 'flex' : 'none'; }

  /**
   * Evaluation bar for tic-tac-toe: X fills the light (bottom) part, O the dark part.
   * @param {{kind:string, winner:number, mateIn:number}} info - Record from the tic-tac-toe engine.
   * @returns {void}
   */
  _setTttEvaluation(info) {
    const el = this.el;
    const X = tttEngine.Mark.X;
    const side = (mark) => t(mark === X ? 'ttt.x' : 'ttt.o');
    let whiteShare = 0.5; let label = '='; let leader = Color.WHITE; let tooltip = t('eval.tttDraw');
    if (info.kind === 'checkmate' || info.kind === 'mate') {
      whiteShare = info.winner === X ? 1 : 0;
      leader = info.winner === X ? Color.WHITE : Color.BLACK;
      label = info.kind === 'mate' ? 'W' + info.mateIn : side(info.winner);
      tooltip = info.kind === 'mate' ? t('eval.tttWin', { side: side(info.winner), n: info.mateIn }) : t('eval.tttWon', { side: side(info.winner) });
    }
    el.evalWhite.style.setProperty('--share', whiteShare * 100 + '%');
    el.evalBlack.style.setProperty('--share', (1 - whiteShare) * 100 + '%');
    el.evalLabelWhite.textContent = leader === Color.WHITE || info.kind === 'draw' ? label : '';
    el.evalLabelBlack.textContent = leader === Color.BLACK && info.kind !== 'draw' ? label : '';
    el.evalBar.title = t('eval.title') + ': ' + tooltip;
    el.evalBar.setAttribute('aria-label', el.evalBar.title);
  }

  /**
   * Switches the menu between the chess and tic-tac-toe sections.
   * @param {string} game - 'chess' or 'ttt'.
   * @returns {void}
   */
  showMenuGame(game) {
    document.getElementById('menu-chess').style.display = game === 'chess' ? '' : 'none';
    document.getElementById('menu-ttt').style.display = game === 'ttt' ? '' : 'none';
    document.getElementById('menu-game-chess').setAttribute('aria-pressed', String(game === 'chess'));
    document.getElementById('menu-game-ttt').setAttribute('aria-pressed', String(game === 'ttt'));
  }

  /** @returns {void} */
  hideLoading() { this.el.loading.classList.remove('visible'); }
  /** @returns {void} */
  showMenu() { this.el.menu.classList.add('visible'); this.hideGameOver(); }
  /** @returns {void} */
  hideMenu() { this.el.menu.classList.remove('visible'); }
  /** @returns {void} */
  hideGameOver() { this.el.gameOver.classList.remove('visible'); }

  /**
   * Shows the game-over card.
   * @param {string} message - Result text.
   * @returns {void}
   */
  showGameOver(message) { this.el.gameOverText.textContent = message; this.el.gameOver.classList.add('visible'); }

  /**
   * Updates the status line.
   * @param {string} text - Main message.
   * @param {string} [sub] - Secondary line.
   * @param {number|null} [turnColor] - Color to show in the indicator dot, or null.
   * @returns {void}
   */
  setStatus(text, sub = '', turnColor = null) {
    this.el.status.textContent = text;
    this.el.statusSub.textContent = sub;
    this.el.turnDot.className = 'dot' + (turnColor === null ? '' : turnColor === Color.WHITE ? ' white' : ' black');
  }

  /** @param {string} sub - New secondary status text (live clock). @returns {void} */
  setStatusSub(sub) { this.el.statusSub.textContent = sub; }

  /** @param {boolean} visible - Show the FPS counter. @returns {void} */
  setFpsVisible(visible) { this.el.fps.style.display = visible ? 'block' : 'none'; }
  /** @param {number} fps - Frames per second to display. @returns {void} */
  setFps(fps) { this.el.fps.textContent = Math.round(fps) + ' fps'; }

  /**
   * Shows a transient message.
   * @param {string} message - Text.
   * @returns {void}
   */
  showToast(message) {
    this.el.toast.textContent = message;
    this.el.toast.classList.add('visible');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.el.toast.classList.remove('visible'), CONFIG.game.toastDurationMs);
  }

  /** Empties the move list. @returns {void} */
  resetMoveList() {
    this.el.moveList.innerHTML = '';
    const empty = document.createElement('p');
    empty.className = 'empty-note'; empty.id = 'empty-moves'; empty.textContent = t('panel.noMoves');
    this.el.moveList.appendChild(empty);
  }

  /**
   * Appends a move to the history table.
   * @param {Object} entry - { moveNumber, color, san, seconds }.
   * @returns {void}
   */
  appendMove({ moveNumber, color, san, seconds }) {
    const empty = document.getElementById('empty-moves');
    if (empty) empty.remove();
    const list = this.el.moveList;
    let row = list.lastElementChild;
    if (color === Color.WHITE || !row || !row.classList.contains('move-row')) {
      row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = '<span class="move-number"></span><span class="move-cell white-cell"></span><span class="move-cell black-cell"></span>';
      row.firstChild.textContent = moveNumber + '.';
      list.appendChild(row);
    }
    const cell = row.querySelector(color === Color.WHITE ? '.white-cell' : '.black-cell');
    const name = document.createElement('span'); name.className = 'san'; name.textContent = san;
    const slot = document.createElement('span'); slot.className = 'rating-slot'; slot.title = t('rating.pending');
    const pendingDot = document.createElement('span'); pendingDot.className = 'rating-pending'; slot.appendChild(pendingDot);
    const time = document.createElement('span'); time.className = 'move-time'; time.textContent = formatSeconds(seconds); time.title = t('panel.timeUsed');
    cell.append(name, slot, time);
    list.querySelectorAll('.latest').forEach((n) => n.classList.remove('latest'));
    cell.classList.add('latest');
    list.scrollTop = list.scrollHeight;
    return slot;
  }

  /**
   * Shows a rating icon in a move-list slot.
   * @param {HTMLElement} slot - Slot returned by appendMove.
   * @param {string} key - Rating key.
   * @returns {void}
   */
  setMoveRating(slot, key) {
    slot.innerHTML = '';
    slot.title = t('rating.' + key);
    slot.appendChild(createRatingBadge(key));
  }

  /**
   * Turns the rating icons on or off everywhere.
   * @param {boolean} enabled - True to show ratings.
   * @returns {void}
   */
  setRatingsVisible(enabled) {
    document.body.classList.toggle('ratings-off', !enabled);
    if (!enabled) this.setBoardBadges([]);
  }

  /**
   * Shows rating icons beside the destination squares of recent moves.
   * @param {Array<{ply:number, square:number, rating:string, faded:boolean}>} badges - Badges to show (oldest first); faded ones are drawn at 70% opacity.
   * @returns {void}
   */
  setBoardBadges(badges) {
    const container = this.el.boardBadges;
    const wanted = new Map(badges.map((b) => [b.ply + ':' + b.rating, b]));
    this.boardBadgeEntries = (this.boardBadgeEntries || []).filter((entry) => {
      if (wanted.has(entry.key)) return true;
      entry.el.remove();
      return false;
    });
    badges.forEach((badge) => {
      const key = badge.ply + ':' + badge.rating;
      let entry = this.boardBadgeEntries.find((e) => e.key === key);
      if (!entry) {
        const el = document.createElement('div');
        el.className = 'board-badge pop';
        el.appendChild(createRatingBadge(badge.rating));
        container.appendChild(el);
        entry = { key, el, square: badge.square, faded: false };
        this.boardBadgeEntries.push(entry);
      }
      entry.square = badge.square;
      entry.faded = badge.faded;
      entry.el.classList.toggle('faded', badge.faded);
    });
    this.boardBadgeEntries.sort((a, b) => Number(a.key.split(':')[0]) - Number(b.key.split(':')[0]));
  }

  /**
   * Moves every board badge to its square's current screen position.
   * @param {function(number): ({x:number,y:number}|null)} getScreenPoint - Maps a square to pixels.
   * @returns {void}
   */
  positionBoardBadges(getScreenPoint) {
    const entries = this.boardBadgeEntries || [];
    entries.forEach((entry, index) => {
      const point = getScreenPoint(entry.square);
      entry.el.style.visibility = point ? 'visible' : 'hidden';
      if (!point) return;
      const sharesSquare = entries.some((other, i) => i > index && other.square === entry.square);
      entry.el.style.left = point.x - (sharesSquare ? 24 : 0) + 'px';
      entry.el.style.top = point.y + 'px';
    });
  }

  /**
   * Redraws captured-piece rows and material advantage.
   * @param {number[][]} capturedByColor - [piece types White captured, piece types Black captured].
   * @returns {void}
   */
  setCaptured(capturedByColor) {
    const value = (types) => types.reduce((sum, type) => sum + PIECE_VALUES[PIECE_KEYS[type]], 0);
    const render = (container, types, ownerColor) => {
      container.innerHTML = '';
      types.slice().sort((a, b) => PIECE_VALUES[PIECE_KEYS[b]] - PIECE_VALUES[PIECE_KEYS[a]]).forEach((type) => {
        const span = document.createElement('span');
        span.className = 'glyph ' + (ownerColor === Color.WHITE ? 'glyph-black' : 'glyph-white'); // shows the captured colour
        span.textContent = PIECE_GLYPHS[type];
        container.appendChild(span);
      });
    };
    render(this.el.capturedWhite, capturedByColor[Color.WHITE], Color.WHITE);
    render(this.el.capturedBlack, capturedByColor[Color.BLACK], Color.BLACK);
    const diff = value(capturedByColor[Color.WHITE]) - value(capturedByColor[Color.BLACK]);
    this.el.advantageWhite.textContent = diff > 0 ? '+' + diff : '';
    this.el.advantageBlack.textContent = diff < 0 ? '+' + (-diff) : '';
  }

  /**
   * Asks the player which piece to promote to.
   * @param {number} color - Color of the promoting pawn.
   * @returns {Promise<number>} Chosen PieceType.
   */
  askPromotion(color) {
    return new Promise((resolve) => {
      const container = this.el.promotionChoices;
      container.innerHTML = '';
      engine.PROMOTION_TYPES.forEach((type) => {
        const button = document.createElement('button');
        button.className = 'promo-button';
        const glyph = document.createElement('span');
        glyph.className = 'promo-glyph ' + (color === Color.WHITE ? 'glyph-white' : 'glyph-black'); glyph.textContent = PIECE_GLYPHS[type];
        const name = document.createElement('span');
        const key = PIECE_KEYS[type];
        name.textContent = t('piece.' + key.charAt(0).toUpperCase() + key.slice(1));
        button.append(glyph, name);
        button.addEventListener('click', () => { this.el.promotion.classList.remove('visible'); resolve(type); });
        container.appendChild(button);
      });
      this.el.promotion.classList.add('visible');
    });
  }
}


/* ============================================================================
 * SECTION 8b — STARTING POSITION EDITOR
 * A free-form board editor: place, move and erase pieces, choose who moves first,
 * and validate the result before it becomes the starting position of a game.
 * ========================================================================== */

/** Overlay dialog for building a custom starting position. */
class PositionEditor {
  /**
   * @param {HTMLElement} overlay - The editor overlay element.
   * @param {function(Object): void} onApply - Called with Position.toState() output when the player accepts.
   */
  constructor(overlay, onApply) {
    this.overlay = overlay;
    this.onApply = onApply;
    this.board = new Int8Array(64);
    this.turn = Color.WHITE;
    this.tool = 'move';       // 'move' | 'erase' | a piece code
    this.pickedSquare = -1;
    this.squareElements = [];
    this.toolButtons = new Map();
    this.messageElement = overlay.querySelector('#editor-message');
    this._buildBoard(overlay.querySelector('#editor-board'));
    this._buildPalette(overlay.querySelector('#editor-palette'));
    this._bindControls();
  }

  /**
   * Opens the editor.
   * @param {Object|null} state - Existing custom position to edit, or null to start from the standard position.
   * @returns {void}
   */
  open(state) {
    const source = state ? Position.fromState(state) : Position.createInitial();
    this.board.set(source.board);
    this.turn = source.turn;
    this.pickedSquare = -1;
    this._setTool('move');
    this._setMessage('');
    this._render();
    this.overlay.classList.add('visible');
  }

  /** Closes the editor. @returns {void} */
  close() {
    this.overlay.classList.remove('visible');
  }

  /** Creates the 64 clickable squares (White at the bottom). */
  _buildBoard(container) {
    for (let square = 0; square < 64; square++) {
      const file = engine.fileOf(square); const rank = engine.rankOf(square);
      const el = document.createElement('div');
      el.className = 'b2d-square edit-square ' + ((file + rank) % 2 === 0 ? 'dark' : 'light');
      el.style.left = file * 12.5 + '%'; el.style.top = (7 - rank) * 12.5 + '%';
      el.dataset.file = rank === 0 ? 'abcdefgh'[file] : '';
      el.dataset.rank = file === 0 ? String(rank + 1) : '';
      el.addEventListener('click', () => this._onSquareClick(square));
      container.appendChild(el);
      this.squareElements.push(el);
    }
  }

  /** Creates piece buttons for both colours plus the Move and Erase tools. */
  _buildPalette(container) {
    const order = [PieceType.KING, PieceType.QUEEN, PieceType.ROOK, PieceType.BISHOP, PieceType.KNIGHT, PieceType.PAWN];
    [Color.WHITE, Color.BLACK].forEach((color) => {
      order.forEach((type) => {
        const code = engine.makePiece(color, type);
        const button = document.createElement('button');
        button.className = 'palette-btn' + (color === Color.BLACK ? ' palette-black' : '');
        button.title = t(color === Color.WHITE ? 'side.white' : 'side.black') + ' ' + t('piece.' + PIECE_KEYS[type]);
        button.appendChild(this._createGlyph(code));
        button.addEventListener('click', () => this._setTool(code));
        container.appendChild(button);
        this.toolButtons.set(code, button);
      });
    });
    [['move', 'editor.tool.move'], ['erase', 'editor.tool.erase']].forEach(([tool, key]) => {
      const button = document.createElement('button');
      button.className = 'palette-btn palette-tool'; button.textContent = t(key);
      button.addEventListener('click', () => this._setTool(tool));
      container.appendChild(button);
      this.toolButtons.set(tool, button);
    });
  }

  /** Wires side-to-move, clear, standard, apply and cancel controls. */
  _bindControls() {
    const o = this.overlay;
    o.querySelector('#editor-side-white').addEventListener('click', () => { this.turn = Color.WHITE; this._render(); });
    o.querySelector('#editor-side-black').addEventListener('click', () => { this.turn = Color.BLACK; this._render(); });
    o.querySelector('#editor-clear').addEventListener('click', () => { this.board.fill(0); this.pickedSquare = -1; this._setMessage(''); this._render(); });
    o.querySelector('#editor-standard').addEventListener('click', () => { this.board.set(Position.createInitial().board); this.turn = Color.WHITE; this.pickedSquare = -1; this._setMessage(''); this._render(); });
    o.querySelector('#editor-cancel').addEventListener('click', () => this.close());
    o.querySelector('#editor-apply').addEventListener('click', () => this._apply());
  }

  /**
   * Builds a glyph element for a piece code.
   * @param {number} code - Piece code.
   * @returns {HTMLElement} Styled glyph.
   */
  _createGlyph(code) {
    const glyph = document.createElement('span');
    glyph.className = 'edit-glyph ' + (engine.getPieceColor(code) === Color.WHITE ? 'white' : 'black');
    glyph.textContent = PIECE_GLYPHS_2D[engine.getPieceType(code)];
    return glyph;
  }

  /** Selects the active tool and refreshes button highlights. */
  _setTool(tool) {
    this.tool = tool;
    this.pickedSquare = -1;
    this.toolButtons.forEach((button, key) => button.classList.toggle('active', key === tool));
    this._render();
  }

  /** Shows (or clears) the validation message. */
  _setMessage(text) {
    this.messageElement.textContent = text;
  }

  /** Applies the active tool to a clicked square. */
  _onSquareClick(square) {
    this._setMessage('');
    if (this.tool === 'erase') this.board[square] = 0;
    else if (this.tool === 'move') {
      if (this.pickedSquare < 0) { if (this.board[square] !== 0) this.pickedSquare = square; }
      else if (this.pickedSquare === square) this.pickedSquare = -1;
      else { this.board[square] = this.board[this.pickedSquare]; this.board[this.pickedSquare] = 0; this.pickedSquare = -1; }
    } else this.board[square] = this.board[square] === this.tool ? 0 : this.tool;
    this._render();
  }

  /** Redraws pieces, selection highlight and the side-to-move toggle. */
  _render() {
    for (let square = 0; square < 64; square++) {
      const el = this.squareElements[square];
      el.innerHTML = '';
      if (this.board[square] !== 0) {
        const piece = document.createElement('div');
        piece.className = 'edit-piece';
        piece.appendChild(this._createGlyph(this.board[square]));
        el.appendChild(piece);
      }
      el.classList.toggle('picked', square === this.pickedSquare);
    }
    this.overlay.querySelector('#editor-side-white').setAttribute('aria-pressed', String(this.turn === Color.WHITE));
    this.overlay.querySelector('#editor-side-black').setAttribute('aria-pressed', String(this.turn === Color.BLACK));
  }

  /**
   * Builds a Position from the editor board with castling rights inferred from piece placement.
   * @returns {Position} The position (not yet validated).
   */
  _buildPosition() {
    const position = new Position();
    position.board.set(this.board);
    position.turn = this.turn;
    const at = (square, color, type) => this.board[square] === engine.makePiece(color, type);
    let rights = 0;
    if (at(4, Color.WHITE, PieceType.KING) && at(7, Color.WHITE, PieceType.ROOK)) rights |= engine.CastlingRight.WHITE_KING;
    if (at(4, Color.WHITE, PieceType.KING) && at(0, Color.WHITE, PieceType.ROOK)) rights |= engine.CastlingRight.WHITE_QUEEN;
    if (at(60, Color.BLACK, PieceType.KING) && at(63, Color.BLACK, PieceType.ROOK)) rights |= engine.CastlingRight.BLACK_KING;
    if (at(60, Color.BLACK, PieceType.KING) && at(56, Color.BLACK, PieceType.ROOK)) rights |= engine.CastlingRight.BLACK_QUEEN;
    position.castlingRights = rights;
    for (let square = 0; square < 64; square++) {
      if (engine.getPieceType(this.board[square]) === PieceType.KING) position.kingSquares[engine.getPieceColor(this.board[square])] = square;
    }
    return position;
  }

  /**
   * Checks that a position is legal and playable.
   * @param {Position} position - Position to validate.
   * @returns {string|null} String-table key of the problem, or null if the position is fine.
   */
  _validate(position) {
    const kings = [0, 0];
    for (let square = 0; square < 64; square++) {
      const code = this.board[square];
      if (code === 0) continue;
      const type = engine.getPieceType(code);
      if (type === PieceType.KING) kings[engine.getPieceColor(code)]++;
      if (type === PieceType.PAWN && (engine.rankOf(square) === 0 || engine.rankOf(square) === 7)) return 'editor.error.pawns';
    }
    if (kings[0] !== 1 || kings[1] !== 1) return 'editor.error.kings';
    if (position.isInCheck(position.turn ^ 1)) return 'editor.error.opponentInCheck';
    const status = position.getStatus();
    if (status === GameStatus.CHECKMATE) return 'editor.error.checkmate';
    if (status === GameStatus.STALEMATE) return 'editor.error.stalemate';
    if (status === GameStatus.INSUFFICIENT_MATERIAL) return 'editor.error.insufficient';
    return null;
  }

  /** Validates and, if legal, hands the position to the application. */
  _apply() {
    const position = this._buildPosition();
    const problem = this._validate(position);
    if (problem) { this._setMessage(t(problem)); return; }
    this.onApply(position.toState());
    this.close();
  }
}


/* ============================================================================
 * SECTION 9 — GAME FLOW AND APPLICATION BOOTSTRAP
 * ========================================================================== */

/** Measures time spent on the current turn, with pause support. */
class TurnTimer {
  /** Creates a stopped timer. */
  constructor() { this.accumulatedMs = 0; this.startedAt = null; this.running = false; }
  /** Starts counting from zero. @returns {void} */
  restart() { this.accumulatedMs = 0; this.startedAt = performance.now(); this.running = true; }
  /** Pauses counting. @returns {void} */
  pause() { if (this.startedAt !== null) { this.accumulatedMs += performance.now() - this.startedAt; this.startedAt = null; } }
  /** @returns {number} Elapsed seconds for the current turn. */
  getSeconds() { return (this.accumulatedMs + (this.startedAt !== null ? performance.now() - this.startedAt : 0)) / 1000; }
}

/** Plays a move's animation, effects and sounds in the right order. */
class MoveDirector {
  /**
   * @param {BoardView} boardView - Board to animate.
   * @param {EffectsManager} effects - Visual effects.
   * @param {AudioManager} audio - Sound effects.
   */
  constructor(boardView, effects, audio) {
    this.boardView = boardView;
    this.effects = effects;
    this.audio = audio;
  }

  /**
   * Animates one legal move including captures, castling and promotion.
   * @param {Object} move - Legal move about to be played.
   * @param {number} moverColor - Color making the move.
   * @returns {Promise<void>} Resolves when everything has settled.
   */
  async playMove(move, moverColor) {
    const board = this.boardView;
    const mover = board.getPieceViewAt(move.from);
    const isEnPassant = (move.flags & MoveFlag.EN_PASSANT) !== 0;
    const victimSquare = isEnPassant ? move.to + (moverColor === Color.WHITE ? -8 : 8) : move.to;
    const victim = (move.flags & MoveFlag.CAPTURE) ? board.getPieceViewAt(victimSquare) : null;
    board.highlighter.setTargets([]);
    board.highlighter.setSelected(-1);
    board.highlighter.setHover(-1);
    board.setSelectedPiece(null);
    let victimDestroyed = false;
    const destroyVictim = () => {
      if (!victim || victimDestroyed) return;
      victimDestroyed = true;
      const position = squareToWorld(victimSquare);
      position.y = CONFIG.pieces.heights[PIECE_KEYS[victim.type]] * 0.4;
      const audioScale = this.effects.explode(position, victim.type, victim.color);
      this.audio.playCapture();
      this.audio.playExplosion(audioScale);
      board.removePiece(victim);
    };
    const promises = [board.movePiece(mover, move.to, {
      onProgress: (progress) => { if (progress >= CONFIG.animation.captureTriggerProgress) destroyVictim(); },
    })];
    if (move.flags & (MoveFlag.CASTLE_KING | MoveFlag.CASTLE_QUEEN)) {
      const kingSide = (move.flags & MoveFlag.CASTLE_KING) !== 0;
      const rook = board.getPieceViewAt(kingSide ? move.to + 1 : move.to - 2);
      promises.push(board.movePiece(rook, kingSide ? move.to - 1 : move.to + 1, { delaySeconds: CONFIG.animation.castlingRookDelaySeconds }));
    }
    await Promise.all(promises);
    destroyVictim();
    const landing = squareToWorld(move.to);
    if (!victim) {
      if (move.flags & (MoveFlag.CASTLE_KING | MoveFlag.CASTLE_QUEEN)) this.audio.playCastle(); else this.audio.playMove();
      this.effects.landingDust(landing);
    }
    if (move.promotion) {
      board.promotePiece(mover, move.promotion);
      this.effects.promotionSparkles(landing);
      this.effects.schedule(victim ? 0.35 : 0.12, () => this.audio.playPromotion());
    }
  }
}

/** Rules, turns, bot scheduling, history, evaluation and result handling; drives whichever view is active. */
class GameController {
  /**
   * @param {Object} deps - { ui, view, bot, evaluation, rater, audio, settings, tweener }.
   */
  constructor(deps) {
    Object.assign(this, deps);
    this.timer = new TurnTimer();
    this._phase = 'menu'; // menu | human | bot | animating | over (use the `phase` accessor)
    this.gameToken = 0;
    this.sessionId = 0;
    this.startState = Position.createInitial().toState();
    this.positionKeys = [];
    this.evalToken = 0;
    this.humanColor = Color.WHITE;
    this.mode = 'bot';           // 'bot' (play the engine) or 'local' (two players, one device)
    this.viewColor = Color.WHITE; // side shown at the bottom of the board and evaluation bar
    this.autoFlip = false;
    this.lastEvalInfo = null;
    this.hint = null;
    this.position = Position.createInitial();
    this.legalMoves = [];
    this.selectedSquare = -1;
    this.selectedMoves = [];
    this.captured = [[], []];
    this.positionCounts = new Map();
    this.lastMove = null;
    this.checkSquare = -1;
    this.pendingView = null;
    this.ply = 0;
    this.positionEvals = [];
    this.moveRecords = [];
    this.ratingsEnabled = true;
    this.view.activate();
    this.view.setOrientation(this.viewColor, false);
    this.view.showPosition(this.position, null, -1);
  }

  /** @returns {string} Current phase: menu | human | bot | animating | over. */
  get phase() { return this._phase; }

  /** @param {string} value - New phase; also refreshes the Undo button state. */
  set phase(value) {
    this._phase = value;
    this._syncUndoButton();
  }

  /**
   * Switches to another view right away, re-syncing it with the game state.
   * @param {Object} view - View2D/View3D implementation to show.
   * @returns {void}
   */
  setView(view) {
    if (view === this.view) return;
    this.view.clearSelection();
    this.view.deactivate();
    this.view = view;
    view.activate();
    view.setOrientation(this.viewColor, false);
    view.showPosition(this.position, this.lastMove, this.checkSquare);
    view.setIdleRotate(this.phase === 'menu');
    if (this.hint) view.setHint(this.hint.from, this.hint.to);
    if (this.phase === 'human' && this.selectedSquare >= 0) view.select(this.selectedSquare, this._targetsOf(this.selectedMoves));
  }

  /**
   * Switches views now, or after the current move animation finishes.
   * @param {Object} view - Desired view.
   * @returns {void}
   */
  requestView(view) {
    if (this.phase === 'animating') this.pendingView = view; else this.setView(view);
  }

  /** Applies a view switch that was requested mid-animation. */
  _flushPendingView() {
    if (this.pendingView) { const view = this.pendingView; this.pendingView = null; this.setView(view); }
  }

  /**
   * Starts a fresh game.
   * @param {number} humanColor - Side the player controls.
   * @param {Object|null} [startState] - Custom starting position (Position.toState output), or null for the standard one.
   * @param {string} [mode] - 'bot' or 'local' (both sides played by people).
   * @returns {void}
   */
  startNewGame(humanColor, startState = null, mode = 'bot') {
    this.gameToken++;
    this.sessionId++;
    this.tweener.cancelAll();
    this.humanColor = humanColor;
    this.mode = mode;
    this.viewColor = humanColor;
    this.hint = null;
    this.position = startState ? Position.fromState(startState) : Position.createInitial();
    this.startState = this.position.toState();
    this.captured = [[], []];
    this.positionKeys = [this.position.getPositionKey()];
    this.positionCounts = new Map([[this.positionKeys[0], 1]]);
    this.selectedSquare = -1;
    this.selectedMoves = [];
    this.lastMove = null;
    this.checkSquare = -1;
    this.pendingView = null;
    this.ply = 0;
    this.positionEvals = [];
    this.moveRecords = [];
    this.ui.setBoardBadges([]);
    this.ui.resetMoveList();
    this.ui.setCaptured(this.captured);
    this.ui.hideMenu();
    this.ui.hideGameOver();
    this.view.setIdleRotate(false);
    this.view.setHint(-1, -1);
    this.view.setOrientation(humanColor, true);
    this.view.showPosition(this.position, null, -1);
    this._updateEvaluation();
    this._beginTurn();
  }

  /** Stops the current chess game without touching the menu (another game takes over). @returns {void} */
  abandon() {
    this.gameToken++;
    this.sessionId++;
    this.phase = 'menu';
    this.timer.running = false;
    this.timer.pause();
  }

  /** Shows the main menu and idles the camera. @returns {void} */
  returnToMenu() {
    this.gameToken++;
    this.phase = 'menu';
    this.timer.running = false;
    this.timer.pause();
    this.view.setIdleRotate(true);
    this.ui.setStatus(t('status.menu'));
    this.ui.showMenu();
  }

  /** Pauses/resumes the turn clock while a dialog is open. @param {boolean} paused - True when paused. @returns {void} */
  setPaused(paused) {
    if (paused) this.timer.pause();
    else if (this.timer.running) this.timer.startedAt = performance.now();
  }

  /** Per-frame hook updating the live clock text. @returns {void} */
  updateClock() {
    if (this.phase === 'human' || this.phase === 'bot') {
      const side = t(this.position.turn === Color.WHITE ? 'side.white' : 'side.black');
      this.ui.setStatusSub(t('status.clock', { side, time: formatClock(this.timer.getSeconds()) }));
    }
  }

  /** Asks the analysis worker to score the current position and shows the result on the bar. */
  _updateEvaluation() {
    const promise = this.evaluation.evaluate(this.position);
    this.positionEvals[this.ply] = promise;
    this._showEvaluation(promise);
    return promise;
  }

  /** Displays an evaluation promise on the bar once it resolves (newest request wins). */
  _showEvaluation(promise) {
    const token = ++this.evalToken;
    this.ui.setEvaluation(null, this.viewColor);
    this.ui.setEngineLines(null);
    promise.then((info) => {
      if (token !== this.evalToken) return;
      this.lastEvalInfo = info;
      this.ui.setEvaluation(info, this.viewColor);
      this.ui.setEngineLines(this._describeLines(info), (hint) => this.setHint(hint));
    });
  }

  /**
   * Converts the engine's top lines for the current position into display records.
   * @param {Object} info - Evaluation record with `lines`.
   * @returns {Array<{from:number,to:number,san:string,label:string}>} Lines with SAN and a signed score label.
   */
  _describeLines(info) {
    const legal = this.position.generateLegalMoves();
    const result = [];
    (info.lines || []).forEach((line) => {
      const move = legal.find((m) => m.from === line.from && m.to === line.to && m.promotion === line.promotion);
      if (move) result.push({ from: line.from, to: line.to, san: engine.moveToSan(this.position, move, legal), label: formatSignedEvaluation(line.evaluation) });
    });
    return result;
  }

  /**
   * Highlights a suggested move on the board (null clears it).
   * @param {{from:number,to:number}|null} hint - Move to highlight.
   * @returns {void}
   */
  setHint(hint) {
    this.hint = hint;
    this.view.setHint(hint ? hint.from : -1, hint ? hint.to : -1);
  }

  /** @returns {number} The side whose pieces the person at the screen may move right now. */
  _controlledColor() {
    return this.mode === 'local' ? this.position.turn : this.humanColor;
  }

  /**
   * Turns move rating on or off (rating past moves when switched on mid-game).
   * @param {boolean} enabled - True to rate moves.
   * @returns {void}
   */
  setRatingsEnabled(enabled) {
    this.ratingsEnabled = enabled;
    this.ui.setRatingsVisible(enabled);
    if (!enabled) return;
    this.moveRecords.filter((r) => !r.requested).forEach((r) => this._rateMove(r, this.gameToken));
    this._refreshBoardBadges();
  }

  /** Shows icons for the two most recent moves (one per side); the older one is faded. */
  _refreshBoardBadges() {
    if (!this.ratingsEnabled) { this.ui.setBoardBadges([]); return; }
    const recent = this.moveRecords.slice(-2);
    const badges = recent
      .map((record, index) => ({ ply: record.ply, square: record.square, rating: record.rating, faded: recent.length === 2 && index === 0 }))
      .filter((badge) => badge.rating);
    this.ui.setBoardBadges(badges);
  }

  /** Waits for the before/after evaluations of a move, rates it, and updates the icons. */
  async _rateMove(record, token) {
    record.requested = true;
    const session = this.sessionId;
    const [before, after] = await Promise.all([this.positionEvals[record.ply], this.positionEvals[record.ply + 1]]);
    if (session !== this.sessionId) return;
    const key = await this.rater.rate(record, before, after);
    if (session !== this.sessionId) return;
    record.rating = key;
    this.ui.setMoveRating(record.slot, key);
    this._refreshBoardBadges();
  }

  /** @returns {boolean} True when there is a human move to take back and nothing is animating. */
  _canUndo() {
    if (this.mode === 'local') return (this.phase === 'human' || this.phase === 'over') && this.moveRecords.length > 0;
    return (this.phase === 'human' || this.phase === 'bot' || this.phase === 'over') && this.moveRecords.some((r) => r.mover === this.humanColor);
  }

  /** Enables or disables the Undo button to match the game state. */
  _syncUndoButton() {
    if (this.ui) this.ui.setUndoEnabled(this._canUndo());
  }

  /**
   * Takes back the player's last move (and the bot's reply, if it already answered),
   * so it is the player's turn again in the position before that move.
   * @returns {void}
   */
  undo() {
    if (!this._canUndo()) return;
    let index = this.moveRecords.length - 1;
    if (this.mode === 'bot') while (this.moveRecords[index].mover !== this.humanColor) index--;
    const target = this.moveRecords[index];
    this.gameToken++; // cancels a bot search in progress and any pending game-over card
    this.moveRecords.length = index;
    this.position = Position.fromState(target.beforeState);
    this.ply = target.ply;
    this.positionEvals.length = this.ply + 1;
    this.positionKeys.length = this.ply + 1;
    this.positionCounts = new Map();
    this.positionKeys.forEach((key) => this.positionCounts.set(key, (this.positionCounts.get(key) || 0) + 1));
    this.captured = [[], []];
    this.moveRecords.forEach((r) => { if (r.capturedType) this.captured[r.mover].push(r.capturedType); });
    const previous = this.moveRecords[this.moveRecords.length - 1];
    this.lastMove = previous ? { from: previous.move.from, to: previous.move.to } : null;
    this.checkSquare = this.position.isInCheck(this.position.turn) ? this.position.kingSquares[this.position.turn] : -1;
    this.selectedSquare = -1;
    this.selectedMoves = [];
    this.timer.pause();
    this.ui.hideGameOver();
    this.setHint(null);
    this.ui.resetMoveList();
    this.moveRecords.forEach((r) => {
      r.slot = this.ui.appendMove({ moveNumber: r.moveNumber, color: r.mover, san: r.san, seconds: r.seconds });
      if (r.rating) this.ui.setMoveRating(r.slot, r.rating);
    });
    this.ui.setCaptured(this.captured);
    this._refreshBoardBadges();
    this.view.showPosition(this.position, this.lastMove, this.checkSquare);
    this._showEvaluation(this.positionEvals[this.ply] || this._updateEvaluation());
    this.ui.showToast(t('toast.undone'));
    this._beginTurn();
  }

  /** Computes legal moves and hands control to the human or the bot. */
  _beginTurn() {
    const turn = this.position.turn;
    this.legalMoves = this.position.generateLegalMoves();
    this.timer.restart();
    const inCheck = this.position.isInCheck(turn);
    this.setHint(null);
    if (this.mode === 'local') {
      if (this.autoFlip && this.viewColor !== turn) {
        this.viewColor = turn;
        this.view.setOrientation(turn, true);
        if (this.lastEvalInfo) this.ui.setEvaluation(this.lastEvalInfo, this.viewColor);
      }
      const side = t(turn === Color.WHITE ? 'side.white' : 'side.black');
      this.phase = 'human';
      this.ui.setStatus(inCheck ? t('status.sideInCheck', { side }) : t(turn === Color.WHITE ? 'status.whiteToMove' : 'status.blackToMove'), '', turn);
    } else if (turn === this.humanColor) {
      this.phase = 'human';
      this.ui.setStatus(inCheck ? t('status.inCheck') : t('status.yourMove'), '', turn);
    } else {
      this.phase = 'bot';
      this.ui.setStatus(t('status.botThinking'), '', turn);
      this._runBotTurn(this.gameToken);
    }
  }

  /** Waits briefly, searches, then plays the bot's move (aborts if the game was reset). */
  async _runBotTurn(token) {
    await delay(this.tweener.instant ? 0 : CONFIG.game.botThinkDelayMs / this.tweener.timeScale);
    if (token !== this.gameToken) return;
    const limits = {
      maxDepth: this.settings.get('gameplay.engineDepth'),
      timeLimitMs: this.settings.get('gameplay.engineThinkSeconds') * 1000,
      strength: this.settings.get('gameplay.engineStrength'),
    };
    const move = await this.bot.chooseMove(this.position, this.legalMoves, this.settings.get('gameplay.randomMoveProbability'), limits);
    if (token !== this.gameToken) return;
    await this._playMove(move, token);
  }

  /** Collapses moves into unique destination markers. */
  _targetsOf(moves) {
    const targets = [];
    moves.forEach((m) => { if (!targets.some((x) => x.square === m.to)) targets.push({ square: m.to, isCapture: (m.flags & MoveFlag.CAPTURE) !== 0 }); });
    return targets;
  }

  /**
   * Handles a click on a board square from the human.
   * @param {number} square - Clicked square or -1.
   * @returns {void}
   */
  handleSquareClick(square) {
    if (this.phase !== 'human' || square < 0) return;
    const targetMoves = this.selectedMoves.filter((m) => m.to === square);
    if (this.selectedSquare >= 0 && targetMoves.length > 0) { this._playHumanMove(targetMoves); return; }
    const piece = this.position.board[square];
    if (piece !== 0 && engine.getPieceColor(piece) === this._controlledColor()) this._selectSquare(square);
    else this._clearSelection();
  }

  /** @param {number} square - Hovered square or -1. @returns {void} */
  handleSquareHover(square) {
    if (this.phase !== 'human') { this.view.setHover(-1); document.body.style.cursor = ''; return; }
    const piece = square >= 0 ? this.position.board[square] : 0;
    const interactive = (piece !== 0 && engine.getPieceColor(piece) === this._controlledColor()) || this.selectedMoves.some((m) => m.to === square);
    this.view.setHover(interactive ? square : -1);
    document.body.style.cursor = interactive ? 'pointer' : '';
  }

  /** Selects a piece and shows its legal destinations. */
  _selectSquare(square) {
    this.selectedSquare = square;
    this.selectedMoves = this.legalMoves.filter((m) => m.from === square);
    this.view.select(square, this._targetsOf(this.selectedMoves));
    this.audio.playSelect();
  }

  /** Clears the current selection. */
  _clearSelection() {
    this.selectedSquare = -1;
    this.selectedMoves = [];
    this.view.clearSelection();
  }

  /** Plays the human's chosen move, asking for a promotion piece when needed. */
  async _playHumanMove(candidateMoves) {
    const token = this.gameToken;
    let move = candidateMoves[0];
    if (move.promotion) {
      this.phase = 'animating';
      this.timer.pause();
      const type = await this.ui.askPromotion(this.position.turn);
      if (token !== this.gameToken) return;
      this.timer.startedAt = performance.now();
      move = candidateMoves.find((m) => m.promotion === type) || candidateMoves[0];
    }
    this._clearSelection();
    await this._playMove(move, token);
  }

  /** Applies a move: record, animate, update state, handle check/mate/draw, advance the turn. */
  async _playMove(move, token) {
    this.phase = 'animating';
    document.body.style.cursor = '';
    this.setHint(null);
    const mover = this.position.turn;
    const seconds = this.timer.getSeconds();
    this.timer.pause();
    this.timer.running = false;
    const san = engine.moveToSan(this.position, move, this.legalMoves);
    const moveNumber = this.position.fullmoveNumber;
    const wasForced = this.legalMoves.length === 1;
    const playedPly = this.ply;
    const beforeState = this.position.toState();
    await this.view.playMove(move, mover);
    if (token !== this.gameToken) return;

    if (move.captured) this.captured[mover].push(engine.getPieceType(move.captured));
    this.position.makeMove(move);
    this.ply++;
    const key = this.position.getPositionKey();
    this.positionCounts.set(key, (this.positionCounts.get(key) || 0) + 1);
    this.positionKeys.push(key);
    const ratingSlot = this.ui.appendMove({ moveNumber, color: mover, san, seconds });
    this.ui.setCaptured(this.captured);
    const opponent = this.position.turn;
    const inCheck = this.position.isInCheck(opponent);
    this.lastMove = { from: move.from, to: move.to };
    this.checkSquare = inCheck ? this.position.kingSquares[opponent] : -1;
    this._flushPendingView();
    this.view.setLastMove(move.from, move.to);
    this.view.setCheck(this.checkSquare);
    this._updateEvaluation();
    let status = this.position.getStatus();
    if (status === GameStatus.ONGOING && this.positionCounts.get(key) >= CONFIG.game.threefoldRepetitionCount) status = 'repetition';
    const record = { ply: playedPly, mover, move: { from: move.from, to: move.to, promotion: move.promotion }, wasForced, deliveredMate: status === GameStatus.CHECKMATE, afterState: this.position.toState(), beforeState, slot: ratingSlot, square: move.to, rating: null, requested: false, san, seconds, moveNumber, capturedType: move.captured ? engine.getPieceType(move.captured) : 0 };
    this.moveRecords.push(record);
    this._syncUndoButton();
    this._refreshBoardBadges();
    if (this.ratingsEnabled) this._rateMove(record, token);

    if (status === GameStatus.CHECKMATE) { this._handleCheckmate(mover, opponent); return; }
    if (status !== GameStatus.ONGOING) { this._handleDraw(status); return; }
    if (move.flags & (MoveFlag.CASTLE_KING | MoveFlag.CASTLE_QUEEN)) this.ui.showToast(t('toast.castle'));
    if (move.promotion) this.ui.showToast(t('toast.promoted', { piece: t('piece.' + PIECE_KEYS[move.promotion]) }));
    if (inCheck) {
      const humanGaveCheck = this.mode === 'local' || mover === this.humanColor;
      delay(200).then(() => { if (token === this.gameToken) (humanGaveCheck ? this.audio.playCheck() : this.audio.playChecked()); });
      this.ui.showToast(this.mode === 'local' ? t('toast.check') : t(humanGaveCheck ? 'toast.youCheck' : 'toast.botChecks'));
    }
    this._beginTurn();
  }

  /** Plays the finale for a checkmate and opens the result card. */
  _handleCheckmate(winner, loser) {
    this.phase = 'over';
    const humanWon = this.mode === 'local' || winner === this.humanColor;
    const resultKey = this.mode === 'local' ? (winner === Color.WHITE ? 'result.checkmateWhite' : 'result.checkmateBlack') : (humanWon ? 'result.checkmateWin' : 'result.checkmateLoss');
    this.ui.setStatus(t('status.gameOver'), t(resultKey));
    (humanWon ? this.audio.playCheckmateWin : this.audio.playCheckmateLoss).call(this.audio);
    this.view.playFinale(this.position.kingSquares[loser], loser, humanWon);
    const token = this.gameToken;
    delay(CONFIG.game.gameOverDelayMs.checkmate).then(() => {
      if (token === this.gameToken) this.ui.showGameOver(t(resultKey));
    });
  }

  /** Announces a drawn game. */
  _handleDraw(status) {
    this.phase = 'over';
    const keyByStatus = { [GameStatus.STALEMATE]: 'result.stalemate', [GameStatus.INSUFFICIENT_MATERIAL]: 'result.insufficient', [GameStatus.FIFTY_MOVE]: 'result.fiftyMove', repetition: 'result.repetition' };
    const text = t(keyByStatus[status]);
    this.audio.playDraw();
    this.ui.setStatus(t('status.gameOver'), text);
    const token = this.gameToken;
    delay(CONFIG.game.gameOverDelayMs.draw).then(() => { if (token === this.gameToken) this.ui.showGameOver(text); });
  }
}

/** Tracks frame time, shows FPS and lowers render resolution when frames run long. */
class PerformanceMonitor {
  /**
   * @param {GraphicsEngine} graphics - Engine whose dynamic scale is adjusted.
   * @param {UIManager} ui - UI for the FPS readout and toast.
   */
  constructor(graphics, ui) {
    this.graphics = graphics;
    this.ui = ui;
    this.smoothedMs = 16.7;
    this.slowSeconds = 0;
    this.fastSeconds = 0;
    this.displayTimer = 0;
    this.cooldown = 3;
    this.downgradeCount = 0;
    this.upgradesAllowed = true;
    this.warned = false;
    this.adaptiveEnabled = true;
  }

  /**
   * Feeds one frame's duration.
   * @param {number} frameSeconds - Raw (unclamped) frame time.
   * @returns {void}
   */
  update(frameSeconds) {
    const perf = CONFIG.performance;
    if (frameSeconds > 0.5) return; // tab was hidden; ignore
    this.smoothedMs = lerp(this.smoothedMs, frameSeconds * 1000, 0.05);
    this.displayTimer += frameSeconds;
    this.cooldown -= frameSeconds;
    if (this.displayTimer > 0.5) { this.displayTimer = 0; this.ui.setFps(1000 / this.smoothedMs); }
    if (!this.adaptiveEnabled) return;
    this.slowSeconds = this.smoothedMs > perf.slowFrameMs ? this.slowSeconds + frameSeconds : 0;
    this.fastSeconds = this.smoothedMs < perf.fastFrameMs ? this.fastSeconds + frameSeconds : 0;
    if (this.cooldown > 0) return;
    const scale = this.graphics.dynamicScale;
    if (this.slowSeconds > perf.slowSecondsBeforeDowngrade && scale > perf.minDynamicScale + 0.01) {
      this.graphics.setDynamicScale(Math.max(perf.minDynamicScale, scale - perf.scaleStep));
      this.downgradeCount++;
      if (this.downgradeCount > 2) this.upgradesAllowed = false;
      this._afterAdjust();
      if (!this.warned) { this.warned = true; this.ui.showToast(t('toast.lowFps')); }
    } else if (this.fastSeconds > perf.fastSecondsBeforeUpgrade && scale < 1 && this.upgradesAllowed) {
      this.graphics.setDynamicScale(Math.min(1, scale + perf.scaleStep));
      this._afterAdjust();
    }
  }

  /** Resets timers after a resolution change. */
  _afterAdjust() { this.slowSeconds = 0; this.fastSeconds = 0; this.cooldown = 4; this.smoothedMs = 16.7; }
}

/** Wires every subsystem together and runs the render loop. */
class Application {
  /** Creates all subsystems; the 3D stack is optional (2D still works without WebGL). */
  constructor() {
    this.ui = new UIManager();
    this.settings = new SettingsStore(CONFIG.defaults, CONFIG.storage.settingsKey);
    this.tweener = new Tweener();
    this.audio = new AudioManager(this.settings);
    this.bot = new BotPlayer(CONFIG.game);
    this.evaluation = new EvaluationService(CONFIG.evaluation);
    this.rater = new MoveRater(this.evaluation, CONFIG.moveRating);
    this.clock = new THREE.Clock();
    this.elapsed = 0;
    this.mode = '2d';
    this._createView3D(document.getElementById('game-canvas'));
    this._createView2D();
    this.mode = this.view3d && this.settings.get('graphics.viewMode') === '3d' ? '3d' : '2d';
    this.game = new GameController({
      ui: this.ui, view: this._viewFor(this.mode), bot: this.bot, evaluation: this.evaluation, rater: this.rater,
      audio: this.audio, settings: this.settings, tweener: this.tweener,
    });
    this.customStartState = null;
    this.activeGame = 'chess';
    this.tttView = new TicTacToeView(document.getElementById('ttt-wrap'), this.effects2d, {
      onCellClick: (cell) => this.ttt.handleCellClick(cell),
      onCellHover: (cell) => this.ttt.handleCellHover(cell),
    });
    this.ttt = new TicTacToeController({ ui: this.ui, view: this.tttView, audio: this.audio, settings: this.settings, tweener: this.tweener });
    this.editor = new PositionEditor(document.getElementById('editor-overlay'), (state) => { this.customStartState = state; this.ui.setCustomStartNote(true); });
    this.settingsPanel = new SettingsPanel(document.getElementById('settings-overlay'), this.settings, (open) => { this.game.setPaused(open); this.ttt.setPaused(open); });
    this.performance = new PerformanceMonitor(this.graphics || { dynamicScale: 1 }, this.ui);
    this._bindUi();
    this._bindSettings();
  }

  /** Builds the three.js stack; on failure leaves view3d null and hides the canvas. */
  _createView3D(canvas) {
    try {
      this.graphics = new GraphicsEngine(canvas, this.tweener);
      this.boardView = new BoardView(this.graphics.scene, this.tweener);
      this.effects = new EffectsManager(this.graphics, this.boardView.pieceFactory.materials);
      this.director = new MoveDirector(this.boardView, this.effects, this.audio);
      this.view3d = new View3D({ graphics: this.graphics, boardView: this.boardView, director: this.director, effects: this.effects });
      this.input = new BoardInput(canvas, this.graphics.cameraRig.camera, this.boardView, {
        onSquareClick: (square) => this.game.handleSquareClick(square),
        onSquareHover: (square) => this.game.handleSquareHover(square),
      });
      this.graphics.onResize((w, h, ratio) => this.boardView.resizeReflection(w * ratio, h * ratio));
    } catch (error) {
      console.error('3D view unavailable:', error);
      this.graphics = null; this.view3d = null;
      canvas.style.display = 'none';
    }
  }

  /** Builds the 2D board and its effects canvas. */
  _createView2D() {
    const wrap = document.getElementById('board2d-wrap');
    this.effects2d = new Effects2D(document.getElementById('fx2d-canvas'), wrap);
    this.view2d = new Board2DView(wrap, this.effects2d, this.audio, this.tweener, {
      onSquareClick: (square) => this.game.handleSquareClick(square),
      onSquareHover: (square) => this.game.handleSquareHover(square),
    });
    this.view2d.deactivate();
  }

  /** @param {string} mode - '2d' or '3d'. @returns {Object} Matching view object. */
  _viewFor(mode) { return mode === '3d' && this.view3d ? this.view3d : this.view2d; }

  /** Connects buttons and window events. */
  _bindUi() {
    window.addEventListener('pointerdown', () => this.audio.unlock(), { passive: true });
    this.ui.bind({
      onPlay: (color) => { this.audio.unlock(); this._setActiveGame('chess'); this.game.startNewGame(color, this.customStartState, 'bot'); },
      onPlayLocal: () => { this.audio.unlock(); this._setActiveGame('chess'); this.game.startNewGame(Color.WHITE, this.customStartState, 'local'); },
      onPlayTtt: (mark) => { this.audio.unlock(); this._setActiveGame('ttt'); this.ttt.startNewGame(mark); },
      onUndo: () => this._activeController().undo(),
      onSetup: () => { this.audio.unlock(); this.editor.open(this.customStartState); },
      onClearCustom: () => { this.customStartState = null; this.ui.setCustomStartNote(false); },
      onSettings: () => { this.audio.unlock(); this.settingsPanel.open(); },
      onNewGame: () => this._activeController().returnToMenu(),
      onResetCamera: () => { if (this.graphics) this.graphics.cameraRig.swingToSide(this.game.phase === 'menu' ? Color.WHITE : this.game.viewColor); },
      onPlayAgain: () => this._activeController().returnToMenu(),
      onViewBoard: () => this.ui.hideGameOver(),
      onViewChange: (mode) => this.settings.set('graphics.viewMode', mode),
    });
    window.addEventListener('keydown', (event) => {
      const dialogOpen = document.querySelector('#settings-overlay.visible, #editor-overlay.visible, #promotion-overlay.visible');
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && !dialogOpen) { event.preventDefault(); this._activeController().undo(); }
    });
    window.addEventListener('resize', () => { if (this.graphics) this.graphics.resize(); this.effects2d.resize(); this.view2d.resize(); this.tttView.resize(); });
    if (this.graphics) this.graphics.resize();
  }

  /** Applies every setting now and whenever it changes. */
  _bindSettings() {
    this.settings.subscribe((path, value) => this._applySetting(path, value));
    ['gameplay', 'graphics', 'audio'].forEach((section) => this.settings.listPaths(section).forEach((path) => this._applySetting(path, this.settings.get(path))));
    this.ui.setViewMode(this.mode, !!this.view3d);
    this.settingsPanel.syncControls();
  }

  /**
   * Routes one setting change to the subsystem that owns it.
   * @param {string} path - Dotted setting path.
   * @param {*} value - New value.
   * @returns {void}
   */
  _applySetting(path, value) {
    const s = this.settings;
    if (path === 'graphics.viewMode') {
      this.mode = value === '3d' && this.view3d ? '3d' : '2d';
      this.performance.adaptiveEnabled = this.mode === '3d';
      this.ui.setViewMode(this.mode, !!this.view3d);
      if (this.game) this.game.requestView(this._viewFor(this.mode));
      return;
    }
    if (path === 'gameplay.animationSpeed') {
      const instant = value > CONFIG.animationSpeed.maxMultiplier + 0.001;
      this.tweener.setSpeed(instant ? 1 : value, instant);
      return;
    }
    if (path === 'gameplay.showEngineLines') { this.ui.setEngineLinesVisible(value); if (!value) { this.game.setHint(null); this.ttt.setHint(null); } return; }
    if (path === 'gameplay.localAutoFlip') { this.game.autoFlip = value; return; }
    if (path === 'gameplay.moveRatingsEnabled') { this.game.setRatingsEnabled(value); this.ttt.setRatingsEnabled(value); return; }
    if (path === 'graphics.showFps') { this.ui.setFpsVisible(value); return; }
    if (path === 'graphics.cameraShakeIntensity') { this.effects2d.shakeScale = value; }
    if (!this.graphics) return;
    const g = this.graphics;
    switch (path) {
      case 'graphics.reflections': this.boardView.setReflectionsEnabled(value); break;
      case 'graphics.antialiasing': g.setAntialiasing(value); break;
      case 'graphics.bloomEnabled': case 'graphics.bloomStrength':
        g.pipeline.setBloom(s.get('graphics.bloomEnabled'), s.get('graphics.bloomStrength')); break;
      case 'graphics.fieldOfView': g.cameraRig.setFieldOfView(value); break;
      case 'graphics.shadowQuality': g.lighting.setShadowQuality(value, g.scene); break;
      case 'graphics.depthOfFieldEnabled': case 'graphics.depthOfFieldStrength':
        g.pipeline.setDepthOfField(s.get('graphics.depthOfFieldEnabled'), s.get('graphics.depthOfFieldStrength')); break;
      case 'graphics.motionBlurStrength': g.pipeline.setMotionBlurStrength(value); break;
      case 'graphics.rainEnabled': this.effects.setRainEnabled(value); break;
      case 'graphics.cameraShakeIntensity': g.cameraRig.shakeScale = value; break;
      default: break;
    }
  }

  /** @returns {Object} Controller of the game being played (chess or tic-tac-toe). */
  _activeController() {
    return this.activeGame === 'ttt' ? this.ttt : this.game;
  }

  /**
   * Switches between the chess and tic-tac-toe screens.
   * @param {string} game - 'chess' or 'ttt'.
   * @returns {void}
   */
  _setActiveGame(game) {
    if (game === this.activeGame) return;
    this.activeGame = game;
    document.body.classList.toggle('game-ttt', game === 'ttt');
    setRatingContext(game);
    this.ui.setEngineLines(null);
    if (game === 'ttt') {
      this.game.abandon();
      this.ui.setViewMode('2d', !!this.view3d);
      document.body.classList.add('game-ttt');
    } else {
      this.ttt.abandon();
      this.ui.setViewMode(this.mode, !!this.view3d);
    }
  }

  /** Starts the render loop and reveals the menu. @returns {void} */
  start() {
    this.game.returnToMenu();
    this.game._updateEvaluation();
    this.ui.hideLoading();
    const frame = () => {
      requestAnimationFrame(frame);
      const rawDelta = this.clock.getDelta();
      const dt = Math.min(rawDelta, 0.05);
      this.elapsed += dt;
      this.tweener.update(dt);
      this.effects2d.update(dt);
      this._activeController().updateClock();
      this.ui.positionBoardBadges((square) => (this.activeGame === 'ttt' ? this.tttView.getScreenPoint(square) : this.game.view.getScreenPoint(square)));
      if (this.mode === '3d' && this.activeGame === 'chess') {
        this.boardView.update(dt, this.elapsed);
        this.effects.update(dt, this.elapsed);
        this.graphics.cameraRig.update(dt, this.elapsed);
        this.graphics.render(dt);
      }
      this.performance.update(rawDelta);
    };
    frame();
  }
}

/**
 * Entry point: boots the app (falling back to 2D-only when WebGL is missing).
 * @returns {void}
 */
function bootstrap() {
  const fail = (key) => {
    const loading = document.getElementById('loading-overlay');
    loading.querySelector('p').textContent = t(key);
    loading.querySelector('.spinner').style.display = 'none';
  };
  try {
    new Application().start();
  } catch (error) {
    console.error(error);
    fail('app.loadFailed');
  }
}

document.addEventListener('DOMContentLoaded', bootstrap);


/* ============================================================================
 * SECTION 9b — TIC-TAC-TOE GAME CONTROLLER
 * Mirrors the chess controller (turns, AI, undo, evaluation bar, move ratings)
 * on top of the solved tic-tac-toe engine.
 * ========================================================================== */

/** Runs a tic-tac-toe game against the AI. */
class TicTacToeController {
  /**
   * @param {Object} deps - { ui, view, audio, settings, tweener }.
   */
  constructor(deps) {
    Object.assign(this, deps);
    this.Mark = tttEngine.Mark;
    this.timer = new TurnTimer();
    this._phase = 'menu'; // menu | human | bot | over
    this.gameToken = 0;
    this.board = new Array(9).fill(0);
    this.humanMark = this.Mark.X;
    this.records = [];
    this.ply = 0;
    this.lastCell = -1;
    this.hint = null;
    this.ratingsEnabled = true;
  }

  /** @returns {string} Current phase. */
  get phase() { return this._phase; }

  /** @param {string} value - New phase; refreshes the Undo button. */
  set phase(value) {
    this._phase = value;
    this._syncUndoButton();
  }

  /** @param {number} mark - Mark.X or Mark.O. @returns {number} Chess Color used for the shared UI (X = white side, O = black side). */
  _colorOf(mark) { return mark === this.Mark.X ? Color.WHITE : Color.BLACK; }

  /** @param {number} mark - Mark. @returns {string} "X" or "O". */
  _markName(mark) { return t(mark === this.Mark.X ? 'ttt.x' : 'ttt.o'); }

  /**
   * Starts a new game.
   * @param {number} humanMark - Mark the player uses (X moves first).
   * @returns {void}
   */
  startNewGame(humanMark) {
    this.gameToken++;
    this.humanMark = humanMark;
    this.board.fill(0);
    this.records = [];
    this.ply = 0;
    this.lastCell = -1;
    this.hint = null;
    this.ui.resetMoveList();
    this.ui.setBoardBadges([]);
    this.ui.hideMenu();
    this.ui.hideGameOver();
    this.view.activate();
    this.view.showPosition(this.board, -1, null);
    this._beginTurn();
  }

  /** Stops the current game without showing the menu (another game takes over). @returns {void} */
  abandon() {
    this.gameToken++;
    this.phase = 'menu';
  }

  /** Shows the main menu. @returns {void} */
  returnToMenu() {
    this.abandon();
    this.timer.pause();
    this.ui.setStatus(t('status.menu'));
    this.ui.showMenu();
  }

  /** Per-frame hook updating the live clock text. @returns {void} */
  updateClock() {
    if (this.phase === 'human' || this.phase === 'bot') {
      this.ui.setStatusSub(t('ttt.clock', { mark: this._markName(tttEngine.markToMove(this.board)), time: formatClock(this.timer.getSeconds()) }));
    }
  }

  /** Pauses/resumes the turn clock while a dialog is open. @param {boolean} paused - True when paused. @returns {void} */
  setPaused(paused) {
    if (paused) this.timer.pause();
    else if (this.timer.running) this.timer.startedAt = performance.now();
  }

  /** Shows the evaluation bar and top moves for the current board. */
  _showEvaluation() {
    const info = tttEngine.describePosition(this.board);
    this.ui.setEvaluation(info, this._colorOf(this.humanMark));
    const mover = tttEngine.markToMove(this.board);
    const lines = (info.lines || []).slice(0, CONFIG.evaluation.lineCount).map((l) => {
      let label = t('ttt.lineDraw');
      if (l.outcome.kind === 'mate') {
        label = t(l.outcome.winner === mover ? 'ttt.lineWin' : 'ttt.lineLoss', { n: l.outcome.mateIn });
      }
      return { from: l.cell, to: l.cell, san: tttEngine.cellName(l.cell), label };
    });
    this.ui.setEngineLines(lines, (hint) => this.setHint(hint));
  }

  /**
   * Highlights a suggested cell (null clears it).
   * @param {{from:number,to:number}|null} hint - Suggested move.
   * @returns {void}
   */
  setHint(hint) {
    this.hint = hint;
    this.view.setHint(-1, hint ? hint.to : -1);
  }

  /** Hands control to the player or the AI. */
  _beginTurn() {
    this.setHint(null);
    const mover = tttEngine.markToMove(this.board);
    this.timer.restart();
    this._showEvaluation();
    if (mover === this.humanMark) {
      this.phase = 'human';
      this.ui.setStatus(t('status.tttYourTurn', { mark: this._markName(mover) }), '', this._colorOf(mover));
    } else {
      this.phase = 'bot';
      this.ui.setStatus(t('status.tttAiThinking'), '', this._colorOf(mover));
      this._runAiTurn(this.gameToken);
    }
  }

  /** Waits briefly, then plays the AI's move. */
  async _runAiTurn(token) {
    await delay(this.tweener.instant ? 0 : CONFIG.game.botThinkDelayMs / this.tweener.timeScale);
    if (token !== this.gameToken) return;
    this._commitMove(this._chooseAiCell());
  }

  /**
   * Chooses the AI's cell using the depth, strength and random-move settings.
   * @returns {number} Cell index.
   */
  _chooseAiCell() {
    const s = this.settings;
    const empties = tttEngine.emptyCells(this.board);
    if (Math.random() < s.get('gameplay.randomMoveProbability')) return empties[Math.floor(Math.random() * empties.length)];
    const scored = tttEngine.scoreMoves(this.board, s.get('gameplay.engineDepth'));
    const best = Math.max(...scored.map((m) => m.score));
    const strength = s.get('gameplay.engineStrength');
    const temperature = Math.pow(1 - strength, 1.5) * CONFIG.game.tttWeakenedTemperature;
    const weights = scored.map((m) => (temperature <= 0 ? (m.score === best ? 1 : 0) : Math.exp((m.score - best) / temperature)));
    let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < scored.length; i++) { roll -= weights[i]; if (roll <= 0) return scored[i].cell; }
    return scored[0].cell;
  }

  /**
   * Handles a click on a cell from the player.
   * @param {number} cell - Cell index.
   * @returns {void}
   */
  handleCellClick(cell) {
    if (this.phase !== 'human' || this.board[cell] !== 0) return;
    this._commitMove(cell);
  }

  /** @param {number} cell - Hovered cell or -1. @returns {void} */
  handleCellHover(cell) {
    const playable = this.phase === 'human' && cell >= 0 && this.board[cell] === 0;
    this.view.setHover(playable ? cell : -1);
    document.body.style.cursor = playable ? 'pointer' : '';
  }

  /** Plays a move for the side to move: record, rate, animate, check the result, advance. */
  _commitMove(cell) {
    const mover = tttEngine.markToMove(this.board);
    const beforeBoard = this.board.slice();
    const seconds = this.timer.getSeconds();
    this.timer.pause();
    this.timer.running = false;
    this.board[cell] = mover;
    const playedPly = this.ply++;
    this.lastCell = cell;
    this.view.placeMark(cell, mover);
    this.view.setHover(-1);
    this.audio.playMove();
    const san = this._markName(mover) + ' ' + tttEngine.cellName(cell);
    const slot = this.ui.appendMove({ moveNumber: Math.floor(playedPly / 2) + 1, color: this._colorOf(mover), san, seconds });
    const record = { ply: playedPly, mover, cell, beforeBoard, san, seconds, slot, rating: null };
    this.records.push(record);
    if (this.ratingsEnabled) this._rate(record);
    this._refreshBoardBadges();
    this.view.setLastMove(cell);
    const line = tttEngine.winningLine(this.board);
    if (line) { this._finish(mover, line); return; }
    if (tttEngine.emptyCells(this.board).length === 0) { this._finish(0, null); return; }
    this._beginTurn();
  }

  /** Computes and shows the rating of one move (instant: the game is solved). */
  _rate(record) {
    record.rating = tttEngine.rateMove(record.beforeBoard, record.cell, CONFIG.moveRating.tttShortsightedDepth);
    this.ui.setMoveRating(record.slot, record.rating);
  }

  /** Shows icons for the two most recent moves (older one faded). */
  _refreshBoardBadges() {
    if (!this.ratingsEnabled) { this.ui.setBoardBadges([]); return; }
    const recent = this.records.slice(-2);
    this.ui.setBoardBadges(recent
      .map((r, index) => ({ ply: r.ply, square: r.cell, rating: r.rating, faded: recent.length === 2 && index === 0 }))
      .filter((b) => b.rating));
  }

  /**
   * Turns ratings on or off (rating earlier moves when switched on mid-game).
   * @param {boolean} enabled - True to rate moves.
   * @returns {void}
   */
  setRatingsEnabled(enabled) {
    this.ratingsEnabled = enabled;
    this.ui.setRatingsVisible(enabled);
    if (enabled) this.records.filter((r) => !r.rating).forEach((r) => this._rate(r));
    this._refreshBoardBadges();
  }

  /** Ends the game with a winner (0 = draw) and announces it. */
  _finish(winnerMark, line) {
    this.phase = 'over';
    this._showEvaluation();
    let text;
    if (winnerMark === 0) {
      text = t('result.tttDraw');
      this.audio.playDraw();
    } else if (winnerMark === this.humanMark) {
      text = t('result.tttWin');
      this.audio.playCheckmateWin();
      this.view.celebrate();
    } else {
      text = t('result.tttLoss');
      this.audio.playCheckmateLoss();
    }
    if (line) this.view.showWin(line);
    this.ui.setStatus(t('status.gameOver'), text);
    const token = this.gameToken;
    delay(CONFIG.game.gameOverDelayMs.draw + 700).then(() => { if (token === this.gameToken) this.ui.showGameOver(text); });
  }

  /** @returns {boolean} True when there is a player move to take back. */
  _canUndo() {
    return (this.phase === 'human' || this.phase === 'bot' || this.phase === 'over') && this.records.some((r) => r.mover === this.humanMark);
  }

  /** Updates the Undo button. */
  _syncUndoButton() {
    if (this.ui) this.ui.setUndoEnabled(this._canUndo());
  }

  /**
   * Takes back the player's last move (and the AI's reply, if any).
   * @returns {void}
   */
  undo() {
    if (!this._canUndo()) return;
    let index = this.records.length - 1;
    while (this.records[index].mover !== this.humanMark) index--;
    const target = this.records[index];
    this.gameToken++;
    this.records.length = index;
    this.board = target.beforeBoard.slice();
    this.ply = target.ply;
    this.lastCell = this.records.length ? this.records[this.records.length - 1].cell : -1;
    this.ui.hideGameOver();
    this.ui.resetMoveList();
    this.records.forEach((r) => {
      r.slot = this.ui.appendMove({ moveNumber: Math.floor(r.ply / 2) + 1, color: this._colorOf(r.mover), san: r.san, seconds: r.seconds });
      if (r.rating) this.ui.setMoveRating(r.slot, r.rating);
    });
    this._refreshBoardBadges();
    this.view.showPosition(this.board, this.lastCell, null);
    this.ui.showToast(t('toast.undone'));
    this._beginTurn();
  }
}

</script>
