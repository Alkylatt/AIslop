function newGame(){
 const prices={},hist={};
 for(const c in CITIES){prices[c]={};hist[c]={};for(const k in COM){prices[c][k]=COM[k].b*(CITIES[c].m[k]||1)*R(.92,1.08);hist[c][k]=[Math.round(prices[c][k])]}}
 S={screen:'city',city:'harrow',day:1,gold:120,hp:50,maxHp:50,food:8,guards:1,cargo:{},basis:{},items:[],nid:1,deck:[...START],prices,hist,shocks:[],rumors:[],msg:'You arrive in Ashenreach with 120 gold and a creaking wagon. Reach 500 gold by day 30 to retire rich.',cb:null,reward:null,over:null};
 genRumor();genRumor();save();render();
}
function genRumor(){
 const c=pick(Object.keys(CITIES)),k=pick(Object.keys(COM)),up=Math.random()<.5,start=S.day+RI(2,4);
 if(Math.random()<.8)S.shocks.push({city:c,com:k,mult:up?1.7:.55,start,len:8});
 S.rumors.push({t:`Travellers whisper that ${COM[k].n.toLowerCase()} will ${up?'surge':'crash'} in ${CITIES[c].n}.`,exp:start+8});
 S.rumors=S.rumors.filter(r=>r.exp>S.day).slice(-4);
}
function tick(days){
 for(let d=0;d<days;d++){S.day++;for(const c in CITIES)for(const k in COM){let p=S.prices[c][k];p+=(tgt(c,k)-p)*.25+p*R(-.04,.04);S.prices[c][k]=Math.max(2,p);const h=S.hist[c][k];h.push(Math.round(p));if(h.length>8)h.shift()}}
}
function removeUnit(k){const n=S.cargo[k];S.basis[k]=Math.round(S.basis[k]*(n-1)/n);const st=S.items.filter(i=>i.type==k).sort((a,b)=>a.q-b.q||b.id-a.id)[0];st.q--;if(!st.q)S.items=S.items.filter(i=>i!==st);sync()}
const cheapest=()=>Object.keys(S.cargo).sort((a,b)=>COM[a].b-COM[b].b)[0];
function loseFragile(){const k=Object.keys(S.cargo).find(k=>COM[k].frag);if(k){removeUnit(k);return COM[k].n+' shattered. '}return''}

/* ===== TRAVEL ===== */
function routes(){const r=[];for(const to in CITIES){if(to==S.city)continue;const d=DIST[[S.city,to].sort().join('|')],t=(S.city=='thorn'||to=='thorn')?'forest':'mountain';
 r.push({to,n:'King’s Road',days:d+1,dg:.3,toll:10,t:'road'},{to,n:t=='forest'?'Wolfwood Track':'Ridge Pass',days:d,dg:t=='forest'?.6:.45,toll:0,t})}return r}
function go(i){
 const r=routes()[i];if(S.gold<r.toll){S.msg='You cannot afford the toll.';return render()}
 S.gold-=r.toll;let days=r.days,m=[];
 if(r.t=='forest'&&Math.random()<.3){days++;m.push('Mud slows the wagons (+1 day).')}
 if(Math.random()<(r.t=='mountain'?.3:.2)){const l=loseFragile();m.push('A storm lashes the caravan. '+l)}
 S.food-=days;if(S.food<0){S.hp+=S.food*3;S.food=0;m.push('Hunger: the caravan goes without food and loses HP.')}
 tick(days);
 if(S.cargo.grain){let l=0;for(let i=0;i<S.cargo.grain*days;i++)if(Math.random()<.05)l++;l=Math.min(l,S.cargo.grain);for(let i=0;i<l;i++)removeUnit('grain');if(l)m.push(l+' grain spoiled.')}
 S.msg=m.join(' ');
 if(S.hp<=0)return over(false,'Starved on the road.');
 if(S.day>=10&&!S.b1){S.b1=1;return startCombat('warlord',r)}
 if(S.day>=20&&!S.b2){S.b2=1;return startCombat('rival',r)}
 if(Math.random()<.25)return startEvent(r);
 if(Math.random()<r.dg){const t={forest:[['wolf',.5],['goblin',.3],['bandit',.2]],mountain:[['bandit',.5],['goblin',.3],['wolf',.2]],road:[['bandit',.4],['goblin',.3],['wolf',.3]]}[r.t];let x=Math.random(),id=t[2][0];for(const[a,p]of t){if(x<p){id=a;break}x-=p}startCombat(id,r)}else arrive(r);
}
function arrive(r){S.city=r.to;S.screen='city';genRumor();S.msg=(S.msg||'')+' Arrived in '+CITIES[r.to].n+' on day '+S.day+'.';if(S.day>30)return over(S.gold>=500,'The season ended on day 30.');save();render()}
function worth(){return S.gold+Object.entries(S.cargo).reduce((a,[k,n])=>a+n*sp(S.city,k),0)}
function over(win,why){S.screen='over';S.over={win:win||worth()>=500&&why.startsWith('Retired'),why,score:worth()};save();render()}

/* ===== COMBAT ===== */
function startCombat(id,route){
 const e=EN[id];S.cb={id,eh:e.hp,em:e.hp,str:0,i:0,draw:shuf([...S.deck]),hand:[],disc:[],exh:[],en:3,blk:S.guards*3,guarded:0,cap:0,bonus:0,weak:0,skip:0,fled:0,log:['A '+e.n+' bars the way!'],route};
 S.screen='combat';startTurn(true);save();render();
}
function draw(n){const c=C();for(let i=0;i<n;i++){if(!c.draw.length){if(!c.disc.length)break;c.draw=shuf(c.disc);c.disc=[]}c.hand.push(c.draw.pop())}}
function startTurn(first){const c=C();if(!first)c.blk=0;c.guarded=0;c.en=3;draw(5)}
function dmg(n){C().eh-=n;log('You deal '+n+' damage.')}
function blk(n){C().blk+=n;log('+'+n+' Block.')}
function play(i){
 const c=C(),id=c.hand[i];if(!id)return;const d=CARDS[id];if(c.en<d.c||(d.ok&&!d.ok()))return;
 c.en-=d.c;c.hand.splice(i,1);d.f();if(d.t=='Defense'&&c.cap&&id!='captain')c.cap++;
 (d.ex?c.exh:c.disc).push(id);
 if(c.eh<=0)return win();render();
}
function hit(d,k){
 const c=C(),a=Math.min(c.blk,d);c.blk-=a;const h=d-a;S.hp-=h;log('The foe hits for '+d+(a?' ('+a+' blocked)':'')+'.');
 if(h>=8&&S.guards>0&&Math.random()<.5){S.guards--;log('A guard is wounded and flees the caravan!')}
 if(h>0&&Math.random()<.25){const l=loseFragile();if(l)log(l)}
 if(k=='raid'){if(c.guarded&&h==0)log('Guarded wagons hold! Cargo is safe.');else{const t=Object.keys(S.cargo).sort((a,b)=>COM[b].b-COM[a].b)[0];if(t){removeUnit(t);log('Raiders seize a unit of '+COM[t].n+'!')}else log('Raiders find nothing to take.')}}
 if(k=='steal'&&h>0)return true;return false;
}
function endTurn(){
 const c=C(),e=EN[c.id];
 if(c.cap){c.eh-=c.cap;log('Your captain strikes for '+c.cap+'.');if(c.eh<=0)return win()}
 c.disc.push(...c.hand);c.hand=[];
 const a=e.ai[c.i%e.ai.length];
 if(c.skip){c.skip=0;log('The foe hesitates.')}
 else if(a.k=='buff'){c.str+=2;log('The foe grows fiercer.')}
 else{const d=Math.max(0,a.d+c.str-c.weak);const st=hit(d,a.k);if(st){if(a.w=='food'){S.food=Math.max(0,S.food-2);log('Supplies stolen: −2 food.')}else{const g=Math.min(S.gold,12);S.gold-=g;log('Purse snatched: −'+g+' gold.')}}}
 c.weak=0;c.i++;
 if(S.hp<=0)return over(false,'Your caravan was lost to a '+e.n+'.');
 startTurn();save();render();
}
function win(){
 const c=C();S.gold+=c.bonus+RI(8,18)+(EN[c.id].boss?50:0);if(EN[c.id].hum&&!c.fled)repUp(c.route.to,1);const pool=shuf([...POOL]).slice(0,3);
 S.reward={cards:pool,route:c.route,fled:c.fled};S.screen='reward';S.cb=null;save();render();
}
function claim(i){
 const rw=S.reward,n=rw.cards.length;
 if(i<n)S.deck.push(rw.cards[i]);else if(i==n)S.gold+=30;else if(i==n+1)S.food+=4;else if(i==n+2){const k=pick(CHEAP());if(gridAdd(k,2))S.basis[k]=(S.basis[k]||0)+Math.round(COM[k].b*1.2)}
 const r=rw.route;S.reward=null;S.msg='Victory! ';arrive(r);
}

/* ===== EVENTS ===== */
const addCargo=(k,n)=>{if(gridAdd(k,n)){S.basis[k]=(S.basis[k]||0)+Math.round(COM[k].b*n);return 1}};
const EVENTS={
 peddler:{t:'🧙 Roadside Peddler',x:'A wiry peddler waves you down, hawking wares from a rattling cart.',o:[
  {t:'Healing draught (20g, +15 HP)',ok:()=>S.gold>=20,f:()=>{S.gold-=20;S.hp=Math.min(S.maxHp,S.hp+15);return'The draught tastes of mint and regret, but you feel better.'}},

 warden:{t:'🪙 Road Warden',x:'A warden bars the road and demands a “road levy”.',o:[

  {t:'Ignore them (−1 reputation)',f:()=>{repUp(S.ev.r.to,-1);return'You drive on, the silence heavy behind you.'}}]}};
function startEvent(r){S.ev={id:pick(Object.keys(EVENTS)),r};S.screen='event';save();render()}
function choose(i){const o=EVENTS[S.ev.id].o[i];if(!o||(o.ok&&!o.ok()))return;const r=S.ev.r;S.msg=o.f();S.ev=null;if(S.hp<=0)return over(false,'You died on the road.');arrive(r)}
/* ===== ACTIONS ===== */
function act(a,k,n){
 k=k===undefined?undefined:isNaN(k)?k:+k;
 if(a=='noop')return;if(a=='gal'){GAL=!GAL;return render()}if(a=='gf'){GF=k;return render()}
 if(a=='new')return newGame();
 if(a=='cont'){S=SAVED;migrate();return render()}
 if(a=='card')return play(k);if(a=='end')return endTurn();if(a=='pick')return claim(k);
 if(a=='go')return go(k);if(a=='ev')return choose(k);if(a=='garr')return gArrange();if(a=='grot')return gRotate();
 if(a=='retire')return over(S.gold>=500,'Retired on day '+S.day+'.');
 if(a=='buy'){let bought=0;for(let i=0;i<n;i++){const p=bp(S.city,k);if(!stockOk(k)){floatTxt(tr('Unavailable'),'bad');break}if(S.gold<p){floatTxt(tr('Not enough money'),'bad');break}if(!gridAdd(k,1)){const m=S.msg;S.msg='';floatTxt(tr(m),'bad');break}S.gold-=p;stockUse(k);S.basis[k]=(S.basis[k]||0)+p;S.prices[S.city][k]*=1.03;S.msg='';bought++}if(bought)floatTxt('+'+bought,'up')}
 if(a=='sell'){let sold=0;for(let i=0;i<n;i++){if(!S.cargo[k])break;const p=sp(S.city,k);S.gold+=p;removeUnit(k);sold++;S.prices[S.city][k]*=.97;S.msg='';S.sc=(S.sc||0)+1;if(S.sc%4==0)repUp(S.city,1)}if(sold)floatTxt('-'+sold,'dn')}
 if(a=='food'&&S.gold>=6*n){S.gold-=6*n;S.food+=n}
 if(a=='hire'){if(S.gold>=gcost()&&S.guards<3){S.gold-=gcost();S.guards++}else S.msg='Cannot hire ('+gcost()+'g, max 3 guards).'}
 if(a=='rest'){if(S.gold>=12){S.gold-=12;S.hp=Math.min(S.maxHp,S.hp+15);S.food--;tick(1);S.msg='You rest at the inn for a day.'}else S.msg='The innkeeper wants 12 gold.'}
 save();render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.k,e.shiftKey?5:1)});
document.addEventListener('keydown',e=>{
 const d=parseInt(e.key);if(GAL){if(e.key=='Escape'){GAL=false;render()}return}
 if(S.screen=='combat'){if(d>=1&&d<=9)play(d-1);else if(e.key=='e'||e.key=='E'||e.key=='Enter')endTurn()}
 else if(S.screen=='event'&&d>=1)choose(d-1);
 else if(S.screen=='reward'&&d>=1&&d<=7){const n=S.reward.cards.length;if(d-1<=n+2)claim(d-1)}
});

function gridAdd(k,q){
 const st=FP[k][2];if(wt()+q*COM[k].w>CAPW){S.msg='Too heavy.';return 0}
 const items=S.items.map(i=>({...i}));let left=q;
 for(const i of items)if(i.type==k&&left>0&&i.q<st){const t=Math.min(left,st-i.q);i.q+=t;left-=t}

function gPlan(it,rot,tx,ty){

function runOps(ops,out,to){const z=Zh(),sg=n=>(n>0?'+':'−')+Math.abs(n);

  if(k=='gold'){S.gold=Math.max(0,S.gold+o[1]);out.push(sg(o[1])+(z?' 金幣':' gold'))}
  else if(k=='hp'){S.hp=Math.min(S.maxHp,S.hp+o[1]);out.push(sg(o[1])+(z?' 生命':' HP'))}
  else if(k=='food'){S.food=Math.max(0,S.food+o[1]);out.push(sg(o[1])+(z?' 食物':' food'))}
  else if(k=='rep'){repUp(to,o[1]);out.push((z?'聲望 ':'Rep ')+sg(o[1]))}
  else if(k=='cargo'||k=='cargoR'){const c=k=='cargo'?o[1]:pick(CHEAP()),n=k=='cargo'?o[2]:o[1];if(gridAdd(c,n)){S.basis[c]=(S.basis[c]||0)+Math.round(COM[c].b*n);out.push('+'+n+' '+(z?terms(COM[c].n):COM[c].n))}else out.push(z?'（沒有空間）':'(no room)')}
  else if(k=='lose'){for(let i=0;i<o[1];i++){const ks=Object.keys(S.cargo);if(!ks.length)break;removeUnit(pick(ks));out.push(z?'− 1 貨物':'−1 cargo')}}
  else if(k=='use'){if(S.cargo[o[1]])removeUnit(o[1])}
  else if(k=='guard')S.guards=Math.max(0,Math.min(5,S.guards+o[1]));
  else if(k=='flag'){S.fl=S.fl||{};S.fl[o[1]]=o[2]}
  else if(k=='fight'){if(S.ev)S.ev.fight=o[1]}
  else if(k=='shock')S.shocks.push({city:to,com:o[1],mult:o[2],start:S.day,len:o[3]});
  else if(k=='later')(S.later=S.later||[]).push(o[1]);
  else if(k=='msg')out.push(L(o[1]));
  else if(k=='rng'){let t=o[1].reduce((a,x)=>a+x[0],0),x=Math.random()*t;for(const[w,ops2]of o[1]){if(x<w){runOps(ops2,out,to);break}x-=w}}}}

 if(dv.group){const g=dv.group;S.dev.group='';return xEncounter(r,g)}
 if(S.fl.alert){S.fl.alert=0;return xEncounter(r,'ruffians')}
