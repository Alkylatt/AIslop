</style></head><body><main>
<div class="hud"><span>🧑</span><span class="said" id="said"></span><button id="hear">🔊</button><label><input type="checkbox" id="show" checked>文字</label><span id="vol"><button id="mt">🔊</button><input type="range" id="vs" min="0" max="100" value="100" aria-label="音量"></span><b id="tm">⏱ 2:00</b><b>💰$<span id="money">0</span></b></div>

</main>
<div class="md" id="md"><div class="mb" id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0],K=Object.keys;
const TEA={紅茶:'#a4471f',綠茶:'#9ab84a',烏龍:'#c98a2c'},ICE={正常冰:.25,少冰:.17,微冰:.08,去冰:0},SUG={全糖:40,少糖:30,半糖:20,微糖:10,無糖:0};
const TOP={無配料:'',珍珠:'#2a1a14',蒟蒻:'#e8d98a',布丁:'#f2c14e',仙草:'#1c1c1c'},SIZE={中杯:45,大杯:55};
const DEF={size:'中杯',tea:'紅茶',ice:'正常冰',sug:'全糖',top:'無配料'};
const FR={x:10,y:190,w:150,h:180},SLOT={x:735,y:80,w:140,h:175},PF={x:610,y:395,w:280,h:155},TRASH={x:20,y:480,w:90,h:70},HD={ice:{x:164,y:302,w:62,h:56},stk:{x:164,y:238,w:50,h:58},top:{x:563,y:448,w:46,h:56},cl:{x:590,y:284,w:76,h:50}};
const G={money:0,n:0,cups:[],straws:[],labels:[]},W=$('#world');let Z=10,s=1,open=0,AC,NB,MG,mute=false,pn,vol=1,lv=1,SKIP=0,CB=null;
const lp=e=>{const r=W.getBoundingClientRect();return{x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s}};
const inR=(p,r,d=0)=>p.x>=r.x-d&&p.x<=r.x+r.w+d&&p.y>=r.y-d&&p.y<=r.y+r.h+d;
const place=o=>{o.el.style.left=o.x+'px';o.el.style.top=o.y+'px'};
const snap=(o,now)=>{const H=o.home;if(!H)return;const e=o.el,m={x:o.x+e.offsetWidth/2,y:o.y+e.offsetHeight/2};if(!inR(m,H,18))return;o.x=H.x+H.w/2-e.offsetWidth/2;o.y=H.y+H.h/2-e.offsetHeight/2;if(!now){e.style.transition='left .15s,top .15s';setTimeout(()=>e.style.transition='',200)}place(o)};
const el=(cls,html,st)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html||'';if(st)d.style.cssText=st;W.appendChild(d);return d};
const fill=c=>c.ice+c.tea+c.sugar*.00225+Object.values(c.top).reduce((a,b)=>a+b,0);
const teaType=c=>{const k=K(c.teaK);return k.length==1?k[0]:k.length?'混茶':''};
const TC=c=>{const t=teaType(c);return t=='混茶'?'#7a5a3a':TEA[t]||'#cde'};
const add=(c,fn,a)=>{const x=Math.min(a,Math.max(0,1-fill(c)));if(x>0)fn(x);c.spill+=a-x};
const cc=c=>({x:c.x+c.w/2,y:c.y+c.h/2});
/* 音效 */
function ctx(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=vol;MG.connect(AC.destination);const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b}return AC}
function tone(f,d,ty='sine',v=.15,f2){if(mute)return;v=Math.min(1,v*2);const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(MG);o.start();o.stop(t+d)}
function noise(d,f,v,loop){if(mute)return;v=Math.min(1,v*2);const a=ctx(),n=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();n.buffer=NB;n.loop=!!loop;bp.type='bandpass';bp.frequency.value=f;g.gain.value=v;n.connect(bp).connect(g).connect(MG);n.start();if(d)n.stop(a.currentTime+d);return n}
const pourOn=(on,f=900)=>{if(on&&!pn)pn=noise(0,f,.12,1);if(!on&&pn){pn.stop();pn=null}};
const S={pick:()=>{tone(420,.09,'triangle',.25,250);noise(.04,2500,.25)},drop:()=>{tone(170,.13,'triangle',.35,60);noise(.06,700,.4)},lid:()=>{tone(220,.08,'square',.12,140);noise(.08,1200,.25)},click:()=>tone(600,.05,'square',.1),scoop:()=>noise(.1,1800,.2),perfect:()=>[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.2),i*110)),stamp:()=>{tone(120,.2,'square',.3,45);noise(.12,900,.5)},tick:()=>tone(900,.03,'square',.07),whoosh:()=>{noise(.35,1200,.25);tone(300,.3,'sine',.1,900)},print:()=>noise(.04,3200,.18),iceScoop:()=>{tone(140,.55,'sine',.25,65);noise(.6,550,.22);for(let i=0;i<10;i++)setTimeout(()=>{noise(.05+Math.random()*.06,1700+Math.random()*2800,.35);if(i%3==0)tone(650+Math.random()*500,.12,'triangle',.12,330)},i*65+Math.random()*30)},shake:()=>noise(.07,3500,.2),seal:()=>tone(110,3,'sawtooth',.07,90),
 ice:()=>[0,60,130].forEach(t=>setTimeout(()=>noise(.06,5000+Math.random()*2500,.3),t)),done:()=>{tone(880,.15,'sine',.2);setTimeout(()=>tone(1320,.25,'sine',.2),120)}};
/* 粒子 */
const X=$('#fx').getContext('2d'),PS=[];
const spawn=(x,y,c,n,sp=2)=>{for(let i=0;i<n;i++)PS.push({x,y,vx:(Math.random()-.5)*sp*2,vy:-Math.random()*sp*1.5,l:25+Math.random()*20,c,r:1.5+Math.random()*2})};
(function loop(){X.clearRect(0,0,900,560);for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.x+=p.vx;p.y+=p.vy;if(p.fog)p.r+=.18;else p.vy+=.18;if(--p.l<=0)PS.splice(i,1);else if(p.fog){const a=.26*Math.min(1,p.l/p.l0),g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(225,242,255,${a})`);g.addColorStop(1,'rgba(225,242,255,0)');X.globalAlpha=1;X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill()}else{X.globalAlpha=Math.min(1,p.l/12);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill()}}requestAnimationFrame(loop)})();
/* 拖曳 */
function dragify(o,h={}){const e0=o.el;e0.style.touchAction='none';
 e0.onpointerdown=e=>{if(o.busy)return;e.preventDefault();e0.setPointerCapture(e.pointerId);const p=lp(e),dx=p.x-o.x,dy=p.y-o.y;e0.style.zIndex=++Z;S.pick();o.t=performance.now();o.lq=p;h.dn&&h.dn(o,p);
  e0.onpointermove=v=>{const q=lp(v);o.x=q.x-dx;o.y=q.y-dy;place(o);h.mv&&h.mv(o,q);o.lq=q;o.t=performance.now()};
  e0.onpointerup=e0.onpointercancel=v=>{e0.onpointermove=e0.onpointerup=e0.onpointercancel=null;S.drop();h.up&&h.up(o,lp(v));o.lq=null}}}
/* 杯子 */
function draw(c){
 const L=`<i style="height:${c.sugar*.225}%;background:#eadcae"></i>`+Object.entries(c.top).map(([t,a])=>`<i style="height:${a*100}%;background:${TOP[t]}"></i>`).join('')+`<i style="height:${c.tea*100}%;background:${TC(c)}"></i><i class="ice" style="height:${c.ice*100}%"></i>`,l=c.label;
 c.el.innerHTML=`<div class="body">${L}<u class="ln"></u></div>${c.sealed?'<em class="lid"></em>':''}${c.sealed&&c.wet>0?`<span class="dr" style="opacity:${c.wet}">💧 💧<br>💧 💧</span>`:''}${l?`<div class="lb"><div class="tm">${l.time}</div><div class="nm"><span>${l.tea}・${l.size}</span><span>$${l.price}</span></div><div>${l.ice}</div><div>${l.sug}</div><div class="ex">${l.top=='無配料'?'—':'+'+l.top}</div></div>`:''}<div class="inf">${c.sealed?`搖${Math.min(6,c.shk)}/6 水珠${Math.round(c.wet*100)}%`:`冰${Math.round(c.ice*100)}% 糖${c.sugar.toFixed(0)}g 茶${Math.round(c.tea*100)}% 滿${Math.round(fill(c)*100)}%`}</div>`;
}
function newCup(size){
 if(G.cups.length>=8)return;const big=size=='大杯',w=big?90:78,h=big?160:130;
 const c={size,w,h,x:200+Math.random()*60,y:275+Math.random()*25,label:null,ice:0,tea:0,teaK:{},top:{},sugar:0,sd:0,stirred:false,spill:0,sealed:false,inMach:false,wet:0,shk:0,busy:false,pvx:0,pvy:0,base:0,spillT:0};
 c.el=el('it cup-it','',`width:${w}px;height:${h}px;transform-origin:50% 90%;transition:transform .12s ease-out`);place(c);G.cups.push(c);draw(c);S.pick();
 dragify(c,{dn:(c,p)=>{c.inMach=false;c.lx=p.x;c.ld=0;c.pvx=c.pvy=0},
  mv:(c,q)=>{const n=performance.now(),dt=Math.max(8,n-c.t),vx=(q.x-c.lq.x)/dt,vy=(q.y-c.lq.y)/dt,sx=c.pvx*.6+vx*.4,sy=c.pvy*.6+vy*.4,da=Math.hypot(sx-c.pvx,sy-c.pvy);c.pvx=sx;c.pvy=sy;
    if(!c.sealed){c.base=Math.max(-25,Math.min(25,sx*22));

function why(o,m,r){
 const d=[],a=(t,p)=>{p=Math.round(p);if(p>0)d.push([t,p])};
 if(!m.label)a('未貼標籤',10);else a('標籤與點單不符',10-r.label);
 a('杯型不正確',10-r.size);
 a(m.ice<ICE[o.ice]?'冰塊太少':'冰塊太多',15-r.ice);
 const sb=SUG[o.sug]>0&&!m.stirred?r.sugar/.6:r.sugar;
 a(m.sugar<SUG[o.sug]?'蔗糖太少':'蔗糖太多',15-sb);
 if(sb!=r.sugar)a('未攪拌',sb-r.sugar);
 const ta=Object.entries(m.top).filter(([k,v])=>v>.005);
 if(o.top=='無配料')a('不需要的配料',15-r.top);
 else if(!ta.length)a('漏加配料',15-r.top);
 else if(ta.length>1||ta[0][0]!=o.top)a('配料加錯',15-r.top);
 else a(ta[0][1]<.12?'配料太少':'配料太多',15-r.top);
 const tt=teaType(m);
 if(tt!=o.tea)a(!tt?'沒有倒茶':tt=='混茶'?'茶種混在一起':'茶種錯誤',20-r.tea);
 a(fill(m)<.95?'飲料沒裝滿':'飲料溢出或灑出',10-r.fill);
 if(!m.sealed)a('未封膜',3);
 if(!(m.sealed&&m.shk>=6))a('未搖晃',1);
 if(!(m.sealed&&m.wet<=0))a('未擦乾',1);
 a(tt==o.tea||m.tea<.4?'茶量不足':'茶種錯誤（加重扣分）',r.raw*(1-r.gate));
 return d}
function typeLines(box,L,done,keep){
 if(!keep)box.innerHTML='';const host=document.createElement('div');box.appendChild(host);
 let i=0,j=0,w=0,d=null;
 const tm=setInterval(()=>{if(w>0){w--;return}if(i>=L.length)return fin();if(!d){d=document.createElement('div');d.className=L[i].c||'';d.style.cssText=L[i].s||'';host.appendChild(d)}
  const ln=L[i];if(ln.c=='dd'||ln.c=='ok'){d.textContent=ln.t;i++;j=0;d=null;w=12;return}
  d.textContent=ln.t.slice(0,++j);if(j>=ln.t.length){i++;j=0;d=null}},18);
 function fin(){clearInterval(tm);box.skip=null;host.innerHTML=L.map(l=>`<div class="${l.c||''}" style="${l.s||''}">${l.t}</div>`).join('');done()}
 box.skip=fin;CB=box;if(SKIP)fin()}
function deliver(){
 if(G.over)return;const cups=G.cups.filter(c=>inR(cc(c),PF)),sts=G.straws.filter(o=>inR({x:o.x+6,y:o.y+35},PF)),sn=sts.length;
 if(!cups.length)return $('#hint').textContent='請先把手搖飲放到交付台上！';
 G.over=true;const e=(Date.now()-G.t0)/1000,ot=Math.max(0,Math.floor(e-G.limit)),used=new Set(),rows=[],mm=[];let price=0;
 const items=[...cups,...sts];
 items.forEach((o,i)=>{o.busy=true;setTimeout(()=>{S.whoosh();o.el.style.transition='transform .85s cubic-bezier(.45,0,.9,.4),opacity .85s ease-in';o.el.style.transform=`translateY(${-(o.y+260)}px)`;o.el.style.opacity='0'},i*140)});
 G.order.forEach(o=>{let b=null;cups.forEach(m=>{if(used.has(m))return;const r=pairScore(o,m);if(!b||r.total>b.r.total)b={m,r}});if(b)used.add(b.m);rows.push(b?b.r:null);mm.push(b?b.m:null);price+=SIZE[o.size]+(o.top!='無配料'?10:0)});
 const extra=Math.max(0,cups.length-G.order.length),se=Math.abs(sn-cups.length),f=Math.round;
 const pens=[['吸管數量不符',se*5],[`多給 ${extra} 杯`,extra*10]].filter(x=>x[1]>0),pen=pens.reduce((a,x)=>a+x[1],0);
 const sc=rows.map(r=>r?Math.max(0,r.total-pen):0),avg=sc.reduce((a,b)=>a+b,0)/sc.length,fin=Math.max(0,avg-ot),ratio=fin>=85?1:fin/85,pay=Math.round(price*ratio);
 G.money+=pay;
 const st=fin>=90?5:fin>=75?4:fin>=55?3:fin>=35?2:1,lost=1-pay/price,payC=pay>=price?'#5fe08a':`rgb(255,${f(255-lost*170)},${f(255-lost*180)})`;
 const Ls=rows.map((r,i)=>{const o=G.order[i],l=[{t:`🥤 杯${i+1}：${o.size}${o.tea} ${o.ice}${o.sug}${o.top!='無配料'?' '+o.top:''}`,c:'c1'},{t:`${f(sc[i])} / 100 分`,c:'big2'}];
  if(!r)l.push({t:'・缺杯 -100',c:'dd'});else{const d=[...why(o,mm[i],r),...pens];d.length?d.forEach(([t,p])=>l.push({t:`・${t} -${p}`,c:'dd'})):l.push({t:'・完美，沒有扣分！',c:'ok'})}return l});
 const L2=[{t:'★'.repeat(st)+'☆'.repeat(5-st),c:'star'},{t:`「${pick(REV[st])}」`,c:'rv'},{t:`客人付款 $${pay}（原價 $${price}，用時 ${f(e)} 秒）`,c:'c1',s:`color:${payC};font-weight:800`}];
 const cl=(v,mx,txt)=>{const l=Math.max(0,1-v/mx),full=f(v)>=mx;return `<td style="background:${full?'#8fdca9':`rgb(255,${f(255-l*185)},${f(255-l*195)})`};color:#222">${txt==null?f(v):txt}</td>`};
 const MX=[['label',10],['size',10],['ice',15],['sugar',15],['tea',20],['top',15],['fill',10],['fin',5]];
 const tbl=`<div class="tw"><table><tr><th>杯</th><th>標籤10</th><th>杯型10</th><th>冰15</th><th>糖15</th><th>茶20</th><th>料15</th><th>注滿10</th><th>完成5</th><th>茶量係數</th><th>小計</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td>${r?MX.map(([k,m])=>cl(r[k],m)).join('')+cl(r.gate*100,100,f(r.gate*100)+'%'):'<td colspan="9" style="background:rgb(229,70,60);color:#fff">缺杯</td>'}${cl(sc[i],100)}</tr>`).join('')}<tr><td colspan="10">各杯平均</td>${cl(avg,100)}</tr>${ot?`<tr><td colspan="10">超時扣分</td><td>-${ot}</td></tr>`:''}<tr><td colspan="10">最終分數</td>${cl(fin,100)}</tr></table></div><p class="hint2">綠色＝滿分；白→紅＝扣分越多越紅。吸管／多給杯的扣分已計入每杯小計，超時則在總分之後另外扣除。</p>`;
 const show=()=>{

  const total=()=>typeLines(sm,[{t:`總分 ${f(avg)} / 100`,c:'big'}],()=>{

   if(ot>0){sm.insertAdjacentHTML('beforeend',`<div class="pst">⏱ 超時 ${ot} 秒　-${ot}</div>`);if(!SKIP)S.stamp();setTimeout(roll,SKIP?0:1000)}else finish()},1);
