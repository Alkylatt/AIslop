/** Draws small metallic tetromino previews on 2D canvases (hold and next slots). */
class PiecePreviewRenderer {
  /**
   * Creates the renderer.
   * @param {Object<string, number>} pieceColors - Hex color per piece type.
   */
  constructor(pieceColors) {
    this.pieceColors = pieceColors;
    this.cellSize = 20;
  }

  /**
   * Prepares a canvas for crisp drawing at the device pixel ratio.
   * @param {HTMLCanvasElement} canvas - Preview canvas.
   * @returns {CanvasRenderingContext2D} Scaled drawing context.
   */
  prepareCanvas(canvas) {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = 96 * ratio;
    canvas.height = 64 * ratio;
    const context = canvas.getContext('2d');
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    return context;
  }

  /**
   * Draws a piece (or clears the canvas when type is null).
   * @param {HTMLCanvasElement} canvas - Target canvas.
   * @param {string|null} type - Piece type or null for empty.
   * @param {boolean} [dimmed] - Draw with reduced opacity (hold slot already used).
   * @returns {void}
   */
  draw(canvas, type, dimmed = false) {
    const context = this.prepareCanvas(canvas);
    context.clearRect(0, 0, 96, 64);
    if (!type) return;
    const cells = PIECE_DEFINITIONS[type].rotations[0];
    const xs = cells.map((cell) => cell[0]);
    const ys = cells.map((cell) => cell[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const offsetX = (96 - (maxX - minX + 1) * this.cellSize) / 2;
    const offsetY = (64 - (maxY - minY + 1) * this.cellSize) / 2;
    context.globalAlpha = dimmed ? 0.35 : 1;
    const base = hexToCss(this.pieceColors[type]);
    cells.forEach(([cx, cy]) => {
      const x = offsetX + (cx - minX) * this.cellSize;
      const y = offsetY + (cy - minY) * this.cellSize;
      const gradient = context.createLinearGradient(x, y, x + this.cellSize, y + this.cellSize);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.22, base);
      gradient.addColorStop(0.75, base);
      gradient.addColorStop(1, 'rgba(0,0,0,0.55)');
      context.fillStyle = base;
      context.fillRect(x + 1, y + 1, this.cellSize - 2, this.cellSize - 2);
      context.fillStyle = gradient;
      context.globalAlpha = (dimmed ? 0.35 : 1) * 0.85;
      context.fillRect(x + 1, y + 1, this.cellSize - 2, this.cellSize - 2);
      context.globalAlpha = dimmed ? 0.35 : 1;
    });
    context.globalAlpha = 1;
  }
}

/** Describes the rows of the stats panel. */
const STAT_ROWS = [
  { id: 'score', labelKey: 'hud.score', primary: true, format: (s) => s.score.toLocaleString() },
  { id: 'level', labelKey: 'hud.level', format: (s) => String(s.level) },
  { id: 'lines', labelKey: 'hud.lines', format: (s) => String(s.lines) },
  { id: 'time', labelKey: 'hud.time', format: (s) => formatTime(s.elapsedSeconds) },
  { id: 'lpm', labelKey: 'hud.linesPerMinute', format: (s) => s.linesPerMinute.toFixed(1) },
  { id: 'pps', labelKey: 'hud.piecesPerSecond', format: (s) => s.piecesPerSecond.toFixed(2) },
  { id: 'tspins', labelKey: 'hud.tSpins', format: (s) => String(s.tSpins) },
  { id: 'quads', labelKey: 'hud.quads', format: (s) => String(s.quads) },
  { id: 'perfects', labelKey: 'hud.perfectClears', format: (s) => String(s.perfectClears) },
];

/**
 * Formats seconds as m:ss.
 * @param {number} totalSeconds - Duration.
 * @returns {string} Formatted time.
 */
function formatTime(totalSeconds) {
  const whole = Math.floor(totalSeconds);
  return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`;
}

/**
 * Chooses the popup text key for a clear result.
 * @param {{lines:number, tSpin:string}} result - Clear event.
 * @returns {string} String table key.
 */
function getClearLabelKey(result) {
  if (result.perfectClear) return 'popup.perfectClear';
  if (result.tSpin === 'full') return ['tspin.zero', 'tspin.single', 'tspin.double', 'tspin.triple'][result.lines];
  if (result.tSpin === 'mini') return ['tspinMini.zero', 'tspinMini.single', 'tspinMini.double'][Math.min(result.lines, 2)];
  return ['', 'clear.single', 'clear.double', 'clear.triple', 'clear.quad'][result.lines];
}

/** Owns every DOM element of the HUD, overlays and popups. */
class HudView {
  /**
   * Binds to the page and builds dynamic parts (stat rows, next queue).
   * @param {Object} config - The CONFIG object.
   */
  constructor(config) {
    this.config = config;
    this.previewRenderer = new PiecePreviewRenderer(config.pieceColors);
    this.holdCanvas = document.getElementById('hold-canvas');
    this.nextQueue = document.getElementById('next-queue');
    this.popupLayer = document.getElementById('popup-layer');
    this.overlay = document.getElementById('overlay');
    this.overlayTitle = document.getElementById('overlay-title');
    this.overlayMessage = document.getElementById('overlay-message');
    this.overlayHelp = document.getElementById('overlay-help');
    this.overlayButton = document.getElementById('overlay-button');
    this.statCells = new Map();
    this.statTextCache = new Map();
    this.lastNextKey = '';
    this.lastHoldKey = '';
    this.statsClock = 0;
    this.applyStaticStrings();
    this.buildStatRows();
    this.buildNextQueue();
  }

  /** Fills every [data-i18n] / [data-i18n-title] element from the string table. @returns {void} */
  applyStaticStrings() {
    document.title = t('game.title');
    document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = t(element.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach((element) => {
      element.title = t(element.dataset.i18nTitle);
      element.setAttribute('aria-label', element.title);
    });
  }

  /** Creates the <dt>/<dd> pairs for statistics. @returns {void} */
  buildStatRows() {
    const list = document.getElementById('stats-list');
    STAT_ROWS.forEach((row) => {
      const term = document.createElement('dt');
      term.textContent = t(row.labelKey);
      const value = document.createElement('dd');
      if (row.primary) value.className = 'primary';
      list.append(term, value);
      this.statCells.set(row.id, value);
    });
  }

  /** Creates one preview canvas per upcoming piece. @returns {void} */
  buildNextQueue() {
    this.nextCanvases = [];
    for (let i = 0; i < this.config.gameplay.nextQueueSize; i++) {
      const canvas = document.createElement('canvas');
      canvas.className = 'piece-preview';
      this.nextQueue.appendChild(canvas);
      this.nextCanvases.push(canvas);
    }
  }

  /**
   * Refreshes previews and (throttled) statistics.
   * @param {GameEngine} engine - Engine to read from.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  update(engine, deltaSeconds) {
    const nextTypes = engine.getNextTypes(this.nextCanvases.length);
    const nextKey = nextTypes.join('');
    if (nextKey !== this.lastNextKey) {
      this.lastNextKey = nextKey;
      nextTypes.forEach((type, index) => this.previewRenderer.draw(this.nextCanvases[index], type));
    }
    const holdKey = `${engine.holdType}:${engine.holdUsed}`;
    if (holdKey !== this.lastHoldKey) {
      this.lastHoldKey = holdKey;
      this.previewRenderer.draw(this.holdCanvas, engine.holdType, engine.holdUsed);
    }
    this.statsClock += deltaSeconds;
    if (this.statsClock >= 0.1) {
      this.statsClock = 0;
      this.renderStats(engine.getStats());
    }
  }

  /**
   * Writes statistics into the DOM, touching only values that changed.
   * @param {Object} stats - Snapshot from GameEngine.getStats().
   * @returns {void}
   */
  renderStats(stats) {
    STAT_ROWS.forEach((row) => {
      const text = row.format(stats);
      if (this.statTextCache.get(row.id) !== text) {
        this.statTextCache.set(row.id, text);
        this.statCells.get(row.id).textContent = text;
      }
    });
  }

  /**
   * Shows a floating text popup that removes itself after its animation.
   * @param {string} text - Display text.
   * @param {string} [variant] - Extra CSS classes (small, big, tspin).
   * @returns {void}
   */
  showPopup(text, variant = '') {
    const element = document.createElement('div');
    element.className = `popup ${variant}`.trim();
    element.textContent = text;
    this.popupLayer.appendChild(element);
    element.addEventListener('animationend', () => element.remove());
    while (this.popupLayer.children.length > 5) this.popupLayer.firstChild.remove();
  }

  /**
   * Shows popups describing a clear result.
   * @param {Object} result - "linesCleared" event payload.
   * @returns {void}
   */
  showClearPopups(result) {
    const key = getClearLabelKey(result);
    if (key) {
      const variant = result.perfectClear ? 'big perfect' : result.explosive ? `big${result.tSpin === 'full' ? ' tspin' : ''}` : (result.tSpin !== 'none' ? 'tspin' : '');
      this.showPopup(t(key), variant);
    }
    if (result.backToBack) this.showPopup(t('popup.backToBack'), 'small');
    if (result.combo > 0) this.showPopup(t('popup.combo', { count: result.combo }), 'small');
  }

  /**
   * Shows or hides the full-screen overlay.
   * @param {'start'|'paused'|'gameover'|null} mode - Which screen to show (null hides it).
   * @param {Object} [stats] - Final stats (used by the game-over message).
   * @returns {void}
   */
  setOverlay(mode, stats) {
    if (!mode) { this.overlay.hidden = true; return; }
    const content = {
      start: ['overlay.startTitle', t('overlay.startMessage'), 'button.start'],
      paused: ['overlay.pausedTitle', t('overlay.pausedMessage'), 'button.resume'],
      gameover: ['overlay.gameOverTitle', t('overlay.gameOverMessage', { score: stats ? stats.score.toLocaleString() : 0, lines: stats ? stats.lines : 0 }), 'button.restart'],
    }[mode];
    this.overlayTitle.textContent = t(content[0]);
    this.overlayMessage.textContent = content[1];
    this.overlayButton.textContent = t(content[2]);
    this.overlayHelp.textContent = t('overlay.help');
    this.overlayHelp.hidden = mode === 'gameover';
    this.overlay.hidden = false;
  }
}

/** Tabs of the settings dialog, in display order. */
const SETTINGS_TABS = [
  { id: 'graphics', labelKey: 'settings.tab.graphics' },
  { id: 'gameplay', labelKey: 'settings.tab.gameplay' },
  { id: 'audio', labelKey: 'settings.tab.audio' },
];

/** The settings dialog; edits the shared settings object live. */
class SettingsPanel {
  /**
   * Builds the sliders and wires buttons.
   * @param {Object<string, number>} settings - Shared mutable settings.
   * @param {{onOpen: function(): void, onClose: function(): void}} callbacks - Notifications for the app.
   */
  constructor(settings, callbacks) {
    this.settings = settings;
    this.callbacks = callbacks;
    this.panel = document.getElementById('settings-panel');
    this.fieldsContainer = document.getElementById('settings-fields');
    this.tabBar = document.getElementById('settings-tabs');
    this.controls = new Map();
    this.tabButtons = new Map();
    this.tabPanels = new Map();
    SETTINGS_TABS.forEach((tab) => this.buildTab(tab));
    SETTINGS_FIELDS.forEach((field) => this.buildRow(field));
    this.selectTab(SETTINGS_TABS[0].id);
    document.getElementById('btn-settings').addEventListener('click', (event) => { event.currentTarget.blur(); this.open(); });
    document.getElementById('settings-close').addEventListener('click', () => this.close());
    document.getElementById('settings-reset').addEventListener('click', () => this.resetToDefaults());
  }

  /**
   * Creates one tab button and its (initially hidden) panel.
   * @param {{id:string, labelKey:string}} tab - Tab description.
   * @returns {void}
   */
  buildTab(tab) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tab-btn';
    button.setAttribute('role', 'tab');
    button.textContent = t(tab.labelKey);
    button.addEventListener('click', () => this.selectTab(tab.id));
    this.tabBar.appendChild(button);
    this.tabButtons.set(tab.id, button);

    const panel = document.createElement('div');
    panel.className = 'tab-panel';
    panel.setAttribute('role', 'tabpanel');
    panel.hidden = true;
    this.fieldsContainer.appendChild(panel);
    this.tabPanels.set(tab.id, panel);
  }

  /**
   * Shows one tab's settings and hides the others.
   * @param {string} tabId - Id of the tab to show.
   * @returns {void}
   */
  selectTab(tabId) {
    this.tabButtons.forEach((button, id) => {
      button.classList.toggle('active', id === tabId);
      button.setAttribute('aria-selected', String(id === tabId));
    });
    this.tabPanels.forEach((panel, id) => { panel.hidden = id !== tabId; });
  }

  /**
   * Creates one labelled slider row.
   * @param {{key:string,labelKey:string,min:number,max:number,step:number,decimals:number}} field - Field description.
   * @returns {void}
   */
  buildRow(field) {
    const row = document.createElement('label');
    row.className = 'settings-row';
    const label = document.createElement('span');
    label.textContent = t(field.labelKey);
    const input = document.createElement('input');
    const isToggle = field.type === 'toggle';
    Object.assign(input, isToggle ? { type: 'checkbox' } : { type: 'range', min: field.min, max: field.max, step: field.step });
    const output = document.createElement('output');
    input.addEventListener('input', () => {
      this.settings[field.key] = isToggle ? (input.checked ? 1 : 0) : parseFloat(input.value);
      output.textContent = SettingsPanel.formatValue(field, this.settings[field.key]);
      saveSettings(this.settings);
    });
    row.append(label, input, output);
    this.tabPanels.get(field.tab).appendChild(row);
    this.controls.set(field.key, { input, output, field });
  }

  /** Copies current settings into the slider positions. @returns {void} */
  syncControls() {
    this.controls.forEach(({ input, output, field }) => {
      if (field.type === 'toggle') input.checked = Boolean(this.settings[field.key]);
      else input.value = this.settings[field.key];
      output.textContent = SettingsPanel.formatValue(field, this.settings[field.key]);
    });
  }

  /**
   * Formats a setting value for the readout next to its control.
   * @param {{type?:string, decimals:number}} field - Field description.
   * @param {number} value - Current value.
   * @returns {string} "On"/"Off" for toggles, otherwise the number with the field's decimals.
   */
  static formatValue(field, value) {
    if (field.zeroLabelKey && Number(value) === 0) return t(field.zeroLabelKey);
    if (field.optionKeys) return t(field.optionKeys[Math.round(value)]);
    if (field.type === 'toggle') return t(value ? 'settings.on' : 'settings.off');
    return Number(value).toFixed(field.decimals);
  }

  /** Opens the dialog. @returns {void} */
  open() {
    this.syncControls();
    this.panel.hidden = false;
    this.callbacks.onOpen();
  }

  /** Closes the dialog. @returns {void} */
  close() {
    this.panel.hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    this.callbacks.onClose();
  }

  /** Whether the dialog is currently visible. @returns {boolean} True when open. */
  isOpen() { return !this.panel.hidden; }

  /** Restores every setting to its CONFIG default. @returns {void} */
  resetToDefaults() {
    Object.assign(this.settings, createDefaultSettings());
    saveSettings(this.settings);
    this.syncControls();
  }
}

/** Buttons shown on touch devices. */
const TOUCH_BUTTONS = [
  { group: 'left', action: 'moveLeft', labelKey: 'touch.left' },
  { group: 'left', action: 'softDrop', labelKey: 'touch.down' },
  { group: 'left', action: 'moveRight', labelKey: 'touch.right' },
  { group: 'right', action: 'rotateCounterClockwise', labelKey: 'touch.rotateCounterClockwise' },
  { group: 'right', action: 'rotateClockwise', labelKey: 'touch.rotateClockwise' },
  { group: 'right', action: 'rotate180', labelKey: 'touch.rotate180' },
  { group: 'right', action: 'hold', labelKey: 'touch.hold' },
  { group: 'right', action: 'hardDrop', labelKey: 'touch.hardDrop', wide: true },
];

/**
 * Builds on-screen touch buttons that feed the same InputController as the keyboard.
 * @param {HTMLElement} container - The #touch-controls element.
 * @param {InputController} input - Input controller to drive.
 * @returns {void}
 */
function buildTouchControls(container, input) {
  const groups = { left: document.createElement('div'), right: document.createElement('div') };
  groups.left.className = 'touch-group left';
  groups.right.className = 'touch-group right';
  TOUCH_BUTTONS.forEach(({ group, action, labelKey, wide }) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = wide ? 'touch-btn wide' : 'touch-btn';
    button.textContent = t(labelKey);
    const end = () => input.release(action);
    button.addEventListener('pointerdown', (event) => { event.preventDefault(); button.setPointerCapture(event.pointerId); input.press(action); });
    button.addEventListener('pointerup', end);
    button.addEventListener('pointercancel', end);
    button.addEventListener('lostpointercapture', end);
    button.addEventListener('contextmenu', (event) => event.preventDefault());
    groups[group].appendChild(button);
  });
  container.append(groups.left, groups.right);
}

/* =====================================================================
 * SECTION 10 — APPLICATION (wiring, main loop)
 * ===================================================================== */

/** Connects engine, input, graphics, effects and UI, and runs the main loop. */
class TetrisApp {
  /** Builds every subsystem and subscribes them to engine events. */
  constructor() {
    this.settings = loadSettings();
    this.engine = new GameEngine(CONFIG);
    this.layout = new BoardLayout(CONFIG.board);
    this.impulses = { bloom: 0, flash: 0, chromaticAberration: 0, whiteout: 0 };
    this.graphics = new GraphicsEngine(document.getElementById('stage'), this.layout, CONFIG, this.settings, this.impulses);
    this.boardView = new BoardView(this.graphics.scene, this.layout, this.engine, CONFIG, this.settings);
    this.effects = new EffectsDirector({ graphics: this.graphics, layout: this.layout, engine: this.engine, config: CONFIG, settings: this.settings, impulses: this.impulses });
    this.hud = new HudView(CONFIG);
    this.audio = new AudioEngine(CONFIG, this.settings);
    const unlockAudio = () => this.audio.unlock();
    ['pointerdown', 'keydown', 'touchstart'].forEach((eventName) => window.addEventListener(eventName, unlockAudio, { passive: true }));
    this.settingsPanel = new SettingsPanel(this.settings, { onOpen: () => this.handleSettingsOpened(), onClose: () => this.handleSettingsClosed() });
    this.input = new InputController({
      keybinds: CONFIG.input.keybinds,
      columns: CONFIG.board.columns,
      getRepeatTiming: (action) => (action === 'softDrop'
        ? { das: 0, arr: this.settings.softDropRepeatFrames }
        : { das: this.settings.dasFrames, arr: this.settings.arrFrames }),
      onSystemAction: (action) => this.handleSystemAction(action),
    });
    this.input.attachKeyboard(window);
    buildTouchControls(document.getElementById('touch-controls'), this.input);

    this.logicAccumulator = 0;
    this.lastFrameTime = performance.now();
    this.elapsedSeconds = 0;
    this.resumeAfterSettings = false;

    this.subscribeToEngine();
    this.bindUiButtons();
    window.addEventListener('resize', () => this.graphics.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.engine.state === 'playing') this.engine.togglePause();
      this.audio.setSuspended(document.hidden);
    });
    this.hud.setOverlay('start');
    this.frame = this.frame.bind(this);
    requestAnimationFrame(this.frame);
  }

  /** Subscribes effects and HUD to engine events. @returns {void} */
  subscribeToEngine() {
    const engine = this.engine;
    engine.on('pieceLocked', (event) => this.effects.handleLock(event));
    engine.on('hardDropped', (event) => this.effects.handleHardDrop(event));
    engine.on('linesCleared', (result) => { this.effects.handleLinesCleared(result); this.hud.showClearPopups(result); });
    engine.on('linesCleared', (result) => this.audio.playLineClear(result));
    engine.on('pieceRotated', (event) => this.audio.playRotate(event.direction));
    engine.on('pieceHeld', () => this.audio.playHold());
    engine.on('hardDropped', (event) => this.audio.playHardDrop(event.distance));
    engine.on('pieceLocked', () => this.audio.playLock());
    engine.on('gameOver', () => this.audio.playGameOver());
    this.effects.on('lightning', (event) => this.audio.playLightning(event.strength));
    this.effects.on('nuclear', () => this.audio.playNuclearExplosion());
    engine.on('levelUp', (event) => this.hud.showPopup(t('popup.levelUp', { level: event.level }), 'small'));
    engine.on('gameOver', (event) => { this.effects.handleGameOver(); this.hud.setOverlay('gameover', event.stats); this.hud.renderStats(event.stats); });
    engine.on('paused', (event) => this.hud.setOverlay(event.paused ? 'paused' : null));
  }

  /** Wires overlay and toolbar buttons. @returns {void} */
  bindUiButtons() {
    document.getElementById('overlay-button').addEventListener('click', (event) => {
      event.currentTarget.blur();
      this.handleSystemAction('start');
    });
    document.getElementById('btn-pause').addEventListener('click', (event) => {
      event.currentTarget.blur();
      this.handleSystemAction('pause');
    });
  }

  /**
   * Handles pause / restart / start commands from keyboard or buttons.
   * @param {'pause'|'restart'|'start'} action - System action.
   * @returns {void}
   */
  handleSystemAction(action) {
    const state = this.engine.state;
    if (action === 'pause') {
      if (this.settingsPanel.isOpen()) { this.settingsPanel.close(); return; }
      this.engine.togglePause();
    } else if (action === 'restart') {
      this.startNewGame();
    } else if (action === 'start') {
      if (state === 'paused') this.engine.togglePause();
      else if (state === 'idle' || state === 'gameover') this.startNewGame();
    }
  }

  /** Starts a fresh game and clears the overlay. @returns {void} */
  startNewGame() {
    this.input.releaseAll();
    this.hud.setOverlay(null);
    this.engine.start();
    this.hud.statsClock = 1;
  }

  /** Pauses the game and blocks gameplay input while settings are open. @returns {void} */
  handleSettingsOpened() {
    this.input.setEnabled(false);
    this.resumeAfterSettings = false;
    if (this.engine.state === 'playing') this.engine.togglePause();
    this.hud.setOverlay(null);
  }

  /** Re-enables input and returns to the correct overlay. @returns {void} */
  handleSettingsClosed() {
    this.input.setEnabled(true);
    const state = this.engine.state;
    if (state === 'paused') this.hud.setOverlay('paused');
    else if (state === 'idle') this.hud.setOverlay('start');
    else if (state === 'gameover') this.hud.setOverlay('gameover', this.engine.getStats());
  }

  /**
   * Runs the fixed-rate game simulation for the elapsed real time.
   * @param {number} deltaSeconds - Real frame time in seconds.
   * @returns {void}
   */
  stepLogic(deltaSeconds) {
    const stepSeconds = 1 / CONFIG.gameplay.logicFps;
    if (this.engine.state !== 'playing') {
      this.input.poll();
      this.logicAccumulator = 0;
      return;
    }
    this.logicAccumulator += deltaSeconds;
    let steps = 0;
    while (this.logicAccumulator >= stepSeconds && steps < CONFIG.gameplay.maxLogicStepsPerFrame) {
      this.engine.tick(this.input.poll());
      this.logicAccumulator -= stepSeconds;
      steps++;
    }
    if (steps >= CONFIG.gameplay.maxLogicStepsPerFrame) this.logicAccumulator = 0;
  }

  /**
   * One iteration of the main loop: logic, effects, view sync, render.
   * @param {number} now - High-resolution timestamp from requestAnimationFrame.
   * @returns {void}
   */
  frame(now) {
    requestAnimationFrame(this.frame);
    const deltaSeconds = Math.min(0.05, (now - this.lastFrameTime) / 1000);
    this.lastFrameTime = now;
    this.elapsedSeconds += deltaSeconds;

    this.stepLogic(deltaSeconds);
    this.effects.update(deltaSeconds);
    this.audio.update(this.effects.stormLevel, deltaSeconds);
    this.boardView.update(deltaSeconds);
    this.hud.update(this.engine, deltaSeconds);
    this.graphics.render(deltaSeconds, this.elapsedSeconds);
  }
}

/* =====================================================================
 * SECTION 11 — BOOTSTRAP
 * ===================================================================== */

/**
 * Shows a fatal error message in the overlay card.
 * @param {string} message - Text to display.
 * @returns {void}
 */
function showFatalError(message) {
  document.getElementById('overlay-title').textContent = t('game.title');
  document.getElementById('overlay-message').textContent = message;
  document.getElementById('overlay-help').hidden = true;
  document.getElementById('overlay-button').hidden = true;
  document.getElementById('overlay').hidden = false;
}

/**
 * Entry point: validates the environment and starts the application.
 * @returns {void}
 */
function bootstrap() {
  setLocale('en');
  if (typeof THREE === 'undefined' || !THREE.EffectComposer || !THREE.Reflector) {
    document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = t(element.dataset.i18n); });
    showFatalError(t('error.noThree'));
    return;
  }
  try {
    new TetrisApp();
  } catch (error) {
    console.error(error);
    showFatalError(t('error.noWebGl'));
  }
}

bootstrap();

})();
</script>
