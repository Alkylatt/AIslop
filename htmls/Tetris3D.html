    gradeUniforms.time.value = time % 100;
    gradeUniforms.whiteout.value = impulses.whiteout;

    this.stage.flashLight.intensity = impulses.flash * graphics.flashLightMaxIntensity;
    this.renderer.shadowMap.needsUpdate = true;
    this.composer.render(deltaSeconds);
  }

  /**
   * Moves the two colored accent lights so reflections slowly shimmer.
   * @param {number} time - Elapsed time in seconds.
   * @returns {void}
   */
  animateLights(time) {
    const [cyan, magenta] = this.stage.orbitLights;
    cyan.position.set(-11 + Math.sin(time * 0.5) * 2.5, 12 + Math.sin(time * 0.37) * 5, 7 + Math.cos(time * 0.43) * 2);
    magenta.position.set(11 + Math.cos(time * 0.45) * 2.5, 8 + Math.cos(time * 0.33) * 5, 7 + Math.sin(time * 0.39) * 2);
  }
}

/* =====================================================================
 * SECTION 8 — VISUAL EFFECTS
 * ===================================================================== */

/** GPU-instanced billboard particles (sparks, sparkles, debris, splashes). */
class ParticleSystem {
  /**
   * Creates the pool and adds it to the scene.
   * @param {THREE.Scene} scene - Target scene.
   * @param {number} capacity - Maximum simultaneous particles.
   * @param {THREE.Texture} texture - Sprite texture.
   */
  constructor(scene, capacity, texture) {
    this.capacity = capacity;
    this.alive = 0;
    this.position = new Float32Array(capacity * 3);
    this.velocity = new Float32Array(capacity * 3);
    this.color = new Float32Array(capacity * 3);
    this.life = new Float32Array(capacity);
    this.maxLife = new Float32Array(capacity);
    this.size = new Float32Array(capacity);
    this.gravity = new Float32Array(capacity);
    this.drag = new Float32Array(capacity);
    this.twinkle = new Float32Array(capacity);
    this.dummy = new THREE.Object3D();
    this.scale = new THREE.Vector3();
    this.matrix = new THREE.Matrix4();

    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false });
    this.mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), material, capacity);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.setColorAt(0, new THREE.Color(1, 1, 1));
    this.mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.count = 0;
    scene.add(this.mesh);
  }

  /**
   * Spawns one particle (silently dropped when the pool is full).
   * @param {Object} p - Particle description.
   * @param {number} p.x - Start X. @param {number} p.y - Start Y. @param {number} p.z - Start Z.
   * @param {number} [p.vx] - Velocity X. @param {number} [p.vy] - Velocity Y. @param {number} [p.vz] - Velocity Z.
   * @param {THREE.Color} p.color - Base color (values above 1 allowed for glow).
   * @param {number} p.life - Lifetime in seconds. @param {number} p.size - World-space size.
   * @param {number} [p.gravity] - Vertical acceleration. @param {number} [p.drag] - Velocity damping per second.
   * @param {number} [p.twinkle] - 0..1 flicker amount.
   * @returns {void}
   */
  emit(p) {
    if (this.alive >= this.capacity) return;
    const i = this.alive++;
    this.position[i * 3] = p.x; this.position[i * 3 + 1] = p.y; this.position[i * 3 + 2] = p.z;
    this.velocity[i * 3] = p.vx || 0; this.velocity[i * 3 + 1] = p.vy || 0; this.velocity[i * 3 + 2] = p.vz || 0;
    this.color[i * 3] = p.color.r; this.color[i * 3 + 1] = p.color.g; this.color[i * 3 + 2] = p.color.b;
    this.life[i] = this.maxLife[i] = p.life;
    this.size[i] = p.size;
    this.gravity[i] = p.gravity || 0;
    this.drag[i] = p.drag || 0;
    this.twinkle[i] = p.twinkle || 0;
  }

  /**
   * Copies particle data from one slot to another (used for swap-remove).
   * @param {number} from - Source slot.
   * @param {number} to - Destination slot.
   * @returns {void}
   */
  copySlot(from, to) {
    for (let k = 0; k < 3; k++) {
      this.position[to * 3 + k] = this.position[from * 3 + k];
      this.velocity[to * 3 + k] = this.velocity[from * 3 + k];
      this.color[to * 3 + k] = this.color[from * 3 + k];
    }
    this.life[to] = this.life[from]; this.maxLife[to] = this.maxLife[from];
    this.size[to] = this.size[from]; this.gravity[to] = this.gravity[from];
    this.drag[to] = this.drag[from]; this.twinkle[to] = this.twinkle[from];
  }

  /**
   * Integrates particles and uploads instance data.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @param {THREE.Quaternion} cameraQuaternion - Used to face particles toward the camera.
   * @param {number} time - Elapsed time (drives twinkle).
   * @returns {void}
   */
  update(deltaSeconds, cameraQuaternion, time) {
    let i = 0;
    while (i < this.alive) {
      this.life[i] -= deltaSeconds;
      if (this.life[i] <= 0) { this.copySlot(this.alive - 1, i); this.alive--; continue; }
      const damping = Math.max(0, 1 - this.drag[i] * deltaSeconds);
      this.velocity[i * 3] *= damping;
      this.velocity[i * 3 + 1] = this.velocity[i * 3 + 1] * damping + this.gravity[i] * deltaSeconds;
      this.velocity[i * 3 + 2] *= damping;
      this.position[i * 3] += this.velocity[i * 3] * deltaSeconds;
      this.position[i * 3 + 1] += this.velocity[i * 3 + 1] * deltaSeconds;
      this.position[i * 3 + 2] += this.velocity[i * 3 + 2] * deltaSeconds;
      i++;
    }
    const colorArray = this.mesh.instanceColor.array;
    const matrixArray = this.mesh.instanceMatrix.array;
    for (let n = 0; n < this.alive; n++) {
      const fade = this.life[n] / this.maxLife[n];
      const flicker = this.twinkle[n] > 0 ? 1 - this.twinkle[n] * (0.5 + 0.5 * Math.sin(time * 38 + n * 1.9)) : 1;
      const brightness = fade * flicker;
      colorArray[n * 3] = this.color[n * 3] * brightness;
      colorArray[n * 3 + 1] = this.color[n * 3 + 1] * brightness;
      colorArray[n * 3 + 2] = this.color[n * 3 + 2] * brightness;
      const scale = this.size[n] * (0.35 + 0.65 * fade);
      this.dummy.position.set(this.position[n * 3], this.position[n * 3 + 1], this.position[n * 3 + 2]);
      this.matrix.compose(this.dummy.position, cameraQuaternion, this.scale.set(scale, scale, scale));
      this.matrix.toArray(matrixArray, n * 16);
    }
    this.mesh.count = this.alive;
    this.mesh.instanceMatrix.needsUpdate = true;
    this.mesh.instanceColor.needsUpdate = true;
  }
}

/** Pool of additive meshes that scale and fade over a short duration (beams, flashes, shockwave rings). */
class TimedMeshPool {
  /**
   * Creates the pool.
   * @param {THREE.Scene} scene - Target scene.
   * @param {THREE.BufferGeometry} geometry - Shared geometry for all items.
   * @param {THREE.Texture|null} texture - Optional sprite texture.
   * @param {number} size - Number of pooled meshes.
   */
  constructor(scene, geometry, texture, size) {
    this.items = [];
    this.cursor = 0;
    for (let i = 0; i < size; i++) {
      const material = new THREE.MeshBasicMaterial({
        map: texture, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
        depthWrite: false, fog: false, toneMapped: false, side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.visible = false;
      scene.add(mesh);
      this.items.push({ mesh, age: 0, duration: 1, from: [1, 1], to: [1, 1], peak: 1, active: false });
    }
  }

  /**
   * Starts an animated item (reuses the oldest slot if all are busy).
   * @param {Object} o - Item description.
   * @param {number[]} o.position - [x, y, z]. @param {number[]} o.from - Start [scaleX, scaleY].
   * @param {number[]} o.to - End [scaleX, scaleY]. @param {THREE.Color} o.color - Tint (may exceed 1 for glow).
   * @param {number} o.duration - Seconds. @param {number} o.peak - Starting opacity.
   * @returns {void}
   */
  spawn(o) {
    const item = this.items.find((candidate) => !candidate.active) || this.items[this.cursor++ % this.items.length];
    item.active = true; item.age = 0; item.duration = o.duration;
    item.from = o.from; item.to = o.to; item.peak = o.peak;
    item.mesh.material.color.copy(o.color);
    item.mesh.position.set(o.position[0], o.position[1], o.position[2]);
    item.mesh.scale.set(o.from[0], o.from[1], 1);
    item.mesh.visible = true;
  }

  /**
   * Advances all active items.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  update(deltaSeconds) {
    this.items.forEach((item) => {
      if (!item.active) return;
      item.age += deltaSeconds;
      const progress = item.age / item.duration;
      if (progress >= 1) { item.active = false; item.mesh.visible = false; return; }
      const eased = 1 - Math.pow(1 - progress, 3);
      item.mesh.scale.set(lerp(item.from[0], item.to[0], eased), lerp(item.from[1], item.to[1], eased), 1);
      item.mesh.material.opacity = item.peak * Math.pow(1 - progress, 1.5);
    });
  }
}

/** Falling rain streaks with splashes on the reflective floor. */
class RainSystem {
  /**
   * Creates the rain field.
   * @param {THREE.Scene} scene - Target scene.
   * @param {Object} rainConfig - CONFIG.effects.rain.
   * @param {THREE.Texture} texture - Streak sprite texture.
   * @param {ParticleSystem} particles - Used to spawn splashes.
   * @param {Object} stormConfig - CONFIG.effects.storm.
   */
  constructor(scene, rainConfig, texture, particles, stormConfig) {
    this.config = rainConfig;
    this.stormConfig = stormConfig;
    this.currentWind = rainConfig.slant;
    this.particles = particles;
    this.dummy = new THREE.Object3D();
    this.splashColor = new THREE.Color(0.55, 0.75, 1.4);
    const count = rainConfig.maxDrops;
    this.drops = Array.from({ length: count }, () => this.createDrop(true));
    const material = new THREE.MeshBasicMaterial({ map: texture, color: 0x9cbcff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false });
    this.material = material;
    this.mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), material, count);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }

  /**
   * Creates a raindrop at a random position.
   * @param {boolean} randomHeight - If true, spread vertically (initial fill); otherwise start at the top.
   * @returns {{x:number,y:number,z:number,speed:number,length:number}} New drop.
   */
  createDrop(randomHeight) {
    const c = this.config;
    return {
      x: randomRange(-c.areaHalfWidth, c.areaHalfWidth),
      y: randomHeight ? randomRange(c.floorY, c.topY) : c.topY + randomRange(0, 6),
      z: randomRange(c.zMin, c.zMax),
      speed: randomRange(c.speedMin, c.speedMax),
      length: randomRange(c.lengthMin, c.lengthMax),
    };
  }

  /**
   * Moves drops, recycles those that hit the floor and spawns splashes. As the storm level
   * rises there are more drops, they fall faster, get longer and thicker, and are blown sideways by gusting wind.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @param {number} userAmount - 0..1 user rain-intensity multiplier from settings.
   * @param {number} stormLevel - 0 (drizzle) .. 1 (hurricane) from the current combo chain.
   * @param {number} time - Elapsed time in seconds (drives wind gusts).
   * @returns {void}
   */
  update(deltaSeconds, userAmount, stormLevel, time) {
    const c = this.config;
    const s = this.stormConfig;
    const dropFraction = lerp(s.calmDropFraction, 1, stormLevel) * clamp(userAmount, 0, 1);
    const visibleCount = Math.floor(this.drops.length * dropFraction);
    const speedScale = lerp(1, s.speedMultiplierMax, stormLevel);
    const gust = 1 + s.gustStrength * stormLevel * Math.sin(time * s.gustFrequency * 2.1) * Math.sin(time * s.gustFrequency * 0.7 + 1.3);
    const wind = lerp(c.slant, s.slantMax, stormLevel) * gust;
    const thickness = 0.05 * lerp(1, s.thicknessMultiplierMax, stormLevel);
    const lengthScale = lerp(1, s.lengthMultiplierMax, stormLevel);
    const splashChance = lerp(c.splashChance, s.splashChanceMax, stormLevel);
    this.currentWind = wind;
    this.material.opacity = lerp(s.opacityMin, s.opacityMax, stormLevel);
    for (let i = 0; i < visibleCount; i++) {
      const drop = this.drops[i];
      const fallSpeed = drop.speed * speedScale;
      drop.y -= fallSpeed * deltaSeconds;
      drop.x += wind * deltaSeconds;
      if (drop.x > c.areaHalfWidth) drop.x -= 2 * c.areaHalfWidth;
      if (drop.y < c.floorY) {
        if (Math.random() < splashChance && drop.z > -6 && Math.abs(drop.x) < c.areaHalfWidth) this.spawnSplash(drop);
        Object.assign(drop, this.createDrop(false));
      }
      this.dummy.position.set(drop.x, drop.y, drop.z);
      this.dummy.rotation.set(0, 0, Math.atan2(wind, fallSpeed));
      this.dummy.scale.set(thickness, drop.length * lengthScale, 1);
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(i, this.dummy.matrix);
    }
    this.mesh.count = visibleCount;
    this.mesh.instanceMatrix.needsUpdate = true;
  }

  /**
   * Emits a couple of tiny droplets where a raindrop hit the floor.
   * @param {{x:number, z:number}} drop - The drop that landed.
   * @returns {void}
   */
  spawnSplash(drop) {
    for (let k = 0; k < 2; k++) {
      this.particles.emit({
        x: drop.x, y: this.config.floorY + 0.05, z: drop.z,
        vx: randomRange(-1.5, 1.5), vy: randomRange(2, 4.5), vz: randomRange(-1.5, 1.5),
        color: this.splashColor, life: 0.35, size: 0.14, gravity: -14,
      });
    }
  }
}

/**
 * Translates game events into particles, flashes, shockwaves, camera shake
 * and post-processing impulses. Contains no gameplay logic.
 */
class EffectsDirector extends EventEmitter {
  /**
   * Creates the director and its pools.
   * @param {Object} deps - Collaborators.
   * @param {GraphicsEngine} deps.graphics - Graphics pipeline (scene and camera rig).
   * @param {BoardLayout} deps.layout - Board layout.
   * @param {GameEngine} deps.engine - Engine (read-only, for ambient sparkles).
   * @param {Object} deps.config - The CONFIG object.
   * @param {Object<string, number>} deps.settings - Runtime settings.
   * @param {{bloom:number, flash:number, chromaticAberration:number}} deps.impulses - Shared post-fx impulses.
   */
  constructor({ graphics, layout, engine, config, settings, impulses }) {
    super();
    this.graphics = graphics;
    this.layout = layout;
    this.engine = engine;
    this.config = config;
    this.settings = settings;
    this.impulses = impulses;
    this.cameraRig = graphics.cameraRig;
    this.time = 0;
    this.sparkleClock = 0;
    this.scheduledCalls = [];
    this.scratchVector = new THREE.Vector3();
    this.colorCache = new Map();

    const glowTexture = createGlowTexture();
    const scene = graphics.scene;
    this.particles = new ParticleSystem(scene, config.effects.particleCapacity, glowTexture);
    this.rain = new RainSystem(scene, config.effects.rain, glowTexture, this.particles, config.effects.storm);
    this.stormLevel = 0;
    this.lightningCountdown = 0;
    this.mistClock = 0;
    this.nuclear = null;              // state of the running nuclear sequence, or null
    this.slowMotionAge = Infinity;    // seconds since the last slow-motion trigger (Infinity = none)
    this.timeScale = 1;               // visual time scale (below 1 during slow motion)
    this.nuclearColor = new THREE.Color();
    this.groundRings = new TimedMeshPool(scene, new THREE.RingGeometry(0.9, 1, 96), null, 2);
    this.groundRings.items.forEach((item) => { item.mesh.rotation.x = -Math.PI / 2; });
    this.beams = new TimedMeshPool(scene, new THREE.PlaneGeometry(1, 1), glowTexture, 24);
    this.rings = new TimedMeshPool(scene, new THREE.RingGeometry(0.9, 1, 72), null, 6);
  }

  /**
   * Returns a cached THREE.Color for a hex value, optionally brightened for HDR glow.
   * @param {number} hex - Base color.
   * @param {number} [gain] - Brightness multiplier.
   * @returns {THREE.Color} Shared color (do not mutate).
   */
  getColor(hex, gain = 1) {
    const key = `${hex}:${gain}`;
    if (!this.colorCache.has(key)) this.colorCache.set(key, new THREE.Color(hex).multiplyScalar(gain));
    return this.colorCache.get(key);
  }

  /**
   * Adds camera shake scaled by the user's shake setting inside the rig.
   * @param {number} amount - Trauma amount.
   * @returns {void}
   */
  shake(amount) { this.cameraRig.addTrauma(amount); }

  /**
   * Runs a function after a delay (driven by update()).
   * @param {number} delaySeconds - Delay.
   * @param {function(): void} callback - Function to run.
   * @returns {void}
   */
  schedule(delaySeconds, callback) {
    this.scheduledCalls.push({ time: this.time + delaySeconds, callback });
  }

  /**
   * Reacts to a piece locking: tiny sparkle and thud.
   * @param {{type:string, cells:Array<{x:number,y:number}>}} event - Lock event.
   * @returns {void}
   */
  handleLock(event) {
    this.shake(this.config.effects.shake.lock);
    const color = this.getColor(this.config.pieceColors[event.type], 1.6);
    event.cells.forEach((cell) => {
      this.layout.gridToWorld(cell.x, cell.y, this.scratchVector);
      for (let i = 0; i < 2; i++) {
        this.particles.emit({
          x: this.scratchVector.x, y: this.scratchVector.y, z: 0.55,
          vx: randomRange(-1.5, 1.5), vy: randomRange(-0.5, 2), vz: randomRange(0.2, 1.2),
          color, life: randomRange(0.25, 0.45), size: 0.28, drag: 2, twinkle: 0.6,
        });
      }
    });
  }

  /**
   * Reacts to a hard drop: light trails down each column and an impact spray.
   * @param {{type:string, fromCells:Array<{x:number,y:number}>, toCells:Array<{x:number,y:number}>, distance:number}} event - Drop event.
   * @returns {void}
   */
  handleHardDrop(event) {
    const shakeConfig = this.config.effects.shake;
    this.shake(Math.min(shakeConfig.hardDropBase + event.distance * shakeConfig.hardDropPerCell, shakeConfig.hardDropMax));
    const color = this.getColor(this.config.pieceColors[event.type], 2.2);
    const topByColumn = new Map();
    event.fromCells.forEach((cell) => topByColumn.set(cell.x, Math.min(topByColumn.get(cell.x) ?? Infinity, cell.y)));
    const bottomByColumn = new Map();
    event.toCells.forEach((cell) => bottomByColumn.set(cell.x, Math.max(bottomByColumn.get(cell.x) ?? -Infinity, cell.y)));

    bottomByColumn.forEach((bottomRow, column) => {
      if (event.distance > 0) {
        const topY = this.layout.gridToWorld(column, topByColumn.get(column), this.scratchVector).y;
        const bottomY = this.layout.gridToWorld(column, bottomRow, this.scratchVector).y;
        this.beams.spawn({
          position: [this.layout.gridToWorld(column, 0, this.scratchVector).x, (topY + bottomY) / 2, 0.2],
          from: [1.2, topY - bottomY + 1.4], to: [0.2, topY - bottomY + 1.4], color, duration: 0.28, peak: 0.55,
        });
      }
      this.layout.gridToWorld(column, bottomRow, this.scratchVector);
      for (let i = 0; i < 9; i++) {
        this.particles.emit({
          x: this.scratchVector.x + randomRange(-0.4, 0.4), y: this.scratchVector.y - 0.45, z: 0.4,
          vx: randomRange(-5, 5), vy: randomRange(1, 6), vz: randomRange(-1, 2),
          color, life: randomRange(0.25, 0.6), size: 0.26, gravity: -18, twinkle: 0.4,
        });
      }
    });
  }

  /**
   * Reacts to line clears: debris from every cleared cell, row flashes and, for
   * quads and T-spin doubles/triples, a full explosion.
   * @param {{lines:number, tSpin:string, rows:Array<{row:number, types:Array<string|null>}>, explosive:boolean}} result - Clear event.
   * @returns {void}
   */
  handleLinesCleared(result) {
    const shakeConfig = this.config.effects.shake;
    const lineClear = this.config.effects.lineClear;
    if (result.lines === 0) { this.shake(shakeConfig.lock * 2); return; }

    this.shake(result.lines * shakeConfig.lineClearPerLine);
    this.impulses.bloom = Math.max(this.impulses.bloom, 0.25 * result.lines);
    this.graphics.stage.flashLight.color.set(0xffc880);
    this.impulses.flash = Math.max(this.impulses.flash, 0.12 * result.lines);

    let centerY = 0;
    result.rows.forEach((rowInfo) => {
      centerY += this.layout.gridToWorld(0, rowInfo.row, this.scratchVector).y / result.rows.length;
      this.beams.spawn({
        position: [0, this.layout.gridToWorld(0, rowInfo.row, this.scratchVector).y, 0.7],
        from: [this.layout.columns + 1, 1.1], to: [this.layout.columns + 5, 0.08],
        color: this.getColor(0xdff4ff, 2.4), duration: 0.4, peak: 0.9,
      });
      rowInfo.types.forEach((type, column) => {
        if (!type) return;
        const color = this.getColor(this.config.pieceColors[type], 2);
        this.layout.gridToWorld(column, rowInfo.row, this.scratchVector);
        for (let i = 0; i < lineClear.particlesPerCell; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = randomRange(lineClear.speedMin, lineClear.speedMax);
          this.particles.emit({
            x: this.scratchVector.x, y: this.scratchVector.y, z: randomRange(-0.2, 0.6),
            vx: Math.cos(angle) * speed, vy: Math.abs(Math.sin(angle)) * speed * 0.8 + 1, vz: randomRange(0, speed * 0.4),
            color, life: randomRange(0.5, 1.1), size: randomRange(0.22, 0.5), gravity: lineClear.gravity, drag: 0.8, twinkle: 0.5,
          });
        }
      });
    });

    if (result.perfectClear) this.triggerNuclearExplosion();
    else if (result.explosive) this.triggerExplosion(centerY, result.tSpin === 'full' ? 'tSpin' : 'quad');
  }

  /**
   * Fires the big explosion: shockwave rings, radial burst, flash, bloom and heavy shake.
   * @param {number} centerY - World Y of the explosion center.
   * @param {'quad'|'tSpin'} style - Chooses the color palette and shake strength.
   * @returns {void}
   */
  triggerExplosion(centerY, style) {
    const explosion = this.config.effects.explosion;
    const palette = explosion.palettes[style];
    this.shake(style === 'tSpin' ? this.config.effects.shake.tSpin : this.config.effects.shake.quad);
    this.graphics.stage.flashLight.color.set(0xffc880);
    this.impulses.flash = explosion.flash;
    this.impulses.bloom = explosion.bloom;
    this.impulses.chromaticAberration = explosion.chromaticAberration;

    explosion.ringDurations.forEach((duration, index) => {
      this.rings.spawn({
        position: [0, centerY, 1.2], from: [1, 1], to: [explosion.ringMaxScale * (1 - index * 0.25), explosion.ringMaxScale * (1 - index * 0.25)],
        color: this.getColor(palette[index % palette.length], 2.4), duration, peak: 0.9,
      });
    });
    this.emitRadialBurst(0, centerY, explosion.particleCount, palette);
    for (let i = 0; i < explosion.secondaryBursts; i++) {
      this.schedule(0.18 + i * 0.16, () => {
        this.emitRadialBurst(randomRange(-4, 4), centerY + randomRange(-5, 5), 110, palette);
        this.shake(0.25);
        this.impulses.flash = Math.max(this.impulses.flash, 0.4);
      });
    }
  }

  /**
   * Emits particles flying outward from a point.
   * @param {number} x - World X. @param {number} y - World Y.
   * @param {number} count - Number of particles.
   * @param {number[]} palette - Hex colors to pick from.
   * @returns {void}
   */
  emitRadialBurst(x, y, count, palette) {
    const explosion = this.config.effects.explosion;
    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(randomRange(-1, 1));
      const speed = randomRange(explosion.speedMin, explosion.speedMax);
      this.particles.emit({
        x, y, z: 1,
        vx: Math.sin(phi) * Math.cos(theta) * speed, vy: Math.sin(phi) * Math.sin(theta) * speed, vz: Math.cos(phi) * speed * 0.8,
        color: this.getColor(palette[i % palette.length], randomRange(1.4, 2.8)),
        life: randomRange(0.7, 1.7), size: randomRange(0.25, 0.7), gravity: -9, drag: 1.4, twinkle: 0.5,
      });
    }
  }

  /**
   * Reacts to game over with a dull red burst along the stack.
   * @returns {void}
   */
  handleGameOver() {
    this.shake(this.config.effects.shake.gameOver);
    const color = this.getColor(0xff4a5c, 1.8);
    for (let i = 0; i < 160; i++) {
      this.particles.emit({
        x: randomRange(-5, 5), y: randomRange(0, 20), z: 0.6,
        vx: randomRange(-2, 2), vy: randomRange(1, 6), vz: randomRange(0, 2),
        color, life: randomRange(0.6, 1.4), size: randomRange(0.2, 0.45), gravity: -6, twinkle: 0.5,
      });
    }
  }

  /**
   * Adds twinkles on random locked blocks so the metal feels alive.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  updateAmbientSparkles(deltaSeconds) {
    this.sparkleClock += deltaSeconds;
    if (this.sparkleClock < this.config.effects.sparkleIntervalSeconds) return;
    this.sparkleClock = 0;
    const { cells } = this.engine.board;
    for (let attempt = 0; attempt < 12; attempt++) {
      const row = Math.floor(Math.random() * cells.length);
      const column = Math.floor(Math.random() * this.layout.columns);
      const type = cells[row][column];
      if (!type) continue;
      this.layout.gridToWorld(column, row, this.scratchVector);
      this.particles.emit({
        x: this.scratchVector.x + randomRange(-0.35, 0.35), y: this.scratchVector.y + randomRange(-0.35, 0.35), z: 0.5,
        color: this.getColor(0xffffff, 2.4), life: 0.55, size: 0.55, twinkle: 0.9,
      });
      break;
    }
  }

  /**
   * Converts the current combo chain (consecutive piece drops that each cleared a line) into a
   * smoothed storm level and drives rain, wind spray, lightning and camera buffeting from it.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  updateStorm(deltaSeconds) {
    const storm = this.config.effects.storm;
    const chain = Math.max(0, this.engine.stats.combo + 1);
    const target = clamp(chain / storm.chainForMaxStorm, 0, 1);
    const rate = target > this.stormLevel ? storm.riseRatePerSecond : storm.fallRatePerSecond;
    this.stormLevel = target > this.stormLevel
      ? Math.min(target, this.stormLevel + rate * deltaSeconds)
      : Math.max(target, this.stormLevel - rate * deltaSeconds);

    this.rain.update(deltaSeconds, this.settings.rainAmount, this.stormLevel, this.time);
    this.updateWindSpray(deltaSeconds);
    this.updateLightning(deltaSeconds);
    if (this.stormLevel > storm.cameraBuffetStartLevel && !this.cameraRig.frozen) {
      const buffet = ((this.stormLevel - storm.cameraBuffetStartLevel) / (1 - storm.cameraBuffetStartLevel)) * storm.cameraBuffetMaxTrauma;
      if (this.cameraRig.trauma < buffet) this.cameraRig.trauma = buffet;
    }
  }

  /**
   * Emits faint wind-driven spray streaming across the screen during heavy storms.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  updateWindSpray(deltaSeconds) {
    const storm = this.config.effects.storm;
    if (this.stormLevel <= storm.mistStartLevel) return;
    const strength = (this.stormLevel - storm.mistStartLevel) / (1 - storm.mistStartLevel);
    this.mistClock += deltaSeconds * storm.mistParticlesPerSecondAtMax * strength;
    const wind = this.rain.currentWind;
    while (this.mistClock >= 1) {
      this.mistClock -= 1;
      this.particles.emit({
        x: randomRange(-24, 10), y: randomRange(0, 26), z: randomRange(-8, 10),
        vx: wind * randomRange(1.1, 1.7), vy: randomRange(-2, 1), vz: 0,
        color: this.getColor(0x9cc0ff, 0.35), life: randomRange(0.5, 0.9), size: randomRange(1.2, 3),
      });
    }
  }

  /**
   * Counts down to the next lightning strike; strikes get more frequent as the storm grows.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  updateLightning(deltaSeconds) {
    const lightning = this.config.effects.storm.lightning;
    if (this.stormLevel < lightning.startLevel) { this.lightningCountdown = lightning.intervalSecondsAtStart; return; }
    this.lightningCountdown -= deltaSeconds;
    if (this.lightningCountdown > 0) return;
    const strength = (this.stormLevel - lightning.startLevel) / (1 - lightning.startLevel);
    this.lightningCountdown = lerp(lightning.intervalSecondsAtStart, lightning.intervalSecondsAtMax, strength) * randomRange(0.6, 1.4);
    this.strikeLightning(strength);
  }

  /**
   * Produces a double-flicker lightning flash with a thunder shake.
   * @param {number} strength - 0..1 storm strength past the lightning threshold.
   * @returns {void}
   */
  strikeLightning(strength) {
    const lightning = this.config.effects.storm.lightning;
    const light = this.graphics.stage.flashLight;
    light.color.set(0xbfd8ff);
    light.position.x = randomRange(-10, 10);
    const flash = lightning.flash * (0.6 + 0.4 * strength);
    this.impulses.flash = Math.max(this.impulses.flash, flash);
    this.impulses.bloom = Math.max(this.impulses.bloom, lightning.bloom * (0.5 + 0.5 * strength));
    this.shake(0.05 + lightning.shake * strength);
    this.schedule(0.11, () => { this.impulses.flash = Math.max(this.impulses.flash, flash * 0.8); });
    this.emit('lightning', { strength });
  }

  /**
   * Computes the visual time scale: slow motion right after a nuclear blast, easing back to normal speed.
   * @param {number} deltaSeconds - Real frame time in seconds.
   * @returns {number} Scale to multiply effect time with (1 = normal).
   */
  updateTimeScale(deltaSeconds) {
    const slow = this.config.effects.nuclear.slowMotion;
    this.slowMotionAge += deltaSeconds;
    const ramp = clamp((this.slowMotionAge - slow.holdSeconds) / slow.rampSeconds, 0, 1);
    this.timeScale = lerp(slow.scale, 1, ramp);
    return this.timeScale;
  }

  /**
   * Returns a fire color between white-hot (heat 1) and deep red (heat 0), reusing one shared Color.
   * @param {number} heat - 0..1 temperature. @param {number} brightness - Overall brightness multiplier.
   * @returns {THREE.Color} Shared color (copy its values immediately).
   */
  getFireColor(heat, brightness) {
    return this.nuclearColor.setRGB(lerp(0.6, 1.7, heat) * brightness, lerp(0.12, 0.85, heat) * brightness, lerp(0.05, 0.3, heat) * brightness);
  }

  /**
   * Starts the cinematic nuclear explosion (perfect clear): white-out flash, slow motion, fireball,
   * ground and dome shockwaves, flying debris and a rising mushroom cloud. The camera is frozen
   * (no shake, sway or movement) until the blast is over.
   * Emits "nuclear" so the audio and UI can join in.
   * @returns {void}
   */
  triggerNuclearExplosion() {
    const n = this.config.effects.nuclear;
    const floorY = this.config.effects.rain.floorY;
    this.nuclear = { age: 0, stemCarry: 0, capCarry: 0 };
    this.slowMotionAge = 0;
    this.graphics.stage.flashLight.color.set(0xfff0d0);
    this.impulses.whiteout = n.whiteout;
    this.impulses.flash = n.flash;
    this.impulses.bloom = n.bloom;
    this.impulses.chromaticAberration = n.chromaticAberration;
    this.cameraRig.setFrozen(true); // the camera stays perfectly still for the whole blast

    const radius = n.fireball.radius;
    this.beams.spawn({ position: [0, n.fireball.y, 1.5], from: [2, 2], to: [radius * 2.2, radius * 2.2], color: this.getColor(0xffe9b0, 3.2), duration: n.fireball.seconds, peak: 1 });
    this.beams.spawn({ position: [0, n.fireball.y + 2, 1.2], from: [4, 4], to: [radius * 3.4, radius * 3.4], color: this.getColor(0xff6a1a, 2.2), duration: n.fireball.seconds * 1.4, peak: 0.8 });
    this.groundRings.spawn({ position: [0, floorY + 0.05, 0], from: [1, 1], to: [n.groundRing.maxScale, n.groundRing.maxScale], color: this.getColor(0xffc890, 2.4), duration: n.groundRing.seconds, peak: 0.9 });
    this.rings.spawn({ position: [0, n.fireball.y, 2], from: [1, 1], to: [n.domeRing.maxScale, n.domeRing.maxScale], color: this.getColor(0xffffff, 2.6), duration: n.domeRing.seconds, peak: 0.9 });

    for (let i = 0; i < n.debrisCount; i++) {
      this.particles.emit({
        x: randomRange(-3, 3), y: floorY + 0.5, z: randomRange(-2, 2),
        vx: randomRange(-9, 9), vy: randomRange(8, 30), vz: randomRange(-7, 7),
        color: this.getColor(0xff9a3c, randomRange(1.2, 2.6)),
        life: randomRange(0.9, 2.2), size: randomRange(0.3, 0.8), gravity: -14, drag: 0.3, twinkle: 0.5,
      });
    }
    this.emit('nuclear', { duration: n.durationSeconds });
  }

  /**
   * Drives the running nuclear sequence: a rising stem of fire from the floor and an expanding
   * mushroom cap on top of it, emitted over time.
   * @param {number} deltaSeconds - Time-scaled frame time in seconds.
   * @returns {void}
   */
  updateNuclear(deltaSeconds) {
    const state = this.nuclear;
    if (!state) return;
    const n = this.config.effects.nuclear;
    const floorY = this.config.effects.rain.floorY;
    state.age += deltaSeconds;
    if (state.age > n.durationSeconds) { this.nuclear = null; this.cameraRig.setFrozen(false); return; }

    const { stem, cap } = n;
    if (state.age >= stem.startSeconds && state.age <= stem.endSeconds) {
      const heat = 1 - (state.age - stem.startSeconds) / (stem.endSeconds - stem.startSeconds);
      state.stemCarry += deltaSeconds * stem.particlesPerSecond;
      while (state.stemCarry >= 1) {
        state.stemCarry -= 1;
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()) * stem.radius;
        this.particles.emit({
          x: Math.cos(angle) * radius, y: floorY + 0.3 + Math.random() * 1.5, z: Math.sin(angle) * radius,
          vx: Math.cos(angle) * randomRange(0, 1.5), vy: randomRange(stem.riseSpeedMin, stem.riseSpeedMax), vz: Math.sin(angle) * randomRange(0, 1.5),
          color: this.getFireColor(heat, 0.7), life: randomRange(1.2, 2), size: randomRange(2.5, 4.5), drag: 0.5,
        });
      }
    }
    if (state.age >= cap.startSeconds && state.age <= cap.endSeconds) {
      const progress = (state.age - cap.startSeconds) / (cap.endSeconds - cap.startSeconds);
      const capY = floorY + 3 + cap.riseHeight * (1 - Math.pow(1 - progress, 2));
      const capRadius = lerp(cap.startRadius, cap.endRadius, progress);
      state.capCarry += deltaSeconds * cap.particlesPerSecond;
      while (state.capCarry >= 1) {
        state.capCarry -= 1;
        const angle = Math.random() * Math.PI * 2;
        const onRim = Math.random() < 0.6; // the rim curls outward and down, forming the mushroom shape
        const radius = onRim ? capRadius * randomRange(0.75, 1) : Math.sqrt(Math.random()) * capRadius;
        const outward = onRim ? randomRange(1, 3) : randomRange(0.5, 2);
        this.particles.emit({
          x: Math.cos(angle) * radius, y: capY + randomRange(-1.5, 1.5), z: Math.sin(angle) * radius * 0.35,
          vx: Math.cos(angle) * outward, vy: onRim ? -randomRange(0.5, 3) : randomRange(0.5, 3), vz: Math.sin(angle) * outward * 0.35,
          color: this.getFireColor(1 - progress * 0.6, 1.1), life: randomRange(1, 1.8), size: randomRange(3, 6), drag: 1,
        });
      }
    }
  }

  /**
   * Advances every effect. Call once per rendered frame.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  update(deltaSeconds) {
    this.time += deltaSeconds;
    const decay = this.config.effects.impulseDecayPerSecond;
    this.impulses.bloom = Math.max(0, this.impulses.bloom - decay.bloom * deltaSeconds);
    this.impulses.flash = Math.max(0, this.impulses.flash - decay.flash * deltaSeconds);
    this.impulses.chromaticAberration = Math.max(0, this.impulses.chromaticAberration - decay.chromaticAberration * 0.01 * deltaSeconds);
    this.impulses.whiteout = Math.max(0, this.impulses.whiteout - decay.whiteout * deltaSeconds);

    this.scheduledCalls = this.scheduledCalls.filter((call) => {
      if (call.time > this.time) return true;
      call.callback();
      return false;
    });
    this.updateAmbientSparkles(deltaSeconds);
    const effectDelta = deltaSeconds * this.updateTimeScale(deltaSeconds);
    this.updateStorm(effectDelta);
    this.updateNuclear(effectDelta);
    this.beams.update(effectDelta);
    this.rings.update(effectDelta);
    this.groundRings.update(effectDelta);
    this.particles.update(effectDelta, this.graphics.camera.quaternion, this.time);
  }
}

/* =====================================================================
 * SECTION 8B — AUDIO
 * Procedurally synthesised sound (no audio files): ambient rain that follows the storm level,
 * thunder, and pitch-laddered line-clear chimes.
 * ===================================================================== */

/** Synthesises all game audio with the Web Audio API. */
class AudioEngine {
  /**
   * Creates the engine. No audio context exists until unlock() is called from a user gesture.
   * @param {Object} config - The CONFIG object (reads config.audio).
   * @param {Object<string, number>} settings - Runtime settings (reads rainVolume and effectsVolume).
   */
  constructor(config, settings) {
    this.config = config.audio;
    this.settings = settings;
    this.context = null;
    this.masterGain = null;
    this.effectsBus = null;
    this.reverbSend = null;
    this.rainBus = null;
    this.noiseBuffer = null;
    this.rainLayers = null;
    this.suppressNextLock = false; // a hard drop already plays its own impact, so its lock thud is skipped
    this.updateClock = 0;
  }

  /**
   * Creates (first call) and resumes the audio context. Browsers only allow audio after a user gesture,
   * so call this from key/pointer handlers. Safe to call repeatedly.
   * @returns {void}
   */
  unlock() {
    if (!this.context) {
      const ContextClass = window.AudioContext || window.webkitAudioContext;
      if (!ContextClass) return;
      this.context = new ContextClass();
      this.buildGraph();
    }
    if (this.context.state === 'suspended') this.context.resume();
  }

  /**
   * Suspends or resumes audio (used when the tab is hidden).
   * @param {boolean} suspended - True to suspend.
   * @returns {void}
   */
  setSuspended(suspended) {
    if (!this.context) return;
    if (suspended) this.context.suspend();
    else this.context.resume();
  }

  /** Builds the mixer: master gain, compressed effects bus with reverb, and the rain bus. @returns {void} */
  buildGraph() {
    const context = this.context;
    this.masterGain = context.createGain();
    this.masterGain.gain.value = this.config.masterVolume;
    this.masterGain.connect(context.destination);

    const compressor = context.createDynamicsCompressor();
    compressor.connect(this.masterGain);
    this.effectsBus = context.createGain();
    this.effectsBus.gain.value = this.settings.effectsVolume;
    this.effectsBus.connect(compressor);

    this.reverbSend = context.createGain();
    this.reverbSend.gain.value = this.config.reverbAmount;
    const convolver = context.createConvolver();
    convolver.buffer = this.createReverbImpulse(this.config.reverbSeconds);
    this.reverbSend.connect(convolver);
    convolver.connect(this.effectsBus);

    this.noiseBuffer = this.createNoiseBuffer(4);
    this.buildRainLayers();
  }

  /**
   * Creates a buffer of white noise.
   * @param {number} seconds - Buffer length.
   * @returns {AudioBuffer} Mono noise buffer.
   */
  createNoiseBuffer(seconds) {
    const buffer = this.context.createBuffer(1, Math.floor(this.context.sampleRate * seconds), this.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  /**
   * Creates a decaying-noise impulse response for a simple room reverb.
   * @param {number} seconds - Reverb tail length.
   * @returns {AudioBuffer} Stereo impulse response.
   */
  createReverbImpulse(seconds) {
    const length = Math.floor(this.context.sampleRate * seconds);
    const buffer = this.context.createBuffer(2, length, this.context.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
    }
    return buffer;
  }

  /**
   * Starts a looping noise source at a random offset.
   * @returns {AudioBufferSourceNode} The running source (not yet connected).
   */
  createLoopingNoise() {
    const source = this.context.createBufferSource();
    source.buffer = this.noiseBuffer;
    source.loop = true;
    source.start(0, Math.random() * 2);
    return source;
  }

  /** Builds the three continuous rain layers: hiss, low body and wind. @returns {void} */
  buildRainLayers() {
    const context = this.context;
    this.rainBus = context.createGain();
    this.rainBus.gain.value = 0;
    this.rainBus.connect(this.masterGain);

    const hissHigh = context.createBiquadFilter();
    hissHigh.type = 'highpass';
    hissHigh.frequency.value = 1400;
    const hissLow = context.createBiquadFilter();
    hissLow.type = 'lowpass';
    hissLow.frequency.value = this.config.rain.calmBrightnessHz;
    const hissGain = context.createGain();
    hissGain.gain.value = 0;
    this.createLoopingNoise().connect(hissHigh);
    hissHigh.connect(hissLow);
    hissLow.connect(hissGain);
    hissGain.connect(this.rainBus);

    const bodyFilter = context.createBiquadFilter();
    bodyFilter.type = 'bandpass';
    bodyFilter.frequency.value = 650;
    bodyFilter.Q.value = 0.7;
    const bodyGain = context.createGain();
    bodyGain.gain.value = 0;
    this.createLoopingNoise().connect(bodyFilter);
    bodyFilter.connect(bodyGain);
    bodyGain.connect(this.rainBus);

    const windFilter = context.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 300;
    windFilter.Q.value = 1.4;
    const windGain = context.createGain();
    windGain.gain.value = 0;
    this.createLoopingNoise().connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(this.rainBus);
    const windLfo = context.createOscillator();
    windLfo.frequency.value = 0.13;
    const windLfoDepth = context.createGain();
    windLfoDepth.gain.value = 160;
    windLfo.connect(windLfoDepth);
    windLfoDepth.connect(windFilter.frequency);
    windLfo.start();

    this.rainLayers = { hissGain, hissLow, bodyGain, windGain, windFilter };
  }

  /**
   * Updates volumes and rain character. Rain grows brighter, louder and windier with the storm level.
   * Throttled internally to the interval set in CONFIG.audio.rain.
   * @param {number} stormLevel - 0 (drizzle) .. 1 (hurricane).
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  update(stormLevel, deltaSeconds) {
    if (!this.context || this.context.state !== 'running') return;
    this.updateClock += deltaSeconds;
    if (this.updateClock < this.config.rain.updateIntervalSeconds) return;
    this.updateClock = 0;
    const now = this.context.currentTime;
    const rain = this.config.rain;
    const storm = clamp(stormLevel, 0, 1);
    const layers = this.rainLayers;
    this.rainBus.gain.setTargetAtTime(this.settings.rainVolume, now, 0.1);
    this.effectsBus.gain.setTargetAtTime(this.settings.effectsVolume, now, 0.05);
    layers.hissGain.gain.setTargetAtTime(lerp(rain.calmHiss, rain.stormHiss, storm), now, 0.25);
    layers.hissLow.frequency.setTargetAtTime(lerp(rain.calmBrightnessHz, rain.stormBrightnessHz, storm), now, 0.25);
    layers.bodyGain.gain.setTargetAtTime(lerp(rain.calmBody, rain.stormBody, storm), now, 0.25);
    layers.windGain.gain.setTargetAtTime(rain.windMax * storm * storm, now, 0.3);
    layers.windFilter.frequency.setTargetAtTime(lerp(250, 520, storm), now, 0.3);
  }

  /**
   * Works out the pitch offset (in semitones) of a clear: the clear type sets the base step
   * (single < double < triple < quad < T-spin double < T-spin triple) and each combo step raises it further.
   * @param {{lines:number, tSpin:string, combo:number}} result - "linesCleared" event payload.
   * @returns {number} Semitones above the base frequency.
   */
  getClearSemitones(result) {
    const tiers = this.config.clearSemitones;
    const table = result.tSpin === 'full'
      ? [0, tiers.tSpinSingle, tiers.tSpinDouble, tiers.tSpinTriple]
      : [0, tiers.single, tiers.double, tiers.triple, tiers.quad];
    const tier = result.perfectClear ? tiers.perfectClear : table[Math.min(result.lines, table.length - 1)];
    const comboBonus = Math.min(Math.max(0, result.combo) * this.config.comboSemitonesPerStep, this.config.maxComboSemitones);
    return tier + comboBonus;
  }

  /**
   * Plays the line-clear sound: one chime per cleared line (up to four) rising as a chord, with the
   * root pitch set by clear type and combo. Quads and full T-spin doubles/triples add an explosion.
   * @param {{lines:number, tSpin:string, combo:number, explosive:boolean}} result - "linesCleared" event payload.
   * @returns {void}
   */
  playLineClear(result) {
    if (!this.context || this.context.state !== 'running' || result.lines === 0) return;
    const root = this.config.baseFrequencyHz * Math.pow(2, this.getClearSemitones(result) / 12);
    const chordSize = this.config.chordOffsetsSemitones.length;
    const noteCount = result.perfectClear ? chordSize : Math.min(result.lines, chordSize);
    const bright = result.tSpin === 'full' || Boolean(result.perfectClear);
    const startTime = this.context.currentTime;
    for (let i = 0; i < noteCount; i++) {
      const frequency = root * Math.pow(2, this.config.chordOffsetsSemitones[i] / 12);
      this.playChime(frequency, startTime + i * this.config.noteSpacingSeconds, 0.3 / Math.sqrt(noteCount), 0.5 + 0.12 * noteCount, bright);
    }
    if (result.explosive) this.playExplosion(bright);
    if (result.perfectClear) this.playPerfectClearFlourish(root);
  }

  /**
   * Plays one bell-like note built from a few sine/triangle partials.
   * @param {number} frequency - Fundamental in Hz.
   * @param {number} startTime - AudioContext time to start at.
   * @param {number} peak - Peak gain.
   * @param {number} duration - Length in seconds.
   * @param {boolean} bright - Adds extra upper partials (used for T-spins).
   * @returns {void}
   */
  playChime(frequency, startTime, peak, duration, bright) {
    const context = this.context;
    const output = context.createGain();
    output.gain.setValueAtTime(0.0001, startTime);
    output.gain.exponentialRampToValueAtTime(peak, startTime + 0.006);
    output.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    const partials = [[1, 'sine', 1], [2, 'triangle', 0.35], [3.01, 'sine', bright ? 0.3 : 0.12]];
    if (bright) partials.push([4.2, 'sine', 0.18]);
    partials.forEach(([ratio, type, amplitude]) => {
      const oscillator = context.createOscillator();
      oscillator.type = type;
      oscillator.frequency.value = frequency * ratio;
      const gain = context.createGain();
      gain.gain.value = amplitude;
      oscillator.connect(gain);
      gain.connect(output);
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.05);
    });
    output.connect(this.effectsBus);
    output.connect(this.reverbSend);
  }

  /**
   * Plays a filtered noise burst with an exponential filter sweep and fade.
   * @param {Object} o - Burst options.
   * @param {string} o.type - Biquad filter type. @param {number} o.startFrequency - Filter start Hz.
   * @param {number} o.endFrequency - Filter end Hz. @param {number} o.peak - Peak gain.
   * @param {number} o.duration - Seconds. @param {AudioNode} o.destination - Where to connect.
   * @param {number} [o.delay] - Seconds before starting. @param {number} [o.attack] - Attack seconds.
   * @returns {void}
   */
  playNoiseBurst({ type, startFrequency, endFrequency, peak, duration, destination, delay = 0, attack = 0.005 }) {
    const context = this.context;
    const start = context.currentTime + delay;
    const source = context.createBufferSource();
    source.buffer = this.noiseBuffer;
    const filter = context.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(startFrequency, start);
    filter.frequency.exponentialRampToValueAtTime(endFrequency, start + duration);
    const gain = context.createGain();
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(destination);
    source.start(start, Math.random());
    source.stop(start + duration + 0.05);
  }

  /**
   * Plays the big explosion: sub boom, rumbling noise and a bright sparkle (plus a rising whoosh for T-spins).
   * @param {boolean} isTSpin - True for the T-spin variant.
   * @returns {void}
   */
  playExplosion(isTSpin) {
    const context = this.context;
    const now = context.currentTime;
    const boom = context.createOscillator();
    boom.type = 'sine';
    boom.frequency.setValueAtTime(isTSpin ? 140 : 110, now);
    boom.frequency.exponentialRampToValueAtTime(32, now + 0.7);
    const boomGain = context.createGain();
    boomGain.gain.setValueAtTime(0.9, now);
    boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
    boom.connect(boomGain);
    boomGain.connect(this.effectsBus);
    boom.start(now);
    boom.stop(now + 1);

    this.playNoiseBurst({ type: 'lowpass', startFrequency: 2400, endFrequency: 180, peak: 0.7, duration: 1, destination: this.effectsBus });
    this.playNoiseBurst({ type: 'highpass', startFrequency: 4500, endFrequency: 6500, peak: 0.22, duration: 0.6, destination: this.reverbSend });
    if (isTSpin) {
      const whoosh = context.createOscillator();
      whoosh.type = 'sawtooth';
      whoosh.frequency.setValueAtTime(300, now);
      whoosh.frequency.exponentialRampToValueAtTime(1800, now + 0.5);
      const whooshGain = context.createGain();
      whooshGain.gain.setValueAtTime(0.0001, now);
      whooshGain.gain.exponentialRampToValueAtTime(0.12, now + 0.3);
      whooshGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      whoosh.connect(whooshGain);
      whooshGain.connect(this.reverbSend);
      whoosh.start(now);
      whoosh.stop(now + 0.7);
    }
  }

  /** Tells whether sound can currently be played. @returns {boolean} True when the audio context is running. */
  isReady() {
    return Boolean(this.context) && this.context.state === 'running';
  }

  /**
   * Plays a simple enveloped oscillator note with an optional pitch glide.
   * @param {Object} o - Tone options.
   * @param {string} o.type - Oscillator type. @param {number} o.frequency - Start frequency in Hz.
   * @param {number} [o.endFrequency] - End frequency in Hz (defaults to the start frequency).
   * @param {number} o.peak - Peak gain. @param {number} o.duration - Length in seconds.
   * @param {number} [o.delay] - Seconds before starting. @param {boolean} [o.reverb] - Also send to the reverb. @param {AudioNode} [o.destination] - Output node (defaults to the effects bus).
   * @returns {void}
   */
  playTone({ type, frequency, endFrequency = frequency, peak, duration, delay = 0, reverb = false, destination = this.effectsBus }) {
    const context = this.context;
    const start = context.currentTime + delay;
    const oscillator = context.createOscillator();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    oscillator.frequency.exponentialRampToValueAtTime(endFrequency, start + duration);
    const gain = context.createGain();
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(destination);
    if (reverb) gain.connect(this.reverbSend);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.03);
  }

  /**
   * Plays a short mechanical tick for a successful rotation (pitch glides up clockwise, down counter-clockwise).
   * @param {number} direction - +1 clockwise, -1 counter-clockwise.
   * @returns {void}
   */
  playRotate(direction) {
    if (!this.isReady()) return;
    const gain = this.config.sfxGains.rotate;
    const clockwise = direction > 0;
    if (Math.abs(direction) === 2) this.playTone({ type: 'triangle', frequency: 700, endFrequency: 1000, peak: gain, duration: 0.06, delay: 0.05 });
    this.playTone({ type: 'triangle', frequency: clockwise ? 620 : 820, endFrequency: clockwise ? 880 : 560, peak: gain, duration: 0.07 });
    this.playNoiseBurst({ type: 'highpass', startFrequency: 3000, endFrequency: 5000, peak: gain * 0.35, duration: 0.03, destination: this.effectsBus });
  }

  /** Plays a swoosh with a two-note blip when a piece is held or swapped. @returns {void} */
  playHold() {
    if (!this.isReady()) return;
    const gain = this.config.sfxGains.hold;
    this.playNoiseBurst({ type: 'bandpass', startFrequency: 500, endFrequency: 2600, peak: gain * 0.8, duration: 0.2, attack: 0.05, destination: this.effectsBus });
    this.playTone({ type: 'sine', frequency: 520, endFrequency: 780, peak: gain * 0.5, duration: 0.14 });
    this.playTone({ type: 'sine', frequency: 780, endFrequency: 1040, peak: gain * 0.4, duration: 0.14, delay: 0.06 });
  }

  /** Plays a soft metallic thud when a piece locks into place (skipped right after a hard drop). @returns {void} */
  playLock() {
    if (this.suppressNextLock) { this.suppressNextLock = false; return; }
    if (!this.isReady()) return;
    const gain = this.config.sfxGains.lock;
    this.playTone({ type: 'sine', frequency: 170, endFrequency: 70, peak: gain, duration: 0.13 });
    this.playNoiseBurst({ type: 'lowpass', startFrequency: 1400, endFrequency: 200, peak: gain * 0.6, duration: 0.08, destination: this.effectsBus });
  }

  /**
   * Plays a heavy impact for a hard drop: a falling whoosh, deep thud and metallic clank. Longer drops hit harder.
   * @param {number} distance - Rows the piece fell.
   * @returns {void}
   */
  playHardDrop(distance) {
    if (!this.isReady()) return;
    this.suppressNextLock = true;
    const gain = this.config.sfxGains.hardDrop * (0.6 + 0.4 * Math.min(distance, 20) / 20);
    if (distance > 2) {
      this.playNoiseBurst({ type: 'bandpass', startFrequency: 1800, endFrequency: 400, peak: gain * 0.35, duration: 0.12, destination: this.effectsBus });
    }
    this.playTone({ type: 'sine', frequency: 130, endFrequency: 38, peak: gain, duration: 0.28 });
    this.playNoiseBurst({ type: 'lowpass', startFrequency: 3200, endFrequency: 140, peak: gain * 0.8, duration: 0.25, destination: this.effectsBus });
    this.playTone({ type: 'triangle', frequency: 1250, endFrequency: 900, peak: gain * 0.18, duration: 0.09 });
  }

  /** Plays a slow descending minor phrase with a low rumble when the game ends. @returns {void} */
  playGameOver() {
    if (!this.isReady()) return;
    const gain = this.config.sfxGains.gameOver;
    [392, 370, 330, 247].forEach((frequency, index) => {
      this.playTone({ type: 'triangle', frequency, endFrequency: frequency * 0.97, peak: gain * 0.8, duration: 0.5 + index * 0.1, delay: index * 0.22, reverb: true });
    });
    this.playTone({ type: 'sine', frequency: 98, endFrequency: 40, peak: gain, duration: 1.2, delay: 0.8, reverb: true });
    this.playNoiseBurst({ type: 'lowpass', startFrequency: 1800, endFrequency: 60, peak: gain * 0.5, duration: 1.8, delay: 0.6, destination: this.effectsBus });
  }

  /**
   * Plays a fast ascending sparkle run on top of a perfect clear.
   * @param {number} root - Root frequency of the clear chord in Hz.
   * @returns {void}
   */
  playPerfectClearFlourish(root) {
    const startTime = this.context.currentTime + 0.25;
    [0, 4, 7, 12, 16, 19].forEach((semitones, index) => {
      this.playChime(root * Math.pow(2, semitones / 12), startTime + index * 0.05, 0.1, 0.45, true);
    });
  }

  /**
   * Plays the nuclear blast: a sharp crack, a huge sub-bass boom with a roaring noise wash, a delayed
   * second rumble and a faint ringing tone.
   * @returns {void}
   */
  playNuclearExplosion() {
    if (!this.isReady()) return;
    this.playNoiseBurst({ type: 'highpass', startFrequency: 2500, endFrequency: 8000, peak: 0.8, duration: 0.25, destination: this.effectsBus });
    this.playTone({ type: 'sine', frequency: 75, endFrequency: 20, peak: 1, duration: 3.6, reverb: true });
    this.playNoiseBurst({ type: 'lowpass', startFrequency: 4000, endFrequency: 60, peak: 0.9, duration: 3.4, attack: 0.06, destination: this.effectsBus });
    this.playTone({ type: 'sine', frequency: 48, endFrequency: 18, peak: 0.8, duration: 3, delay: 0.7, reverb: true });
    this.playNoiseBurst({ type: 'lowpass', startFrequency: 900, endFrequency: 50, peak: 0.6, duration: 3, delay: 0.8, destination: this.reverbSend });
    this.playTone({ type: 'sine', frequency: 3150, endFrequency: 3100, peak: 0.05, duration: 2.6, delay: 0.3 });
  }

  /**
   * Plays a lightning strike: a sharp crack with crackling sizzle and an electric zap (matching the visual
   * double flash), followed by rolling thunder. It uses the ambient bus, so the rain volume controls it.
   * @param {number} strength - 0..1 storm strength at the time of the strike.
   * @returns {void}
   */
  playLightning(strength) {
    if (!this.isReady()) return;
    const { crackGain, zapGain } = this.config.lightning;
    const destination = this.rainBus;
    const loudness = 0.6 + 0.4 * strength;
    this.playNoiseBurst({ type: 'highpass', startFrequency: 2500, endFrequency: 9000, peak: crackGain * loudness, duration: 0.14, destination });
    this.playTone({ type: 'sawtooth', frequency: 2600, endFrequency: 260, peak: zapGain * loudness, duration: 0.14, destination });
    for (let i = 0; i < 4; i++) {
      this.playNoiseBurst({
        type: 'bandpass', startFrequency: randomRange(1800, 4500), endFrequency: randomRange(900, 2500),
        peak: crackGain * 0.45 * loudness, duration: randomRange(0.03, 0.07), delay: 0.05 + i * randomRange(0.03, 0.07), destination,
      });
    }
    this.playNoiseBurst({ type: 'highpass', startFrequency: 3000, endFrequency: 8000, peak: crackGain * 0.7 * loudness, duration: 0.1, delay: 0.11, destination });
    this.playThunder(strength);
  }

  /**
   * Plays a rolling thunder rumble shortly after a lightning flash (part of the rain volume).
   * @param {number} strength - 0..1 storm strength at the time of the strike.
   * @returns {void}
   */
  playThunder(strength) {
    if (!this.context || this.context.state !== 'running') return;
    const delay = lerp(0.9, 0.1, strength) + randomRange(0, 0.15); // stronger storms strike closer, so thunder arrives sooner
    this.playNoiseBurst({
      type: 'lowpass', startFrequency: 420, endFrequency: 70, peak: 0.5 + 0.5 * strength,
      duration: 2.8, destination: this.rainBus, delay, attack: 0.15,
    });
    this.playTone({ type: 'sine', frequency: 62, endFrequency: 28, peak: 0.35 + 0.4 * strength, duration: 2, delay, destination: this.rainBus });
  }
}
