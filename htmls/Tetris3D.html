<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chrome Tetris</title>
<style>
  :root {
    --bg: #07080d;
    --panel: rgba(13, 15, 24, 0.74);
    --panel-border: rgba(130, 150, 210, 0.16);
    --text: #dbe1f2;
    --muted: #7f89a8;
    --accent: #5fd4ff;
    --accent-2: #b36bff;
    --danger: #ff5c70;
    --font: "Segoe UI", "Helvetica Neue", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* ---------- HUD panels ---------- */
  .panel {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    width: 208px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }
  .hud-left  { left: 22px; }
  .hud-right { right: 22px; width: 168px; }
  .block {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: auto;
  }
  .block h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .block-header h2 { margin: 0; }
  .toolbar { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }
  .icon-btn:focus-visible, .btn:focus-visible, .touch-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  canvas.piece-preview { display: block; width: 96px; height: 64px; margin: 0 auto; }
  #next-queue { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  #stats-list { margin: 0; display: grid; grid-template-columns: 1fr auto; row-gap: 7px; column-gap: 10px; }
  #stats-list dt { color: var(--muted); font-size: 12px; align-self: center; }
  #stats-list dd { margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  #stats-list dd.primary { font-size: 22px; color: var(--accent); }

  /* ---------- popups ---------- */
  #popup-layer {
    position: fixed; left: 0; right: 0; top: 24%; z-index: 7;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none;
  }
  .popup {
    font-size: 30px; font-weight: 800; letter-spacing: 0.03em;
    color: #fff;
    text-shadow: 0 0 18px rgba(95, 212, 255, 0.9), 0 0 42px rgba(95, 212, 255, 0.5);
    animation: popup-rise 1.5s cubic-bezier(.2,.7,.2,1) forwards;
    white-space: nowrap;
  }
  .popup.small { font-size: 17px; color: #ffd36b; text-shadow: 0 0 14px rgba(255, 190, 70, 0.7); }
  .popup.big {
    font-size: 46px;
    color: #fff3c9;
    text-shadow: 0 0 22px rgba(255, 170, 60, 1), 0 0 60px rgba(255, 90, 40, 0.8);
    animation-duration: 2.1s;
  }
  .popup.tspin { text-shadow: 0 0 22px rgba(190, 110, 255, 1), 0 0 60px rgba(150, 70, 255, 0.8); color: #f0dcff; }
  .popup.perfect {
    background: linear-gradient(90deg, #ff7a7a, #ffd36b, #7dffa8, #6fd6ff, #c48bff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: none;
    filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.85));
  }
  @keyframes popup-rise {
    0%   { opacity: 0; transform: translateY(14px) scale(0.7); }
    12%  { opacity: 1; transform: translateY(0) scale(1.12); }
    22%  { transform: translateY(0) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-34px) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .popup { animation-duration: 0.01s; opacity: 1; } }

  /* ---------- overlay & settings ---------- */
  #overlay, #settings-panel {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: rgba(4, 5, 9, 0.62);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  #settings-panel { z-index: 20; }
  .card {
    width: min(420px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow: auto;
    background: rgba(14, 16, 26, 0.94);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 26px 26px 22px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .card h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0.02em; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .card .help { font-size: 12.5px; line-height: 1.8; color: #98a2c2; text-align: left; margin: 0 0 20px; padding: 12px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; white-space: pre-line; }
  .btn {
    padding: 11px 26px;
    font: inherit; font-weight: 700;
    border: 0; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #07080d; cursor: pointer;
  }
  .btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); font-weight: 600; margin-left: 8px; }
  .settings-row { display: grid; grid-template-columns: 1fr 120px 56px; gap: 10px; align-items: center; margin-bottom: 12px; text-align: left; font-size: 13px; }
  .settings-row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
  .tab-bar { display: flex; gap: 6px; justify-content: center; margin: 0 0 18px; }
  .tab-btn {
    padding: 8px 16px; font: 600 13px var(--font); color: var(--muted);
    background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border); border-radius: 8px; cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); background: rgba(95, 212, 255, 0.14); border-color: rgba(95, 212, 255, 0.5); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab-panel { min-height: 330px; }
  .settings-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .settings-row input[type=checkbox] { justify-self: start; width: 20px; height: 20px; accent-color: var(--accent); }
  .settings-actions { margin-top: 18px; }

  /* ---------- touch controls ---------- */
  #touch-controls {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 12px; pointer-events: none; gap: 8px;
  }
  .touch-group { display: grid; gap: 8px; pointer-events: none; }
  .touch-group.left  { grid-template-columns: repeat(3, 54px); }
  .touch-group.right { grid-template-columns: repeat(3, 54px); }
  .touch-btn {
    height: 54px; border-radius: 14px;
    border: 1px solid var(--panel-border);
    background: rgba(24, 28, 44, 0.78);
    color: var(--text); font: 700 16px var(--font);
    pointer-events: auto; touch-action: none;
  }
  .touch-btn:active { background: rgba(95, 212, 255, 0.28); }
  .touch-btn.wide { grid-column: span 2; }
  @media (pointer: coarse) { #touch-controls { display: flex; } }

  /* ---------- portrait / compact layout ---------- */
  @media (orientation: portrait) {
    .panel { top: calc(env(safe-area-inset-top, 0px) + 8px); }
    .hud-left { left: 8px; right: 92px; width: auto; flex-direction: row; gap: 8px; align-items: flex-start; }
    .hud-right { right: 8px; width: 78px; }
    .block { padding: 7px 9px; border-radius: 8px; }
    .block h2 { font-size: 10px; margin-bottom: 4px; }
    canvas.piece-preview { width: 60px; height: 40px; }
    #stats-list { grid-template-columns: auto auto; row-gap: 3px; column-gap: 8px; }
    #stats-list dt { font-size: 10px; }
    #stats-list dd { font-size: 12px; }
    #stats-list dd.primary { font-size: 14px; }
    .stats-block { flex: 1; min-width: 0; }
    #next-queue .piece-preview:nth-child(n+4) { display: none; }
    .icon-btn { width: 24px; height: 24px; font-size: 12px; }
    .popup { font-size: 22px; }
    .popup.big { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="popup-layer"></div>

<aside class="panel hud-left">
  <div class="block hold-block">
    <h2 data-i18n="hud.hold"></h2>
    <canvas id="hold-canvas" class="piece-preview"></canvas>
  </div>
  <div class="block stats-block"><dl id="stats-list"></dl></div>
</aside>

<aside class="panel hud-right">
  <div class="block">
    <div class="block-header">
      <h2 data-i18n="hud.next"></h2>
      <div class="toolbar">
        <button id="btn-pause" class="icon-btn" data-i18n-title="button.pause" type="button">❚❚</button>
        <button id="btn-settings" class="icon-btn" data-i18n-title="button.settings" type="button">⚙</button>
      </div>
    </div>
    <div id="next-queue"></div>
  </div>
</aside>

<section id="overlay" hidden>
  <div class="card">
    <h1 id="overlay-title"></h1>
    <p id="overlay-message"></p>
    <div class="help" id="overlay-help"></div>
    <button id="overlay-button" class="btn" type="button"></button>
  </div>
</section>

<section id="settings-panel" hidden>
  <div class="card">
    <h1 data-i18n="settings.title"></h1>
    <div id="settings-tabs" class="tab-bar" role="tablist"></div>
    <div id="settings-fields"></div>
    <div class="settings-actions">
      <button id="settings-reset" class="btn secondary" type="button" data-i18n="settings.reset"></button>
      <button id="settings-close" class="btn" type="button" data-i18n="settings.close"></button>
    </div>
  </div>
</section>

<div id="touch-controls"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/AfterimageShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/BokehPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/AfterimagePass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Reflector.js"></script>

<script>
'use strict';
(function () {

/* =====================================================================
 * SECTION 1 — UTILITIES
 * Small, dependency-free helpers shared by every module.
 * ===================================================================== */

/**
 * Recursively freezes an object so configuration cannot be mutated by accident.
 * @param {Object} target - The object (and nested objects) to freeze.
 * @returns {Object} The same object, now deeply frozen.
 */
function deepFreeze(target) {
  Object.values(target).forEach((value) => {
    if (value && typeof value === 'object') deepFreeze(value);
  });
  return Object.freeze(target);
}

/**
 * Restricts a number to the inclusive range [min, max].
 * @param {number} value - Input value.
 * @param {number} min - Lower bound.
 * @param {number} max - Upper bound.
 * @returns {number} The clamped value.
 */
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

/**
 * Linearly interpolates between two numbers.
 * @param {number} from - Start value.
 * @param {number} to - End value.
 * @param {number} amount - Interpolation factor (0..1).
 * @returns {number} Interpolated value.
 */
function lerp(from, to, amount) {
  return from + (to - from) * amount;
}

/**
 * Returns a random float in [min, max).
 * @param {number} min - Lower bound.
 * @param {number} max - Upper bound (exclusive).
 * @returns {number} Random value.
 */
function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

/**
 * Shuffles an array in place using the Fisher-Yates algorithm.
 * @param {Array} items - Array to shuffle (mutated).
 * @param {function(): number} random - Random source returning [0,1).
 * @returns {Array} The same array, shuffled.
 */
function shuffleInPlace(items, random) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

/**
 * Converts a numeric hex color (0xRRGGBB) to a CSS "#rrggbb" string.
 * @param {number} hex - Color as a number.
 * @returns {string} CSS color string.
 */
function hexToCss(hex) {
  return '#' + hex.toString(16).padStart(6, '0');
}

/**
 * Cheap smooth pseudo-noise in [-1, 1] built from summed sine waves.
 * @param {number} time - Sample position.
 * @param {number} seed - Per-channel offset so channels decorrelate.
 * @returns {number} Noise value.
 */
function smoothNoise(time, seed) {
  return (Math.sin(time + seed) + 0.5 * Math.sin(time * 2.3 + seed * 1.7) + 0.25 * Math.sin(time * 4.1 + seed * 0.6)) / 1.75;
}

/* =====================================================================
 * SECTION 2 — CONFIG
 * Every tunable value lives here (key binds, DAS/ARR, soft drop speed,
 * graphics and effect parameters).
 * ===================================================================== */

const CONFIG = deepFreeze({
  board: { columns: 10, visibleRows: 20, hiddenRows: 3, spawnRow: 1 },

  input: {
    /** Keyboard bindings as KeyboardEvent.code values. */
    keybinds: {
      moveLeft: ['ArrowLeft'],
      moveRight: ['ArrowRight'],
      softDrop: ['ArrowDown'],
      rotateClockwise: ['ArrowUp'],
      rotateCounterClockwise: ['KeyZ'],
      rotate180: ['KeyA'],
      hold: ['KeyC'],
      hardDrop: ['KeyB', 'Space'],
      pause: ['KeyP', 'Escape'],
      restart: ['KeyR'],
      start: ['Enter'],
    },
    dasFrames: 10,            // Delayed Auto Shift: frames to wait before auto-repeat begins
    arrFrames: 2,             // Auto Repeat Rate: frames between repeats (0 = instant to wall)
    softDropRepeatFrames: 1,  // Frames between soft-drop steps while held; 0 = instant (piece drops straight to the floor without locking)
  },

  gameplay: {
    logicFps: 60,
    maxLogicStepsPerFrame: 5,
    lockDelayFrames: 30,
    maxLockResets: 15,
    linesPerLevel: 10,
    gravityBaseSeconds: 0.8,
    gravityDecrementPerLevel: 0.007,
    minGravityFramesPerCell: 1 / 20,
    nextQueueSize: 5,
    scoring: {
      lineClear: [0, 100, 300, 500, 800],
      tSpin: [400, 800, 1200, 1600],
      tSpinMini: [100, 200, 400],
      softDropPerCell: 1,
      hardDropPerCell: 2,
      comboPerStep: 50,
      backToBackMultiplier: 1.5,
      perfectClearQuadMultiplier: 2.5, // a perfect clear scores this many times a quad clear (replaces the normal line-clear score)
    },
  },

  pieceColors: { I: 0x27e6ff, O: 0xffd21f, T: 0xb44dff, S: 0x3dff7a, Z: 0xff3b4f, J: 0x3d6bff, L: 0xff8a1f },

  /** Defaults for the options exposed in the settings panel (visual options only). */
  userSettings: {
    motionBlurStrength: 0.45,
    depthOfFieldStrength: 1,
    bloomStrength: 1,
    cameraShakeStrength: 1,
    rainAmount: 1,
  },

  audio: {
    masterVolume: 0.8,
    rainVolume: 0.5,            // default ambient rain volume (0..1); also a slider in the settings panel
    effectsVolume: 0.8,         // default volume of line-clear sounds (0..1); also a slider in the settings panel
    baseFrequencyHz: 330,       // pitch of a single-line clear at combo 0
    /** Pitch offset in semitones per clear type: single < double < triple < quad < T-spin double < T-spin triple. */
    clearSemitones: { single: 0, double: 2, triple: 4, quad: 6, tSpinSingle: 5, tSpinDouble: 8, tSpinTriple: 10, perfectClear: 13 }, // perfect clear is the highest
    /** Relative loudness of the one-shot sound effects (0..1). */
    sfxGains: { rotate: 0.16, hold: 0.28, lock: 0.4, hardDrop: 0.65, gameOver: 0.45 },
    comboSemitonesPerStep: 1,   // extra semitones added to every line clear for each combo step
    maxComboSemitones: 12,      // cap so very long combos stay pleasant
    chordOffsetsSemitones: [0, 4, 7, 12], // the Nth chime of a multi-line clear is offset by the Nth value
    noteSpacingSeconds: 0.06,
    reverbSeconds: 1.6,
    reverbAmount: 0.25,
    rain: { updateIntervalSeconds: 0.1, calmHiss: 0.1, stormHiss: 0.4, calmBrightnessHz: 5000, stormBrightnessHz: 10000, calmBody: 0.04, stormBody: 0.45, windMax: 0.5 },
    lightning: { crackGain: 0.9, zapGain: 0.25 }, // lightning sound loudness (also scaled by the rain volume)
  },

  graphics: {
    fieldOfViewDegrees: 36,
    cameraPitchDegrees: 8,
    cameraTargetHeight: 9.6,
    framing: {
      landscape: { height: 25, width: 14 },
      portrait: { height: 29, width: 13.5 },
    },
    pixelRatio: { max: 1.75, min: 0.75 },
    antiAliasingLevels: [0, 2, 4, 8],          // MSAA sample counts selectable in settings (capped by what the GPU supports)
    antiAliasingDefaultIndex: 2,              // default level: index into the list above
    shadowQualityLevels: [0, 512, 1024, 2048], // shadow map sizes selectable in settings (0 = shadows off)
    shadowQualityDefaultIndex: 2,             // default level: index into the list above
    reflections: { enabled: true, textureSize: 768 }, // enabled = default of the in-game Reflections switch; turn off for a big speed-up on low-end machines
    smoothPieceMovement: true,   // false = pieces snap instantly to their grid cell (precise, no easing)
    pieceSmoothingPerSecond: 38, // easing speed when smoothing is on (higher = snappier)
    cell: { size: 0.94, depth: 0.8, bevel: 0.08, metalness: 1, roughness: 0.24, clearcoat: 0.5, envMapIntensity: 1.5 },
    bloom: { strength: 0.55, radius: 0.65, threshold: 0.8 },
    depthOfField: { aperture: 0.0016, maxBlur: 0.012 },
    finalGrade: { exposure: 1.15, vignette: 0.55, grain: 0.03, baseChromaticAberration: 0.0008 },
    flashLightMaxIntensity: 6,
    adaptiveQuality: { enabled: true, lowFpsThreshold: 52, sampleSeconds: 1.5, pixelRatioStep: 0.15 },
  },

  effects: {
    particleCapacity: 4500,
    shake: {
      decayPerSecond: 1.7, maxOffset: 0.9, maxRotationRadians: 0.035, frequency: 22,
      lock: 0.05, hardDropBase: 0.1, hardDropPerCell: 0.012, hardDropMax: 0.38,
      lineClearPerLine: 0.1, quad: 0.9, tSpin: 0.8, gameOver: 0.6,
    },
    impulseDecayPerSecond: { bloom: 1.6, flash: 3.2, chromaticAberration: 2.2, whiteout: 0.9 },
    rain: {
      maxDrops: 1100, speedMin: 24, speedMax: 38, lengthMin: 0.6, lengthMax: 1.4,
      slant: 2.5, areaHalfWidth: 22, zMin: -16, zMax: 12, topY: 46, floorY: -0.5, splashChance: 0.25,
    },
    sparkleIntervalSeconds: 0.12,
    /** Cinematic nuclear explosion triggered by a perfect clear (all clear). */
    nuclear: {
      durationSeconds: 4.5,
      slowMotion: { scale: 0.3, holdSeconds: 0.55, rampSeconds: 1.0 }, // visual slow-motion; the game itself keeps its normal speed
      whiteout: 1, flash: 2.2, bloom: 3, chromaticAberration: 0.02,
      fireball: { radius: 15, seconds: 1.6, y: 5 },
      groundRing: { maxScale: 75, seconds: 1.8 },
      domeRing: { maxScale: 60, seconds: 1.4 },
      stem: { startSeconds: 0.25, endSeconds: 2.8, particlesPerSecond: 260, radius: 1.6, riseSpeedMin: 13, riseSpeedMax: 19 },
      cap: { startSeconds: 0.9, endSeconds: 3.4, particlesPerSecond: 320, riseHeight: 17, startRadius: 2.5, endRadius: 12 },
      debrisCount: 320,
    },
    /** Combo-driven storm: intensity rises from 0 (light drizzle) to 1 (hurricane) as consecutive line clears build up. */
    storm: {
      chainForMaxStorm: 7,          // consecutive piece drops that each clear >= 1 line to reach a full hurricane
      riseRatePerSecond: 1.2,       // how fast the storm builds after a clear
      fallRatePerSecond: 0.35,      // how fast it calms once the combo breaks
      calmDropFraction: 0.1,        // fraction of raindrops visible at 0 combo
      speedMultiplierMax: 1.9,
      slantMax: 24,                 // horizontal wind speed at full storm
      lengthMultiplierMax: 2,
      thicknessMultiplierMax: 2.4,
      opacityMin: 0.4,
      opacityMax: 0.85,
      splashChanceMax: 0.6,
      gustFrequency: 0.8,
      gustStrength: 0.4,
      cameraBuffetStartLevel: 0.5,  // storm level where wind starts rattling the camera
      cameraBuffetMaxTrauma: 0.5,
      mistStartLevel: 0.4,          // storm level where wind-blown spray appears
      mistParticlesPerSecondAtMax: 140,
      lightning: { startLevel: 0.45, intervalSecondsAtStart: 7, intervalSecondsAtMax: 1.4, flash: 0.9, bloom: 0.6, shake: 0.3 },
    },
    lineClear: { particlesPerCell: 7, speedMin: 3, speedMax: 11, gravity: -16 },
    explosion: {

/**
 * Looks up a displayed string and substitutes {placeholders}.
 * @param {string} key - String table key.
 * @param {Object<string, string|number>} [params] - Values for {placeholder} tokens.
 * @returns {string} Localized text, or the key itself if missing.
 */
function t(key, params) {
  const table = STRINGS[activeLocale] || STRINGS.en;
  let text = table[key];
  if (text === undefined) text = STRINGS.en[key];
  if (text === undefined) return key;
  if (params) text = text.replace(/\{(\w+)\}/g, (match, name) => (name in params ? params[name] : match));
  return text;
}

}

const PIECE_TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

/** Spawn shapes (rotation 0) as [x, y] cells inside a square bounding box (y grows downward). */
const BASE_SHAPES = {
  I: { size: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
  O: { size: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]] },
  T: { size: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
  S: { size: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
  Z: { size: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
  J: { size: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
  L: { size: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
};

/** SRS wall-kick offsets as [dx, dy] with y pointing UP (converted to grid space when built). */
const SRS_KICKS_JLSTZ = {
  '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
};
/** 180-degree rotation kicks (y up). Horizontal-first for flat states, vertical-first for upright states. */
const SRS_KICKS_180 = {
  '0>2': [[0, 0], [1, 0], [2, 0], [1, 1], [2, 1], [-1, 0], [-2, 0], [-1, 1], [-2, 1], [0, -1], [3, 0], [-3, 0]],
  '2>0': [[0, 0], [-1, 0], [-2, 0], [-1, -1], [-2, -1], [1, 0], [2, 0], [1, -1], [2, -1], [0, 1], [-3, 0], [3, 0]],
  '1>3': [[0, 0], [0, 2], [0, 1], [1, 0], [-1, 0], [1, 2], [-1, 2], [0, -1]],
  '3>1': [[0, 0], [0, 2], [0, 1], [-1, 0], [1, 0], [-1, 2], [1, 2], [0, -1]],
};
const SRS_KICKS_I = {
  '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
};

/**
 * Converts a kick table from "y up" to grid space ("y down").
 * @param {Object<string, number[][]>} table - Kick table with y pointing up.
 * @returns {Object<string, number[][]>} Kick table with y pointing down.
 */
function toGridSpaceKicks(table) {
  const converted = {};
  Object.keys(table).forEach((key) => { converted[key] = table[key].map(([dx, dy]) => [dx, -dy]); });
  return converted;
}

/**
 * Builds the four rotation states of every piece by rotating its base shape clockwise.
 * @returns {Object<string, {size:number, rotations:number[][][], kicks:Object}>} Piece definitions by type.
 */
function buildPieceDefinitions() {
  const jlstzKicks = toGridSpaceKicks(SRS_KICKS_JLSTZ);
  const iKicks = toGridSpaceKicks(SRS_KICKS_I);
  const kicks180 = toGridSpaceKicks(SRS_KICKS_180);
  const definitions = {};
  PIECE_TYPES.forEach((type) => {
    const { size, cells } = BASE_SHAPES[type];
    const rotations = [cells];
    for (let i = 1; i < 4; i++) {
      rotations.push(rotations[i - 1].map(([x, y]) => [size - 1 - y, x]));
    }
    const baseKicks = type === 'I' ? iKicks : jlstzKicks;
    definitions[type] = { size, rotations, kicks: type === 'O' ? {} : { ...baseKicks, ...kicks180 } };
  });
  return definitions;
}

const PIECE_DEFINITIONS = buildPieceDefinitions();

/**
 * Returns the absolute grid cells occupied by a piece.
 * @param {{type:string, rotation:number, x:number, y:number}} piece - The piece.
 * @returns {Array<{x:number, y:number}>} Four grid cells.
 */
function getPieceCells(piece) {
  return PIECE_DEFINITIONS[piece.type].rotations[piece.rotation].map(([cx, cy]) => ({ x: piece.x + cx, y: piece.y + cy }));
}

/** Minimal publish/subscribe helper that decouples game logic from views. */
class EventEmitter {
  /** Creates an emitter with no listeners. @returns {EventEmitter} */
  constructor() { this.listeners = new Map(); }

  /**
   * Registers a listener.
   * @param {string} eventName - Event to listen for.
   * @param {function(Object): void} handler - Callback receiving the payload.
   * @returns {function(): void} Function that removes the listener.
   */
  on(eventName, handler) {
    if (!this.listeners.has(eventName)) this.listeners.set(eventName, []);
    this.listeners.get(eventName).push(handler);
    return () => this.listeners.set(eventName, this.listeners.get(eventName).filter((h) => h !== handler));
  }

  /**
   * Calls every listener registered for an event.
   * @param {string} eventName - Event name.
   * @param {Object} [payload] - Data passed to listeners.
   * @returns {void}
   */
  emit(eventName, payload) {
    const handlers = this.listeners.get(eventName);
    if (handlers) handlers.forEach((handler) => handler(payload));
  }
}

/** The playfield grid. Cells hold a piece type string or null. */
class Board {
  /**
   * Creates an empty board.
   * @param {number} columns - Number of columns.
   * @param {number} rows - Total rows including hidden spawn rows.
   */
  constructor(columns, rows) {
    this.columns = columns;
    this.rows = rows;
    this.version = 0; // increments on every mutation so views know when to rebuild
    this.cells = Board.createGrid(columns, rows);
  }

  /**
   * Creates an empty grid.
   * @param {number} columns - Column count.
   * @param {number} rows - Row count.
   * @returns {Array<Array<string|null>>} 2D array filled with null.
   */
  static createGrid(columns, rows) {
    return Array.from({ length: rows }, () => new Array(columns).fill(null));
  }

  /** Empties the board. @returns {void} */
  reset() {
    this.cells = Board.createGrid(this.columns, this.rows);
    this.version++;
  }

  /**
   * Tests whether a cell is outside the board or already filled.
   * @param {number} x - Column.
   * @param {number} y - Row.
   * @returns {boolean} True when the cell cannot be occupied.
   */
  isBlocked(x, y) {
    return x < 0 || x >= this.columns || y < 0 || y >= this.rows || this.cells[y][x] !== null;
  }

  /**
   * Tests whether any of the given cells is blocked.
   * @param {Array<{x:number,y:number}>} cells - Cells to test.
   * @returns {boolean} True if there is a collision.
   */
  collides(cells) {
    return cells.some((cell) => this.isBlocked(cell.x, cell.y));
  }

  /**
   * Writes a piece's cells into the grid.
   * @param {Array<{x:number,y:number}>} cells - Cells to fill.
   * @param {string} type - Piece type stored in the cells.
   * @returns {void}
   */
  lockCells(cells, type) {
    cells.forEach((cell) => { this.cells[cell.y][cell.x] = type; });
    this.version++;
  }

  /** Tests whether the whole board is empty (used for perfect-clear detection). @returns {boolean} True when no cell is filled. */
  isEmpty() {
    return this.cells.every((row) => row.every((cell) => cell === null));
  }

  /** Finds all completed rows. @returns {number[]} Row indices, ascending. */
  findFullRows() {
    const rows = [];
    this.cells.forEach((row, index) => { if (row.every((cell) => cell !== null)) rows.push(index); });
    return rows;
  }

  /**
   * Removes rows and shifts everything above downward.
   * @param {number[]} rowIndices - Rows to delete.
   * @returns {void}
   */
  removeRows(rowIndices) {
    const removed = new Set(rowIndices);
    const kept = this.cells.filter((row, index) => !removed.has(index));
    while (kept.length < this.rows) kept.unshift(new Array(this.columns).fill(null));
    this.cells = kept;
    this.version++;
  }
}

/** Produces pieces using the fair 7-bag randomizer. */
class PieceGenerator {
  /**
   * Creates a generator.
   * @param {function(): number} [random] - Random source returning [0,1).
   */
  constructor(random = Math.random) {
    this.random = random;
    this.queue = [];
  }

  /** Clears the queue. @returns {void} */
  reset() { this.queue = []; }

  /**
   * Makes sure the queue holds at least a number of pieces.
   * @param {number} minimumLength - Required queue length.
   * @returns {void}
   */
  refill(minimumLength) {
    while (this.queue.length < minimumLength) {
      this.queue.push(...shuffleInPlace([...PIECE_TYPES], this.random));
    }
  }

  /** Removes and returns the next piece type. @returns {string} Piece type. */
  next() {
    this.refill(1);
    return this.queue.shift();
  }

  /**
   * Looks ahead without consuming.
   * @param {number} count - How many upcoming pieces to return.
   * @returns {string[]} Upcoming piece types.
   */
  peek(count) {
    this.refill(count);
    return this.queue.slice(0, count);
  }
}

/**
 * The rules engine: movement, SRS rotation, hold, gravity, locking,
 * line clears, T-spin detection and scoring. It knows nothing about rendering
 * and communicates through events:
 * started, pieceSpawned, pieceMoved, pieceRotated, pieceHeld, hardDropped,
 * pieceLocked, linesCleared, levelUp, gameOver, paused.
 */
class GameEngine extends EventEmitter {
  /**
   * Creates an idle engine.
   * @param {Object} config - The CONFIG object.
   */
  constructor(config) {
    super();
    this.config = config;
    this.board = new Board(config.board.columns, config.board.hiddenRows + config.board.visibleRows);
    this.generator = new PieceGenerator();
    this.state = 'idle'; // idle | playing | paused | gameover
    this.resetRun();
  }

  /** Resets all per-game state. @returns {void} */
  resetRun() {
    this.board.reset();
    this.generator.reset();
    this.piece = null;
    this.pieceSerial = 0;
    this.holdType = null;
    this.holdUsed = false;
    this.gravityAccumulator = 0;
    this.lockTimer = 0;
    this.lockResets = 0;
    this.lowestRow = 0;
    this.lastMoveWasRotation = false;
    this.lastKickIndex = 0;
    this.frames = 0;
    this.stats = { score: 0, level: 1, lines: 0, tSpins: 0, quads: 0, perfectClears: 0, pieces: 0, combo: -1, backToBack: false };
  }

  /** Starts a fresh game. @returns {void} */
  start() {
    this.resetRun();
    this.state = 'playing';
    this.emit('started', {});
    this.spawnPiece(this.generator.next(), false);
  }

  /** Toggles between playing and paused; ignored in other states. @returns {void} */
  togglePause() {
    if (this.state === 'playing') this.state = 'paused';
    else if (this.state === 'paused') this.state = 'playing';
    else return;
    this.emit('paused', { paused: this.state === 'paused' });
  }

  /**
   * Computes how many logic frames gravity takes to move a piece one row.
   * @returns {number} Frames per row (can be below 1 for very high speeds).
   */
  getGravityFramesPerCell() {
    const { gravityBaseSeconds, gravityDecrementPerLevel, logicFps, minGravityFramesPerCell } = this.config.gameplay;
    const level = this.stats.level;
    const seconds = Math.pow(gravityBaseSeconds - (level - 1) * gravityDecrementPerLevel, level - 1);
    return Math.max(seconds * logicFps, minGravityFramesPerCell);
  }

  /**
   * Advances the simulation by one logic frame.
   * @param {string[]} actions - Actions the input layer produced for this frame.
   * @returns {void}
   */
  tick(actions) {
    if (this.state !== 'playing') return;
    this.frames++;
    actions.forEach((action) => { if (this.piece) this.applyAction(action); });
    if (!this.piece) return;

    this.gravityAccumulator += 1 / this.getGravityFramesPerCell();
    while (this.gravityAccumulator >= 1) {
      this.gravityAccumulator -= 1;
      if (!this.tryMove(0, 1, true)) { this.gravityAccumulator = 0; break; }
    }

    if (this.isGrounded()) {
      this.lockTimer++;
      if (this.lockTimer >= this.config.gameplay.lockDelayFrames) this.lockActivePiece();
    } else {
      this.lockTimer = 0;
    }
  }

  /**
   * Executes one gameplay action.
   * @param {string} action - moveLeft, moveRight, softDrop, rotateClockwise, rotateCounterClockwise, hold or hardDrop.
   * @returns {void}
   */
  applyAction(action) {
    switch (action) {
      case 'moveLeft': this.tryMove(-1, 0, false); break;
      case 'moveRight': this.tryMove(1, 0, false); break;
      case 'softDrop':
        if (this.tryMove(0, 1, false)) this.stats.score += this.config.gameplay.scoring.softDropPerCell;
        break;
      case 'softDropInstant': this.softDropToFloor(); break;
      case 'rotateClockwise': this.tryRotate(1); break;
      case 'rotateCounterClockwise': this.tryRotate(-1); break;
      case 'rotate180': this.tryRotate(2); break;
      case 'hold': this.holdPiece(); break;
      case 'hardDrop': this.hardDrop(); break;
      default: break;
    }
  }

  /**
   * Attempts to translate the active piece.
   * @param {number} dx - Columns to move.
   * @param {number} dy - Rows to move (positive is down).
   * @param {boolean} isGravity - True when caused by gravity (does not reset lock delay).
   * @returns {boolean} True if the piece moved.
   */
  tryMove(dx, dy, isGravity) {
    if (!this.piece) return false;
    const moved = { ...this.piece, x: this.piece.x + dx, y: this.piece.y + dy };
    if (this.board.collides(getPieceCells(moved))) return false;
    this.piece = moved;
    this.lastMoveWasRotation = false;
    if (this.piece.y > this.lowestRow) { this.lowestRow = this.piece.y; this.lockResets = 0; }
    if (!isGravity) this.registerPieceAdjustment();
    this.emit('pieceMoved', { dx, dy, isGravity });
    return true;
  }

  /**
   * Attempts an SRS rotation including wall kicks.
   * @param {number} direction - +1 clockwise, -1 counter-clockwise, 2 for a 180-degree turn.
   * @returns {boolean} True if the rotation succeeded.
   */
  tryRotate(direction) {
    if (!this.piece) return false;
    const definition = PIECE_DEFINITIONS[this.piece.type];
    const fromRotation = this.piece.rotation;
    const toRotation = (fromRotation + direction + 4) % 4;
    const kicks = definition.kicks[`${fromRotation}>${toRotation}`] || [[0, 0]];
    for (let index = 0; index < kicks.length; index++) {
      const candidate = { ...this.piece, rotation: toRotation, x: this.piece.x + kicks[index][0], y: this.piece.y + kicks[index][1] };
      if (!this.board.collides(getPieceCells(candidate))) {
        this.piece = candidate;
        this.lastMoveWasRotation = true;
        this.lastKickIndex = Math.abs(direction) === 2 ? -1 : index; // 180-degree kicks never count as the special 5th-kick T-spin
        if (this.piece.y > this.lowestRow) { this.lowestRow = this.piece.y; this.lockResets = 0; }
        this.registerPieceAdjustment();
        this.emit('pieceRotated', { direction });
        return true;
      }
    }
    return false;
  }

  /**
   * Resets the lock timer after a successful manual adjustment while grounded (limited by maxLockResets).
   * @returns {void}
   */
  registerPieceAdjustment() {
    if (this.isGrounded() && this.lockResets < this.config.gameplay.maxLockResets) {
      this.lockTimer = 0;
      this.lockResets++;
    }
  }

  /** Tests whether the active piece rests on something. @returns {boolean} True when it cannot move down. */
  isGrounded() {
    return this.board.collides(getPieceCells({ ...this.piece, y: this.piece.y + 1 }));
  }

  /**
   * Moves the active piece straight down until it rests on something, WITHOUT locking it
   * (the player can still slide or rotate it until the lock delay runs out). Awards soft-drop points per row.
   * @returns {number} Number of rows the piece moved.
   */
  softDropToFloor() {
    let rows = 0;
    while (this.tryMove(0, 1, false)) rows++;
    this.stats.score += rows * this.config.gameplay.scoring.softDropPerCell;
    return rows;
  }

  /** Drops the active piece to the bottom and locks it immediately. @returns {void} */
  hardDrop() {
    if (!this.piece) return;
    const fromCells = getPieceCells(this.piece);
    let distance = 0;
    while (!this.board.collides(getPieceCells({ ...this.piece, y: this.piece.y + 1 }))) {
      this.piece = { ...this.piece, y: this.piece.y + 1 };
      distance++;
    }
    if (distance > 0) this.lastMoveWasRotation = false;
    this.stats.score += distance * this.config.gameplay.scoring.hardDropPerCell;
    this.emit('hardDropped', { type: this.piece.type, fromCells, toCells: getPieceCells(this.piece), distance });
    this.lockActivePiece();
  }

  /** Stores the active piece in the hold slot (swapping if occupied); once per piece. @returns {void} */
  holdPiece() {
    if (!this.piece || this.holdUsed) return;
    const currentType = this.piece.type;
    const swapType = this.holdType;
    this.holdType = currentType;
    this.emit('pieceHeld', { type: currentType });
    this.spawnPiece(swapType || this.generator.next(), true);
  }

  /**
   * Places a new piece at the top of the board; ends the game if it overlaps.
   * @param {string} type - Piece type to spawn.
   * @param {boolean} isFromHold - True if spawned by a hold action (keeps hold locked).
   * @returns {void}
   */
  spawnPiece(type, isFromHold) {
    const piece = { type, rotation: 0, x: type === 'O' ? 4 : 3, y: this.config.board.spawnRow };
    this.holdUsed = isFromHold;
    this.lockTimer = 0;
    this.lockResets = 0;
    this.lowestRow = piece.y;
    this.lastMoveWasRotation = false;
    this.gravityAccumulator = 0;
    this.pieceSerial++;
    if (this.board.collides(getPieceCells(piece))) {
      this.piece = null;
      this.state = 'gameover';
      this.emit('gameOver', { stats: this.getStats() });
      return;
    }
    this.piece = piece;
    this.emit('pieceSpawned', { type });
  }

  /**
   * Classifies a T-spin using the 3-corner rule (call before locking the piece).
   * @returns {'none'|'mini'|'full'} T-spin classification.
   */
  detectTSpin() {
    if (!this.piece || this.piece.type !== 'T' || !this.lastMoveWasRotation) return 'none';
    const { x, y, rotation } = this.piece;
    const occupied = (cx, cy) => this.board.isBlocked(x + cx, y + cy);
    const corners = { topLeft: occupied(0, 0), topRight: occupied(2, 0), bottomLeft: occupied(0, 2), bottomRight: occupied(2, 2) };
    const total = Object.values(corners).filter(Boolean).length;
    if (total < 3) return 'none';
    const frontCorners = [
      [corners.topLeft, corners.topRight],
      [corners.topRight, corners.bottomRight],
      [corners.bottomLeft, corners.bottomRight],
      [corners.topLeft, corners.bottomLeft],
    ][rotation];
    if (frontCorners[0] && frontCorners[1]) return 'full';
    return this.lastKickIndex === 4 ? 'full' : 'mini';
  }

  /** Locks the active piece, resolves line clears and spawns the next piece. @returns {void} */
  lockActivePiece() {
    const piece = this.piece;
    const cells = getPieceCells(piece);
    const tSpin = this.detectTSpin();
    this.board.lockCells(cells, piece.type);
    this.stats.pieces++;
    this.emit('pieceLocked', { type: piece.type, cells });

    const fullRows = this.board.findFullRows();
    if (fullRows.length === 0) this.stats.combo = -1;
    if (fullRows.length > 0 || tSpin !== 'none') this.resolveClear(fullRows, tSpin, piece.type);

    this.piece = null;
    this.spawnPiece(this.generator.next(), false);
  }

  /**
   * Removes cleared rows, updates stats/score and emits "linesCleared".
   * @param {number[]} fullRows - Completed row indices.
   * @param {'none'|'mini'|'full'} tSpin - T-spin classification of the locking move.
   * @param {string} pieceType - Type of the piece that caused the clear.
   * @returns {void}
   */
  resolveClear(fullRows, tSpin, pieceType) {
    const { scoring, linesPerLevel } = this.config.gameplay;
    const lines = fullRows.length;
    const rows = fullRows.map((row) => ({ row, types: [...this.board.cells[row]] }));
    this.board.removeRows(fullRows);
    const isPerfectClear = lines > 0 && this.board.isEmpty();

    let baseScore = 0;
    if (tSpin === 'full') baseScore = scoring.tSpin[lines];
    else if (tSpin === 'mini') baseScore = scoring.tSpinMini[Math.min(lines, scoring.tSpinMini.length - 1)];
    else baseScore = scoring.lineClear[lines];
    if (isPerfectClear) baseScore = scoring.lineClear[4] * scoring.perfectClearQuadMultiplier;

    const isDifficult = lines === 4 || isPerfectClear || (tSpin !== 'none' && lines > 0);
    const appliedBackToBack = lines > 0 && isDifficult && this.stats.backToBack && !isPerfectClear;
    if (lines > 0) this.stats.backToBack = isDifficult;

    let awarded = baseScore * this.stats.level;
    if (appliedBackToBack) awarded = Math.floor(awarded * scoring.backToBackMultiplier);
    if (lines > 0) {
      this.stats.combo++;
      if (this.stats.combo > 0) awarded += scoring.comboPerStep * this.stats.combo * this.stats.level;
    }
    this.stats.score += awarded;
    this.stats.lines += lines;
    if (lines === 4) this.stats.quads++;
    if (isPerfectClear) this.stats.perfectClears++;
    if (tSpin === 'full' && lines >= 2) this.stats.tSpins++;

    const previousLevel = this.stats.level;
    this.stats.level = 1 + Math.floor(this.stats.lines / linesPerLevel);

    this.emit('linesCleared', {
      lines, tSpin, rows, pieceType, awarded,
      combo: this.stats.combo,
      backToBack: appliedBackToBack,
      perfectClear: isPerfectClear,
      explosive: lines === 4 || (tSpin === 'full' && lines >= 2) || isPerfectClear,
    });
    if (this.stats.level > previousLevel) this.emit('levelUp', { level: this.stats.level });
  }

  /** Computes where the active piece would land. @returns {Array<{x:number,y:number}>} Ghost cells (empty if no piece). */
  getGhostCells() {
    if (!this.piece) return [];
    let ghost = this.piece;
    while (!this.board.collides(getPieceCells({ ...ghost, y: ghost.y + 1 }))) ghost = { ...ghost, y: ghost.y + 1 };
    return getPieceCells(ghost);
  }

  /**
   * Returns upcoming piece types.
   * @param {number} count - Number of pieces to preview.
   * @returns {string[]} Piece types.
   */
  getNextTypes(count) { return this.generator.peek(count); }

  /**
   * Builds a snapshot of statistics including derived rates.
   * @returns {{score:number,level:number,lines:number,tSpins:number,quads:number,pieces:number,elapsedSeconds:number,linesPerMinute:number,piecesPerSecond:number}} Stats snapshot.
   */
  getStats() {
    const elapsedSeconds = this.frames / this.config.gameplay.logicFps;
    return {
      ...this.stats,
      elapsedSeconds,
      linesPerMinute: elapsedSeconds > 0 ? (this.stats.lines / elapsedSeconds) * 60 : 0,
      piecesPerSecond: elapsedSeconds > 0 ? this.stats.pieces / elapsedSeconds : 0,
    };
  }
}

/**
 * Converts keyboard / touch presses into per-frame gameplay actions with DAS/ARR.
 * Left/right/soft-drop move once instantly on press, wait DAS frames, then
 * repeat every ARR frames until released. Rotate, hold and hard drop never repeat.
 */
class InputController {
  /**
   * Creates the controller.
   * @param {Object} options - Setup options.
   * @param {Object<string,string[]>} options.keybinds - Action name to KeyboardEvent.code list.
   * @param {function(string): {das:number, arr:number}} options.getRepeatTiming - Returns live DAS/ARR for an action.
   * @param {number} options.columns - Board width (used for instant ARR).
   * @param {function(string): void} options.onSystemAction - Called for pause/restart/start.
   */
  constructor({ keybinds, getRepeatTiming, columns, onSystemAction }) {
    this.getRepeatTiming = getRepeatTiming;
    this.columns = columns;
    this.onSystemAction = onSystemAction;
    this.enabled = true;
    this.codeToAction = new Map();
    Object.entries(keybinds).forEach(([action, codes]) => codes.forEach((code) => this.codeToAction.set(code, action)));
    this.heldCodes = new Set();
    this.heldActions = new Set();
    this.repeatState = new Map();
    this.pendingActions = [];
    this.activeHorizontal = null;
  }

  /**
   * Starts listening for keyboard events.
   * @param {Window|HTMLElement} target - Event target (usually window).
   * @returns {void}
   */
  attachKeyboard(target) {
    target.addEventListener('keydown', (event) => this.handleKeyDown(event), { passive: false });
    target.addEventListener('keyup', (event) => this.handleKeyUp(event));
    window.addEventListener('blur', () => this.releaseAll());
  }

  /**
   * Handles a keydown event.
   * @param {KeyboardEvent} event - Browser event.
   * @returns {void}
   */
  handleKeyDown(event) {
    const action = this.codeToAction.get(event.code);
    if (!action) return;
    event.preventDefault();
    if (event.repeat) return;
    this.heldCodes.add(event.code);
    this.press(action);
  }

  /**
   * Handles a keyup event.
   * @param {KeyboardEvent} event - Browser event.
   * @returns {void}
   */
  handleKeyUp(event) {
    const action = this.codeToAction.get(event.code);
    if (!action) return;
    this.heldCodes.delete(event.code);
    const stillHeld = [...this.heldCodes].some((code) => this.codeToAction.get(code) === action);
    if (!stillHeld) this.release(action);
  }

  /**
   * Registers that an action began (key down or touch down).
   * @param {string} action - Action name.
   * @returns {void}
   */
  press(action) {
    if (!this.enabled) return;
    if (action === 'pause' || action === 'restart' || action === 'start') { this.onSystemAction(action); return; }
    if (this.heldActions.has(action)) return;
    this.heldActions.add(action);
    if (action === 'moveLeft' || action === 'moveRight' || action === 'softDrop') {
      this.repeatState.set(action, { frames: 0, justPressed: true });
      if (action !== 'softDrop') this.activeHorizontal = action;
    }
    const instantSoftDrop = action === 'softDrop' && this.getRepeatTiming(action).arr <= 0;
    this.pendingActions.push(instantSoftDrop ? 'softDropInstant' : action);
  }

  /**
   * Registers that an action ended (key up or touch up).
   * @param {string} action - Action name.
   * @returns {void}
   */
  release(action) {
    this.heldActions.delete(action);
    this.repeatState.delete(action);
    if (this.activeHorizontal === action) {
      const other = action === 'moveLeft' ? 'moveRight' : 'moveLeft';
      this.activeHorizontal = this.heldActions.has(other) ? other : null;
    }
  }

  /** Releases every held input (used on blur or when input is disabled). @returns {void} */
  releaseAll() {
    this.heldCodes.clear();
    [...this.heldActions].forEach((action) => this.release(action));
    this.pendingActions = [];
  }

  /**
   * Enables or disables input processing.
   * @param {boolean} enabled - New state.
   * @returns {void}
   */
  setEnabled(enabled) {
    this.enabled = enabled;
    if (!enabled) this.releaseAll();
  }

  /**
   * Produces the actions to apply during this logic frame. Call exactly once per logic frame.
   * @returns {string[]} Ordered list of action names (may contain duplicates for instant ARR).
   */
  poll() {
    const actions = this.pendingActions;
    this.pendingActions = [];
    this.repeatState.forEach((state, action) => {
      const isHorizontal = action !== 'softDrop';
      if (isHorizontal && action !== this.activeHorizontal) return;
      if (state.justPressed) { state.justPressed = false; return; }
      state.frames++;
      const { das, arr } = this.getRepeatTiming(action);
      if (state.frames < das) return;
      if (arr <= 0 && isHorizontal) {
        for (let i = 0; i < this.columns; i++) actions.push(action);
      } else if (arr <= 0) {
        actions.push('softDropInstant'); // soft drop with no delay: reach the floor every frame while held
      } else if ((state.frames - das) % arr === 0) {
        actions.push(action);
      }
    });
    return actions;
  }
}
// ==== LOGIC END

 * SECTION 6 — RENDERING HELPERS (layout, textures, geometry)
 * ===================================================================== */

/** Converts between grid coordinates and world space. */
class BoardLayout {
  /**
   * Creates a layout.
   * @param {{columns:number, visibleRows:number, hiddenRows:number}} boardConfig - Board dimensions.
   */
  constructor(boardConfig) {
    this.columns = boardConfig.columns;
    this.rows = boardConfig.visibleRows + boardConfig.hiddenRows;
    this.visibleRows = boardConfig.visibleRows;
  }

  /**
   * Converts a (possibly fractional) grid cell to its world-space center.
   * @param {number} column - Grid column.
   * @param {number} row - Grid row (0 is the top hidden row).
   * @param {THREE.Vector3} [target] - Vector to write into.
   * @returns {THREE.Vector3} World position of the cell center.
   */
  gridToWorld(column, row, target = new THREE.Vector3()) {
    return target.set(column - (this.columns - 1) / 2, this.rows - 1 - row + 0.5, 0);
  }
}

/**
 * Creates a soft radial glow texture used for sparks, flashes and rain streaks.
 * @returns {THREE.CanvasTexture} Texture with a white center fading to transparent.
 */
function createGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const context = canvas.getContext('2d');
  const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.25, 'rgba(255,255,255,0.75)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  context.fillStyle = gradient;
  context.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(canvas);
}

/**
 * Creates a subtle grid texture for the back wall of the well.
 * @returns {THREE.CanvasTexture} Repeating grid texture (one tile per cell).
 */
function createGridTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 128;
  const context = canvas.getContext('2d');
  context.fillStyle = '#0a0d16';
  context.fillRect(0, 0, 128, 128);
  context.strokeStyle = '#1d2740';
  context.lineWidth = 3;
  context.strokeRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = 4;
  return texture;
}

/**
 * Creates the dark gradient used as distant backdrop.
 * @returns {THREE.CanvasTexture} Vertical gradient texture.
 */
function createBackdropTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 16; canvas.height = 256;
  const context = canvas.getContext('2d');
  const gradient = context.createLinearGradient(0, 0, 0, 256);
  gradient.addColorStop(0, '#0b1020');
  gradient.addColorStop(0.55, '#0a0b16');
  gradient.addColorStop(1, '#14091c');
  context.fillStyle = gradient;
  context.fillRect(0, 0, 16, 256);
  return new THREE.CanvasTexture(canvas);
}

/**
 * Builds a beveled cube so metallic surfaces catch highlights on their edges.
 * @param {number} size - Edge length on X and Y.
 * @param {number} depth - Thickness on Z.
 * @param {number} bevel - Bevel radius.
 * @returns {THREE.BufferGeometry} Centered geometry.
 */
function createBeveledCubeGeometry(size, depth, bevel) {
  const half = size / 2 - bevel;
  const shape = new THREE.Shape();
  shape.moveTo(-half, -half);
  shape.lineTo(half, -half);
  shape.lineTo(half, half);
  shape.lineTo(-half, half);
  shape.closePath();
  const extrudeDepth = depth - 2 * bevel;
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: extrudeDepth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 1,
  });
  geometry.translate(0, 0, -extrudeDepth / 2);
  return geometry;
}

/**
 * Builds a procedural HDR-ish studio environment (softboxes and colored strips)
 * and prefilters it so metal surfaces have something interesting to reflect.
 * @param {THREE.WebGLRenderer} renderer - Renderer used to bake the environment.
 * @returns {THREE.Texture} Prefiltered environment map.
 */
function createStudioEnvironment(renderer) {
  const environmentScene = new THREE.Scene();
  environmentScene.background = new THREE.Color(0x06070c);
  /**
   * Adds an emissive rectangle to the environment scene.
   * @param {number} color - Hex color.
   * @param {number} intensity - Brightness multiplier (values above 1 act as HDR).
   * @param {number[]} size - [width, height].
   * @param {number[]} position - [x, y, z].
   * @returns {void}
   */
  const addPanel = (color, intensity, size, position) => {
    const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide, toneMapped: false });
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), material);
    panel.position.set(...position);
    panel.lookAt(0, 0, 0);
    environmentScene.add(panel);
  };
  addPanel(0xffffff, 6, [14, 14], [0, 18, 4]);
  addPanel(0x35d9ff, 4, [3, 20], [-16, 2, 4]);
  addPanel(0xff3fb4, 4, [3, 20], [16, 2, 4]);
  addPanel(0xffb060, 2.5, [18, 5], [0, -3, 16]);
  addPanel(0x7a8cff, 1.5, [22, 8], [0, 4, -16]);
  const generator = new THREE.PMREMGenerator(renderer);
  const environmentMap = generator.fromScene(environmentScene, 0.02).texture;
  generator.dispose();
  return environmentMap;
}

/* =====================================================================
 * SECTION 7 — SCENE: STAGE, BOARD VIEW, CAMERA, GRAPHICS PIPELINE
 * ===================================================================== */

/** Final color-grading shader: tone map, chromatic aberration, vignette, grain, gamma. */
const FINAL_GRADE_SHADER = {
  uniforms: {
    tDiffuse: { value: null },
    exposure: { value: 1.1 },
    vignette: { value: 0.5 },
    aberration: { value: 0.0008 },
    grain: { value: 0.03 },
    time: { value: 0 },
    whiteout: { value: 0 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: [
    'uniform sampler2D tDiffuse; uniform float exposure; uniform float vignette; uniform float aberration; uniform float grain; uniform float time; uniform float whiteout;',
    'varying vec2 vUv;',
    'vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }',
    'void main(){',
    '  vec2 dir = vUv - 0.5;',
    '  vec2 offset = dir * aberration * (1.0 + dot(dir, dir) * 4.0);',
    '  vec3 color = vec3(texture2D(tDiffuse, vUv + offset).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - offset).b);',
    '  color = aces(color * exposure);',
    '  color = mix(color, vec3(1.0), clamp(whiteout, 0.0, 1.0));',
    '  color *= 1.0 - vignette * smoothstep(0.3, 1.0, length(dir) * 1.45);',
    '  float noise = fract(sin(dot(vUv * vec2(1913.0, 1077.0) + time, vec2(12.9898, 78.233))) * 43758.5453);',
    '  color += (noise - 0.5) * grain;',
    '  gl_FragColor = vec4(pow(max(color, 0.0), vec3(1.0 / 2.2)), 1.0);',
    '}',
  ].join('\n'),
};

/**
 * Builds the static scenery: back wall, frame, reflective floor, backdrop and lights.
 * @param {THREE.Scene} scene - Scene to populate.
 * @param {BoardLayout} layout - Board layout.
 * @param {Object} config - The CONFIG object.
 * @returns {{floorReflector:?THREE.Object3D, floorProxy:?THREE.Mesh, plainFloor:THREE.Mesh, keyLight:THREE.SpotLight, flashLight:THREE.PointLight, orbitLights:THREE.PointLight[], setReflectionsEnabled:function(boolean):void}} Handles needed at runtime.
 */
function buildStage(scene, layout, config) {
  const columns = layout.columns;
  const wellHeight = layout.visibleRows;

  // Back wall with grid texture.
  const gridTexture = createGridTexture();
  gridTexture.repeat.set(columns, wellHeight);
  const backWall = new THREE.Mesh(
    new THREE.PlaneGeometry(columns, wellHeight),
    new THREE.MeshStandardMaterial({ map: gridTexture, metalness: 0.7, roughness: 0.5, envMapIntensity: 0.5 })
  );
  backWall.position.set(0, wellHeight / 2, -0.55);
  backWall.receiveShadow = true;
  scene.add(backWall);

  // Metallic frame: side rails, base, glowing inlays.
  const railMaterial = new THREE.MeshStandardMaterial({ color: 0x20263a, metalness: 1, roughness: 0.28, envMapIntensity: 1.3 });
  [-1, 1].forEach((side) => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.5, wellHeight + 0.6, 1.3), railMaterial);
    rail.position.set(side * (columns / 2 + 0.25), wellHeight / 2 + 0.05, 0);
    scene.add(rail);
    const inlay = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, wellHeight, 0.08),
      new THREE.MeshBasicMaterial({ color: side < 0 ? new THREE.Color(0x35d9ff).multiplyScalar(2.2) : new THREE.Color(0xff3fb4).multiplyScalar(2.2), toneMapped: false })
    );
    inlay.position.set(side * (columns / 2 - 0.02), wellHeight / 2, 0.66);
    scene.add(inlay);
  });
  const base = new THREE.Mesh(new THREE.BoxGeometry(columns + 1.4, 0.5, 1.5), railMaterial);
  base.position.set(0, -0.25, 0);
  scene.add(base);

  // Floor: a dark glossy plain floor, swapped for a real mirror (Reflector) when reflections are switched on.
  // The mirror is only created on first use, so setups that keep reflections off never pay for it.
  const floorGeometry = new THREE.PlaneGeometry(90, 64);
  const plainFloor = new THREE.Mesh(floorGeometry, new THREE.MeshStandardMaterial({ color: 0x151824, metalness: 0.85, roughness: 0.4, envMapIntensity: 0.5 }));
  plainFloor.rotation.x = -Math.PI / 2;
  plainFloor.position.set(0, -0.5, 8);
  scene.add(plainFloor);

  // Distant backdrop.
  const backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 120),
    new THREE.MeshBasicMaterial({ map: createBackdropTexture(), fog: false, toneMapped: false })
  );
  backdrop.position.set(0, 24, -30);
  scene.add(backdrop);

  // Lighting: hemisphere fill, shadow-casting key spot, two colored orbiting points, flash light for explosions.
  scene.add(new THREE.HemisphereLight(0x7080b8, 0x120a1c, 0.3));
  const keyLight = new THREE.SpotLight(0xfff2e0, 1.7, 90, 0.55, 0.6, 1);
  keyLight.position.set(6, 28, 22);
  keyLight.target.position.set(0, 10, 0);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024); // placeholder: the Shadow quality setting picks the real size
  keyLight.shadow.camera.near = 10;
  keyLight.shadow.camera.far = 70;
  keyLight.shadow.bias = -0.0004;
  scene.add(keyLight, keyLight.target);

  const cyanLight = new THREE.PointLight(0x35d9ff, 1.1, 40, 2);
  const magentaLight = new THREE.PointLight(0xff3fb4, 1.0, 40, 2);
  scene.add(cyanLight, magentaLight);
  const flashLight = new THREE.PointLight(0xffc880, 0, 60, 2);
  flashLight.position.set(0, 10, 7);
  scene.add(flashLight);

  const stage = { floorReflector: null, floorProxy: null, plainFloor, keyLight, flashLight, orbitLights: [cyanLight, magentaLight] };

  /**
   * Switches between the mirror floor and the plain floor (creating the mirror on first use).
   * @param {boolean} enabled - True for real-time reflections.
   * @returns {void}
   */
  stage.setReflectionsEnabled = (enabled) => {
    if (enabled && !stage.floorReflector) {
      const size = config.graphics.reflections.textureSize;
      const reflector = new THREE.Reflector(floorGeometry, { color: 0x2c3042, textureWidth: size, textureHeight: size, multisample: 2 });
      reflector.rotation.x = -Math.PI / 2;
      reflector.position.copy(plainFloor.position);
      scene.add(reflector);
      // Cheap stand-in used while depth is rendered for the depth-of-field pass (avoids a second mirror render).
      const proxy = new THREE.Mesh(floorGeometry, new THREE.MeshStandardMaterial({ color: 0x0b0d14 }));
      proxy.rotation.copy(reflector.rotation);
      proxy.position.copy(reflector.position);
      proxy.visible = false;
      scene.add(proxy);
      stage.floorReflector = reflector;
      stage.floorProxy = proxy;
    }
    if (stage.floorReflector) stage.floorReflector.visible = enabled;
    plainFloor.visible = !enabled;
  };
  return stage;
}

/** Renders the locked stack, the active piece and the ghost piece using instanced metal cubes. */
class BoardView {
  /**
   * Creates the view and adds its meshes to the scene.
   * @param {THREE.Scene} scene - Target scene.
   * @param {BoardLayout} layout - Board layout.
   * @param {GameEngine} engine - Engine whose state is displayed.
   * @param {Object} config - The CONFIG object.
   * @param {Object<string, number>} settings - Runtime settings (reads smoothPieceMovement).
   */
  constructor(scene, layout, engine, config, settings) {
    this.settings = settings;
    this.layout = layout;
    this.engine = engine;
    this.config = config;
    this.dummy = new THREE.Object3D();
    this.scratchColor = new THREE.Color();
    this.scratchVector = new THREE.Vector3();
    this.lastBoardVersion = -1;
    this.smoothedOrigin = null;
    this.smoothedSerial = -1;

    const { cell } = config.graphics;
    this.geometry = createBeveledCubeGeometry(cell.size, cell.depth, cell.bevel);
    const metalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, metalness: cell.metalness, roughness: cell.roughness,
      clearcoat: cell.clearcoat, clearcoatRoughness: 0.12, envMapIntensity: cell.envMapIntensity,
    });
    this.lockedMesh = this.createInstancedMesh(this.geometry, metalMaterial, layout.columns * layout.rows);
    this.activeMesh = this.createInstancedMesh(this.geometry, metalMaterial, 4);
    this.activeMesh.receiveShadow = false;

    const ghostMaterial = new THREE.MeshBasicMaterial({
      transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    });
    this.ghostMesh = this.createInstancedMesh(this.geometry, ghostMaterial, 4);
    this.ghostMesh.castShadow = false;
    [this.lockedMesh, this.activeMesh, this.ghostMesh].forEach((mesh) => scene.add(mesh));
  }

  /**
   * Creates an instanced mesh with dynamic buffers and per-instance color.
   * @param {THREE.BufferGeometry} geometry - Shared geometry.
   * @param {THREE.Material} material - Shared material.
   * @param {number} capacity - Max instance count.
   * @returns {THREE.InstancedMesh} Configured mesh with zero visible instances.
   */
  createInstancedMesh(geometry, material, capacity) {
    const mesh = new THREE.InstancedMesh(geometry, material, capacity);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.setColorAt(0, this.scratchColor.set(0xffffff));
    mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    mesh.castShadow = true;
    mesh.frustumCulled = false;
    mesh.count = 0;
    return mesh;
  }

  /**
   * Writes one instance (position + color).
   * @param {THREE.InstancedMesh} mesh - Target mesh.
   * @param {number} index - Instance slot.
   * @param {number} column - Fractional grid column.
   * @param {number} row - Fractional grid row.
   * @param {number} colorHex - Instance color.
   * @returns {void}
   */
  setInstance(mesh, index, column, row, colorHex) {
    this.layout.gridToWorld(column, row, this.scratchVector);
    this.dummy.position.copy(this.scratchVector);
    this.dummy.updateMatrix();
    mesh.setMatrixAt(index, this.dummy.matrix);
    mesh.setColorAt(index, this.scratchColor.set(colorHex));
  }

  /**
   * Marks an instanced mesh's buffers as needing upload.
   * @param {THREE.InstancedMesh} mesh - Mesh to flag.
   * @returns {void}
   */
  flagForUpload(mesh) {
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
  }

  /**
   * Updates all meshes from the current engine state. Call once per rendered frame.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  update(deltaSeconds) {
    if (this.engine.board.version !== this.lastBoardVersion) this.rebuildLockedCells();
    this.updateActivePiece(deltaSeconds);
    this.updateGhostPiece();
  }

  /** Rebuilds instances for every locked cell. @returns {void} */
  rebuildLockedCells() {
    const { cells } = this.engine.board;
    let count = 0;
    cells.forEach((rowCells, row) => rowCells.forEach((type, column) => {
      if (type) this.setInstance(this.lockedMesh, count++, column, row, this.config.pieceColors[type]);
    }));
    this.lockedMesh.count = count;
    this.flagForUpload(this.lockedMesh);
    this.lastBoardVersion = this.engine.board.version;
  }

  /**
   * Positions the active piece, easing its origin so motion looks fluid (and blurs well).
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  updateActivePiece(deltaSeconds) {
    const piece = this.engine.piece;
    if (!piece) { this.activeMesh.count = 0; return; }
    if (!this.smoothedOrigin || this.smoothedSerial !== this.engine.pieceSerial) {
      this.smoothedOrigin = { x: piece.x, y: piece.y };
      this.smoothedSerial = this.engine.pieceSerial;
    }
    // With smoothing disabled the blend factor is 1, so the piece snaps to its logical cell every frame.
    const blend = this.settings.smoothPieceMovement
      ? 1 - Math.exp(-deltaSeconds * this.config.graphics.pieceSmoothingPerSecond)
      : 1;
    this.smoothedOrigin.x = lerp(this.smoothedOrigin.x, piece.x, blend);
    this.smoothedOrigin.y = lerp(this.smoothedOrigin.y, piece.y, blend);
    const color = this.config.pieceColors[piece.type];
    PIECE_DEFINITIONS[piece.type].rotations[piece.rotation].forEach(([cx, cy], index) => {
      this.setInstance(this.activeMesh, index, this.smoothedOrigin.x + cx, this.smoothedOrigin.y + cy, color);
    });
    this.activeMesh.count = 4;
    this.flagForUpload(this.activeMesh);
  }

  /** Positions the translucent landing preview. @returns {void} */
  updateGhostPiece() {
    const piece = this.engine.piece;
    const ghostCells = this.engine.getGhostCells();
    const sameAsPiece = piece && ghostCells.length === 4 && ghostCells[0].y === getPieceCells(piece)[0].y;
    if (!piece || sameAsPiece) { this.ghostMesh.count = 0; return; }
    const color = this.config.pieceColors[piece.type];
    ghostCells.forEach((cell, index) => this.setInstance(this.ghostMesh, index, cell.x, cell.y, color));
    this.ghostMesh.count = 4;
    this.flagForUpload(this.ghostMesh);
  }
}

/** Controls the camera: framing, idle sway and trauma-based shake. */
class CameraRig {
  /**
   * Creates the rig.
   * @param {THREE.PerspectiveCamera} camera - Camera to drive.
   * @param {Object} config - The CONFIG object.
   * @param {Object<string, number>} settings - Runtime settings (reads cameraShakeStrength).
   */
  constructor(camera, config, settings) {
    this.camera = camera;
    this.config = config;
    this.settings = settings;
    this.target = new THREE.Vector3(0, config.graphics.cameraTargetHeight, 0);
    this.distance = 40;
    this.trauma = 0;
    this.frozen = false;          // true while the camera must stay perfectly still (nuclear explosion)
    this.frozenTimeOffset = 0;    // total time spent frozen, so the idle sway resumes without a jump
  }

  /**
   * Chooses a camera distance so the board fits the viewport.
   * @param {number} aspect - Viewport width / height.
   * @returns {void}
   */
  fitToViewport(aspect) {
    const { framing, fieldOfViewDegrees } = this.config.graphics;
    const frame = aspect < 1 ? framing.portrait : framing.landscape;
    const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(fieldOfViewDegrees / 2));
    this.distance = Math.max(frame.height / (2 * tanHalfFov), frame.width / (2 * tanHalfFov * aspect));
  }

  /**
   * Freezes or releases the camera. While frozen it holds perfectly still (no sway, shake or movement)
   * and ignores new shake; on release the idle sway continues from where it stopped, with no jump.
   * @param {boolean} frozen - True to freeze, false to release.
   * @returns {void}
   */
  setFrozen(frozen) {
    this.frozen = frozen;
    if (frozen) this.trauma = 0;
  }

  /**
   * Adds shake energy (clamped to 1).
   * @param {number} amount - Trauma to add (0..1).
   * @returns {void}
   */
  addTrauma(amount) {
    if (this.frozen) return;
    this.trauma = Math.min(1, this.trauma + amount);
  }

  /**
   * Updates camera pose for this frame.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @param {number} time - Elapsed time in seconds.
   * @returns {void}
   */
  update(deltaSeconds, time) {
    if (this.frozen) { this.frozenTimeOffset += deltaSeconds; this.trauma = 0; }
    const poseTime = time - this.frozenTimeOffset;
    const shakeConfig = this.config.effects.shake;
    this.trauma = Math.max(0, this.trauma - shakeConfig.decayPerSecond * deltaSeconds);
    const intensity = this.trauma * this.trauma * this.settings.cameraShakeStrength;
    const shakeTime = poseTime * shakeConfig.frequency;
    const pitch = THREE.MathUtils.degToRad(this.config.graphics.cameraPitchDegrees);

    this.camera.position.set(
      this.target.x + Math.sin(poseTime * 0.23) * 1.1 + smoothNoise(shakeTime, 1) * shakeConfig.maxOffset * intensity,
      this.target.y + Math.sin(pitch) * this.distance + Math.sin(poseTime * 0.31) * 0.35 + smoothNoise(shakeTime, 7) * shakeConfig.maxOffset * intensity,
      this.target.z + Math.cos(pitch) * this.distance + smoothNoise(shakeTime, 13) * shakeConfig.maxOffset * 0.6 * intensity
    );
    this.camera.lookAt(this.target);
    this.camera.rotateZ(smoothNoise(shakeTime, 21) * shakeConfig.maxRotationRadians * intensity);
  }
}

/** Owns the WebGL renderer, scene, camera and the post-processing chain. */
class GraphicsEngine {
  /**
   * Creates the full graphics pipeline.
   * @param {HTMLElement} container - Element that receives the canvas.
   * @param {BoardLayout} layout - Board layout.
   * @param {Object} config - The CONFIG object.
   * @param {Object<string, number>} settings - Runtime settings.
   * @param {{bloom:number, flash:number, chromaticAberration:number}} impulses - Transient post-fx boosts written by effects.
   */
  constructor(container, layout, config, settings, impulses) {
    this.container = container;
    this.config = config;
    this.settings = settings;
    this.impulses = impulses;
    this.pixelRatio = Math.min(window.devicePixelRatio || 1, config.graphics.pixelRatio.max);
    this.frameTimeSamples = [];
    this.sampleClock = 0;

    this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.shadowMap.autoUpdate = false;
    container.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(config.graphics.fieldOfViewDegrees, 1, 0.5, 220);
    this.cameraRig = new CameraRig(this.camera, config, settings);
    this.scene.environment = createStudioEnvironment(this.renderer);
    this.stage = buildStage(this.scene, layout, config);
    this.composer = this.createComposer();
    this.appliedQuality = { reflections: null, antiAliasing: -1, shadow: -1 }; // last values pushed to the GPU
    this.resize();
    this.syncQualitySettings();
  }

  /**
   * Builds the post chain: scene → depth of field → motion blur → bloom → grading.
   * @returns {THREE.EffectComposer} Configured composer.
   */
  createComposer() {
    const { graphics } = this.config;
    const target = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 0 }); // the Anti-aliasing setting applies the real sample count right after creation
    const composer = new THREE.EffectComposer(this.renderer, target);
    composer.addPass(new THREE.RenderPass(this.scene, this.camera));

    this.bokehPass = new THREE.BokehPass(this.scene, this.camera, { focus: 40, aperture: graphics.depthOfField.aperture, maxblur: graphics.depthOfField.maxBlur });
    // The mirror floor is replaced by a simple proxy while depth is rendered, avoiding a second reflection pass.
    const renderBokeh = this.bokehPass.render.bind(this.bokehPass);
    this.bokehPass.render = (...args) => {
      const { floorReflector, floorProxy } = this.stage;
      if (!floorReflector || !floorReflector.visible) { renderBokeh(...args); return; } // mirror off: the plain floor renders normally
      floorReflector.visible = false;
      floorProxy.visible = true;
      renderBokeh(...args);
      floorReflector.visible = true;
      floorProxy.visible = false;
    };
    composer.addPass(this.bokehPass);

    this.motionBlurPass = new THREE.AfterimagePass(0.5);
    composer.addPass(this.motionBlurPass);

    this.bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(4, 4), graphics.bloom.strength, graphics.bloom.radius, graphics.bloom.threshold);
    composer.addPass(this.bloomPass);

    this.gradePass = new THREE.ShaderPass(FINAL_GRADE_SHADER);
    composer.addPass(this.gradePass);
    return composer;
  }

  /** Resizes renderer, composer and camera to the container. @returns {void} */
  resize() {
    const width = Math.max(1, this.container.clientWidth);
    const height = Math.max(1, this.container.clientHeight);
    this.renderer.setPixelRatio(this.pixelRatio);
    this.renderer.setSize(width, height);
    this.composer.setPixelRatio(this.pixelRatio);
    this.composer.setSize(width, height);
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.cameraRig.fitToViewport(this.camera.aspect);
  }

  /**
   * Applies the Reflections, Anti-aliasing and Shadow quality settings to the GPU pipeline. Cheap to call every
   * frame: it only does work when a value has changed since the last call.
   * @returns {void}
   */
  syncQualitySettings() {
    const { graphics } = this.config;
    const applied = this.appliedQuality;
    const reflections = Boolean(this.settings.reflectionsEnabled);
    if (reflections !== applied.reflections) {
      this.stage.setReflectionsEnabled(reflections);
      applied.reflections = reflections;
    }
    const antiAliasingIndex = clamp(Math.round(this.settings.antiAliasingLevel), 0, graphics.antiAliasingLevels.length - 1);
    if (antiAliasingIndex !== applied.antiAliasing) {
      this.applyAntiAliasing(graphics.antiAliasingLevels[antiAliasingIndex]);
      applied.antiAliasing = antiAliasingIndex;
    }
    const shadowIndex = clamp(Math.round(this.settings.shadowQuality), 0, graphics.shadowQualityLevels.length - 1);
    if (shadowIndex !== applied.shadow) {
      this.applyShadowQuality(graphics.shadowQualityLevels[shadowIndex]);
      applied.shadow = shadowIndex;
    }
  }

  /**
   * Sets the multisample anti-aliasing level of the scene render targets (capped to the GPU maximum).
   * @param {number} samples - Requested MSAA sample count (0 = off).
   * @returns {void}
   */
  applyAntiAliasing(samples) {
    const capped = Math.min(samples, this.renderer.capabilities.maxSamples || 0);
    [this.composer.renderTarget1, this.composer.renderTarget2].forEach((target) => {
      target.samples = capped;
      target.dispose(); // forces the framebuffer to be rebuilt with the new sample count on next use
    });
  }

  /**
   * Sets the shadow map resolution, or turns shadows off entirely.
   * @param {number} size - Shadow map edge length in pixels (0 = shadows off).
   * @returns {void}
   */
  applyShadowQuality(size) {
    const light = this.stage.keyLight;
    if (size === 0) { light.castShadow = false; return; }
    light.castShadow = true;
    if (light.shadow.mapSize.x !== size) {
      light.shadow.mapSize.set(size, size);
      if (light.shadow.map) { light.shadow.map.dispose(); light.shadow.map = null; } // re-created at the new size
    }
  }

  /**
   * Lowers resolution when the frame rate stays below target, keeping interaction smooth.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @returns {void}
   */
  monitorPerformance(deltaSeconds) {
    const quality = this.config.graphics.adaptiveQuality;
    if (!quality.enabled) return;
    this.frameTimeSamples.push(deltaSeconds);
    this.sampleClock += deltaSeconds;
    if (this.sampleClock < quality.sampleSeconds) return;
    const averageFps = this.frameTimeSamples.length / this.sampleClock;
    this.frameTimeSamples = [];
    this.sampleClock = 0;
    if (averageFps < quality.lowFpsThreshold && this.pixelRatio > this.config.graphics.pixelRatio.min) {
      this.pixelRatio = Math.max(this.config.graphics.pixelRatio.min, this.pixelRatio - quality.pixelRatioStep);
      this.resize();
    }
  }

  /**
   * Renders one frame through the whole post chain.
   * @param {number} deltaSeconds - Frame time in seconds.
   * @param {number} time - Elapsed time in seconds.
   * @returns {void}
   */
  render(deltaSeconds, time) {
    this.syncQualitySettings();
    this.monitorPerformance(deltaSeconds);
    this.cameraRig.update(deltaSeconds, time);
    this.animateLights(time);

    const { graphics } = this.config;
    const { settings, impulses } = this;
    this.bokehPass.enabled = settings.depthOfFieldStrength > 0;
    this.bokehPass.uniforms.focus.value = this.cameraRig.distance;
    this.bokehPass.uniforms.aperture.value = graphics.depthOfField.aperture * settings.depthOfFieldStrength;
    this.motionBlurPass.enabled = settings.motionBlurStrength > 0.001;
    this.motionBlurPass.uniforms.damp.value = settings.motionBlurStrength;
    this.bloomPass.strength = (graphics.bloom.strength + impulses.bloom) * settings.bloomStrength;
    this.bloomPass.enabled = this.bloomPass.strength > 0.001;

    const gradeUniforms = this.gradePass.uniforms;
    gradeUniforms.exposure.value = graphics.finalGrade.exposure;
    gradeUniforms.vignette.value = graphics.finalGrade.vignette;
    gradeUniforms.grain.value = graphics.finalGrade.grain;
    gradeUniforms.aberration.value = graphics.finalGrade.baseChromaticAberration + impulses.chromaticAberration;
