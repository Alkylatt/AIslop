const it=(l,k,on=true)=>`<div class="mi${on?'':' off'}" data-k="${k}">${l}</div>`;
cm.innerHTML=it('複製','copy',!!sel)+(ok?it('貼上','paste')+it('刪除','del',!!sel):'')+'<hr>'+it('檢視網頁原始碼<span>Ctrl+U</span>','src');
cm.style.display='block';cm.style.left=Math.max(0,Math.min(e.clientX,innerWidth-cm.offsetWidth-6))+'px';cm.style.top=Math.max(0,Math.min(e.clientY,innerHeight-cm.offsetHeight-6))+'px'});
cm.onmousedown=e=>e.preventDefault();
cm.onclick=async e=>{const m=e.target.closest('.mi');if(!m||m.classList.contains('off'))return;const k=m.dataset.k,{ed,sel}=cmS;hideCM();
if(k==='copy'){clip=sel;try{await navigator.clipboard.writeText(sel)}catch(_){try{document.execCommand('copy')}catch(__){}}}
if(k==='paste'&&ed){let t='';try{t=await navigator.clipboard.readText()}catch(_){}if(!t)t=clip;ed.focus();ed.setRangeText(t,ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input',{bubbles:true}))}
if(k==='del'&&ed){ed.focus();ed.setRangeText('',ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input',{bubbles:true}))}
if(k==='src')viewSrc()};
document.addEventListener('mousedown',e=>{if(!cm.contains(e.target))hideCM()});addEventListener('scroll',hideCM,{passive:true});addEventListener('blur',hideCM);addEventListener('resize',hideCM);
document.addEventListener('copy',()=>{const a=document.activeElement,t=isEd(a)?a.value.substring(a.selectionStart,a.selectionEnd):String(getSelection());if(t)clip=t});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCM();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='u'){e.preventDefault();viewSrc()}});
document.addEventListener('mousedown',e=>{if(e.button===3||e.button===4)e.preventDefault()});
document.addEventListener('mouseup',e=>{if(e.button===3){e.preventDefault();$('#bk').click()}else if(e.button===4)e.preventDefault()});
document.addEventListener('auxclick',e=>{if(e.button===3||e.button===4)e.preventDefault()});
if(new Date().getHours()<3)document.body.classList.add('late');
console.log('%cElysium 極樂追憶 · 紀念與傳承服務','font:600 14px serif;color:#7d5fd0','\n珍藏昨日，溫暖明天。');
go('/',false);
</script></body></html>
