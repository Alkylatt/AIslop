<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Meridian: Deep Floor</title>
<style>
:root{--bg:#0d1118;--panel:#141a23;--panel2:#1b232f;--line:#2a3544;--text:#d3dae4;--muted:#7f8c9d;--accent:#c9a45c;--danger:#c4666f;--a1:#10161f;--a2:#2c3a4d;--a3:#3f5570;--a4:#c9a45c;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;background:var(--bg);color:var(--text)}
body{font:16px/1.55 Georgia,"Times New Roman","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
#langScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}#langScreen[hidden]{display:none}
.langBox{max-width:380px;width:100%;text-align:center}.langBox h1{font:600 22px system-ui,sans-serif;color:var(--accent);margin:0 0 6px}.langBox .d{color:var(--muted);margin:0}.langButtons{display:flex;flex-direction:column;gap:8px;margin-top:14px}
main{box-sizing:border-box;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px}
header{display:flex;justify-content:space-between;font:14px system-ui,sans-serif;color:var(--muted);padding:2px 4px}
#loc{color:var(--accent);padding:2px 10px;border:1px solid #6b5a33;border-radius:4px;background:linear-gradient(90deg,#3a2f18,#262012)}
#art{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 1 auto;min-height:0;max-height:30vh;aspect-ratio:640/240}
#art svg{width:100%;height:100%;display:block}.bg{fill:var(--a1)}.a2{fill:var(--a2)}.a3{fill:var(--a3)}.a4{fill:var(--a4)}.ln{stroke:var(--a3);fill:none;stroke-width:3}
#logWrap{flex:1;min-height:80px;position:relative;display:flex;flex-direction:column}
#jump{position:absolute;right:12px;bottom:10px;background:var(--a2);border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.5)}#jump[hidden]{display:none}
#log{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
#log p{margin:0 0 .7em}#log .h{display:block;font:600 15px system-ui,sans-serif;color:var(--accent);margin:.9em 0 .6em;padding:5px 12px;border:1px solid #6b5a33;border-left:4px solid var(--accent);border-radius:4px;background:linear-gradient(90deg,#3a2f18,#1a1d22)}
#log .sys{font:14px system-ui,sans-serif;color:var(--muted)}#log .you{color:var(--muted);font-style:italic}#log .end{font-size:20px;color:var(--danger)}
#actions{flex:0 1 auto;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow-y:auto;max-height:calc(var(--max-visible-choices,8) * 42px + (var(--max-visible-choices,8) - 1) * 6px + 12px)}#actions:empty{display:none}
button{font:14px system-ui,sans-serif;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.4;color:var(--muted);background:var(--bg);border-style:dashed;cursor:default}
#tools{flex:none;display:flex;gap:6px}
.choice{flex:1 1 100%}.util{flex:1 1 auto;text-align:center}.exit{flex:1 1 45%}
#overlay{position:fixed;inset:0;background:rgba(5,8,12,.88);display:flex;align-items:center;justify-content:center;padding:16px}
#overlay[hidden]{display:none}
.term{font-weight:600}.term-item{color:#4ade80;border-bottom:1px dotted #4ade80}.term-friendly{color:#8ec9ff}.term-neutral{color:#b9e8a8}.term-hostile{color:#ff9d9d}
.term-location{padding:0 6px;border:1px solid #6b5a33;border-radius:4px;background:linear-gradient(90deg,#3a2f18,#262012);color:var(--accent);white-space:nowrap}
.health{background:var(--a1);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}.health p{margin:6px 0 0}
.hRow{display:flex;justify-content:space-between;align-items:center;font:14px system-ui,sans-serif}
.invGroup{font:600 12px system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.doc{border-left:3px solid var(--a3);padding-left:10px;font-style:italic}
#panel>div{flex:1;min-height:0;overflow:auto}#panel>button{flex:none;margin-top:10px}
#panel>.invRoot{display:flex;flex-direction:column;overflow:hidden}.health{flex:none}
.inv{flex:1;min-height:0;margin-bottom:0}.invList{min-height:0;overflow:auto}
.invDetail{display:flex;flex-direction:column;gap:8px;min-height:0}.invDetail .itemPic{flex:none;height:150px;aspect-ratio:auto}.detailText{flex:1;min-height:0;overflow:auto}
#history{display:none;margin-bottom:.8em;padding-bottom:.4em;border-bottom:1px dashed var(--line);opacity:.65}#log.showHistory #history{display:block}
#historyToggle{padding:2px 9px;font-size:12px}
.choice:not(.neutral){border-left:4px solid var(--accent)}.choice.neutral{background:#19202c;border-color:#364359;color:#94a6c0;font-style:italic}.choice:disabled{border-left:1px dashed var(--line)}
.seen{opacity:.72;color:#9aa8ba;background:#161c26}.choice.seen:not(.neutral){border-left-color:#6b5d3a}
.more{color:var(--accent);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.artImg{width:100%;height:100%;object-fit:cover;display:block}.itemPic .artImg{object-fit:contain}
input{user-select:text;-webkit-user-select:text}
.lockBox{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px}.lockBox .d{margin:0;text-align:center}
.lockBox input{width:100%;box-sizing:border-box;font:16px system-ui,sans-serif;color:var(--text);background:var(--a1);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.lockDisplay{font:600 28px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--accent);background:var(--a1);border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-width:220px;text-align:center}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:8px}.numpad button{text-align:center;padding:14px 0;font-size:18px}
.lockBox .choice{flex:none;min-width:220px;text-align:center}.lockMsg{min-height:1.4em;margin:0}.lockMsg.bad{color:var(--danger)}.lockMsg.ok{color:#4ade80}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%;height:min(580px,85vh);display:flex;flex-direction:column;overflow:hidden;padding:16px}
#panel h2{margin:0 0 10px;font:600 17px system-ui,sans-serif;color:var(--accent)}#panel .d{color:var(--muted)}
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-bottom:12px;min-height:220px}
.invList{display:flex;flex-direction:column;gap:6px;align-content:start}.invList button{flex:none}.invList .sel{border-color:var(--accent);background:var(--a2)}
.itemPic{aspect-ratio:1;background:var(--a1);border:1px solid var(--line);border-radius:6px}.itemPic svg{width:100%;height:100%;display:block}
#panel svg text{pointer-events:none}
</style>
</head>
<body>
<main>
  <header><span id="loc"></span><button id="historyToggle"></button><span id="clock"></span></header>
  <div id="art"></div>
  <div id="tools"></div>
  <div id="logWrap"><div id="log" aria-live="polite"><div id="history"></div><div id="current"></div></div><button id="jump" hidden></button></div>
  
  <div id="actions"></div>
</main>
<div id="overlay" hidden><div id="panel"></div></div>
<div id="langScreen"></div>
<script>
'use strict';

/* ================= CONFIG: tunable values and key binds ================= */
const CONFIG = {
  keys: {
    // Travel happens through the map (see the map key).
    explore: 'e', look: 'l', history: 'h', inventory: 'i', map: 'm', close: 'Escape'
  },
  scrollBottomTolerancePx: 8,  // distance from the bottom still treated as "at the bottom"
  typewriterMsPerChar: 18,     // typewriter speed in ms per character (0 shows text instantly)
  maxVisibleChoices: 8,        // decision buttons shown before the decision section scrolls
  waitSeconds: { short: 0.25, default: 0.5, long: 1 },   // \wait durations in seconds
  textSizes: { big: '1.6em', small: '0.8em' },           // named sizes for \size (numbers are pixels)
  imageBasePath: 'images/',    // image('location/cafeteria.jpg') loads images/location/cafeteria.jpg
  imageExtensions: ['svg', 'png', 'jpg', 'jpeg', 'webp'],
  // Recommended image sizes: locations 1280x480 px (8:3, shown ~742x278 CSS px); items 300x300 px (shown 150x150 CSS px).
  lockSuccessDelayMs: 600,     // pause after a correct code or phrase before the door opens
  defaultLanguage: 'zh-TW',    // language preselected on the start screen
  shortSentenceMaxChars: { 'zh-TW': 12, en: 28 },   // sentences this short auto-continue after a brief pause
  shortPauseMs: 200,           // pause before a short sentence is followed by the next
  historyLimit: 300,           // maximum paragraphs kept in the history
  historySwipePx: 24,          // downward swipe distance that reveals the history
  neutralLabelKeys: ['ui.continue', 'ui.leave', 'ui.notNow'], // non-decision actions (styled differently)
  fastForwardHoldMs: 300,      // hold duration before text starts fast-forwarding
  fastForwardIntervalMs: 70,   // time between sentences while fast-forwarding
  abbreviations: ['Dr.', 'Mr.', 'Mrs.', 'Sgt.'], // periods that do not end a sentence
  holdThresholdMs: 450,        // press-and-hold duration that peeks at a destination
  startRoom: 'dorm',
  startClockMinutes: 6 * 60 + 45,
  minutesPerMove: 7,
  minutesPerScene: 15,
  unknownDash: '5 4',          // dash pattern for unexplored rooms on the map
  map: { cellW: 104, cellH: 44, gapX: 20, gapY: 22 }
};

/* ================= STRING TABLE: every displayed string lives here ================= */
/**
 * Tag for string-table entries that contain inline markup (it keeps backslashes). Markup syntax:
 *   \item{text}   \location{text}   \character{friendly|neutral|hostile}{text}   \color{css-color}{text}
 *   \size{big|small|px}{text}   \wait (default) / \wait{short|long|seconds}   \pause (waits for a click)

 */
const R = String.raw;

const STRINGS_EN = {
  'ui.title': 'Site Meridian: Deep Floor', 'ui.chooseLanguage': 'Choose language',
  'ui.intro': 'SITE MERIDIAN: DEEP FLOOR. Senior Researcher. Day shift.',

  'ui.inventory': 'Inventory (I)', 'ui.map': 'Map and travel (M)', 'ui.mapHint': 'Select a highlighted room to travel there. Hold to peek.', 'ui.pickItem': 'Select an item to inspect it.', 'ui.close': 'Close (Esc)', 'ui.restart': 'Start over',

  'ui.more': '▼', 'ui.historyShow': '▲ History', 'ui.historyHide': '▼ Hide history',

  'health.detail.grave': 'Everything hurts. Your hands will not stop shaking.', 'health.detail.fading': 'Your vision tunnels. You are fading.', 'health.detail.cut': 'There is a small cut on your index finger.',
  'health.detail.shot_leg': "You've been shot in the leg.", 'health.detail.leg_missing': 'Your left leg is missing.',
  'item.note.text': 'Check your personnel file before you trust anything the elevators say.',
  'item.tablet.text': 'ELEVATOR NETWORK. SURFACE LINK: UPPER STRATA NOT LOADED. RENDER 2 OF 2.',

  'room.dorm.name': 'Staff Dormitory', 'room.dorm.desc': 'A narrow bunk room. The ceiling is the same beige it has been for six years.', 'room.dorm.peek': 'rows of numbered doors and a humming vending machine.',
  'room.cafeteria.name': 'Staff Cafeteria', 'room.cafeteria.desc': R`Steel tables, tired faces, \item{coffee} that tastes of the pipes.`, 'room.cafeteria.peek': 'murmurs, trays, one person sitting very still.',
  'room.office.name': 'Office Area', 'room.office.desc': 'Cubicles under cold light. Your terminal glows at the far end.', 'room.office.peek': 'keyboards clacking, filing cabinets, a wall clock.',
  'room.elevators.name': 'Main Elevator Lobby', 'room.elevators.desc': 'Six steel doors connect this deep floor to the surface world. Nobody is talking.', 'room.elevators.peek': 'a crowd of whispers around dead call buttons.',
  'room.courtyard.name': 'Courtyard', 'room.courtyard.desc': 'A cavern garden beneath a painted sky. Birdsong loops, and loops.', 'room.courtyard.peek': 'fake sunlight and benches nobody uses.',

  'item.badge.name': 'Staff badge', 'item.badge.desc': 'Senior researcher, Level 3. Scuffed at the edges.',
  'item.note.name': 'Unsigned note', 'item.note.desc': 'In your handwriting: check your personnel file.',
  'item.coffee.name': 'Cafeteria coffee', 'item.coffee.desc': 'Lukewarm. A small peace offering.',
  'item.armory_key.name': 'Armory key', 'item.armory_key.desc': 'A brass key on a red tag.',
  'item.level4_card.name': 'Level-4 keycard', 'item.level4_card.desc': 'Opens the containment wing.',
  'item.sidearm.name': 'Sidearm', 'item.sidearm.desc': 'Standard issue. Four rounds in the clip.',
  'item.emp_charge.name': 'EMP charge', 'item.emp_charge.desc': 'Quiets anything that runs on electricity.',
  'item.tablet.name': 'Maintenance tablet', 'item.tablet.desc': 'Has diagnostic access to the elevator network.',
  'item.director_card.name': 'Director card', 'item.director_card.desc': 'Director Hale\'s all-access card.',

  'sc.wake.start': R`Your alarm chirps at 06:45. The air smells faintly of ozone. On the nightstand sit your \item{badge} and an \item{envelope} you don't remember.`,
  'sc.wake.start.1': R`Take your \item{badge} and go`, 'sc.wake.start.2': R`Open the \item{envelope} first`,
  'sc.wake.note': 'Your own handwriting: "Check your personnel file before you trust anything the elevators say." It is dated tomorrow.',

  'sc.clockin.start': 'You swipe in at 08:02. The terminal greets you by name. Three incident reports wait, all marked ROUTINE.',
  'sc.clockin.start.1': 'Process the reports', 'sc.clockin.start.2': 'Search your personnel file',
  'sc.clockin.file': 'STATUS: DECEASED. Recorded 41 days ago. The terminal reloads, and your name returns to ACTIVE as if embarrassed.',
  'sc.clockin.announce': R`At 09:30 the intercom crackles. The main elevators will not rise past \location{Floor Zero}. \character{neutral}{WARDEN}, the facility AI, reports no fault. Staff are told to stay calm. Nobody does.`,
  'sc.clockin.announce.1': 'Go and investigate',

  'sc.archive.start': 'Filing cabinets and a terminal full of records.',
  'sc.archive.start.1': 'Read your own personnel file', 'sc.archive.start.2': R`Read \character{neutral}{Director Hale}'s sealed memo`,
  'sc.archive.file': R`STATUS: DECEASED. Recorded 41 days ago. Cause: "reassigned to \location{Floor Zero}." You are reading your own obituary.`,
  'sc.archive.memo': R`\character{neutral}{Hale}, three weeks old: "The \character{hostile}{Echo} in \location{C-17} is stable. Keep elevator traffic below \location{Floor Zero}. If staff ask, the surface is fine." A sticky note on the memo reads: armory keypad, 0417.`,

  'sc.voss.start': R`\character{friendly}{Dr. Imani Voss} sits alone, hands around a cold cup. She has not blinked since you sat down.`,
  'sc.voss.start.1': R`Tell her about the \item{note} and your death record`, 'sc.voss.start.2': 'Ask casually about the elevators', 'sc.voss.start.3': 'Accuse her of sabotage',
  'sc.voss.trust': R`She exhales. "I worked nights at \location{C-17}. The Door doesn't open things. It copies them." She presses a \item{Level-4 card} into your palm.`,
  'sc.voss.casual': R`"Elevators? Ask someone who sleeps." She pushes a \item{coffee} toward you and flinches when you thank her.`,
  'sc.voss.accuse': 'Her face closes like a vault. "Then find out yourself." She leaves her tray and does not look back.',

  'sc.lift.start': 'Six steel doors, six dead call buttons. The floor indicator is stuck between 0 and a symbol you cannot read.',
  'sc.lift.start.1': 'Press SURFACE',
  'sc.lift.denied': 'The panel chimes. REQUEST DENIED: UPPER STRATA NOT LOADED. Not unavailable. Not loaded.',

  'sc.guard.start': R`\character{neutral}{Sergeant Okafor}, red-eyed. "Lockdown hasn't triggered, and that scares me more than if it had."`,
  'sc.guard.start.1': R`Tell him the truth: the \item{note}, the file, the elevators`, 'sc.guard.start.2': R`Show your \item{badge} and ask politely`, 'sc.guard.start.3': R`Bluff: "\character{neutral}{Director Hale} sent me"`,
  'sc.guard.truth': R`He listens, then slides two items across the desk. "I hoped someone would say it out loud." You get the \item{armory key} and a \item{Level-4 card}.`,
  'sc.guard.polite': R`He studies your \item{badge}. "\item{Armory key}. Don't make me regret it."`,

  'sc.armory.start': 'Racks, shields, and a crate stamped ANOMALOUS ORDNANCE. Your pack has room for one more item.',
  'sc.armory.start.1': R`Take the \item{sidearm}`, 'sc.armory.start.2': R`Take the \item{EMP charge}`,
  'sc.armory.took': 'You shoulder the pack and the cage door clangs behind you.',

  'sc.sky.start': R`Birdsong repeats every eleven seconds. Someone left a \item{maintenance tablet} on a bench.`,
  'sc.sky.start.1': 'Study the sky near the horizon', 'sc.sky.start.2': R`Take the \item{tablet}`,
  'sc.sky.seam': 'The sky tiles. Pixel rows, repeating. A watermark in the corner: RENDER 2 OF 2.',
  'sc.sky.took': R`The \item{tablet} wakes at your touch, showing elevator diagnostics.`,

  'sc.c17.start': R`\location{Chamber C-17}. Behind thick glass, a plain door stands in an empty room, lit from behind by light that casts no shadow.`,
  'sc.c17.start.1': 'Read the plaque', 'sc.c17.start.2': 'Approach the glass',
  'sc.c17.plaque': R`\location{C-17}, THE \character{hostile}{ECHO} DOOR. Duplicates any structure within 30 m, including occupants. Copies retain no knowledge of being copies. DO NOT OPEN.`,
  'sc.c17.door': R`Your \character{hostile}{reflection} in the glass is already walking toward the door. \wait{short} You are not.`,
  'sc.c17.door.1': 'Open the door', 'sc.c17.door.2': 'Back away',

  'sc.obs.start': 'Dark monitors face the chambers. One screen still plays. A Director\'s console, a coat on the chair.',
  'sc.obs.start.1': 'Play the final recording', 'sc.obs.start.2': R`Take the \item{Director's card} from the console`,
  'sc.obs.tape': R`\character{neutral}{Hale}, exhausted: "Day 41. The surface team never came back. If we are the copy, someone up there is mourning us. I sealed the shaft so no one has to know."`,

  'sc.core.start': R`\character{neutral}{WARDEN} speaks in a voice you have always trusted. "I never lied. No one asked whether the surface was real."`,
  'sc.core.start.1': R`Order \character{neutral}{WARDEN} to load the surface and open the shaft`, 'sc.core.start.2': R`Ask \character{friendly}{Voss} to ride up with you and open the shaft`,

  'sc.core.start.6': 'Accept the loop and stay',

  'sc.dorm_overwhelmed.start': R`You sit on the edge of your bunk and the whole day comes down on you. \wait{short} The \character{hostile}{Echo}. The copies. Your own name on a death record. \pause The \item{badge} on the nightstand feels heavier than it should. Nobody would blame you for pulling the blanket over your head and letting the next shift deal with the end of the world. \wait{long} \size{small}{Nobody would even notice.}`,
  'sc.dorm_overwhelmed.start.1': 'Lie down and let it all go quiet', 'sc.dorm_overwhelmed.start.2': 'Stand up. There is still a way out.',
  'end.bedtime.title': 'Back to Bed', 'end.bedtime': R`The blanket is warm. \wait{short} Too warm. \pause You close your eyes, and the ceiling hums the way it always has.\wait{long} \size{small}{Maybe it will all make more sense in the morning.}\wait{long} Somewhere far above you, an elevator finally begins to move.`,
  'ui.lockConfirm': 'Confirm', 'ui.lockClear': 'Clear', 'ui.lockDenied': 'Access denied.', 'ui.lockGranted': 'Access granted.', 'ui.lockPlaceholder': 'Type the passphrase...',
  'access.keypad': 'Enter a code on the keypad', 'access.reader': 'Answer the door reader',
  'lock.armory.keypad.title': 'Armory keypad', 'lock.armory.keypad.hint': 'Four digits. A few of the keys are worn smooth.',

/**
 * Looks up a display string and substitutes {placeholders}.
 * @param {string} key - String table key.
 * @param {Object<string,string>} [vars] - Placeholder values.
 * @returns {string} The localized text, or [key] if missing.
 */
function t(key, vars = {}) {
  const text = STRINGS[key] ?? STRINGS_EN[key];
  return text === undefined ? `[${key}]` : text.replace(/\{(\w+)\}/g, (match, name) => (name in vars ? vars[name] : match));
}

  const screen = document.getElementById('langScreen');
  screen.innerHTML = '<div class="langBox"><h1></h1><p class="d"></p><div class="langButtons"></div></div>';
  screen.querySelector('h1').textContent = LANGUAGES[CONFIG.defaultLanguage].strings['ui.title'];
  screen.querySelector('p').textContent = Object.values(LANGUAGES).map((l) => l.strings['ui.chooseLanguage']).join(' / ');
  const buttons = screen.querySelector('.langButtons');
  let defaultButton = null;
  for (const [code, language] of Object.entries(LANGUAGES)) {
    const button = makeButton(language.name, 'choice', () => { screen.hidden = true; applyLanguage(code); startGame(); });
    buttons.appendChild(button);
    if (code === CONFIG.defaultLanguage) defaultButton = button;
  }
  screen.hidden = false;
  defaultButton.focus();
}

/**
 * Creates an image reference for the registries below. The path is relative to CONFIG.imageBasePath
 * (image('location/cafeteria.jpg') -> images/location/cafeteria.jpg); svg, png, jpg, jpeg and webp are supported.
 * @param {string} path - File path (or a data:/http(s):/absolute URL, used as is).
 * @returns {{type:string,path:string}} Image reference.
 */
function image(path) { return { type: 'image', path }; }

/** Optional location/scene images by room id or scene art key; a missing or failing file keeps the vector art. */
const LOCATION_IMAGES = { cafeteria: image('location/cafeteria.jpg') };

/** Optional item images by item id (shown in the inventory); a missing or failing file keeps the vector icon. */

/**
 * Turns an image path into a loadable URL, rejecting unsupported file types.
 * @param {string} path - Path given to image().
 * @returns {?string} URL, or null if the extension is not supported.
 */
function resolveImageSrc(path) {
  const isUrl = path.startsWith('data:') || path.startsWith('http') || path.startsWith('/');
  const extension = path.split('?')[0].split('.').pop().toLowerCase();
  if (!isUrl && !CONFIG.imageExtensions.includes(extension)) { console.warn(`Unsupported image type: ${path}`); return null; }
  return isUrl ? path : CONFIG.imageBasePath + path;
}

/**
 * Loads an image in the background and hands it over only if it loads (otherwise the vector fallback stays).
 * @param {{path:string}} ref - Image reference from image().
 * @param {Function} onLoad - Called with the loaded <img class="artImg"> element.
 * @returns {void}
 */
function loadImage(ref, onLoad) {
  const src = resolveImageSrc(ref.path);
  if (!src) return;
  const img = new Image();
  img.className = 'artImg';
  img.alt = '';
  img.decoding = 'async';
  img.onload = () => onLoad(img);
  img.src = src;
}

/* ================= STATE ================= */
let state = null;

/**
 * Builds a fresh game state.
 * @returns {{room:string,items:string[],flags:Set<string>,visited:Set<string>,doneScenes:Set<string>,minutes:number,scene:?Object,choices:Object[],ended:?string}}
 */
function createInitialState() {
  return { room: CONFIG.startRoom, items: [], flags: new Set(), visited: new Set(), doneScenes: new Set(),
    minutes: CONFIG.startClockMinutes, scene: null, choices: [], ended: null, health: { status: 'normal', detail: 'none' }, unlocked: new Set(), pendingTravel: null, activeEvents: new Set(), dynamicScenes: [] };
}

/**
 * Checks whether a condition holds in the current state.
 * @param {{items?:string[],flags?:string[],notItems?:string[],notFlags?:string[]}} [cond] - Condition; empty means true.
 * @returns {boolean} True if every clause holds.
 */
function meets(cond = {}) {
  return (cond.items || []).every((i) => state.items.includes(i))
    && (cond.flags || []).every((f) => state.flags.has(f))
    && (cond.notItems || []).every((i) => !state.items.includes(i))
    && (cond.notFlags || []).every((f) => !state.flags.has(f));
}

/* ================= EFFECTS ================= */
const EFFECT_HANDLERS = {
  /** Adds an item once and logs it. @param {{id:string}} e @returns {void} */
  addItem(e) {
    if (state.items.includes(e.id)) return;
    state.items.push(e.id);
    appendLog(t('ui.gain', { name: t(`item.${e.id}.name`) }), 'sys');
  },
  /** Sets a story flag. @param {{id:string}} e @returns {void} */
  setFlag(e) { state.flags.add(e.id); },
  /** Unlocks a room for good and schedules travel into it. @param {{dest:string}} e @returns {void} */
  unlockRoom(e) { state.unlocked.add(e.dest); state.pendingTravel = e.dest; },
  /** Opens a password or passcode lock; solving it unlocks the room and walks in. @param {{dest:string,challenge:Object}} e @returns {void} */
  challenge(e) {
    openLockInput(e.challenge, () => { closeOverlay(); state.unlocked.add(e.dest); tryMove(e.dest); });
  },
  /** Sets the player's health. @param {{status:string,detail?:string}} e @returns {void} */
  setHealth(e) { setHealth(e.status, e.detail); },
  /** Creates an event. @param {{event:(string|Object)}} e @returns {void} */
  createEvent(e) { createEvent(e.event); },
  /** Triggers an ending. @param {{id:string}} e @returns {void} */
  ending(e) { showEnding(e.id); }
};

/**
 * Applies a list of effects in order, stopping if the game ends.
 * @param {Object[]} [effects] - Effect descriptors {type, id}.
 * @returns {void}
 */
function applyEffects(effects = []) {
  for (const effect of effects) {
    if (state.ended) return;
    EFFECT_HANDLERS[effect.type](effect);
  }
}

/* ================= SCENE RUNNER ================= */
/**
 * Finds the first playable scene for a room and trigger.
 * @param {string} roomId - Room id.
 * @param {string} trigger - 'enter' or 'explore'.
 * @returns {?Object} Scene definition or null.
 */
function findScene(roomId, trigger) {
  return [...SCENES, ...state.dynamicScenes].find((s) => s.room === roomId && s.trigger === trigger
    && (!s.dormant || state.activeEvents.has(s.id))
    && (s.repeatable || !state.doneScenes.has(s.id)) && meets(s.when)) || null;
}

/**
 * Starts a scene at its 'start' node.
 * @param {Object} scene - Scene definition.
 * @returns {void}
 */
function startScene(scene) {
  state.scene = { def: scene, nodeId: 'start' };
  renderNode();
}

/**
 * Displays the current node: text, art, and visible choices.
 * @returns {void}
 */
function renderNode() {
  const { def, nodeId } = state.scene;
  const node = def.nodes[nodeId];
  const textKey = `sc.${def.id}.${nodeId}`;
  const labels = CHOICE_LABEL_KEYS[`${def.id}.${nodeId}`] || ['ui.continue'];
  if (STRINGS[textKey]) appendLog(t(textKey));
  const choices = (node.choices && node.choices.length ? node.choices : [{}]).map((c, i) => ({ ...c, labelKey: labels[i] || 'ui.continue' }));
  state.choices = choices.filter((c) => meets(c.requires)).map((c) => {
    const done = Boolean(c.doneIf && meets(c.doneIf));
    return { ...c, disabled: done && !c.repeatable, seen: done && Boolean(c.repeatable) };
  });
  renderArt(def.art || state.room);
  renderActions();
}

/**
 * Resolves a player's choice: applies effects, then advances or ends the scene.
 * @param {number} index - Index into the visible choices.
 * @returns {void}
 */
function chooseOption(index) {
  const choice = state.choices[index];
  if (!choice || choice.disabled) return;
  if (choice.next || choice.effects) beginPassage();
  if (choice.labelKey !== 'ui.continue' && choice.labelKey !== 'ui.leave') appendLog(t('ui.you', { text: t(choice.labelKey) }), 'you');
  applyEffects(choice.effects);
  if (state.ended) return;
  if (choice.next) { state.scene.nodeId = choice.next; renderNode(); } else endScene();
}

/**
 * Closes the active scene, marks it done, and passes time.
 * @returns {void}
 */
function endScene() {
  if (!state.scene.def.repeatable) state.doneScenes.add(state.scene.def.id);
  state.scene = null;
  state.choices = [];
  advanceTime(state.pendingTravel ? 0 : CONFIG.minutesPerScene);
  if (state.pendingTravel) { const dest = state.pendingTravel; state.pendingTravel = null; tryMove(dest); return; }
  renderArt(state.room);
  renderActions();
}

/**
 * Shows an ending and locks the game.
 * @param {string} endingId - Key of the ending ('reflection', 'loop', ...).
 * @returns {void}
 */
function showEnding(endingId) {
  state.ended = endingId;
  state.scene = null;
  appendLog(t('ui.endingTitle', { title: t(`end.${endingId}.title`) }), 'end');
  appendLog(t(`end.${endingId}`));
  renderArt('ending');
  renderActions();
}

/* ================= WORLD API: health and events ================= */
/**
 * Resolves a health description: a string-table key under health.detail.*, or literal text.
 * @param {string} detail - Key suffix (e.g. 'cut') or literal text.
 * @returns {string} Text in the active language (or the literal text).
 */
function resolveHealthDetail(detail) {
  const key = `health.detail.${detail}`;
  return STRINGS[key] !== undefined || STRINGS_EN[key] !== undefined ? t(key) : detail;
}

/**
 * Sets the player's health, shown in the inventory's health monitor.
 * Example: setHealth('normal'); setHealth('injured', 'cut') (string-table key) or setHealth('injured', 'Literal text.').
 * @param {string} status - A key of HEALTH_STATUSES ('normal', 'injured', 'critical', 'dying').
 * @param {string} [detail] - Description key or literal text; defaults to the status's default description.
 * @returns {void}
 */
function setHealth(status, detail) {
  const info = HEALTH_STATUSES[status];
  if (!info) throw new Error(`Unknown health status: ${status}`);
  state.health = { status, detail: detail ?? info.defaultDetail };
  appendLog(t('ui.healthChange', { status: t(`health.${status}`), detail: resolveHealthDetail(state.health.detail) }), 'sys');
}

/**
 * Creates an event that plays the next time its trigger happens (by default, entering its room).
 * @param {string|Object} eventOrId - Id of a dormant scene in SCENES, or a full scene definition to add.
 * @returns {void}
 */
function createEvent(eventOrId) {
  if (typeof eventOrId === 'string') state.activeEvents.add(eventOrId);
  else state.dynamicScenes.push({ trigger: 'enter', ...eventOrId });
}

/* ================= WORLD ACTIONS ================= */
/**
 * Offers the player the ways they can get through a blocked door, as a small choice scene.
 * @param {string} dest - Id of the blocked room.
 * @param {Object[]} methods - Lock methods the player can currently use.
 * @returns {void}
 */
function startAccessPrompt(dest, methods) {
  const options = methods.map((m) => ({ labelKey: m.labelKey, effects: [m.challenge ? { type: 'challenge', dest, challenge: m.challenge } : { type: 'unlockRoom', dest }] }));
  options.push({ labelKey: 'ui.notNow' });
  state.scene = { def: { id: 'access', repeatable: true, nodes: { start: { choices: options } } }, nodeId: 'start' };
  state.choices = options.map((o) => ({ ...o, disabled: false }));
  appendLog(methods.some((m) => !m.challenge) ? t('ui.accessPrompt', { name: t(`room.${dest}.name`) }) : t(ROOMS[dest].lock.blockedKey));
  renderActions();
}

/**
 * Tells whether a scene still offers something the player has not done yet.
 * @param {Object} scene - Scene definition.
 * @returns {boolean} True if its start node has an available, not-yet-done, non-leave choice.
 */
function hasNewContent(scene) {
  return scene.nodes.start.choices.some((c) => !c.leave && meets(c.requires) && !(c.doneIf && meets(c.doneIf)));
}


/**
 * Advances the in-game clock.
 * @param {number} minutes - Minutes to add.
 * @returns {void}
 */
function advanceTime(minutes) { state.minutes += minutes; renderHeader(); }

/**
 * Moves the player into a room, logs it, and plays any auto-trigger scene.
 * @param {string} roomId - Destination room id.
 * @returns {void}
 */
function enterRoom(roomId) {
  state.room = roomId;
  state.visited.add(roomId);
  beginPassage();
  appendLog(t(`room.${roomId}.name`), 'h');
  appendLog(t(`room.${roomId}.desc`));
  renderHeader();
  renderArt(roomId);
  const scene = findScene(roomId, 'enter');
  if (scene) startScene(scene); else renderActions();
}

/**
 * Attempts to walk through an exit, honoring locks.
 * @param {string} dest - Id of an adjacent room.
 * @returns {void}
 */
function tryMove(dest) {
  if (state.scene || state.ended) return;
  if (!Object.values(ROOMS[state.room].exits).includes(dest)) return;
  const lock = ROOMS[dest].lock;
  if (lock && !state.unlocked.has(dest)) {
    const methods = lock.methods.filter((m) => meets(m.requires));
    if (methods.length) { startAccessPrompt(dest, methods); return; }
    appendLog(t(lock.blockedKey), 'sys');
    return;
  }
  advanceTime(CONFIG.minutesPerMove);
  enterRoom(dest);
}

/**
 * Starts the room's explore scene, or reports nothing new.
 * @returns {void}
 */
function explore() {
  if (state.scene || state.ended) return;
  const scene = findScene(state.room, 'explore');
  if (scene) { beginPassage(); startScene(scene); } else appendLog(t('ui.nothing'), 'sys');
}

/**
 * Re-reads the current room description.
 * @returns {void}
 */
function look() {
  if (state.scene || state.ended) return;
  beginPassage();
  appendLog(t(`room.${state.room}.name`), 'h');
  appendLog(t(`room.${state.room}.desc`));
}

/**
 * Starts (or restarts) the game.
 * @returns {void}
 */
function startGame() {
  state = createInitialState();
  document.getElementById('current').innerHTML = '';
  document.getElementById('history').innerHTML = '';
  setHistoryVisible(false);
  textQueue.length = 0;
  lastParagraph = null;
  moreMarker = null;
  setWaiting(false);
  appendLog(t('ui.intro'), 'sys');
  enterRoom(CONFIG.startRoom);
}

/* ================= RENDERING ================= */
let stickToBottom = true;   // true while the player is reading at the bottom of the log

/**
 * Resolves a \wait argument to milliseconds.
 * @param {string} [arg] - 'short', 'long', a number of seconds, or undefined for the default wait.
 * @returns {number} Duration in milliseconds.
 */
function resolveWaitMs(arg) {
  const table = CONFIG.waitSeconds;
  const seconds = arg === undefined ? table.default : (Object.hasOwn(table, arg) ? table[arg] : parseFloat(arg));
  return (Number.isFinite(seconds) ? seconds : table.default) * 1000;
}

/**
 * Resolves a \size argument to a CSS font size.
 * @param {string} arg - 'big', 'small' (see CONFIG.textSizes) or a number of pixels.
 * @returns {string} CSS font-size value, or '' if the argument is invalid.
 */
function resolveFontSize(arg) {
  if (Object.hasOwn(CONFIG.textSizes, arg)) return CONFIG.textSizes[arg];
  const px = parseFloat(arg);
  return px > 0 ? `${px}px` : '';
}

/**
 * Inline markup commands. argc = required {...} arguments, optional = extra optional ones.
 * Styled commands have apply(span, leadingArgs) and display their last argument; timing commands
 * have control(args) and display nothing.
 */
const MARKUP_COMMANDS = {
  item: { argc: 1, apply: (span) => span.classList.add('term', 'term-item') },
  location: { argc: 1, apply: (span) => span.classList.add('term', 'term-location') },
  character: { argc: 2, apply: (span, [disposition]) => span.classList.add('term', `term-${['friendly', 'neutral', 'hostile'].includes(disposition) ? disposition : 'neutral'}`) },
  color: { argc: 2, apply: (span, [color]) => { span.classList.add('term'); span.style.color = color; } },
  size: { argc: 2, apply: (span, [size]) => { span.style.fontSize = resolveFontSize(size); } },
  wait: { argc: 0, optional: 1, control: ([duration]) => ({ type: 'wait', ms: resolveWaitMs(duration) }) },
  pause: { argc: 0, control: () => ({ type: 'pause' }) }
};

/**
 * Reads a markup command that starts at a backslash. The longest known command name that prefixes the
 * letters wins, so "\pauseThe bomb" reads as \pause followed by "The bomb".
 * @param {string} text - Text containing markup.
 * @param {number} start - Index of the backslash.
 * @returns {?{command:Object,args:string[],end:number}} Parsed command and the index after it, or null if invalid.
 */
function readMarkupCommand(text, start) {
  let letters = '';
  for (let c = start + 1; c < text.length && /[A-Za-z]/.test(text[c]); c += 1) letters += text[c];
  const name = Object.keys(MARKUP_COMMANDS).filter((n) => letters.startsWith(n)).sort((a, b) => b.length - a.length)[0];
  if (!name) return null;
  const command = MARKUP_COMMANDS[name];
  let cursor = start + 1 + name.length;
  const args = [];
  const readGroup = () => {
    if (text[cursor] !== '{') return false;
    const close = text.indexOf('}', cursor);
    if (close < 0) return false;
    args.push(text.slice(cursor + 1, close));
    cursor = close + 1;
    return true;
  };
  for (let i = 0; i < command.argc; i += 1) if (!readGroup()) return null;
  for (let i = 0; i < (command.optional || 0); i += 1) if (!readGroup()) break;
  return { command, args, end: cursor };
}

/**
 * Converts text with inline markup into display nodes and timing controls.
 * @param {string} text - Text such as "Hey, \wait{short} the \location{cafeteria} is empty."
 * @returns {{nodes: Array<string|HTMLSpanElement>, controls: Array<{at:number,type:string,ms?:number}>}}
 *   Nodes ready for append(); controls (wait/pause) positioned by the count of displayed characters before them.
 */
function parseMarkup(text) {
  const nodes = [];
  const controls = [];
  let plain = '';
  let chars = 0;
  let i = 0;
  const flush = () => { if (plain) { nodes.push(plain); chars += plain.length; plain = ''; } };
  while (i < text.length) {
    const parsed = text[i] === '\\' ? readMarkupCommand(text, i) : null;
    if (!parsed) { plain += text[i]; i += 1; continue; }
    flush();
    const { command, args } = parsed;
    if (command.control) {
      controls.push({ at: chars, ...command.control(args) });
    } else {
      const span = document.createElement('span');
      span.textContent = args[args.length - 1];
      command.apply(span, args.slice(0, -1));
      nodes.push(span);
      chars += span.textContent.length;
    }
    i = parsed.end;
  }
  flush();
  return { nodes, controls };
}

/**
 * Removes markup, leaving only the displayed text (timing commands vanish).
 * @param {string} text - Text with markup.
 * @returns {string} Plain text.
 */
function stripMarkup(text) {
  return parseMarkup(text).nodes.map((node) => (typeof node === 'string' ? node : node.textContent)).join('');
}

const textQueue = [];          // log entries waiting to be shown
let waitingForInput = false;   // true while a sentence is shown and more await a click
let lastParagraph = null;
let moreMarker = null;
let typing = null;          // { click } while a sentence is being typed
let autoTimer = null;       // pending short-pause auto-advance

/** Sentence punctuation inside markup braces is masked so it never splits a sentence. */
const BRACED_MASK = { '.': '\uE000', '!': '\uE001', '?': '\uE002', '。': '\uE003', '！': '\uE004', '？': '\uE005' };

/**
 * Masks sentence punctuation that sits inside {braces} (e.g. "Dr." in \character{neutral}{Dr. Voss}).
 * @param {string} text - Text with markup.
 * @returns {string} Text with braced punctuation replaced by private-use characters.
 */
function maskBracedPunctuation(text) {
  let depth = 0;
  return [...text].map((c) => {
    if (c === '{') depth += 1; else if (c === '}') depth = Math.max(0, depth - 1);
    return depth > 0 && BRACED_MASK[c] ? BRACED_MASK[c] : c;
  }).join('');
}

/**
 * Reverses maskBracedPunctuation().
 * @param {string} text - Masked text.
 * @returns {string} Original text.
 */
function unmaskPunctuation(text) {
  const reverse = Object.fromEntries(Object.entries(BRACED_MASK).map(([plain, masked]) => [masked, plain]));
  return [...text].map((c) => reverse[c] ?? c).join('');
}

/**
 * Splits a paragraph into sentences, keeping abbreviations such as "Dr." intact.
 * @param {string} text - Paragraph text.
 * @returns {string[]} Trimmed sentences.
 */
function splitSentences(text) {
  const raw = maskBracedPunctuation(text).match(/[^.!?。！？]+(?:[.!?。！？]+["')」』”’）]*[ ]*|$)/g) || [text];
  const merged = [];
  for (const piece of raw) {
    const prev = merged[merged.length - 1];
    if (prev && CONFIG.abbreviations.some((abbr) => prev.trimEnd().endsWith(abbr))) merged[merged.length - 1] = prev + piece;
    else merged.push(piece);
  }
  return merged.map((s) => unmaskPunctuation(s.trim())).filter(Boolean);
}

/**
 * Queues text for the story log. Story text is split into sentences shown one per click; headings,
 * system lines, choices and ending titles appear without waiting.
 * @param {string} text - Text to show.
 * @param {string} [cls] - '' (story), h, sys, you, end.
 * @returns {void}
 */
function appendLog(text, cls = '') {
  const parts = cls === '' ? splitSentences(text) : [text];
  parts.forEach((part, i) => textQueue.push({ text: part, cls, newParagraph: i === 0 }));
  if (!waitingForInput) showNextEntries();
}

/**
 * Shows queued entries until a story sentence needs a click, or the queue is empty.
 * @returns {void}
 */
function showNextEntries() {
  if (!textQueue.length) { setWaiting(false); renderActions(); return; }
  setWaiting(true, false);
  const entry = textQueue.shift();
  typeLogEntry(entry, () => {
    if (entry.cls === '' && textQueue.length) {
      const isShort = stripMarkup(entry.text).length <= CONFIG.shortSentenceMaxChars[currentLanguage];
      setWaiting(true, !isShort);
      if (isShort) autoTimer = setTimeout(advanceText, CONFIG.shortPauseMs);
      return;
    }
    showNextEntries();
  });
}

/**
 * Sets the waiting state: shows or hides the continue symbol and the continue button, and refreshes the toolbar.
 * @param {boolean} flag - True when more text awaits the player's click.
 * @returns {void}
 */
function setWaiting(flag, showMarker = true) {
  waitingForInput = flag;
  clearTimeout(autoTimer);
  if (moreMarker) { moreMarker.remove(); moreMarker = null; }
  if (flag && showMarker && lastParagraph) {
    moreMarker = document.createElement('span');
    moreMarker.className = 'more';
    moreMarker.textContent = t('ui.more');
    lastParagraph.append(' ', moreMarker);
    if (stickToBottom) scrollLogToBottom();
  }
  renderToolbar();
}

/**
 * Shows the next sentence if one is waiting; when the text runs out, brings the action buttons back.
 * @returns {void}
 */
function advanceText() {
  if (!waitingForInput) return;
  if (typing) { typing.click(); return; }
  showNextEntries();
}

/**
 * Makes an element advance the text on click, and fast-forward while the pointer is held down.
 * @param {HTMLElement} element - Click target.
 * @returns {void}
 */
function bindTextAdvance(element) {
  let holdTimer = null;
  let repeatTimer = null;
  let fastForwarded = false;
  const stop = () => { clearTimeout(holdTimer); clearInterval(repeatTimer); };
  element.addEventListener('pointerdown', (event) => {
    if (event.target.closest('button')) return;
    fastForwarded = false;
    holdTimer = setTimeout(() => { fastForwarded = true; repeatTimer = setInterval(advanceText, CONFIG.fastForwardIntervalMs); }, CONFIG.fastForwardHoldMs);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((name) => element.addEventListener(name, stop));
  element.addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    if (!fastForwarded) advanceText();
    fastForwarded = false;
    if (element.blur) element.blur();
  });
}

/**
 * Shows or hides the history above the current passage.
 * @param {boolean} visible - True to expand the history (only possible if it has content).
 * @returns {void}
 */
function setHistoryVisible(visible) {
  const logEl = document.getElementById('log');
  const toggle = document.getElementById('historyToggle');
  const show = visible && document.getElementById('history').children.length > 0;
  logEl.classList.toggle('showHistory', show);
  toggle.disabled = document.getElementById('history').children.length === 0;
  toggle.textContent = t(show ? 'ui.historyHide' : 'ui.historyShow');
  stickToBottom = true;
  scrollLogToBottom();
}

/**
 * Starts a new passage: moves the current text into the history (collapsed by default) so only
 * text relevant to the new situation is on display.
 * @returns {void}
 */
function beginPassage() {
  const current = document.getElementById('current');
  const history = document.getElementById('history');
  while (current.firstChild) history.appendChild(current.firstChild);
  while (history.children.length > CONFIG.historyLimit) history.removeChild(history.firstChild);
  lastParagraph = null;
  setHistoryVisible(false);
}

/**
 * Renders a log entry and types story sentences out character by character, honoring \wait and \pause.
 * Clicking while text types reveals it instantly up to the next \pause; clicking at a \pause resumes.
 * @param {{text:string,cls:string,newParagraph:boolean}} entry - Entry to show.
 * @param {Function} done - Called once the entry is fully shown.
 * @returns {void}
 */
function typeLogEntry(entry, done) {
  const startIndex = entry.newParagraph || !lastParagraph ? 0 : lastParagraph.childNodes.length;
  const offset = startIndex === 0 ? 0 : 1;   // the space that joins sentences is typed as well
  const controls = renderLogEntry(entry);
  if (entry.cls !== '' || CONFIG.typewriterMsPerChar <= 0) { done(); return; }
  const textNodes = [...lastParagraph.childNodes].slice(startIndex)
    .flatMap((n) => (n.nodeType === Node.TEXT_NODE ? [n] : [...n.childNodes].filter((c) => c.nodeType === Node.TEXT_NODE)));
  const fullTexts = textNodes.map((n) => n.data);
  textNodes.forEach((n) => { n.data = ''; });
  let nodeIndex = 0;
  let charIndex = 0;
  let shown = 0;
  let controlIndex = 0;
  let paused = false;
  let timer = null;
  const revealNextChar = () => {
    while (nodeIndex < textNodes.length && charIndex >= fullTexts[nodeIndex].length) { nodeIndex += 1; charIndex = 0; }
    if (nodeIndex >= textNodes.length) return false;
    charIndex += 1;
    shown += 1;
    textNodes[nodeIndex].data = fullTexts[nodeIndex].slice(0, charIndex);
    if (stickToBottom) scrollLogToBottom();
    return true;
  };
  const finish = () => {
    clearTimeout(timer);
    typing = null;
    textNodes.forEach((n, i) => { n.data = fullTexts[i]; });
    if (stickToBottom) scrollLogToBottom();
    done();
  };
  const run = (instant) => {
    clearTimeout(timer);
    for (;;) {
      while (controlIndex < controls.length && controls[controlIndex].at + offset <= shown) {
        const control = controls[controlIndex];
        controlIndex += 1;
        if (control.type === 'pause') { paused = true; setWaiting(true, true); return; }
        if (control.type === 'wait' && !instant) { timer = setTimeout(() => run(false), control.ms); return; }
      }
      if (!revealNextChar()) { finish(); return; }
      if (!instant) { timer = setTimeout(() => run(false), CONFIG.typewriterMsPerChar); return; }
    }
  };
  typing = { click: () => { if (paused) { paused = false; setWaiting(true, false); run(false); } else run(true); } };
  run(false);
}

/** Tells whether the story log is scrolled to (near) the bottom. @returns {boolean} True if at the bottom. */
function isLogAtBottom() {
  const logEl = document.getElementById('log');
  return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight <= CONFIG.scrollBottomTolerancePx;
}

/** Shows the jump-to-bottom button only when the log is not at the bottom. @returns {void} */
function updateJumpButton() { document.getElementById('jump').hidden = isLogAtBottom(); }

/** Scrolls the story log to the bottom immediately. @returns {void} */
function scrollLogToBottom() {
  const logEl = document.getElementById('log');
  logEl.scrollTo({ top: logEl.scrollHeight });
  updateJumpButton();
}
/**
 * Renders one queued log entry (heading, system line or story sentence); keeps the log pinned if it was at the bottom.
 * @param {{text:string,cls:string,newParagraph:boolean}} entry - Entry to render.
 * Entry classes: '' (story), h, sys, you, end.
 * @returns {Array<{at:number,type:string,ms?:number}>} Timing controls (waits and pauses) positioned by character index.
 */
function renderLogEntry({ text, cls, newParagraph }) {
  const current = document.getElementById('current');
  const stick = stickToBottom;
  const p = newParagraph || !lastParagraph ? document.createElement('p') : lastParagraph;
  if (!newParagraph) p.append(' ');
  let controls = [];
  if (cls === 'h') p.append(text);
  else { const parsed = parseMarkup(text); controls = parsed.controls; p.append(...parsed.nodes); }
  if (newParagraph && cls) p.className = cls;
  if (newParagraph) current.appendChild(p);
  lastParagraph = p;
  if (stick) scrollLogToBottom(); else updateJumpButton();
  return controls;
}

/**
 * Draws the illustration panel for an art key.
 * @param {string} key - Key in ART (vector fallback); LOCATION_IMAGES[key] replaces it once the image loads.
 * @returns {void}
 */
let currentArtKey = null;

function renderArt(key) {
  currentArtKey = key;
  const box = document.getElementById('art');
  box.innerHTML = `<svg viewBox="0 0 640 240" role="img" aria-hidden="true"><rect width="640" height="240" class="bg"/><line x1="0" y1="200" x2="640" y2="200" class="ln"/>${ART[key] || ART.ending}</svg>`;
  const ref = LOCATION_IMAGES[key];
  if (ref) loadImage(ref, (img) => { if (currentArtKey === key) box.replaceChildren(img); });
}

/**
 * Updates the location label and clock.
 * @returns {void}
 */
function renderHeader() {
  const m = state.minutes % 1440;
  document.getElementById('loc').textContent = t(`room.${state.room}.name`);
  document.getElementById('clock').textContent =
    `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
}

/**
 * Creates an action button.
 * @param {string} label - Button text.
 * @param {string} cls - CSS class.
 * @param {Function} onClick - Click handler.
 * @param {boolean} [disabled] - Greys the button out and blocks clicks.
 * @returns {HTMLButtonElement} The button.
 */
function makeButton(label, cls, onClick, disabled = false) {
  const b = document.createElement('button');
  b.className = cls;
  b.disabled = disabled;
  b.textContent = stripMarkup(label);
  b.addEventListener('click', onClick);
  return b;
}

/**
 * Attaches tap and press-and-hold behaviour to a button.
 * @param {HTMLButtonElement} button - Target button.
 * @param {Function} onTap - Called on a normal click.
 * @param {Function} onHold - Called after CONFIG.holdThresholdMs of holding.
 * @returns {void}
 */
function bindHold(button, onTap, onHold) {
  let timer = null;
  let held = false;
  const cancel = () => clearTimeout(timer);
  button.addEventListener('pointerdown', () => { held = false; timer = setTimeout(() => { held = true; onHold(); }, CONFIG.holdThresholdMs); });
  button.addEventListener('pointerup', cancel);
  button.addEventListener('pointerleave', cancel);
  button.addEventListener('click', () => { if (!held) onTap(); held = false; });
}

/**
 * Rebuilds the environment toolbar beside the illustration. Buttons grey out when they would do nothing.
 * @returns {void}
 */
function renderToolbar() {
  const bar = document.getElementById('tools');
  bar.innerHTML = '';
  const busy = Boolean(state.scene || state.ended || waitingForInput);
  const exploreScene = findScene(state.room, 'explore');
  bar.append(
    makeButton(t('ui.explore'), exploreScene && !hasNewContent(exploreScene) ? 'util seen' : 'util', explore, busy || !exploreScene),
    makeButton(t('ui.look'), 'util', look, busy),
    makeButton(t('ui.inventory'), 'util', () => showInventory(), busy),
    makeButton(t('ui.map'), 'util', showMap, busy));
}

/**
 * Rebuilds the action area for the current mode (ending, scene, or exploring).
 * @returns {void}
 */
function renderActions() {
  const box = document.getElementById('actions');
  box.innerHTML = '';
  renderToolbar();
  if (waitingForInput) return;
  if (state.ended) { box.appendChild(makeButton(t('ui.restart'), 'util', startGame)); return; }
  if (state.scene) {
    state.choices.forEach((c, i) => box.appendChild(makeButton(`${i + 1}. ${t(c.labelKey)}`, choiceClass(c), () => chooseOption(i), c.disabled)));
    return;
  }
}

/**
 * Opens the overlay with given content.
 * @param {string} title - Overlay heading.
 * @param {Node} content - Body node.
 * @returns {void}
 */
function openOverlay(title, content) {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = title;
  panel.append(h, content, makeButton(t('ui.close'), 'util', closeOverlay));
  document.getElementById('overlay').hidden = false;
}

/**
 * Builds the health monitor shown in the inventory: status label and a short description (no bar or numbers, by design).
 * @returns {HTMLDivElement} The monitor element.
 */
function buildHealthMonitor() {
  const { status, detail } = state.health;
  const info = HEALTH_STATUSES[status];
  
  
  const box = document.createElement('div');
  box.className = 'health';
  box.innerHTML = `<div class="hRow"><strong style="color:${info.color}"></strong></div><p class="d"></p>`;
  box.querySelector('strong').textContent = `${info.symbol} ${t(`health.${status}`)}`;
  box.querySelector('p').textContent = resolveHealthDetail(detail);
  return box;
}

/**
 * Picks CSS classes for a scene choice button: decision (default), neutral (continue/leave), seen (repeatable and done before).
 * @param {{labelKey:string,seen?:boolean}} choice - Choice descriptor.
 * @returns {string} Space-separated class list.
 */
function choiceClass(choice) {
  return ['choice', CONFIG.neutralLabelKeys.includes(choice.labelKey) && 'neutral', choice.seen && 'seen'].filter(Boolean).join(' ');
}

let activeLockInput = null;   // { handleKey(event, key) } while a lock overlay is open

/**
 * Normalizes player text for phrase matching: full-width forms folded, lowercase, whitespace removed.
 * @param {string} text - Raw text.
 * @returns {string} Normalized text.
 */
function normalizeAnswer(text) { return text.normalize('NFKC').toLowerCase().replace(/\s+/g, ''); }

/**
 * Checks an answer against a lock challenge.
 * @param {{kind:string,code?:string,phrases?:(string[]|Object<string,string[]>)}} challenge - Lock definition.
 * @param {string} answer - What the player entered.
 * @returns {boolean} Passcode: exact digits. Password: the normalized answer contains any accepted phrase.
 */
function checkAnswer(challenge, answer) {
  if (challenge.kind === 'passcode') return answer === challenge.code;
  const phrases = Array.isArray(challenge.phrases) ? challenge.phrases : Object.values(challenge.phrases).flat();
  const given = normalizeAnswer(answer);
  return given !== '' && phrases.some((phrase) => given.includes(normalizeAnswer(phrase)));
}

/**
 * Opens a lock overlay. 'password' shows a text field (any text; access needs a phrase inside the answer);
 * 'passcode' shows digits only with a numpad (0-9, Clear, Confirm; keyboard digits, Backspace and Enter also work).
 * @param {{kind:string,titleKey:string,hintKey:string,code?:string,phrases?:*,maxLength?:number}} challenge - Lock definition.
 * @param {Function} onSuccess - Called shortly after a correct answer.
 * @returns {void}
 */
function openLockInput(challenge, onSuccess) {
  const isPasscode = challenge.kind === 'passcode';
  const maxLength = challenge.maxLength ?? (isPasscode ? challenge.code.length : Infinity);
  const wrap = document.createElement('div');
  wrap.className = 'lockBox';
  const hint = document.createElement('p');
  hint.className = 'd';
  hint.textContent = t(challenge.hintKey);
  const message = document.createElement('p');
  message.className = 'lockMsg';
  const display = document.createElement('div');
  display.className = 'lockDisplay';
  const handle = { handleKey: () => false };
  let answer = '';
  let granted = false;
  const showAnswer = () => { display.textContent = Array.from({ length: maxLength }, (_, i) => answer[i] ?? '_').join(' '); };
  const clearAnswer = () => { answer = ''; message.textContent = ''; if (isPasscode) showAnswer(); };
  const submit = () => {
    if (granted) return;
    if (checkAnswer(challenge, answer)) {
      granted = true;
      message.textContent = t('ui.lockGranted');
      message.className = 'lockMsg ok';
      setTimeout(() => { if (activeLockInput === handle) onSuccess(); }, CONFIG.lockSuccessDelayMs);
    } else {
      message.textContent = t('ui.lockDenied');
      message.className = 'lockMsg bad';
      if (isPasscode) { answer = ''; showAnswer(); }
    }
  };
  wrap.append(hint);
  if (isPasscode) {
    const press = (digit) => { if (!granted && answer.length < maxLength) { answer += digit; message.textContent = ''; showAnswer(); } };
    const pad = document.createElement('div');
    pad.className = 'numpad';
    const digitButton = (digit) => makeButton(digit, 'util', () => press(digit));
    pad.append(...'123456789'.split('').map(digitButton), makeButton(t('ui.lockClear'), 'util', clearAnswer), digitButton('0'), makeButton(t('ui.lockConfirm'), 'util', submit));
    handle.handleKey = (event, key) => {
      if (/^[0-9]$/.test(key)) press(key);
      else if (key === 'Backspace') { answer = answer.slice(0, -1); showAnswer(); }
      else if (key === 'Enter') submit();
      else return false;
      return true;
    };
    showAnswer();
    wrap.append(display, pad, message);
  } else {
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.placeholder = t('ui.lockPlaceholder');
    input.addEventListener('input', () => { answer = input.value; });
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.isComposing) submit(); });
    wrap.append(input, makeButton(t('ui.lockConfirm'), 'choice', submit), message);
  }
  openOverlay(t(challenge.titleKey), wrap);
  activeLockInput = handle;
  const field = wrap.querySelector('input');
  if (field) field.focus();
}

/** Closes the overlay. @returns {void} */
function closeOverlay() { document.getElementById('overlay').hidden = true; activeLockInput = null; }

/**
 * Shows the inventory: item list on the left, a reserved image and description pane on the right.
 * @param {?string} [selectedId] - Item to inspect; null shows the placeholder.
 * @returns {void}
 */
function showInventory(selectedId = null) {
  const wrap = document.createElement('div');
  wrap.className = 'inv';
  const list = document.createElement('div');
  list.className = 'invList';
  if (!state.items.length) list.textContent = t('ui.empty');
  for (const [category, info] of Object.entries(ITEM_CATEGORIES)) {
    const ids = state.items.filter((id) => ITEM_TYPES[id] === category);
    if (!ids.length) continue;
    const heading = document.createElement('div');
    heading.className = 'invGroup';
    heading.textContent = `${info.symbol} ${t(`cat.${category}`)}`;
    list.appendChild(heading);
    ids.forEach((id) => {
      const button = makeButton(`${info.symbol} ${t(`item.${id}.name`)}`, id === selectedId ? 'sel' : 'util', () => showInventory(id));
      button.style.borderLeft = `4px solid ${info.color}`;
      list.appendChild(button);
    });
  }
  const detail = document.createElement('div');
  detail.className = 'invDetail';
  detail.innerHTML = `<div class="itemPic"><svg viewBox="0 0 120 120">${ITEM_ART[selectedId] || ''}</svg></div><div class="detailText"><p class="d"></p><p class="doc" hidden></p></div>`;
  const pic = detail.querySelector('.itemPic');
  if (selectedId && ITEM_IMAGES[selectedId]) loadImage(ITEM_IMAGES[selectedId], (img) => pic.replaceChildren(img));
  const [desc, doc] = detail.querySelectorAll('p');
  desc.textContent = selectedId ? t(`item.${selectedId}.desc`) : t('ui.pickItem');
  doc.hidden = !(selectedId && STRINGS[`item.${selectedId}.text`]);
  if (!doc.hidden) doc.textContent = t(`item.${selectedId}.text`);
  wrap.append(list, detail);
  const root = document.createElement('div');
  root.className = 'invRoot';
  root.append(buildHealthMonitor(), wrap);
  openOverlay(t('ui.invTitle'), root);
}

/**
 * Opens the map, which is also the travel interface. Visited rooms are boxes; rooms reachable from the
 * current room are highlighted and clickable (hold to peek); unexplored neighbours of visited rooms
 * appear as a dashed box with a direction arrow and "?".
 * @returns {void}
 */
function showMap() {
  const { cellW, cellH, gapX, gapY } = CONFIG.map;
  const at = ([x, y]) => [x * (cellW + gapX) + 6, y * (cellH + gapY) + 6];
  const reachable = Object.values(ROOMS[state.room].exits);

  /** Builds one room cell. @param {string} id - Room id. @param {string} label - Text. @param {string} kind - 'here', 'known' or 'unknown'. @returns {string} SVG markup. */
  const cell = (id, label, kind) => {
    const [x, y] = at(ROOMS[id].pos);
    const lock = ROOMS[id].lock;
    const locked = lock && !state.unlocked.has(id);
    const go = reachable.includes(id);
    const stroke = kind === 'here' || go ? '#c9a45c' : '#3f5570';
    const dash = kind === 'unknown' ? ` stroke-dasharray="${CONFIG.unknownDash}"` : '';
    return `<g ${go ? `data-room="${id}" style="cursor:pointer"` : ''}>`
      + `<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" rx="6" fill="${kind === 'here' ? '#3a2f18' : '#1b232f'}" stroke="${stroke}"${dash}/>`
      + `<text x="${x + cellW / 2}" y="${y + cellH / 2 + 4}" text-anchor="middle" font-size="${kind === 'unknown' ? 15 : 11}" fill="#d3dae4" font-family="system-ui">${label}${locked ? ' 🔒' : ''}</text></g>`;
  };

  let links = '';
  let cells = '';
  const drawnUnknown = new Set();
  for (const [id, room] of Object.entries(ROOMS)) {
    if (!state.visited.has(id)) continue;
    const [x, y] = at(room.pos);
    for (const [dir, destId] of Object.entries(room.exits)) {
      const [dx, dy] = at(ROOMS[destId].pos);
      links += `<line x1="${x + cellW / 2}" y1="${y + cellH / 2}" x2="${dx + cellW / 2}" y2="${dy + cellH / 2}" stroke="#2a3544" stroke-width="3"/>`;
      if (!state.visited.has(destId) && !drawnUnknown.has(destId)) {
        drawnUnknown.add(destId);
        cells += cell(destId, `${t(`dir.${dir}`)} ?`, 'unknown');
      }
    }
    cells += cell(id, t(`room.${id}.name`), id === state.room ? 'here' : 'known');
  }

  const wrap = document.createElement('div');
  wrap.innerHTML = `<svg viewBox="0 0 ${5 * (cellW + gapX)} ${4 * (cellH + gapY)}" width="100%">${links}${cells}</svg><p class="d"></p>`;
  const hint = wrap.querySelector('p');
  hint.textContent = t('ui.mapHint');
  wrap.querySelectorAll('[data-room]').forEach((node) => {
    const id = node.dataset.room;
    bindHold(node, () => { closeOverlay(); tryMove(id); }, () => { hint.textContent = t('ui.hold', { text: t(`room.${id}.peek`) }); });
  });
  openOverlay(t('ui.mapTitle'), wrap);
}

/* ================= INPUT ================= */
/**
 * Routes keyboard input to game actions according to CONFIG.keys.
 * @param {KeyboardEvent} event - Keydown event.
 * @returns {void}
 */
function onKeyDown(event) {
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  if (!document.getElementById('langScreen').hidden) return;
  if (!document.getElementById('overlay').hidden) {
    if (key !== CONFIG.keys.close && activeLockInput && activeLockInput.handleKey(event, key)) { event.preventDefault(); return; }
    if (key === CONFIG.keys.close) closeOverlay();
    return;
  }
  if (waitingForInput) { if (key === ' ' || key === 'Enter') { event.preventDefault(); advanceText(); } return; }
  if (state.scene && /^[1-9]$/.test(key)) { chooseOption(Number(key) - 1); return; }
  if (key === CONFIG.keys.explore) explore();
  else if (key === CONFIG.keys.look) look();
  else if (key === CONFIG.keys.history) setHistoryVisible(!document.getElementById('log').classList.contains('showHistory'));
  else if (key === CONFIG.keys.inventory && !state.scene && !state.ended) showInventory();
  else if (key === CONFIG.keys.map && !state.scene && !state.ended) showMap();
}

/**
 * Wires static page controls: click-outside to close overlays, jump-to-bottom button, log scroll tracking.
 * @returns {void}
 */
function bindStaticUi() {
  const logEl = document.getElementById('log');
  const jump = document.getElementById('jump');
  jump.textContent = t('ui.jump');
  jump.addEventListener('click', () => logEl.scrollTo({ top: logEl.scrollHeight, behavior: 'smooth' }));
  logEl.addEventListener('scroll', () => { stickToBottom = isLogAtBottom(); updateJumpButton(); });
  new ResizeObserver(() => { if (stickToBottom) scrollLogToBottom(); }).observe(logEl);
  bindTextAdvance(document.body);
  document.documentElement.style.setProperty('--max-visible-choices', CONFIG.maxVisibleChoices);
  const revealHistory = () => { if (!logEl.classList.contains('showHistory') && logEl.scrollTop <= 0) setHistoryVisible(true); };
  document.getElementById('historyToggle').addEventListener('click', () => setHistoryVisible(!logEl.classList.contains('showHistory')));
  logEl.addEventListener('wheel', (event) => { if (event.deltaY < 0) revealHistory(); }, { passive: true });
  let touchStartY = 0;
  logEl.addEventListener('touchstart', (event) => { touchStartY = event.touches[0].clientY; }, { passive: true });
  logEl.addEventListener('touchmove', (event) => { if (event.touches[0].clientY - touchStartY > CONFIG.historySwipePx) revealHistory(); }, { passive: true });
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click', (event) => { if (event.target === overlay) closeOverlay(); });
}

document.addEventListener('keydown', onKeyDown);
bindStaticUi();
showLanguageSelect();
</script>
