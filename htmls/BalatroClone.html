 return `<div class="ctr" style="max-width:1000px"><h2>${tr('gallery')}</h2><p>${['all','j','p','t','v'].map(k=>`<button class="${k==this.gk?'on':''}" data-a="gcat" data-k="${k}">${k=='all'?tr('all'):tr({j:'jokers',p:'k.planet',t:'k.tarot',v:'k.voucher'}[k])}</button>`).join('')}</p><p>${eds.map(e=>`<button class="b2 ${e==this.ge?'on':''}" data-a="gedit" data-e="${e}">${e?tr('e.'+e):tr('e.none')}</button>`).join('')}</p><p>${rs.map(r=>`<button class="b2 ${r==this.gr?'on':''}" data-a="grar" data-r="${r}">${r=='all'?tr('all'):tr('r.'+r)}</button>`).join('')}</p><div class="row">${this.gcards()}</div><p><button data-a="menu">${tr('back')}</button></p></div>`},
jc(j,o={}){const d=JK[j.id];return `<div class="jw" data-tip="${esc(this.jtip(j))}"><div class="jk ${d.r} ${j.e||''}" ${o.i!==undefined?`data-j="${o.i}"`:''}>${art(j.id)}</div></div>`},
gc(name,kind,tip,gold,art){return `<div class="jw${gold?' vcw':''}" data-tip="${esc(tipH(name,kind,tip,art?(art.includes('plart')?'planet':art.includes('#tr-')||art.includes('b36bff')?'tarot':''):''))}"><div class="jk${gold?' vc':''}" ${gold?'style="border-color:var(--gold)"':''}>${art||`<b>${name}</b><small></small><em>${kind}</em>`}</div></div>`},
jrow(sell){const g=G.g;if(!g.vo.length&&!g.cons.length)return this.jraw(sell);const ks=['j','v','t'],fr=ks.includes(this.inv)?this.inv:'j',ord=[fr,...ks.filter(k=>k!=fr)],Hh={j:()=>this.jraw(sell),v:()=>this.vrow(),t:()=>this.trow()},N={j:tr('jokers')+' '+g.jokers.length+'/5',v:tr('vouchers')+' '+g.vo.length,t:tr('consum')+' '+g.cons.length+'/2'};
 return `<div class="inv">${ks.map(k=>{const d=ord.indexOf(k);return `<div class="ly d${d}" data-k="${k}" ${d?'data-a="invsw"':''}>${Hh[k]()}</div>`}).join('')}</div><div class="invb">${ks.map(k=>`<button class="b2 ${k==fr?'on':''}" data-a="invsw" data-k="${k}">${N[k]}</button>`).join('')}</div>`},
jrow0(sell){const g=G.g;if(!g.vo.length)return this.jraw(sell);const jf=this.inv!='v';return `<div class="inv"><div class="ly ${jf?'f':'b'}" ${jf?'':'data-a="invsw"'}>${this.jraw(sell)}</div><div class="ly ${jf?'b':'f'}" ${jf?'data-a="invsw"':''}>${this.vrow()}</div><button class="b2 sw" data-a="invsw">⇄ ${tr(jf?'vouchers':'jokers')}</button></div>`},
jraw(sell){const g=G.g;let h='<div class="row jr">';for(let i=0;i<5;i++){const j=g.jokers[i];h+=j?(sell?`<div class="it">${this.jc(j,{i})}<button data-a="sell" data-i="${i}">${tr('sell',G.sv(j))}</button></div>`:this.jc(j,{i})):`<div class="jk empty">${tr('slot')}</div>`}return h+'</div>'},
cons(){return '<div class="row">'+G.g.cons.map((id,i)=>`<div class="it">${this.cc(id)}<button data-a="use" data-i="${i}">${tr('use')}</button></div>`).join('')+'</div>'},
menu(){return `<div class="ctr"><h1>${tr('menu.title')}</h1><p>${tr('menu.intro')}</p>
 <p>${tr('seed')}: <input id="seed" value="${this.rs}" maxlength="12"></p><button data-a="new">${tr('newrun')}</button>${this.hasSave()?`<button data-a="cont">${tr('cont')}</button>`:''}<button class="b2" data-a="mute">${tr(Sfx.mute?'sndOff':'sndOn')}</button><button class="b2" data-a="gal">🃏 ${tr('gallery')}</button><button class="b2" data-a="help">❓ ${tr('help')}</button><button class="b2" data-a="dbg">🛠 ${tr('debug')}</button>
 <p>${tr('lang')}: ${Object.keys(LANGS).map(l=>`<button class="b2 ${l==lang?'on':''}" data-a="lang" data-l="${l}">${LANGS[l]}</button>`).join('')}</p><p><small>${tr('keys')}</small></p></div>`},
select(){const g=G.g;return `<div class="ctr"><h2>${tr('ante',g.ante,g.endless)}</h2><div class="row">${[0,1,2].map(i=>{const b=G.blind(g,i);
 return `<div class="blind ${i==g.bi?'cur':''}"><h3>${tr(b.n)}</h3>${b.boss?`<p class="warn">⚠ ${tr('bd.'+b.boss.id)}</p>`:''}<p>${tr('target')} <b>${fmt(b.t)}</b></p><p>${tr('reward')} $${b.rw}</p>${i==g.bi?`<button data-a="start">${tr('playBlind')}</button>`:i<g.bi?tr('cleared'):tr('upcoming')}</div>`}).join('')}</div>
 <h3>${tr('jokers')}</h3>${this.jrow(false)}<p class="gold">$${g.money}</p><small>${tr('seed')} ${g.seed}</small><br><button class="b2" data-a="menu">${tr('menu')}</button></div>`},
play(){const g=G.g,b=G.cur(),fin=this.fin&&Date.now()<this.fin.until?this.fin:null;const fr=G.fresh;G.fresh=new Set();let fi=0;return `<div class="app"><div class="side">
 <div class="pn"><b>${tr(b.n)}</b>${b.boss?`<div class="warn">⚠ ${tr('bd.'+b.boss.id)}</div>`:''}<div class="scr"><span class="sl">${tr('score')}</span><b id="sc">${fmt(g.score)}</b><span class="tg">/${fmt(b.t)}</span></div></div>
 <div class="stk"><div class="pn" ${G.lastLog?`data-tip="${esc(tipH(tr('log.title'),'',"<div style='font-size:13px;text-align:left'>"+G.lastLog.map(esc).join('\n')+'</div>'))}"`:''}><div class="hn" id="hn">${fin?tr('h.'+fin.h):''}</div><div class="cm"><div id="ch">${fin?fmt(fin.c):0}</div><span>×</span><div id="mu">${fin?fmt(fin.m):0}</div><div id="fs" class="fs${fin?' show nf':''}">${fin?'= '+fmt(fin.t):''}</div></div></div>
 <div class="hd"><div class="bx bh"><span>${tr('hands')}</span><b>${g.hands}</b></div><div class="bx bd"><span>${tr('discards')}</span><b>${g.discards}</b></div></div></div><div class="pn grid"><span>${tr('money')}</span><b class="gold">$${g.money}</b><span>${tr('anteL')}</span><b>${g.ante}</b><span>${tr('deck')}</span><b>${g.pile.length}/${g.deck.length}</b></div>
 <div class="pn"><small>${tr('seed')}: <b>${g.seed}</b></small><br><button class="b2" data-a="mute">${Sfx.mute?'🔇':'🔊'}</button><button class="b2" data-a="dbg">🛠</button><button class="b2" data-a="help">?</button><button class="b2" data-a="menu">${tr('menu')}</button></div></div>
 <div class="main">${this.jrow(false)}
 <div class="row" style="padding-top:26px">${g.hand.map((c,i)=>`<div class="card ${fr.has(c.id)?'deal':''} ${cardCls(c)} ${g.sel.includes(i)?'sel':''} ${b.boss&&b.boss.deb!==undefined&&isSuit(c,b.boss.deb)?'deb':''}" data-tip="${esc(cardTip(c))}" data-a="card" data-i="${i}" style="${fr.has(c.id)?`animation-delay:${fi++*40}ms`:''}">${cardFace(c)}</div>`).join('')}</div>
 <div>${g.won?`<div class="gold">${tr('blindWin')}</div><button data-a="adv">${tr('advance')}</button>`:`<button data-a="play">${tr('playHand')}</button><button class="dc" data-a="disc">${tr('discard')}</button>`}</div></div></div>`},
shop(){const g=G.g,s=g.shop;
 const its=s.items.map((it,i)=>{let c;
  if(it.k=='j')c=this.jc(it,{tip:jdesc(it.id)+(it.e?`\n${tr('e.'+it.e)}: ${tr('e.'+it.e+'.d')}`:'')});
  else if(it.k=='p'){const h=HT[it.t];c=this.gc(tr('pl.n',Object.keys(HT).indexOf(it.t)),tr('k.planet'),tr('pl.d',tr('h.'+it.t),h[2],h[3],g.lv[it.t]),0,planetArt(Object.keys(HT).indexOf(it.t)))}
  else c=this.gc(tr('tn.'+it.id),tr('k.tarot'),tr('td.'+it.id),0,tarotArt(it.id));
  return `<div class="it">${c}<button data-a="buy" data-i="${i}">${tr('buy',it.cost)}</button></div>`}).join('');
 const v=s.v?`<div class="it">${this.gc(tr('vn.'+s.v),tr('k.voucher'),tr('vd.'+s.v),1,voucherArt(s.v))}<button data-a="buyv">${tr('buy',10)}</button></div>`:'';
 return `<div class="ctr"><h2>${tr('shop')} <span class="gold">$${g.money}</span></h2><small>${g.pay&&typeof g.pay=='object'?tr('pay',g.pay):''}</small><div class="row" style="margin:10px 0">${its}${v}</div>
 <button class="b2" data-a="reroll">${tr('reroll',5+s.rr)}</button><h3>${tr('yourJokers',g.jokers.length)}</h3>${this.jrow(true)}
 <button data-a="next">${tr('next')}</button> <button class="b2" data-a="menu">${tr('menu')}</button></div>`},
over(){const g=G.g,w=g.phase=='win',s=g.st;return `<div class="ctr"><h1>${tr(w?'win':'lose')}</h1><div class="pn" style="display:inline-block;text-align:left">
 <p>${tr('best',s.bh?tr('h.'+s.bh):'—',fmt(s.best))}</p><p>${tr('clr',s.cl)}</p><p>${tr('reached',g.ante,g.money)}</p><p>${tr('seed')}: <b>${g.seed}</b></p></div><br>
 ${w?`<button data-a="endless">${tr('endless')}</button>`:''}<button class="b2" data-a="menu">${tr('mainMenu')}</button></div>`}};
/* ================= wiring ================= */
const ACT={new:()=>{UI.rs=($('#seed').value.trim()||UI.rs);G.new(UI.rs)},cont:()=>{if(G.g&&G.g.phase!='over'){UI.view='run';UI.render()}else G.load()},
adv:()=>{const g=G.g;if(g&&g.won&&!G.busy){g.won=0;G.win()}},gal:()=>{UI.view='gallery';UI.render()},invsw:(i,d)=>{const k=d.k,el=$('.inv');if(!k||k==UI.inv)return;UI.inv=k;if(!el){UI.render();return}const ks=['j','v','t'],ord=[k,...ks.filter(x=>x!=k)];el.querySelectorAll('.ly').forEach(l=>{const dd=ord.indexOf(l.dataset.k);l.className='ly d'+dd+(dd==0?' pl':'');if(dd)l.setAttribute('data-a','invsw');else l.removeAttribute('data-a')});document.querySelectorAll('.invb button').forEach(b=>b.classList.toggle('on',b.dataset.k==k))},
invsw0:()=>{const el=$('.inv');UI.inv=UI.inv=='v'?'j':'v';if(!el){UI.render();return}const ls=el.querySelectorAll('.ly'),fr=UI.inv=='v'?ls[1]:ls[0],bk=UI.inv=='v'?ls[0]:ls[1];fr.className='ly f pull';fr.removeAttribute('data-a');bk.className='ly b tuck';bk.setAttribute('data-a','invsw');el.querySelector('.sw').textContent='⇄ '+tr(UI.inv=='v'?'jokers':'vouchers')},help:()=>{UI.pv=UI.view;UI.view='help';UI.render()},hback:()=>{UI.view=UI.pv=='help'?'menu':UI.pv;UI.render()},dbg:()=>{DBG.open=DBG.open?0:1;UI.render()},dbgx:()=>{DBG.open=0;UI.render()},dbgnow:()=>{const g=G.g;if(g&&g.hand){g.hand.forEach(c=>{if(DBG.enh)c.e=DBG.enh;if(DBG.seal)c.sl=DBG.seal});UI.render()}},pk:(i,d)=>G.applyPick(d.v),pkx:()=>{UI.pick=null;UI.render()},gcat:(i,d)=>{UI.gk=d.k;UI.render()},gedit:(i,d)=>{UI.ge=d.e;UI.render()},grar:(i,d)=>{UI.gr=d.r;UI.render()},start:()=>G.start(),card:i=>{if(!G.busy&&!G.g.won)UI.toggle(i)},play:()=>G.play(),disc:()=>G.discard(),use:i=>G.use(i),buy:i=>G.buy(i),buyv:()=>G.buyv(),reroll:()=>G.reroll(),sell:i=>G.sell(i),next:()=>G.next(),
menu:()=>{if(G.busy)return;UI.rs=Math.random().toString(36).slice(2,8);UI.view='menu';UI.render()},
lang:(i,d)=>{const s=$('#seed');if(s&&s.value.trim())UI.rs=s.value.trim();lang=d.l;try{localStorage.setItem('pj_lang',lang)}catch(e){}UI.render()},
mute:()=>{Sfx.mute=!Sfx.mute;if(!G.busy)UI.render()},endless:()=>{G.g.endless=true;G.g.phase='shop';G.mkShop();G.save();UI.render()}};
document.addEventListener('pointerdown',e=>{lastPT=e.pointerType});
document.addEventListener('click',e=>{
 const w=e.target.closest('.jw[data-tip],.card[data-tip],.pn[data-tip]');
 if(w&&lastPT!='mouse')tipEl===w?hideTip():showTip(w);else if(!w)hideTip(); // tap-to-toggle tooltip on touch; hover handles mouse
 const t=e.target.closest('[data-a]');if(!t)return;const f=ACT[t.dataset.a];if(f){t.blur();f(+t.dataset.i,t.dataset)}});
// Joker hover: the hit box is the untransformed .jw wrapper; only the inner .jk is tilted/scaled/shadowed
document.addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;const w=e.target.closest?e.target.closest('.jw,.card[data-tip],.pn[data-tip]'):null;
 if(w!==hv){if(hv)hv.classList.remove('hov');hv=w;if(w){w.classList.add('hov')}if(w&&w.dataset.tip)showTip(w);else hideTip()}
 if(w){const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;w.style.setProperty('--ry',(x*18).toFixed(1)+'deg');w.style.setProperty('--rx',(-y*18).toFixed(1)+'deg')}});
document.addEventListener('pointerleave',()=>{if(hv)hv.classList.remove('hov');hv=null;hideTip()});
document.addEventListener('change',e=>{const t=e.target.closest('[data-dbg]');if(!t)return;const k=t.dataset.dbg;DBG[k]=t.type=='checkbox'?(t.checked?1:0):k=='n'?(parseInt(t.value)||0):t.value});
addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;
 if(e.key==' '){e.preventDefault();G.play()}else if(e.key.toLowerCase()=='d')G.discard();
 else if(e.key=='Escape'&&!G.busy){UI.view=(UI.view=='menu'&&G.g)?'run':'menu';UI.render()}});
UI.render();
</script></body></html>
