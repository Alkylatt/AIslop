const kv=(l,v)=>`<div><span class="lb">${l}</span><b>${v}</b></div>`;
as.innerHTML=`<div class="dos" style="--cc:${CATS[k][1]}"><div class="hd"><div><span class="lb">Element dossier</span><div class="mo" style="font-size:10px;color:var(--mu);margin-top:2px">RI-EL-${String(z).padStart(3,'0')}-${(z*7919%9973).toString(16).toUpperCase().padStart(4,'0')}</div><div class="bar" aria-hidden="true"></div></div><button class="b x" data-close aria-label="Close dossier">Close</button></div>
<div class="big"><div class="bs">${e.s}</div><div class="bz">${String(z).padStart(3,'0')}</div></div>
<h2>${e.n}</h2>${L=='zh'?'<div class="lb">'+e.en+'</div>':''}<span class="tag">${CATS[k][0]}</span>
<div class="sec lb">Physical data</div><div class="kv">${kv('Atomic mass',mass(e)+' u')}${kv('Physical state (293 K)',snm)}${kv('Melting point',e.mp?e.mp+' K / '+(e.mp-273.15).toFixed(0)+' °C':'N/A')}${kv('Boiling point',e.bp?e.bp+' K / '+(e.bp-273.15).toFixed(0)+' °C':'N/A')}${kv('Density',dens(e.d))}${kv('Period / group',pr+' / '+g)}${kv('Electronegativity',fm(e.en,' (Pauling)'))}${kv('Atomic radius',fm(e.r,' pm'))}${kv('1st ionization',fm(e.ie,' kJ/mol'))}${kv('Discovered',(e.y?e.y+' // '+e.di:'Ancient'))}</div>
<div class="sec lb">Configuration</div><div class="cfg">${cfg(z).map(([k,v])=>k+sup(v)).join(' ')}</div><div style="margin-top:6px">${shells(z)}</div>
<div class="sec lb">Hazard status</div><div class="hz ${hz[0]}">${hz[1]}</div>
<div class="sec lb">Notes</div><p>${(L=='zh'?NZ[z]:NOTE[z])||(L=='zh'?U+'。屬於'+CATS[k][0]+'，位於第 '+pr+' 週期。':U+'. A '+CATS[k][0].toLowerCase()+' in period '+pr+'.')}</p>
<div class="sec lb">Isotopes</div><p class="mo" style="font-size:12px">${RADIOACT(z)?'No stable isotopes. Nominal mass no. '+e.m.split('.')[0]+' (most stable / reference)':'Nominal mass no. '+Math.round(+e.m)+' (most abundant / reference)'}</p>
<div class="sec lb">Trend: along period</div>${spark(e)}
<div class="sec lb">Related</div><div class="rel">${nb.map(x=>`<button class="b" data-go="${x.z}">${x.s} ${x.z}</button>`).join('')}${sameG.map(x=>`<button class="b" data-go="${x.z}" title="Same group">${x.s}</button>`).join('')}</div></div>`;
as.classList.toggle('open',true)}
function cmpView(){const[a,b]=picks.map(z=>E[z-1]);const rows=[['Atomic number','z',''],['Atomic mass','m',' u'],['Melting point','mp',' K'],['Boiling point','bp',' K'],['Density','d',''],['Electronegativity','en',''],['Atomic radius','r',' pm'],['Ionization energy','ie',' kJ/mol']];
const cell=(x,y,p,u)=>{const v=x[p];const t=p=='d'?dens(v):p=='m'?mass(x)+u:v==null?'N/A':v+u;const win=typeof v=='number'&&typeof y[p]=='number'&&p!='z'&&p!='m'&&v>y[p];return`<td class="${win?'w':''}">${t}</td>`};
as.innerHTML=`<div class="dos"><div class="hd"><div><span class="lb">Comparison</span><div class="bar" aria-hidden="true"></div></div><button class="b x" data-close>Close</button></div><h2>${a.s} <span style="color:var(--mu)">vs</span> ${b.s}</h2>
<table class="cmp"><tr><th>Property</th><th>${a.n}</th><th>${b.n}</th></tr>${rows.map(r=>`<tr><th>${r[0]}</th>${cell(a,b,r[1],r[2])}${cell(b,a,r[1],r[2])}</tr>`).join('')}
<tr><th>Category</th><td>${CATS[a.k][0]}</td><td>${CATS[b.k][0]}</td></tr><tr><th>State (selected T)</th><td>${state(a,T0())}</td><td>${state(b,T0())}</td></tr></table><p class="lb" style="margin-top:10px">Higher value highlighted</p></div>`;as.classList.add('open')}
function choose(z){if(cmpMode){picks=picks.includes(z)?picks.filter(x=>x!=z):[...picks,z].slice(-2);sel=z}else sel=z;refresh()}
gr.addEventListener('click',e=>{const b=e.target.closest('.el');if(b)choose(+b.dataset.z)});
gr.addEventListener('mouseover',e=>{const b=e.target.closest('.el');if(b){const x=E[b.dataset.z-1];$('#fh').textContent=`${x.s} // ${x.n} // ${mass(x)} u // ${SN(state(x,T0()))}`}});
gr.addEventListener('focusin',e=>{const b=e.target.closest('.el');if(b){const x=E[b.dataset.z-1];$('#fh').textContent=`${x.s} // ${x.n}`}});
gr.addEventListener('keydown',e=>{const d={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];if(!d)return;e.preventDefault();const z=+e.target.dataset.z;if(!z)return;let r=E[z-1].r0,c=E[z-1].c0;
for(let i=0;i<20;i++){r+=d[0];c+=d[1];if(r<1||r>10||c<1||c>18)return;if(map[r+','+c]){els[z].tabIndex=-1;map[r+','+c].tabIndex=0;map[r+','+c].focus();return}}});
as.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go)choose(+t.dataset.go);if(t.dataset.close!=null)as.classList.remove('open')});
$('#pre').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;preset=b.dataset.p;document.querySelectorAll('#pre .b').forEach(x=>x.setAttribute('aria-pressed',x==b));refresh()});
['q','fc','fs','fp','fg','tn','tp'].forEach(i=>$('#'+i).addEventListener('input',refresh));
$('#cm').addEventListener('click',e=>{cmpMode=!cmpMode;e.target.setAttribute('aria-pressed',cmpMode);picks=cmpMode&&sel?[sel]:[];if(!cmpMode)as.classList.remove('open');refresh()});
$('#ln').addEventListener('change',e=>{L=e.target.value;try{localStorage.setItem('ptl',L)}catch(_){}applyLang()});
$('#th').addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme=='dark'?'light':'dark'});
document.addEventListener('keydown',e=>{if(e.key=='Escape')as.classList.remove('open')});
applyLang();as.classList.remove('open');
</script>
</body>
</html>
