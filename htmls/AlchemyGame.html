let S;try{S=JSON.parse(localStorage.getItem('aetherworks.v1'))}catch(e){}S=S||fresh();S.lang=S.lang||'zh-TW';if(!S.mv){const mg=v=>{v.heat=v.chill?1:(v.heat||0)+2;delete v.chill};mg(S.v);Object.values(S.setups||{}).forEach(mg);S.mv=1}let hist=[],last='water',inb=0;

function why(v,r,t){
 if(!r.i.every(s=>has(v,s)))return 'inp';
 if(r.x&&r.x.some(s=>has(v,s)))return 'blk';
 if(r.t){if(r.t[0]!=null&&t<r.t[0])return 'cold';if(r.t[1]!=null&&t>r.t[1])return 'hot'}

 if(c.seal===1&&!v.seal)return 'seal';if(c.seal===0&&v.seal)return 'open';

  if(r.e=='pop'&&v.seal){v.m={};o.broke=1;o.log.push(L('popS'));break}
  if(r.e=='break'){v.m={};o.broke=1;o.log.push(L(r.id=='overp'?'overp':'eat'));break}
 }

 if(!v.seal)Object.keys(v.m).forEach(id=>{if(MAT[id].s=='g'&&id!='air'){o.vent.push(id);delete v.m[id]}});

  if(before.some(id=>MAT[id].b<.3&&true)&&tmp(v,env)>=30)o.hints.push(L('unst'));
  const t=tmp(v,env),seen=new Set();RULES.forEach(r=>{const w=why(v,r,t);if(w&&w!='inp'&&HT(w)&&!seen.has(w)&&seen.size<2){seen.add(w);o.hints.push(HT(w))}});
  if(!o.hints.length)o.hints.push(L('nohit'))}

 return o}
function absorb(o,pre){
 o.fired.forEach(id=>{const r=RN[id];if(!S.disc.r[id]){S.disc.r[id]=1;say('new',L('disc',r.n));beep(660)}
  (r.o||[]).forEach(m=>{if(!S.disc.m[m]){S.disc.m[m]=1;say('new',MAT[m].i+' '+L('newmat',MAT[m].n))}})});
 o.log.forEach(t=>say(o.boom||o.broke?'warn':'ok',pre+t));o.hints.forEach(t=>say('warn',pre+t));

 if(S.disc.m.brine&&!S.disc.m.nitre){S.disc.m.nitre=1;say('new','⚪ '+L('nit'))}
 save()}
const say=(k,t)=>{S.log.unshift({k,t,r:inb?S.rn:-1});S.log=S.log.slice(0,14)};
function beep(f,d=.12){try{const a=beep.c=beep.c||new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type=f<200?'sawtooth':'sine';g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.1);o.stop(a.currentTime+d+.1)}catch(e){}}
function runSite(k,rain){if(!inb){S.rn=(S.rn||0)+1;inb=1}const s=S.sites[k];if(S.wx=='rain'&&rain)s.m.water=Math.min(14,(s.m.water||0)+2);

guide:`<div class="card guide"><h2>運作方式</h2><p>每種材料都是一組屬性：狀態、可燃性、密度、黏度、溶解度、酸鹼值、導電性、魔力、穩定性、揮發性、毒性與反應性。規則會讀取這些屬性，以及容器的條件（溫度、密封、攪拌、通電、催化劑、容器種類），並逐條觸發。每個產物都可能引發下一條規則，因此反應會連鎖發生。規則存放在 JSON 區塊中，使用 <i>#base</i>、<i>#flam</i> 之類的選擇器，要新增內容只需新增一列。</p><h2 style="margin-top:14px">五條可嘗試的連鎖</h2><ol><li>蒸氣動力：在燒瓶中放入 2–4 份水、一顆水晶與以太並密封，加熱到沸騰以上。蒸氣壓力會把水晶精煉成流明水晶。</li><li>安撫靈藥：將植物與水在室溫下密封發酵，加入以太，保持低溫且不要攪拌，再加入流明水晶。</li><li>淨化溪流：把植物燒成灰燼，再把灰燼倒進溪流。鹼液過多會矯枉過正，要留意 pH 值。</li><li>黑火藥：密封加熱植物得到木炭，採集硫磺與硝石，再把三者攪拌在一起。請保持低溫。</li><li>燼花：以溫和的火力（60–150°C）加熱植物、硫磺與泥土，得到能在火山土中生長的植物。</li></ol><h2 style="margin-top:14px">未來藍圖</h2><p class="muted">擁有各自環境條件的生態區、會躲避危險的生物、風暴與季節、機器用的傳送帶與閥門、可分享的配置代碼，以及轉化與附魔祭壇等多階段煉金術。</p></div>`}};

<div class="ctl" style="justify-content:center"><button data-a="savesetup">${L('save')}</button><select data-a="loadsetup" aria-label="${L('load')}"><option value="">${L('load')}</option>${Object.keys(S.setups).map(k=>`<option>${k}</option>`).join('')}</select></div>
<div class="ctl" style="justify-content:center"><label>${L('pour')}</label>${Object.keys(SITE0).map(k=>`<button data-a="pour" data-k="${k}">${SITE0[k].ic} ${sn(k)}</button>`).join('')}</div>
<div class="log" aria-live="polite">${logHTML()}</div></section></div>`}
function world(){return `<div class="ctl" style="margin:0 0 12px"><button data-a="wx" data-k="clear" class="${S.wx=='clear'?'on':''}">${L('wx.clear')}</button><button data-a="wx" data-k="rain" class="${S.wx=='rain'?'on':''}">${L('wx.rain')}</button><button class="go" data-a="time">${L('time')}</button><span class="muted">${L('wxnote')}</span></div>
<div class="sites">${Object.keys(SITE0).map(k=>{const s=S.sites[k],p=ph(s);return `<section class="card"><h2>${SITE0[k].ic} ${sn(k)}</h2><p class="muted">${sd(k)} ${L('amb',s.env)}</p><div class="vessel plain ${s.env>=100?'hot':''}">${layers(s)}</div><div class="ro"><span>${L('temp')} <b>${s.env}°C</b></span><span>pH <b>${p==null?'–':p.toFixed(1)}</b></span><span>${contents(s)}</span></div><div class="ctl"><button data-a="srun" data-k="${k}">${L('run')}</button><button data-a="sreset" data-k="${k}">${L('reset')}</button></div></section>`}).join('')}</div>
<p class="muted">${L('worldnote')}</p>`}
function codex(){const dm=Object.keys(MAT).filter(i=>S.disc.m[i]),dr=RULES.filter(r=>S.disc.r[r.id]);
 return `<div class="grid"><section class="card"><h2>${L('cx.mat')} ${dm.length}/${Object.keys(MAT).length}</h2><div class="list">${dm.map(i=>`<div class="it"><h3>${MAT[i].i} ${MAT[i].n}</h3><small>${MAT[i].h}<br>${S.disc.st[i]?props(MAT[i]):L('cx.ns')}</small></div>`).join('')}</div></section>
<section class="card"><h2>${L('cx.rx')} ${dr.length}/${RULES.length}</h2><div class="list">${dr.map(r=>{const c=r.c||{},need=[r.t&&(r.t[0]!=null?'≥'+r.t[0]+'°C':'')+(r.t[1]!=null?' ≤'+r.t[1]+'°C':''),c.seal===1&&L('n.seal'),c.seal===0&&L('n.open'),c.stir&&L('n.stir'),c.chg&&L('n.chg'),c.pw&&L('n.pw'),c.cat&&L('n.cat',nm(c.cat)),c.cont&&L('n.cont'),r.x&&L('n.wo',r.x.map(nm).join('/'))].filter(Boolean).join(L('sep'));
 return `<div class="it"><h3>${r.n}</h3><small>${r.i.map(nm).join(' + ')} → ${(r.o||[]).map(nm).join(' + ')||L('gone')}${need?'<br>'+L('needs')+need:''}</small></div>`}).join('')||`<div class="muted">${L('cx.none')}</div>`}</div>
<h2 style="margin-top:16px">${L('cx.notes')}</h2><textarea id="nt" placeholder="${L('cx.ph')}"></textarea></section></div>`}
function goals(){return `<div class="list">${GOALS.map(g=>`<div class="it ${g.ck()?'done':''}"><h3>${gn(g,0)}</h3><small>${gn(g,1)}</small></div>`).join('')}<div class="it"><h3>${L('g.own')}</h3><small>${L('g.ownd')}</small></div></div>`}
const VIEWS={bench,world,codex,goals,guide:()=>L('guide')};
function R(){$('#tabs').innerHTML=TABS.map(k=>`<button data-a="tab" data-k="${k}" class="${S.tab==k?'on':''}">${L('tab.'+k)}</button>`).join('');
 $('#view').innerHTML=VIEWS[S.tab]();if(S.tab=='codex')$('#nt').value=S.notes;
 GOALS.forEach(g=>{if(!S.done)S.done={};if(!S.done[g.id]&&g.ck()){S.done[g.id]=1;say('new',L('goal',gn(g,0)));beep(880,.3)}})}
let busy=0;
const push=()=>{hist.push(JSON.stringify(S.v));if(hist.length>40)hist.shift()};
function partial(){const v=S.v;$('#vwslot').innerHTML=vessel(v,20);$('#mon').outerHTML=monitor(v);$('#hl').textContent=L('hn'+v.heat);$('.thermo').style.setProperty('--tc',tcol(20+HEAT[v.heat]));save()}
function doRun(){const v=S.v;
 const fin=()=>{push();S.rn=(S.rn||0)+1;inb=1;absorb(run(v,20),'');busy=0;R();inb=0;const e=$('#ves');if(e)e.classList.add('pop')};
 if(v.stir){busy=1;$('#stage').classList.add('stirring');setTimeout(fin,1300)}else fin()}
function doEmpty(){const v=S.v,vw=$('#vw'),ids=Object.keys(v.m);if(!ids.length||!vw)return;busy=1;push();vw.classList.add('dump');$('#stage').classList.add('dumping');
 for(let i=0;i<14;i++){const p=document.createElement('span');p.className='part';p.style.background=MAT[ids[i%ids.length]].c;p.style.setProperty('--x',(40+(i*37)%90)+'px');p.style.setProperty('--y',(20+(i*23)%50)+'px');p.style.setProperty('--d',(.42+(i%7)*.06)+'s');vw.appendChild(p)}
 setTimeout(()=>vw.classList.add('drain'),520);
 setTimeout(()=>{v.m={};busy=0;save();R()},1260)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName=='SELECT'||busy)return;const a=b.dataset.a,k=b.dataset.k,v=S.v;
 if(a=='tab'){S.tab=k}
 else if(a=='add'){last=b.dataset.id;push();if(tot(v)<14)v.m[last]=(v.m[last]||0)+1;else say('warn',L('full'))}
 else if(a=='tog'){
  if(k=='seal'&&v.seal&&$('#lid')){busy=1;$('#lid').classList.add('out');setTimeout(()=>{push();v.seal=0;busy=0;save();R()},300);return}
  push();v[k]=v[k]?0:1;if(k=='seal'&&v.seal){save();R();const l=$('#lid');if(l)l.classList.add('in');return}}
 else if(a=='run'){if(!tot(v)){say('warn',L('first'))}else{doRun();return}}
 else if(a=='undo'){if(hist.length)S.v=JSON.parse(hist.pop())}
 else if(a=='empty'){if(tot(v)){doEmpty();return}}
 else if(a=='savesetup'){const n=(prompt(L('nameit'))||'').replace(/[<>&"]/g,'').trim();if(n){S.setups[n]=JSON.parse(JSON.stringify(v));say('ok',L('saved',n))}}
 else if(a=='pour'){if(!tot(v)){say('warn',L('nopour'))}else{const s=S.sites[k];Object.keys(v.m).forEach(i=>s.m[i]=Math.min(14,(s.m[i]||0)+v.m[i]));if(v.heat!=2)say('warn',L('heatstay'));push();v.m={};say('ok',L('poured',sn(k)));runSite(k,0)}}
 else if(a=='wx'){S.wx=k}
 else if(a=='time'){Object.keys(SITE0).forEach(x=>runSite(x,1))}
 else if(a=='srun'){runSite(k,1)}
 else if(a=='sreset'){S.sites[k]=JSON.parse(JSON.stringify(SITE0[k]))}
 else if(a=='anchor'){push();v.heat=2}
 save();R();inb=0});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='lang'){S.lang=t.value;S.log=[];applyLang();save();R()}
 else if(t.dataset.a=='cont'){push();S.v.cont=t.value;save();R()}
 else if(t.dataset.a=='loadsetup'&&t.value){push();S.v=JSON.parse(JSON.stringify(S.setups[t.value]));say('ok',L('loaded',t.value));save();R()}});
document.addEventListener('input',e=>{if(e.target.id=='heat'){S.v.heat=+e.target.value;partial()}
 if(e.target.id=='nt'){S.notes=e.target.value;save()}});
// tooltip
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
const lite=h=>{const n=parseInt(h.slice(1),16),f=c=>Math.round(c+(255-c)*.4);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
function tipAt(x,y){const w=tip.offsetWidth,h=tip.offsetHeight;let l=x+16,t=y+18;if(l+w>innerWidth-8)l=x-w-16;if(t+h>innerHeight-8)t=y-h-18;tip.style.left=Math.max(8,l)+'px';tip.style.top=Math.max(8,t)+'px'}
function tipOn(id,x,y){const m=MAT[id];tip.innerHTML=`<h4 style="color:${lite(m.c)}">${m.i} ${m.n}</h4><hr><p>${m.h}</p><div class="at">${S.disc.st[id]?propList(m).map(s=>`<span>${s}</span>`).join(''):`<span>${L('unk')}</span>`}</div><p class="fl">${zh()?ZM[id][2]:FL[id]}</p>`;tip.style.display='block';tipAt(x,y)}
const tipOff=()=>{tip.style.display='none'};
function tipTool(el,x,y){const k=el.dataset.tool;tip.innerHTML=`<h4 style="color:#e0a93b">${L(k)}</h4><hr><p>${L('tt.'+k)}</p>${el.dataset.lock?`<p class="fl">🔒 ${L(el.dataset.lock)}</p>`:''}`;tip.style.display='block';tipAt(x,y)}
const TS='[data-mat],[data-tool]',tipShow=(t,x,y)=>t.dataset.tool?tipTool(t,x,y):tipOn(t.dataset.mat,x,y);
document.addEventListener('mouseover',e=>{const t=e.target.closest(TS);t?tipShow(t,e.clientX,e.clientY):tipOff()});
document.addEventListener('mousemove',e=>{const t=e.target.closest(TS);if(t){tip.style.display=='block'?tipAt(e.clientX,e.clientY):tipShow(t,e.clientX,e.clientY)}});
document.addEventListener('click',tipOff);
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest(TS);if(t){const r=t.getBoundingClientRect();tipShow(t,r.left,r.bottom)}});
document.addEventListener('focusout',tipOff);
applyLang();R();
</script></body></html>
