  _createTarget(w, h, { depth = false, samples = 0 } = {}) {
    const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: depth, samples });
    if (depth) rt.depthTexture = new THREE.DepthTexture(w, h);
    return rt;
  }

  /**
   * Recreates all intermediate targets for a new internal resolution.
   * @param {number} width - Internal width in pixels.
   * @param {number} height - Internal height in pixels.
   * @returns {void}
   */
  resize(width, height) {
    width = Math.max(64, width | 0); height = Math.max(64, height | 0);
    if (this.size && this.size.w === width && this.size.h === height) return;
    Object.values(this.targets).forEach((rt) => rt.dispose());
    const qw = Math.max(16, width >> 2), qh = Math.max(16, height >> 2);
    this.targets = {
      scene: this._createTarget(width, height, { depth: true, samples: this.config.msaaSamples }),
      dof: this._createTarget(width, height),
      bloomA: this._createTarget(qw, qh), bloomB: this._createTarget(qw, qh)
    };
    this.size = { w: width, h: height, qw, qh };
    this.hasPrev = false;
  }

  /**
   * Renders one complete frame to the screen.
   * @param {THREE.Scene} scene - Scene.
   * @param {THREE.PerspectiveCamera} camera - Camera.
   * @param {Object} frame - time, focusDistance, characterPosition (Vector3|null), flash.
   * @returns {void}
   */
  render(scene, camera, frame) {
    const r = this.renderer, s = this.settings, T = this.targets, u = this.compositeUniforms, size = this.size;
    r.shadowMap.needsUpdate = s.get('shadows');
    r.setRenderTarget(T.scene);
    r.render(scene, camera);

    this.viewProj.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    this.invViewProj.copy(this.viewProj).invert();
    if (!this.hasPrev) { this.prevViewProj.copy(this.viewProj); this.hasPrev = true; }

    let colorSource = T.scene.texture;
    const dof = s.get('depthOfField');
    if (dof > 0.01) {
      const d = this.dofUniforms;
      d.tColor.value = colorSource; d.tDepth.value = T.scene.depthTexture; d.uTexel.value.set(1 / size.w, 1 / size.h);
      d.uNear.value = camera.near; d.uFar.value = camera.far; d.uFocus.value = frame.focusDistance; d.uMaxBlur.value = this.config.dofMaxBlurPixels * dof;
      this.dofPass.render(r, T.dof);
      colorSource = T.dof.texture;
    }

    const bloom = s.get('bloom');
    if (bloom > 0.01) {
      this.brightUniforms.tColor.value = colorSource; this.brightUniforms.uTexel.value.set(1 / size.w, 1 / size.h);
      this.brightPass.render(r, T.bloomA);
      for (let i = 0; i < this.config.bloomBlurPasses; i++) {
        this.blurUniforms.tColor.value = T.bloomA.texture; this.blurUniforms.uDir.value.set(1 / size.qw, 0); this.blurPass.render(r, T.bloomB);
        this.blurUniforms.tColor.value = T.bloomB.texture; this.blurUniforms.uDir.value.set(0, 1 / size.qh); this.blurPass.render(r, T.bloomA);
      }
    }

    u.tColor.value = colorSource; u.tDepth.value = T.scene.depthTexture; u.tBloom.value = T.bloomA.texture;
    u.uMotionStrength.value = s.get('motionBlur'); u.uBloomStrength.value = bloom * 0.9;
    u.uExposure.value = s.get('exposure'); u.uVignette.value = s.get('vignette'); u.uGrain.value = s.get('filmGrain');
    u.uTime.value = frame.time; u.uAspect.value = size.w / size.h; u.uFlash.value = frame.flash;
    if (frame.characterPosition) {
      const p = this._tmpVec.copy(frame.characterPosition).project(camera);
      u.uMaskCenter.value.set(p.x * 0.5 + 0.5, p.y * 0.5 + 0.5);
      const distance = camera.position.distanceTo(frame.characterPosition);
      u.uMaskRadius.value = this.config.characterMaskRadiusMeters / (2 * distance * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    } else u.uMaskRadius.value = 0;
    this.compositePass.render(r, null);
    this.prevViewProj.copy(this.viewProj);
  }
}

/* ============================== 7. ANIME CHARACTER ============================== */

/**
 * Merges geometries (each pre-transformed by its matrix) into one non-indexed BufferGeometry.
 * All inputs must contain position, normal and uv attributes.
 * @param {{geometry:THREE.BufferGeometry,matrix:THREE.Matrix4}[]} items - Geometries with local transforms.
 * @returns {THREE.BufferGeometry} Merged geometry.
 */
function mergeTransformedGeometries(items) {
  const prepared = items.map(({ geometry, matrix }) => {
    const g = geometry.index ? geometry.toNonIndexed() : geometry.clone();
    g.applyMatrix4(matrix);
    return g;
  });
  const total = prepared.reduce((sum, g) => sum + g.attributes.position.count, 0);
  const position = new Float32Array(total * 3), normal = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let offset = 0;
  for (const g of prepared) {
    position.set(g.attributes.position.array, offset * 3);
    normal.set(g.attributes.normal.array, offset * 3);
    uv.set(g.attributes.uv.array, offset * 2);
    offset += g.attributes.position.count;
    g.dispose();
  }
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(position, 3));
  merged.setAttribute('normal', new THREE.BufferAttribute(normal, 3));
  merged.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return merged;
}

/**
 * Builds the toon-shaded anime girl: painted 2K face, textured layered hair with highlight band, plaid pleated
 * skirt, detailed uniform/boots/gloves/headset, inverted-hull outlines and a fresnel rim light.
 * Geometry is merged per joint+material so the whole character costs roughly a hundred draw calls.
 */
class AnimeCharacterFactory {
  /**
   * @param {Object} config - CONFIG.character.
   */
  constructor(config) {
    this.config = config;
    const colors = config.colors;
    this.gradient = new THREE.DataTexture(new Uint8Array([78, 138, 205, 255]), 4, 1, THREE.RedFormat);
    this.gradient.minFilter = this.gradient.magFilter = THREE.NearestFilter;
    this.gradient.needsUpdate = true;
    this.faceTextures = {
      open: this._createFaceTexture({ blink: false, effort: false }),
      blink: this._createFaceTexture({ blink: true, effort: false }),
      effort: this._createFaceTexture({ blink: false, effort: true })
    };
    const hairMaps = { cap: this._createHairTexture('cap'), cone: this._createHairTexture('cone'), cyl: this._createHairTexture('cyl') };
    const toon = (color, emissive = 0x100c0c, map = null, rim = 0x7f9cff, rimStrength = 0.3) => {
      const material = new THREE.MeshToonMaterial({ color, gradientMap: this.gradient, emissive, map });
      this._applyRim(material, rim, rimStrength);
      return material;
    };
    this.mats = {
      skin: toon(colors.skin, 0x2a1c18, null, 0xffb4a0, 0.22),
      face: toon(0xffffff, 0x2a1c18, this.faceTextures.open, 0xffb4a0, 0.15),
      hairCap: toon(colors.hair, 0x151824, hairMaps.cap), hairCone: toon(colors.hair, 0x151824, hairMaps.cone),
      hairCyl: toon(colors.hair, 0x151824, hairMaps.cyl), hairTip: toon(colors.hairTip, 0x10162a, hairMaps.cyl),
      jacket: toon(colors.jacket, 0x07090c), shirt: toon(colors.shirt, 0x111315), trim: toon(colors.trim, 0x3a1a08, null, 0xffc080, 0.2),
      skirt: toon(0xffffff, 0x05070a, this._createPlaidTexture()), petticoat: toon(0xaab4c4, 0x080a0e),
      stocking: toon(colors.stocking, 0x000000, null, 0x8fa8ff, 0.18), boot: toon(colors.boot, 0x000000), sole: toon(0x0d0f11, 0x000000),
      steel: toon(0x7a828a, 0x000000), ribbon: toon(0xb8323a, 0x1a0506),
      badge: new THREE.MeshBasicMaterial({ map: this._createBadgeTexture(), toneMapped: false })
    };
    this.mats.skirt.side = THREE.DoubleSide;
    const thickness = config.outlineThickness;
    this.outlineMaterial = new THREE.MeshBasicMaterial({ color: colors.outline, side: THREE.BackSide });
    this.outlineMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uOutline = { value: thickness };
      shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nuniform float uOutline;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += normalize(normal) * uOutline;');
    };
  }

  /**
   * Adds a fresnel rim light to a toon material (cool light that separates the character from dark rooms).
   * @param {THREE.MeshToonMaterial} material - Material to patch.
   * @param {number} rimColor - Rim colour.
   * @param {number} strength - Rim intensity.
   * @returns {void}
   */
  _applyRim(material, rimColor, strength) {
    material.customProgramCacheKey = () => 'toon-rim';
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uRimColor = { value: new THREE.Color(rimColor) };
      shader.uniforms.uRimStrength = { value: strength };
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform vec3 uRimColor;\nuniform float uRimStrength;')
        .replace('#include <opaque_fragment>', 'outgoingLight += uRimColor * uRimStrength * pow(1.0 - clamp(dot(normalize(vViewPosition), normal), 0.0, 1.0), 3.0);\n#include <opaque_fragment>');
    };
  }

  /**
   * Wraps a canvas as a texture.
   * @param {HTMLCanvasElement} canvas - Source.
   * @param {boolean} [repeat] - Tile the texture.
   * @returns {THREE.CanvasTexture} Texture (sRGB).
   */
  _canvasTexture(canvas, repeat = false) {
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8;
    if (repeat) texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    return texture;
  }

  /**
   * Paints one face expression at 2048x1024 (centred on u = 0.25 of the head sphere): layered anime eyes with
   * limbus ring, gradient iris, pupil, three highlights and lashes; tapered brows; blush; nose; lips.
   * @param {Object} o - blink (closed eyes) and effort (open mouth, tense brows, sweat drop).
   * @returns {THREE.CanvasTexture} Face texture.
   */
  _createFaceTexture({ blink, effort }) {
    const w = 2048, h = 1024, cx = 512, canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const skin = ctx.createLinearGradient(0, 0, 0, h);
    skin.addColorStop(0, '#ffe9dc'); skin.addColorStop(0.55, '#ffdfce'); skin.addColorStop(0.82, '#f6cbba'); skin.addColorStop(1, '#e8b5a6');
    ctx.fillStyle = skin; ctx.fillRect(0, 0, w, h);
    const temple = ctx.createRadialGradient(cx, 560, 160, cx, 560, 520);
    temple.addColorStop(0, 'rgba(255,240,232,0)'); temple.addColorStop(1, 'rgba(210,150,140,0.28)');
    ctx.fillStyle = temple; ctx.fillRect(0, 0, w, h);
    const eyeY = 548;
    for (const side of [-1, 1]) {
      const ex = cx + side * 124;
      const lid = ctx.createRadialGradient(ex, eyeY - 100, 10, ex, eyeY - 100, 110);
      lid.addColorStop(0, 'rgba(190,130,125,0.30)'); lid.addColorStop(1, 'rgba(190,130,125,0)');
      ctx.fillStyle = lid; ctx.beginPath(); ctx.ellipse(ex, eyeY - 96, 96, 56, 0, 0, Math.PI * 2); ctx.fill();
      if (!blink) {
        ctx.save();
        ctx.beginPath(); ctx.ellipse(ex, eyeY, 63, 82, 0, 0, Math.PI * 2); ctx.clip();
        const sclera = ctx.createLinearGradient(0, eyeY - 82, 0, eyeY + 82);
        sclera.addColorStop(0, '#cfd3e2'); sclera.addColorStop(0.3, '#f4f6fb'); sclera.addColorStop(1, '#ffffff');
        ctx.fillStyle = sclera; ctx.fillRect(ex - 70, eyeY - 90, 140, 180);
        const iris = ctx.createLinearGradient(0, eyeY - 76, 0, eyeY + 82);
        iris.addColorStop(0, '#093a43'); iris.addColorStop(0.45, '#1c9b99'); iris.addColorStop(0.8, '#62dcc6'); iris.addColorStop(1, '#b8fff0');
        ctx.fillStyle = iris; ctx.beginPath(); ctx.ellipse(ex, eyeY + 6, 53, 75, 0, 0, Math.PI * 2); ctx.fill();
        const edge = ctx.createRadialGradient(ex, eyeY + 6, 26, ex, eyeY + 6, 70);
        edge.addColorStop(0, 'rgba(0,30,40,0)'); edge.addColorStop(1, 'rgba(0,30,40,0.6)');
        ctx.fillStyle = edge; ctx.beginPath(); ctx.ellipse(ex, eyeY + 6, 53, 75, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(190,255,245,0.16)'; ctx.lineWidth = 2;
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(ex + Math.cos(a) * 24, eyeY + 6 + Math.sin(a) * 34); ctx.lineTo(ex + Math.cos(a) * 50, eyeY + 6 + Math.sin(a) * 70); ctx.stroke();
        }
        ctx.fillStyle = '#04161a'; ctx.beginPath(); ctx.ellipse(ex, eyeY + 4, 21, 33, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#052a30'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(ex, eyeY + 6, 53, 75, 0, 0, Math.PI * 2); ctx.stroke();
        const shade = ctx.createLinearGradient(0, eyeY - 82, 0, eyeY - 30);
        shade.addColorStop(0, 'rgba(10,10,20,0.55)'); shade.addColorStop(1, 'rgba(10,10,20,0)');
        ctx.fillStyle = shade; ctx.fillRect(ex - 70, eyeY - 82, 140, 56);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(ex - 16, eyeY - 30, 17, 20, -0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 24, eyeY + 38, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(ex + 12, eyeY - 4, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(200,255,250,0.55)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(ex, eyeY + 6, 44, 66, 0, Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = '#1a1215'; ctx.lineCap = 'round'; ctx.lineWidth = 15;
        ctx.beginPath(); ctx.ellipse(ex, eyeY, 64, 83, 0, Math.PI * 1.07, Math.PI * 1.93); ctx.stroke();
        ctx.lineWidth = 9;
        for (const [dx, dy, ex2, ey2] of [[side * 56, -44, side * 84, -64], [side * 61, -26, side * 92, -38], [side * 63, -6, side * 90, 0]]) {
          ctx.beginPath(); ctx.moveTo(ex + dx, eyeY + dy); ctx.lineTo(ex + ex2, eyeY + ey2); ctx.stroke();
        }
        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(ex - side * 58, eyeY - 30); ctx.lineTo(ex - side * 74, eyeY - 22); ctx.stroke();
        ctx.strokeStyle = 'rgba(26,18,21,0.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(ex, eyeY, 62, 82, 0, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
      } else {
        ctx.strokeStyle = '#1a1215'; ctx.lineCap = 'round'; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.arc(ex, eyeY - 12, 58, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
        ctx.lineWidth = 8;
        for (const [dx, dy, ex2, ey2] of [[side * 54, 6, side * 82, 0], [side * 46, 24, side * 72, 26]]) { ctx.beginPath(); ctx.moveTo(ex + dx, eyeY + dy); ctx.lineTo(ex + ex2, eyeY + ey2); ctx.stroke(); }
      }
      ctx.strokeStyle = 'rgba(206,160,150,0.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(ex, eyeY - 8, 72, 92, 0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      const brow = effort ? -0.18 : 0.0;
      ctx.strokeStyle = '#7388c4'; ctx.lineCap = 'round';
      for (const [width, alpha, off] of [[12, 0.35, 0], [8, 0.7, 0], [4, 1, 0]]) {
        ctx.lineWidth = width; ctx.globalAlpha = alpha;
        ctx.beginPath(); ctx.moveTo(ex - side * 56, eyeY - 128 - side * brow * 40 + off); ctx.quadraticCurveTo(ex + side * 4, eyeY - 150 + brow * 30, ex + side * 62, eyeY - 120 + side * brow * 60 + off); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const blush = ctx.createRadialGradient(ex + side * 30, eyeY + 122, 4, ex + side * 30, eyeY + 122, 62);
      blush.addColorStop(0, 'rgba(255,104,122,0.42)'); blush.addColorStop(1, 'rgba(255,104,122,0)');
      ctx.fillStyle = blush; ctx.beginPath(); ctx.ellipse(ex + side * 30, eyeY + 122, 62, 30, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,90,110,0.35)'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(ex + side * (6 + i * 18), eyeY + 136); ctx.lineTo(ex + side * (18 + i * 18), eyeY + 112); ctx.stroke(); }
    }
    ctx.strokeStyle = '#cf9a8e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 5, 650); ctx.quadraticCurveTo(cx - 9, 662, cx + 4, 664); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(cx + 2, 640, 4, 0, Math.PI * 2); ctx.fill();
    if (effort) {
      ctx.fillStyle = '#4e1620'; ctx.beginPath(); ctx.ellipse(cx, 706, 26, 22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e0707c'; ctx.beginPath(); ctx.ellipse(cx, 716, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 16, 688, 32, 8);
      ctx.strokeStyle = '#a34a58'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(cx, 706, 26, 22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(150,215,255,0.8)'; ctx.beginPath(); ctx.moveTo(cx + 300, 430); ctx.quadraticCurveTo(cx + 322, 478, cx + 300, 496); ctx.quadraticCurveTo(cx + 278, 478, cx + 300, 430); ctx.fill();
    } else {
      ctx.strokeStyle = '#b4505f'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(cx, 686, 34, Math.PI * 0.16, Math.PI * 0.84); ctx.stroke();
      ctx.strokeStyle = '#d8707e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, 692, 22, Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
      ctx.strokeStyle = '#b4505f'; ctx.lineWidth = 4;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + s * 33, 692); ctx.lineTo(cx + s * 40, 684); ctx.stroke(); }
    }
    return this._canvasTexture(canvas);
  }

  /**
   * Paints a grayscale strand texture (multiplied by the hair colour). 'cap' has an "angel ring" highlight band.
   * @param {string} kind - 'cap' | 'cone' (root at bottom of UV) | 'cyl' (root at top of UV).
   * @returns {THREE.CanvasTexture} Texture.
   */
  _createHairTexture(kind) {
    const s = 256, canvas = document.createElement('canvas'); canvas.width = canvas.height = s;
    const ctx = canvas.getContext('2d');
    const base = ctx.createLinearGradient(0, 0, 0, s);
    if (kind === 'cap') { base.addColorStop(0, '#9c9c9c'); base.addColorStop(0.5, '#cfcfcf'); base.addColorStop(1, '#e6e6e6'); }
    else if (kind === 'cone') { base.addColorStop(0, '#ffffff'); base.addColorStop(1, '#8a8a8a'); }
    else { base.addColorStop(0, '#8a8a8a'); base.addColorStop(1, '#ffffff'); }
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    const rng = new SeededRandom(kind.length * 17 + 3);
    for (let i = 0; i < 70; i++) { ctx.fillStyle = `rgba(0,0,40,${rng.range(0.04, 0.13)})`; ctx.fillRect(rng.next() * s, 0, rng.range(1, 3.5), s); }
    for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(255,255,255,${rng.range(0.05, 0.16)})`; ctx.fillRect(rng.next() * s, 0, rng.range(1, 2.5), s); }
    if (kind === 'cap') {
      const band = ctx.createLinearGradient(0, s * 0.5, 0, s * 0.86);
      band.addColorStop(0, 'rgba(255,255,255,0)'); band.addColorStop(0.5, 'rgba(255,255,255,0.95)'); band.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = band; ctx.fillRect(0, s * 0.5, s, s * 0.36);
    }
    return this._canvasTexture(canvas, true);
  }

  /**
   * Paints the plaid skirt pattern.
   * @returns {THREE.CanvasTexture} Tiling texture.
   */
  _createPlaidTexture() {
    const s = 256, canvas = document.createElement('canvas'); canvas.width = canvas.height = s;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1f2a3a'; ctx.fillRect(0, 0, s, s);
    ctx.fillStyle = 'rgba(70,100,140,0.45)';
    for (let i = 0; i < 4; i++) { ctx.fillRect(i * 64 + 6, 0, 22, s); ctx.fillRect(0, i * 64 + 6, s, 22); }
    ctx.fillStyle = 'rgba(232,116,42,0.9)';
    for (let i = 0; i < 4; i++) { ctx.fillRect(i * 64 + 42, 0, 3, s); ctx.fillRect(0, i * 64 + 42, s, 3); }
    ctx.fillStyle = 'rgba(220,230,245,0.3)';
    for (let i = 0; i < 4; i++) { ctx.fillRect(i * 64 + 54, 0, 1, s); ctx.fillRect(0, i * 64 + 54, s, 1); }
    const texture = this._canvasTexture(canvas, true);
    texture.repeat.set(8, 1.6);
    return texture;
  }

  /**
   * Paints the staff ID badge.
   * @returns {THREE.CanvasTexture} Badge texture.
   */
  _createBadgeTexture() {
    const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 184;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#10151a'; ctx.fillRect(0, 0, 128, 184);
    ctx.fillStyle = '#e8742a'; ctx.fillRect(0, 0, 128, 34);
    ctx.fillStyle = '#10151a'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center'; ctx.fillText('SITE-19', 64, 24);
    SignFactory.drawEmblem(ctx, 64, 88, 30, '#e8742a');
    ctx.fillStyle = '#cfd8e0'; ctx.font = 'bold 14px monospace'; ctx.fillText('RESEARCH', 64, 140);
    for (let i = 0; i < 26; i++) { ctx.fillStyle = '#9aa7b3'; ctx.fillRect(14 + i * 4, 154, i % 3 === 0 ? 3 : 1.5, 20); }
    return this._canvasTexture(canvas);
  }

  /**
   * Queues a part for merging with other parts sharing joint + material.
   * @param {THREE.BufferGeometry} geometry - Part geometry.
   * @param {string} matKey - Key into this.mats.
   * @param {THREE.Object3D} parent - Joint the part belongs to.
   * @param {Object} [o] - position, rotation, scale arrays and outline flag.
   * @returns {void}
   */
  _part(geometry, matKey, parent, { position = [0, 0, 0], rotation = [0, 0, 0], scale = [1, 1, 1], outline = true } = {}) {
    const key = `${parent.uuid}|${matKey}|${outline ? 1 : 0}`;
    let batch = this.batches.get(key);
    if (!batch) { batch = { parent, matKey, outline, items: [] }; this.batches.set(key, batch); }
    batch.items.push({ geometry, matrix: new THREE.Matrix4().compose(new THREE.Vector3(...position), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rotation)), new THREE.Vector3(...scale)) });
  }

  /**
   * Builds merged meshes (plus outline hulls) for every queued batch.
   * @returns {void}
   */
  _flush() {
    for (const batch of this.batches.values()) {
      const geometry = mergeTransformedGeometries(batch.items);
      const mesh = new THREE.Mesh(geometry, this.mats[batch.matKey]);
      mesh.receiveShadow = true;
      if (batch.outline) mesh.add(new THREE.Mesh(geometry, this.outlineMaterial));
      batch.parent.add(mesh);
      batch.items.forEach((item) => item.geometry.dispose());
    }
    this.batches.clear();
  }

  /**
   * Creates a pivot group.
   * @param {THREE.Object3D} parent - Parent node.
   * @param {number} x - Local x.
   * @param {number} y - Local y.
   * @param {number} z - Local z.
   * @returns {THREE.Group} Pivot.
   */
  _pivot(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }

  /**
   * Builds one leg: tapered thigh-high stocking with lace band and skin gap, laced boot with cuff, sole and heel.
   * @param {THREE.Object3D} hips - Hip node.
   * @param {number} side - +1 left (+x), -1 right.
   * @returns {{hip:THREE.Group,knee:THREE.Group,ankle:THREE.Group}} Joints.
   */
  _buildLeg(hips, side) {
    const hip = this._pivot(hips, side * 0.078, -0.02, 0);
    this._part(new THREE.CylinderGeometry(0.069, 0.067, 0.12, 18), 'skin', hip, { position: [0, -0.06, 0], outline: false });
    this._part(new THREE.CylinderGeometry(0.068, 0.054, 0.3, 18), 'stocking', hip, { position: [0, -0.25, 0] });
    this._part(new THREE.TorusGeometry(0.068, 0.007, 6, 24), 'shirt', hip, { position: [0, -0.115, 0], rotation: [Math.PI / 2, 0, 0], outline: false });
    const knee = this._pivot(hip, 0, -0.41, 0);
    this._part(new THREE.SphereGeometry(0.053, 14, 10), 'stocking', knee, { outline: false });
    this._part(new THREE.CylinderGeometry(0.053, 0.041, 0.37, 16), 'stocking', knee, { position: [0, -0.2, 0] });
    this._part(new THREE.CylinderGeometry(0.058, 0.052, 0.2, 16), 'boot', knee, { position: [0, -0.29, 0] });
    this._part(new THREE.CylinderGeometry(0.063, 0.06, 0.028, 16), 'trim', knee, { position: [0, -0.195, 0] });
    for (let i = 0; i < 3; i++) this._part(new THREE.BoxGeometry(0.044, 0.007, 0.006), 'steel', knee, { position: [0, -0.24 - i * 0.04, 0.056 - i * 0.002], rotation: [0.15, 0, i % 2 ? 0.35 : -0.35], outline: false });
    const ankle = this._pivot(knee, 0, -0.4, 0);
    this._part(new THREE.CapsuleGeometry(0.05, 0.11, 4, 12), 'boot', ankle, { position: [0, -0.012, 0.038], rotation: [Math.PI / 2, 0, 0] });
    this._part(new THREE.SphereGeometry(0.052, 12, 10), 'boot', ankle, { position: [0, -0.012, 0.105], scale: [1, 0.8, 1] });
    this._part(new THREE.BoxGeometry(0.108, 0.024, 0.255), 'sole', ankle, { position: [0, -0.058, 0.035], outline: false });
    this._part(new THREE.BoxGeometry(0.085, 0.034, 0.07), 'sole', ankle, { position: [0, -0.052, -0.06], outline: false });
    return { hip, knee, ankle };
  }

  /**
   * Builds one arm: jacket sleeve, cuff, glove with individual fingers and thumb.
   * @param {THREE.Object3D} spine - Torso node.
   * @param {number} side - +1 left, -1 right.
   * @returns {{shoulder:THREE.Group,elbow:THREE.Group,hand:THREE.Group}} Joints.
   */
  _buildArm(spine, side) {
    const shoulder = this._pivot(spine, side * 0.147, 0.335, 0);
    this._part(new THREE.SphereGeometry(0.054, 16, 12), 'jacket', shoulder, { outline: false });
    this._part(new THREE.CylinderGeometry(0.047, 0.041, 0.27, 14), 'jacket', shoulder, { position: [0, -0.13, 0] });
    this._part(new THREE.BoxGeometry(0.058, 0.012, 0.08), 'trim', shoulder, { position: [side * 0.004, 0.05, 0], rotation: [0, 0, side * -0.25], outline: false });
    if (side > 0) this._part(new THREE.CylinderGeometry(0.049, 0.049, 0.05, 14), 'trim', shoulder, { position: [0, -0.1, 0], outline: false });
    const elbow = this._pivot(shoulder, 0, -0.26, 0);
    this._part(new THREE.SphereGeometry(0.041, 12, 10), 'jacket', elbow, { outline: false });
    this._part(new THREE.CylinderGeometry(0.041, 0.034, 0.22, 14), 'jacket', elbow, { position: [0, -0.11, 0] });
    this._part(new THREE.CylinderGeometry(0.039, 0.039, 0.03, 14), 'shirt', elbow, { position: [0, -0.225, 0], outline: false });
    this._part(new THREE.CylinderGeometry(0.037, 0.036, 0.04, 14), 'boot', elbow, { position: [0, -0.255, 0] });
    const hand = this._pivot(elbow, 0, -0.27, 0);
    this._part(new THREE.SphereGeometry(0.034, 12, 10), 'boot', hand, { position: [0, -0.02, 0], scale: [1.05, 1.1, 0.7] });
    for (let i = 0; i < 4; i++) {
      const fx = (i - 1.5) * 0.0155, len = 0.034 + (i === 1 || i === 2 ? 0.006 : 0);
      this._part(new THREE.CapsuleGeometry(0.0085, len, 3, 8), 'skin', hand, { position: [fx, -0.07, 0.012], rotation: [-0.35, 0, 0], outline: false });
    }
    this._part(new THREE.CapsuleGeometry(0.0095, 0.03, 3, 8), 'skin', hand, { position: [-side * 0.03, -0.045, 0.022], rotation: [-0.5, 0, side * 0.7], outline: false });
    return { shoulder, elbow, hand };
  }

  /**
   * Builds one twin tail (four spring-driven segments) with a bow at its root.
   * @param {THREE.Object3D} head - Head group.
   * @param {number} side - +1 left, -1 right.
   * @returns {{joints:Object[],side:number}} Tail joints with spring state.
   */
  _buildTail(head, side) {
    const root = this._pivot(head, side * 0.108, 0.075, -0.045);
    root.rotation.z = side * -0.3;
    this._part(new THREE.SphereGeometry(0.022, 10, 8), 'trim', root, { outline: false });
    for (const s of [-1, 1]) this._part(new THREE.ConeGeometry(0.026, 0.07, 8), 'trim', root, { position: [s * 0.04, 0.02, 0.03], rotation: [0, 0, -s * 1.2], scale: [1, 1, 0.45], outline: false });
    const lengths = [0.14, 0.18, 0.2, 0.22], radii = [[0.033, 0.054], [0.054, 0.06], [0.06, 0.052], [0.052, 0.006]];
    const joints = [];
    let parent = root;
    lengths.forEach((len, i) => {
      const pivot = i === 0 ? root : this._pivot(parent, 0, -lengths[i - 1], 0);
      this._part(new THREE.CylinderGeometry(radii[i][0], radii[i][1], len, 12), i >= 2 ? 'hairTip' : 'hairCyl', pivot, { position: [0, -len / 2, 0], scale: [1, 1, 0.82] });
      joints.push({ node: pivot, angleX: 0, velX: 0, angleZ: 0, velZ: 0, baseZ: i === 0 ? root.rotation.z : 0 });
      parent = pivot;
    });
    return { joints, side };
  }

  /**
   * Adds a flat tapered strand that hangs from a pivot and sways (back hair, side locks, ahoge).
   * @param {THREE.Object3D} parent - Parent node.
   * @param {Object} o - position [x,y,z], yaw, length, radius, amp (sway amount), phase, tilt (initial pitch), matKey.
   * @param {Object[]} swayParts - Collector for animated strands.
   * @returns {void}
   */
  _strand(parent, { position, yaw = 0, length, radius, amp, phase, tilt = 0.1, roll = 0, matKey = 'hairCone' }, swayParts) {
    const pivot = this._pivot(parent, ...position);
    pivot.rotation.set(tilt, yaw, roll);
    this._part(new THREE.ConeGeometry(radius, length, 8), matKey, pivot, { position: [0, -length / 2, 0], rotation: [Math.PI, 0, 0], scale: [1, 1, 0.55] });
    swayParts.push({ node: pivot, amp, phase, baseX: tilt, baseZ: roll, x: tilt, z: roll });
  }

  /**
   * Assembles the whole character.
   * @returns {Object} Rig: root, hips, spine, head, legs, arms, tails, swayParts, skirt, faceMaterial, faceTextures, flashlight, blob, headGroup.
   */
  create() {
    this.batches = new Map();
    const root = new THREE.Group(), swayParts = [];
    const hips = this._pivot(root, 0, 0.9, 0);
    this._part(new THREE.CylinderGeometry(0.106, 0.1, 0.1, 20), 'jacket', hips, { scale: [1, 1, 0.8] });

    const skirt = this._pivot(hips, 0, 0, 0);
    const skirtGeo = new THREE.CylinderGeometry(0.118, 0.218, 0.2, 40, 1, true);
    const sp = skirtGeo.attributes.position;
    for (let i = 0; i < sp.count; i++) {
      const x = sp.getX(i), z = sp.getZ(i), a = Math.atan2(z, x), k = 1 + 0.075 * Math.cos(a * 16) * (0.35 + (0.1 - sp.getY(i)) * 3.2);
      sp.setX(i, x * k); sp.setZ(i, z * k);
    }
    skirtGeo.computeVertexNormals();
    this._part(skirtGeo, 'skirt', skirt, { position: [0, -0.06, 0] });
    this._part(new THREE.CylinderGeometry(0.1, 0.192, 0.15, 24, 1, true), 'petticoat', skirt, { position: [0, -0.04, 0], outline: false });
    this._part(new THREE.CylinderGeometry(0.103, 0.103, 0.028, 20), 'trim', skirt, { position: [0, 0.045, 0], scale: [1, 1, 0.84], outline: false });

    const legs = [this._buildLeg(hips, 1), this._buildLeg(hips, -1)];

    const spine = this._pivot(hips, 0, 0.02, 0);
    const profile = [[0.001, 0], [0.083, 0], [0.082, 0.04], [0.086, 0.09], [0.098, 0.15], [0.112, 0.2], [0.118, 0.235], [0.112, 0.28], [0.105, 0.325], [0.085, 0.36], [0.05, 0.382], [0.001, 0.39]].map(([r, y]) => new THREE.Vector2(r, y));
    this._part(new THREE.LatheGeometry(profile, 28), 'shirt', spine, { scale: [1, 1, 0.76], outline: false });
    const jacketLathe = new THREE.LatheGeometry(profile, 28, 0.4, Math.PI * 2 - 0.8);
    this._part(jacketLathe, 'jacket', spine, { scale: [1.045, 1.0, 0.8] });
    this._part(new THREE.CylinderGeometry(0.094, 0.108, 0.07, 28, 1, true), 'jacket', spine, { position: [0, 0.0, 0], scale: [1, 1, 0.82] });
    this._part(new THREE.CylinderGeometry(0.097, 0.097, 0.03, 24), 'boot', spine, { position: [0, 0.02, 0], scale: [1, 1, 0.82] });
    this._part(new THREE.BoxGeometry(0.034, 0.028, 0.014), 'trim', spine, { position: [0, 0.02, 0.082] });
    for (const s of [-1, 1]) {
      this._part(new THREE.BoxGeometry(0.052, 0.15, 0.008), 'jacket', spine, { position: [s * 0.058, 0.3, 0.083], rotation: [0.12, 0, s * -0.28] });
      this._part(new THREE.BoxGeometry(0.008, 0.15, 0.01), 'trim', spine, { position: [s * 0.037, 0.3, 0.088], rotation: [0.12, 0, s * -0.28], outline: false });
      this._part(new THREE.BoxGeometry(0.05, 0.03, 0.008), 'shirt', spine, { position: [s * 0.03, 0.372, 0.066], rotation: [0.25, s * 0.5, s * -0.3], outline: false });
      this._part(new THREE.BoxGeometry(0.048, 0.062, 0.042), 'boot', spine, { position: [s * 0.108, 0.0, 0.0] });
      this._part(new THREE.BoxGeometry(0.046, 0.016, 0.044), 'trim', spine, { position: [s * 0.108, 0.034, 0.0], outline: false });
    }
    for (let i = 0; i < 4; i++) this._part(new THREE.SphereGeometry(0.0085, 8, 6), 'trim', spine, { position: [0.054, 0.07 + i * 0.062, 0.084], outline: false });
    this._part(new THREE.TorusGeometry(0.058, 0.014, 8, 24), 'shirt', spine, { position: [0, 0.385, 0], rotation: [Math.PI / 2, 0, 0], outline: false });
    this._part(new THREE.SphereGeometry(0.018, 10, 8), 'ribbon', spine, { position: [0, 0.345, 0.082], scale: [1.2, 1, 0.8], outline: false });
    for (const s of [-1, 1]) this._part(new THREE.ConeGeometry(0.02, 0.08, 6), 'ribbon', spine, { position: [s * 0.02, 0.3, 0.08], rotation: [Math.PI, 0, s * 0.18], scale: [1, 1, 0.4], outline: false });
    this._part(new THREE.BoxGeometry(0.0065, 0.17, 0.004), 'trim', spine, { position: [0.045, 0.285, 0.084], rotation: [0, 0, -0.28], outline: false });
    this._part(new THREE.BoxGeometry(0.15, 0.012, 0.09), 'trim', spine, { position: [0, 0.382, -0.0], scale: [1, 1, 1], outline: false });
    const badge = new THREE.Mesh(new THREE.PlaneGeometry(0.046, 0.066), this.mats.badge);
    badge.position.set(0.07, 0.19, 0.0935); badge.rotation.set(-0.08, 0.12, 0.0); spine.add(badge);
    this._part(new THREE.BoxGeometry(0.012, 0.05, 0.012), 'steel', spine, { position: [0.108, 0.075, 0.0], outline: false });
    this._part(new THREE.CylinderGeometry(0.0035, 0.0035, 0.07, 6), 'steel', spine, { position: [0.12, 0.11, 0.0], outline: false });
    this._part(new THREE.CylinderGeometry(0.033, 0.037, 0.1, 14), 'skin', spine, { position: [0, 0.425, 0], outline: false });
    const arms = [this._buildArm(spine, 1), this._buildArm(spine, -1)];
    arms[0].shoulder.rotation.z = 0.1; arms[1].shoulder.rotation.z = -0.1;

    const flashlight = new THREE.Group();
    this._part(new THREE.CylinderGeometry(0.026, 0.03, 0.13, 12), 'boot', flashlight, { position: [0, -0.06, 0] });
    this._part(new THREE.CylinderGeometry(0.037, 0.026, 0.04, 12), 'steel', flashlight, { position: [0, -0.14, 0], outline: false });
    this._part(new THREE.CylinderGeometry(0.031, 0.031, 0.012, 12), 'trim', flashlight, { position: [0, -0.04, 0], outline: false });
    flashlight.visible = false; arms[1].hand.add(flashlight);

    const headPivot = this._pivot(spine, 0, 0.46, 0), head = this._pivot(headPivot, 0, 0.105, 0);
    const headGeo = new THREE.SphereGeometry(0.108, 48, 32);
    const hp = headGeo.attributes.position;
    for (let i = 0; i < hp.count; i++) {
      const y = hp.getY(i);
      if (y < 0) { const q = Math.pow(-y / 0.108, 1.35); hp.setX(i, hp.getX(i) * (1 - 0.32 * q)); hp.setZ(i, hp.getZ(i) * (1 - 0.08 * q)); }
    }
    headGeo.computeVertexNormals();
    this._part(headGeo, 'face', head, { scale: [1, 1.05, 0.98] });
    for (const s of [-1, 1]) {
      this._part(new THREE.SphereGeometry(0.02, 10, 8), 'skin', head, { position: [s * 0.104, -0.006, -0.006], scale: [0.55, 1.1, 0.85], outline: false });
    }

    this._part(new THREE.SphereGeometry(0.123, 40, 16, 0, Math.PI * 2, 0, Math.PI * 0.36), 'hairCap', head, { scale: [1, 1.06, 1.05], position: [0, 0.002, -0.004] });
    this._part(new THREE.SphereGeometry(0.12, 40, 20, Math.PI / 2 + 1.0, Math.PI * 2 - 2.0, Math.PI * 0.34, Math.PI * 0.4), 'hairCyl', head, { scale: [1, 1.06, 1.05], position: [0, 0, -0.004] });
    for (let k = 0; k < 9; k++) {
      const phi = (k - 4) * 0.19, len = 0.1 + ((k * 5) % 3) * 0.018 + (k === 4 ? 0.02 : 0);
      this._part(new THREE.ConeGeometry(0.031, len, 7), 'hairCone', head, { position: [Math.sin(phi) * 0.094, 0.076, Math.cos(phi) * 0.099], rotation: [Math.PI - 0.24, phi * 0.55, (k % 2 ? 1 : -1) * 0.06], scale: [1, 1, 0.55] });
    }
    for (let i = -4; i <= 4; i++) {
      const phi = i * 0.3;
      this._strand(head, { position: [Math.sin(phi) * 0.1, -0.02, -Math.cos(phi) * 0.1], yaw: phi, length: 0.3 + 0.07 * Math.cos(i * 0.8), radius: 0.042, amp: 0.45 + 0.1 * Math.abs(i % 3), phase: i * 0.7, tilt: 0.1 }, swayParts);
    }
    for (const s of [-1, 1]) {
      this._strand(head, { position: [s * 0.108, 0.01, 0.04], yaw: s * 0.15, length: 0.27, radius: 0.03, amp: 0.7, phase: s * 1.3, tilt: -0.04, roll: s * -0.03 }, swayParts);
      this._strand(head, { position: [s * 0.112, 0.03, 0.0], yaw: s * 0.3, length: 0.2, radius: 0.026, amp: 0.8, phase: s * 2.1, tilt: 0.05 }, swayParts);
    }
    this._strand(head, { position: [0.008, 0.118, 0.02], yaw: 0.4, length: 0.1, radius: 0.012, amp: 1.5, phase: 0.5, tilt: -0.6, roll: -0.3 }, swayParts);
    this._strand(head, { position: [-0.012, 0.12, 0.015], yaw: -0.5, length: 0.07, radius: 0.009, amp: 1.8, phase: 1.4, tilt: -0.5, roll: 0.4 }, swayParts);

    const tails = [this._buildTail(head, 1), this._buildTail(head, -1)];
    this._part(new THREE.BoxGeometry(0.03, 0.007, 0.006), 'trim', head, { position: [0.094, 0.09, 0.07], rotation: [0, 0.9, 0.5], outline: false });
    this._part(new THREE.BoxGeometry(0.03, 0.007, 0.006), 'trim', head, { position: [0.094, 0.09, 0.07], rotation: [0, 0.9, -0.5], outline: false });
    this._part(new THREE.TorusGeometry(0.132, 0.006, 8, 36, Math.PI), 'boot', head, { position: [0, 0.0, -0.006], outline: false });
    for (const s of [-1, 1]) {
      this._part(new THREE.CylinderGeometry(0.034, 0.034, 0.022, 16), 'boot', head, { position: [s * 0.126, 0.0, -0.006], rotation: [0, 0, Math.PI / 2] });
      this._part(new THREE.CylinderGeometry(0.026, 0.026, 0.006, 16), 'trim', head, { position: [s * 0.139, 0.0, -0.006], rotation: [0, 0, Math.PI / 2], outline: false });
    }
    this._part(new THREE.CylinderGeometry(0.0035, 0.0035, 0.09, 6), 'boot', head, { position: [0.116, -0.04, 0.03], rotation: [0.6, 0, 0.12], outline: false });
    this._part(new THREE.CylinderGeometry(0.0035, 0.0035, 0.06, 6), 'boot', head, { position: [0.1, -0.075, 0.07], rotation: [1.3, 0, 0.5], outline: false });
    this._part(new THREE.SphereGeometry(0.009, 8, 6), 'steel', head, { position: [0.082, -0.085, 0.09], outline: false });

    this._flush();

    const blob = new THREE.Mesh(new THREE.CircleGeometry(0.45, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.38, depthWrite: false }));
    blob.rotation.x = -Math.PI / 2; blob.position.y = 0.012; blob.renderOrder = 2;
    root.add(blob);
    return { root, hips, spine, head: headPivot, legs, arms, tails, swayParts, skirt, faceMaterial: this.mats.face, faceTextures: this.faceTextures, flashlight, blob, headGroup: head };
  }
}

/** Procedural gait/idle/sprint animation driven from locomotion state. */
class CharacterAnimator {
  /**
   * @param {Object} rig - Result of AnimeCharacterFactory.create().
   * @param {Object} config - CONFIG.character.
   * @param {Object} playerConfig - CONFIG.player (for speed normalisation).
   */
  constructor(rig, config, playerConfig) {
    this.rig = rig; this.config = config; this.playerConfig = playerConfig;
    this.phase = 0; this.moveBlend = 0; this.sprintBlend = 0; this.flashBlend = 0; this.time = 0;
    this.nextBlink = 2.5; this.blinkTimer = 0; this.lastStepSide = 0;
    this.onFootstep = null;
  }

  /**
   * Advances the animation.
   * @param {number} dt - Delta seconds.
   * @param {Object} motion - speed (m/s), isSprinting, yawRate (rad/s), flashlightOn, airborne (unused).
   * @returns {void}
   */
  update(dt, motion) {
    const rig = this.rig, cfg = this.config, L = MathUtil.lerp;
    this.time += dt;
    const targetMove = MathUtil.clamp(motion.speed / this.playerConfig.walkSpeed, 0, 1);
    this.moveBlend = MathUtil.damp(this.moveBlend, targetMove, 10, dt);
    this.sprintBlend = MathUtil.damp(this.sprintBlend, motion.isSprinting ? 1 : 0, 8, dt);
    this.flashBlend = MathUtil.damp(this.flashBlend, motion.flashlightOn ? 1 : 0, 9, dt);
    const mb = this.moveBlend, sb = this.sprintBlend, t = this.time;
    const stride = L(cfg.walkStrideMeters, cfg.sprintStrideMeters, sb);
    const previousPhase = this.phase;
    this.phase += dt * Math.PI * 2 * (motion.speed / stride);
    const p = this.phase;
    if (mb > 0.3 && this.onFootstep && Math.floor(previousPhase / Math.PI) !== Math.floor(p / Math.PI)) this.onFootstep(motion.isSprinting);

    const swing = L(0.52, 0.9, sb) * mb, kneeMax = L(0.95, 1.65, sb) * mb;
    rig.legs.forEach((leg, i) => {
      const ph = p + i * Math.PI;
      leg.hip.rotation.x = -Math.sin(ph) * swing + 0.08 * sb * mb;
      leg.knee.rotation.x = Math.max(0, Math.cos(ph + 0.3)) * kneeMax + 0.07 * mb;
      leg.ankle.rotation.x = -(leg.hip.rotation.x + leg.knee.rotation.x) * 0.6;
    });
    const bob = L(0.016, 0.04, sb) * mb;
    rig.hips.position.y = 0.9 - bob * 0.5 - 0.025 * sb * mb + bob * 0.5 * Math.cos(2 * p) + Math.sin(t * 1.6) * 0.003 * (1 - mb);
    rig.hips.rotation.y = -Math.sin(p) * 0.1 * mb;
    rig.hips.rotation.z = Math.sin(p) * 0.03 * mb + Math.sin(t * 0.6) * 0.01 * (1 - mb);
    rig.spine.rotation.x = 0.3 * sb * mb + 0.06 * mb + Math.sin(t * 1.6) * 0.012;
    rig.spine.rotation.y = Math.sin(p) * 0.15 * mb * (1 + sb);
    rig.head.rotation.x = -rig.spine.rotation.x * 0.8 + Math.sin(t * 0.7) * 0.02;
    rig.head.rotation.y = -(rig.spine.rotation.y + rig.hips.rotation.y) * 0.6 + Math.sin(t * 0.4) * 0.05 * (1 - mb);
    rig.head.rotation.z = Math.sin(t * 0.5) * 0.015;

    const armSwing = L(0.45, 0.95, sb) * mb;
    rig.arms.forEach((arm, i) => {
      const side = i === 0 ? 1 : -1;
      let shoulderX = Math.sin(p + i * Math.PI) * armSwing * (i === 0 ? 1 : 1);
      shoulderX = (i === 0 ? Math.sin(p) : -Math.sin(p)) * armSwing;
      let elbowX = -(0.18 + 0.9 * sb) * Math.max(mb, 0.2) - 0.4 * Math.max(0, -shoulderX) - 0.05;
      if (i === 1 && this.flashBlend > 0.01) {
        const hold = this.flashBlend * (1 - sb * 0.6);
        shoulderX = L(shoulderX, -1.2, hold); elbowX = L(elbowX, -0.55, hold);
      }
      arm.shoulder.rotation.x = shoulderX + Math.sin(t * 1.6 + i) * 0.015 * (1 - mb);
      arm.shoulder.rotation.z = side * (0.1 + 0.05 * Math.sin(t * 1.6) * (1 - mb));
      arm.elbow.rotation.x = elbowX;
    });
    rig.flashlight.visible = this.flashBlend > 0.3;

    this._animateHair(dt, mb, sb, p, motion.yawRate);
    this._animateSway(dt, mb, sb, motion.yawRate);
    this._animateFace(dt, sb);
  }

  /**
   * Spring simulation for the twin tails and ahoge sway.
   * @param {number} dt - Delta seconds.
   * @param {number} mb - Move blend.
   * @param {number} sb - Sprint blend.
   * @param {number} phase - Gait phase.
   * @param {number} yawRate - Body yaw rate in rad/s.
   * @returns {void}
   */
  _animateHair(dt, mb, sb, phase, yawRate) {
    const k = this.config.hairSpring, c = this.config.hairDamping, h = Math.min(dt, 1 / 30);
    for (const tail of this.rig.tails) {
      tail.joints.forEach((joint, i) => {
        const w = (i + 1) / 3;
        const targetX = (0.25 + 0.55 * sb) * mb * w + Math.sin(phase * 2 + i * 0.7) * 0.1 * mb * (0.5 + sb) + Math.sin(this.time * 1.3 + i) * 0.03;
        const targetZ = joint.baseZ * (i === 0 ? 1 : 0) + tail.side * -0.2 * mb * sb * w - yawRate * 0.035 * w + Math.sin(this.time * 1.1 + i + tail.side) * 0.03;
        joint.velX += ((targetX - joint.angleX) * k - joint.velX * c) * h; joint.angleX += joint.velX * h;
        joint.velZ += ((targetZ - joint.angleZ) * k - joint.velZ * c) * h; joint.angleZ += joint.velZ * h;
        joint.node.rotation.x = joint.angleX; joint.node.rotation.z = joint.angleZ;
      });
    }
  }

  /**
   * Smoothly sways strand pivots (back hair, side locks, ahoge) and flares the skirt.
   * @param {number} dt - Delta seconds.
   * @param {number} mb - Move blend.
   * @param {number} sb - Sprint blend.
   * @param {number} yawRate - Body yaw rate in rad/s.
   * @returns {void}
   */
  _animateSway(dt, mb, sb, yawRate) {
    const t = this.time;
    for (const s of this.rig.swayParts || []) {
      const targetX = s.baseX + ((0.1 + 0.4 * sb) * mb + Math.sin(t * 1.7 + s.phase) * 0.035) * s.amp;
      const targetZ = s.baseZ + (Math.sin(t * 1.3 + s.phase * 1.7) * 0.03 - yawRate * 0.02) * s.amp;
      s.x = MathUtil.damp(s.x, targetX, 9, dt); s.z = MathUtil.damp(s.z, targetZ, 9, dt);
      s.node.rotation.x = s.x; s.node.rotation.z = s.z;
    }
    const skirt = this.rig.skirt;
    if (skirt) {
      skirt.rotation.x = MathUtil.damp(skirt.rotation.x, -(0.03 + 0.09 * sb) * mb + Math.sin(t * 2) * 0.008, 8, dt);
      const flare = 1 + 0.07 * sb * mb + Math.sin(this.phase * 2) * 0.015 * mb;
      skirt.scale.set(flare, 1, flare);
    }
  }

  /**
   * Handles blinking and the sprint "effort" expression.
   * @param {number} dt - Delta seconds.
   * @param {number} sb - Sprint blend.
   * @returns {void}
   */
  _animateFace(dt, sb) {
    const [minI, maxI] = this.config.blinkIntervalRange;
    this.nextBlink -= dt;
    if (this.nextBlink <= 0) { this.blinkTimer = this.config.blinkDuration; this.nextBlink = minI + Math.random() * (maxI - minI); }
    this.blinkTimer = Math.max(0, this.blinkTimer - dt);
    const tex = this.rig.faceTextures;
    const wanted = this.blinkTimer > 0 ? tex.blink : (sb > 0.6 ? tex.effort : tex.open);
    if (this.rig.faceMaterial.map !== wanted) { this.rig.faceMaterial.map = wanted; this.rig.faceMaterial.needsUpdate = true; }
  }
}

/** Unit geometries shared by every instanced batch (scale encodes size). */
const SHARED_GEOMETRY = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 16),
  sphere: new THREE.SphereGeometry(0.5, 16, 12),
  cone: new THREE.ConeGeometry(0.5, 1, 16)
};

/** Creates readable sign textures (room names, warnings, Foundation emblem). */
const SignFactory = {
  cache: new Map(),
  /**
   * Draws the Foundation-style emblem (ring with three inward arrows).
   * @param {CanvasRenderingContext2D} ctx - Context.
   * @param {number} cx - Centre x.
   * @param {number} cy - Centre y.
   * @param {number} r - Outer radius.
   * @param {string} color - Stroke/fill colour.
   * @returns {void}
   */
  drawEmblem(ctx, cx, cy, r, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = r * 0.09;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = r * 0.03; ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i * Math.PI * 2) / 3;
      const p = (rad, off) => [cx + Math.cos(a + off) * rad, cy + Math.sin(a + off) * rad];
      ctx.beginPath();
      ctx.moveTo(...p(r * 0.94, -0.3)); ctx.lineTo(...p(r * 0.94, 0.3)); ctx.lineTo(...p(r * 0.34, 0)); ctx.closePath(); ctx.fill();
    }
  },
  /**
   * Creates (and caches) a sign texture.
   * @param {string} text - Main line.
   * @param {string} sub - Optional sub line.
   * @param {Object} o - accent colour, logo ('large' | true | falsy).
   * @param {number} width - Canvas width.
   * @param {number} height - Canvas height.
   * @returns {THREE.CanvasTexture} Texture.
   */
  create(text, sub, o, width, height) {
    const key = `${text}|${sub}|${o.accent}|${o.logo}|${width}x${height}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d'), accent = o.accent || '#e8742a';
    ctx.fillStyle = '#0a0e12'; ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = accent; ctx.lineWidth = Math.max(4, height * 0.035); ctx.strokeRect(6, 6, width - 12, height - 12);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (o.logo === 'large') {
      this.drawEmblem(ctx, width / 2, height * 0.42, height * 0.3, accent);
      ctx.fillStyle = '#d7dee6'; ctx.font = `bold ${height * 0.075}px ui-monospace, Menlo, Consolas, monospace`; ctx.fillText(text, width / 2, height * 0.85);
    } else {
      const left = o.logo ? height * 0.9 : 0;
      if (o.logo) this.drawEmblem(ctx, height * 0.5, height / 2, height * 0.3, accent);
      let size = height * (sub ? 0.38 : 0.5);
      ctx.font = `bold ${size}px ui-monospace, Menlo, Consolas, monospace`;
      const maxWidth = (width - left) * 0.9;
      while (ctx.measureText(text).width > maxWidth && size > 8) { size -= 2; ctx.font = `bold ${size}px ui-monospace, Menlo, Consolas, monospace`; }
      ctx.fillStyle = '#e1e8ef'; ctx.fillText(text, left + (width - left) / 2, sub ? height * 0.38 : height / 2);
      if (sub) { ctx.fillStyle = '#8b98a5'; ctx.font = `${height * 0.2}px ui-monospace, Menlo, Consolas, monospace`; ctx.fillText(sub, left + (width - left) / 2, height * 0.74); }
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8;
    this.cache.set(key, texture);
    return texture;
  }
};

/**
 * Builds one level. Static geometry is queued into per-material InstancedMesh batches (few draw calls),
 * colliders are collected as 2D AABBs, and fixtures/interactables are registered with shared services.
 */
class LevelBuilder {
  /**
   * @param {number} levelIndex - Level id (0 = surface, 1 = sublevel).
   * @param {number} baseY - World height of this level's floor.
   * @param {Object} services - materials, lightPool, flicker, interactions, actions, world (CONFIG.world), lighting.
   */
  constructor(levelIndex, baseY, services) {
    this.levelIndex = levelIndex; this.baseY = baseY; this.services = services;
    this.group = new THREE.Group(); this.group.position.y = baseY;
    this.colliders = []; this.zones = []; this.hazards = []; this.doors = []; this.animations = [];
    this.batches = new Map(); this.leds = []; this.ledMesh = null; this.ledTimer = 0; this.floorCount = 0;
    this.rng = new SeededRandom(900 + levelIndex);
  }

  /**
   * Queues one instance in a shared batch.
   * @param {string} shape - 'box' | 'cylinder' | 'sphere' | 'cone'.
   * @param {string} matKey - Material key.
   * @param {number[]} p - Centre [x,y,z] in level space.
   * @param {number[]} s - Scale [x,y,z].
   * @param {Object} o - rotX/rotY/rotZ, color, cast, layer, solid.
   * @returns {void}
   */
  _queue(shape, matKey, p, s, o = {}) {
    const { rotX = 0, rotY = 0, rotZ = 0, color = 0xffffff, cast = true, layer = 0, solid = false } = o;
    const key = `${shape}|${matKey}|${cast ? 1 : 0}|${layer}`;
    let batch = this.batches.get(key);
    if (!batch) { batch = { shape, matKey, cast, layer, matrices: [], colors: [] }; this.batches.set(key, batch); }
    batch.matrices.push(new THREE.Matrix4().compose(new THREE.Vector3(...p), new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX, rotY, rotZ)), new THREE.Vector3(...s)));
    batch.colors.push(color instanceof THREE.Color ? color : new THREE.Color(color));
    if (solid) this._addRotatedCollider(p[0], p[2], s[0], s[2], rotY);
  }

  /**
   * Queues a box.
   * @param {string} matKey - Material key.
   * @param {number} cx - Centre x.
   * @param {number} cy - Centre y (relative to the floor).
   * @param {number} cz - Centre z.
   * @param {number} sx - Size x.
   * @param {number} sy - Size y.
   * @param {number} sz - Size z.
   * @param {Object} [o] - Options (see _queue).
   * @returns {void}
   */
  box(matKey, cx, cy, cz, sx, sy, sz, o) { this._queue('box', matKey, [cx, cy, cz], [sx, sy, sz], o); }
  /**
   * Queues a cylinder (axis = local y).
   * @param {string} matKey - Material key.
   * @param {number} cx - Centre x.
   * @param {number} cy - Centre y.
   * @param {number} cz - Centre z.
   * @param {number} diameter - Diameter.
   * @param {number} height - Height.
   * @param {Object} [o] - Options.
   * @returns {void}
   */
  cylinder(matKey, cx, cy, cz, diameter, height, o) { this._queue('cylinder', matKey, [cx, cy, cz], [diameter, height, diameter], o); }
  /**
   * Queues an (ellipsoid) sphere.
   * @param {string} matKey - Material key.
   * @param {number} cx - Centre x.
   * @param {number} cy - Centre y.
   * @param {number} cz - Centre z.
   * @param {number} dx - Diameter x.
   * @param {number} dy - Diameter y.
   * @param {number} dz - Diameter z.
   * @param {Object} [o] - Options.
   * @returns {void}
   */
  sphere(matKey, cx, cy, cz, dx, dy, dz, o) { this._queue('sphere', matKey, [cx, cy, cz], [dx, dy, dz], o); }
  /**
   * Queues a cone (tip up).
   * @param {string} matKey - Material key.
   * @param {number} cx - Centre x.
   * @param {number} cy - Centre y.
   * @param {number} cz - Centre z.
   * @param {number} diameter - Base diameter.
   * @param {number} height - Height.
   * @param {Object} [o] - Options.
   * @returns {void}
   */
  cone(matKey, cx, cy, cz, diameter, height, o) { this._queue('cone', matKey, [cx, cy, cz], [diameter, height, diameter], o); }

  /**
   * Transforms a prop-local offset into world space.
   * @param {number} ox - Prop origin x.
   * @param {number} oz - Prop origin z.
   * @param {number} rot - Prop yaw.
   * @param {number} dx - Local x offset.
   * @param {number} dz - Local z offset.
   * @returns {number[]} World [x, z].
   */
  local(ox, oz, rot, dx, dz) { const c = Math.cos(rot), s = Math.sin(rot); return [ox + dx * c + dz * s, oz - dx * s + dz * c]; }

  /**
   * Queues a box positioned relative to a rotated prop origin.
   * @param {string} matKey - Material key.
   * @param {number} ox - Prop x.
   * @param {number} oz - Prop z.
   * @param {number} rot - Prop yaw.
   * @param {number[]} offset - Local [dx,dy,dz].
   * @param {number[]} size - Size [sx,sy,sz].
   * @param {Object} [o] - Options.
   * @returns {void}
   */
  boxAt(matKey, ox, oz, rot, offset, size, o = {}) {
    const [wx, wz] = this.local(ox, oz, rot, offset[0], offset[2]);
    this.box(matKey, wx, offset[1], wz, size[0], size[1], size[2], { ...o, rotY: rot + (o.rotY || 0) });
  }
  /**
   * Queues a cylinder positioned relative to a rotated prop origin.
   * @param {string} matKey - Material key.
   * @param {number} ox - Prop x.
   * @param {number} oz - Prop z.
   * @param {number} rot - Prop yaw.
   * @param {number[]} offset - Local [dx,dy,dz].
   * @param {number} diameter - Diameter.
   * @param {number} height - Height.
   * @param {Object} [o] - Options.
   * @returns {void}
   */
  cylAt(matKey, ox, oz, rot, offset, diameter, height, o = {}) {
    const [wx, wz] = this.local(ox, oz, rot, offset[0], offset[2]);
    this.cylinder(matKey, wx, offset[1], wz, diameter, height, { ...o, rotY: rot + (o.rotY || 0) });
  }

  /**
   * Adds an axis-aligned collider.
   * @param {number} minX - Min x.
   * @param {number} minZ - Min z.
   * @param {number} maxX - Max x.
   * @param {number} maxZ - Max z.
   * @returns {Object} Collider record (toggle .enabled).
   */
  addCollider(minX, minZ, maxX, maxZ) { const c = { minX, minZ, maxX, maxZ, enabled: true }; this.colliders.push(c); return c; }
  /**
   * Adds a collider covering a yaw-rotated rectangle.
   * @param {number} cx - Centre x.
   * @param {number} cz - Centre z.
   * @param {number} w - Local width.
   * @param {number} d - Local depth.
   * @param {number} rot - Yaw.
   * @returns {Object} Collider.
   */
  _addRotatedCollider(cx, cz, w, d, rot) {
    const c = Math.abs(Math.cos(rot)), s = Math.abs(Math.sin(rot));
    const ex = (c * w + s * d) / 2, ez = (s * w + c * d) / 2;
    return this.addCollider(cx - ex, cz - ez, cx + ex, cz + ez);
  }
  /**
   * Adds a collider for a prop footprint.
   * @param {number} ox - Prop x.
   * @param {number} oz - Prop z.
   * @param {number} rot - Prop yaw.
   * @param {number} w - Local width.
   * @param {number} d - Local depth.
   * @returns {Object} Collider.
   */
  footprint(ox, oz, rot, w, d) { return this._addRotatedCollider(ox, oz, w, d, rot); }

  /**
   * Registers a pooled light source (level-space height).
   * @param {number} x - X.
   * @param {number} y - Height above the floor.
   * @param {number} z - Z.
   * @param {Object} o - color, intensity, distance.
   * @returns {Object} Light source record.
   */
  registerLight(x, y, z, o) { return this.services.lightPool.register(this.levelIndex, new THREE.Vector3(x, this.baseY + y, z), o); }

  /**
   * Adds a flickering fixture with optional emissive panel.
   * @param {number} x - X.
   * @param {number} y - Height.
   * @param {number} z - Z.
   * @param {Object} o - color, intensity, panel [w,d] or null, pattern, phase, distance.
   * @returns {Object} Light source record.
   */
  flickerLight(x, y, z, { color, intensity, panel = [1.2, 0.4], pattern = 'faulty', phase = 0, distance }) {
    const source = this.registerLight(x, y - 0.5, z, { color, intensity, distance });
    let mesh = null;
    const baseColor = hdrColor(color, this.services.lighting.panelEmissive);
    if (panel) {
      mesh = new THREE.Mesh(SHARED_GEOMETRY.box, new THREE.MeshBasicMaterial({ color: baseColor.clone(), toneMapped: false }));
      mesh.scale.set(panel[0], 0.08, panel[1]); mesh.position.set(x, y, z);
      this.group.add(mesh);
    }
    this.services.flicker.add(source, mesh, baseColor, pattern, phase);
    return source;
  }

  /**
   * Registers an interactable at a level position.
   * @param {Object} def - x, z, y, actionKey, mode, holdSeconds, cooldownSeconds, radius, onActivate, isAvailable.
   * @returns {Object} Interactable record.
   */
  interact(def) {
    return this.services.interactions.register({ ...def, level: this.levelIndex, position: new THREE.Vector3(def.x, this.baseY + (def.y || 1), def.z) });
  }

  /**
   * Adds a blinking server LED.
   * @param {number} x - X.
   * @param {number} y - Y.
   * @param {number} z - Z.
   * @returns {void}
   */
  addLed(x, y, z) { this.leds.push([x, y, z]); }

  /**
   * Places a sign plane facing a direction.
   * @param {string} textKey - String table key for the headline.
   * @param {number} x - X.
   * @param {number} y - Height.
   * @param {number} z - Z.
   * @param {number} rotY - Yaw (0 faces +z, π/2 faces +x, π faces -z, -π/2 faces -x).
   * @param {number} w - Width in metres.
   * @param {number} h - Height in metres.
   * @param {Object} [o] - sub (string key), accent, logo.
   * @returns {THREE.Mesh} The sign mesh.
   */
  sign(textKey, x, y, z, rotY, w, h, o = {}) {
    const px = 220;
    const texture = SignFactory.create(t(textKey), o.sub ? t(o.sub) : '', o, Math.min(1024, Math.round(w * px)), Math.min(1024, Math.round(h * px)));
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: texture, color: new THREE.Color().setScalar(1.35), toneMapped: false }));
    mesh.position.set(x, y, z); mesh.rotation.y = rotY;
    this.group.add(mesh);
    return mesh;
  }

  /**
   * Creates a room: floor, ceiling, ceiling lights and a named zone.
   * @param {Object} d - id, nameKey, x0,z0,x1,z1, floor, ceiling, outdoor, lights {sx,sz,color,intensity,panel}.
   * @returns {void}
   */
  room(d) {
    const H = this.services.world.wallHeight, w = d.x1 - d.x0, depth = d.z1 - d.z0, cx = (d.x0 + d.x1) / 2, cz = (d.z0 + d.z1) / 2;
    const lift = -(this.floorCount++) * 0.0015;
    this.box(d.floor, cx, -0.15 + lift, cz, w + 0.3, 0.3, depth + 0.3, { cast: false, layer: 1 });
    if (!d.outdoor && d.ceiling !== false) this.box('ceiling', cx, H + 0.15, cz, w + 0.3, 0.3, depth + 0.3);
    this.zones.push({ id: d.id, nameKey: d.nameKey, x0: d.x0, z0: d.z0, x1: d.x1, z1: d.z1, outdoor: !!d.outdoor, level: this.levelIndex });
    if (d.lights) this._ceilingLights(d.x0, d.z0, d.x1, d.z1, H, d.lights);
  }

  /**
   * Lays a grid of ceiling panels and registers a pooled light for each.
   * @param {number} x0 - Min x.
   * @param {number} z0 - Min z.
   * @param {number} x1 - Max x.
   * @param {number} z1 - Max z.
   * @param {number} H - Ceiling height.
   * @param {Object} l - sx, sz spacing; color; intensity; panel [w,d].
   * @returns {void}
   */
  _ceilingLights(x0, z0, x1, z1, H, l) {
    const nx = Math.max(1, Math.round((x1 - x0) / l.sx)), nz = Math.max(1, Math.round((z1 - z0) / l.sz));
    const panel = l.panel || [1.4, 0.5], emissive = hdrColor(l.color, this.services.lighting.panelEmissive);
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
      const x = x0 + ((i + 0.5) * (x1 - x0)) / nx, z = z0 + ((j + 0.5) * (z1 - z0)) / nz;
      this.box('emissive', x, H - 0.04, z, panel[0], 0.08, panel[1], { color: emissive, cast: false });
      this.registerLight(x, H - 0.55, z, { color: l.color, intensity: l.intensity });
    }
  }

  /**
   * Builds a wall running along the X axis at a fixed Z.
   * @param {number} z - Fixed z.
   * @param {number} x0 - Start x.
   * @param {number} x1 - End x.
   * @param {Object} [o] - doors [{at,width,height}], windows [{at,width}], height, matKey.
   * @returns {void}
   */
  wallAlongX(z, x0, x1, o) { this._buildWall(true, z, x0, x1, o); }
  /**
   * Builds a wall running along the Z axis at a fixed X.
   * @param {number} x - Fixed x.
   * @param {number} z0 - Start z.
   * @param {number} z1 - End z.
   * @param {Object} [o] - doors, windows, height, matKey.
   * @returns {void}
   */
  wallAlongZ(x, z0, z1, o) { this._buildWall(false, x, z0, z1, o); }

  /**
   * Builds wall segments around door/window gaps with lintels, frames and glass.
   * @param {boolean} alongX - True if the wall runs along X.
   * @param {number} fixed - Fixed coordinate of the wall centre line.
   * @param {number} a0 - Start along the run.
   * @param {number} a1 - End along the run.
   * @param {Object} [o] - See wallAlongX.
   * @returns {void}
   */
  _buildWall(alongX, fixed, a0, a1, o = {}) {
    const W = this.services.world, T = W.wallThickness, height = o.height || W.wallHeight, matKey = o.matKey || 'wallPanel';
    a0 -= T / 2; a1 += T / 2;
    const gaps = [];
    (o.doors || []).forEach((d) => { const w = d.width || W.doorWidth; gaps.push({ from: d.at - w / 2, to: d.at + w / 2, type: 'door', h: d.height || W.doorHeight }); });
    (o.windows || []).forEach((d) => gaps.push({ from: d.at - d.width / 2, to: d.at + d.width / 2, type: 'window' }));
    gaps.sort((a, b) => a.from - b.from);
    const place = (from, to, y0, y1, solid) => {
      if (to - from < 0.01 || y1 - y0 < 0.01) return;
      const mid = (from + to) / 2, len = to - from, cy = (y0 + y1) / 2, sy = y1 - y0;
      if (alongX) this.box(matKey, mid, cy, fixed, len, sy, T, { solid }); else this.box(matKey, fixed, cy, mid, T, sy, len, { solid });
    };
    const frame = (cx, cy, sa, sy) => {
      if (alongX) this.box('darkMetal', cx, cy, fixed, sa, sy, T + 0.08, { cast: false }); else this.box('darkMetal', fixed, cy, cx, T + 0.08, sy, sa, { cast: false });
    };
    let cursor = a0;
    for (const g of gaps) {
      place(cursor, g.from, 0, height, true);
      const mid = (g.from + g.to) / 2, len = g.to - g.from;
      if (g.type === 'door') {
        place(g.from, g.to, g.h, height, false);
        frame(g.from + 0.05, g.h / 2, 0.1, g.h); frame(g.to - 0.05, g.h / 2, 0.1, g.h); frame(mid, g.h - 0.05, len, 0.1);
      } else {
        const sill = W.windowSillHeight, top = sill + W.windowHeight;
        place(g.from, g.to, 0, sill, false); place(g.from, g.to, top, height, false);
        frame(mid, sill, len, 0.08); frame(mid, top, len, 0.08);
        const glass = new THREE.Mesh(SHARED_GEOMETRY.box, this.services.materials.get('glass'));
        if (alongX) { glass.scale.set(len, W.windowHeight, 0.04); glass.position.set(mid, sill + W.windowHeight / 2, fixed); } else { glass.scale.set(0.04, W.windowHeight, len); glass.position.set(fixed, sill + W.windowHeight / 2, mid); }
        this.group.add(glass);
        if (alongX) this.addCollider(g.from, fixed - T / 2, g.to, fixed + T / 2); else this.addCollider(fixed - T / 2, g.from, fixed + T / 2, g.to);
      }
      cursor = g.to;
    }
    place(cursor, a1, 0, height, true);
  }

  /**
   * Builds the instanced meshes from queued data and adds them to the level group.
   * @returns {void}
   */
  finalize() {
    for (const batch of this.batches.values()) {
      const mesh = new THREE.InstancedMesh(SHARED_GEOMETRY[batch.shape], this.services.materials.get(batch.matKey), batch.matrices.length);
      batch.matrices.forEach((m, i) => { mesh.setMatrixAt(i, m); mesh.setColorAt(i, batch.colors[i]); });
      mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = batch.cast; mesh.receiveShadow = batch.matKey !== 'emissive';
      mesh.frustumCulled = false; mesh.layers.set(batch.layer);
      this.group.add(mesh);
    }
    this.batches.clear();
    if (this.leds.length) {
      this.ledMesh = new THREE.InstancedMesh(SHARED_GEOMETRY.box, new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), this.leds.length);
      this.leds.forEach(([x, y, z], i) => { this.ledMesh.setMatrixAt(i, new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(0.05, 0.025, 0.02))); this.ledMesh.setColorAt(i, new THREE.Color(0)); });
      this.ledMesh.frustumCulled = false;
      this.group.add(this.ledMesh);
      this._randomizeLeds();
    }
  }

  /**
   * Randomly sets LED colours (green/amber/red/off).
   * @returns {void}
   */
  _randomizeLeds() {
    const palette = [hdrColor(0x33ff66, 2.4), hdrColor(0xffa030, 2.4), hdrColor(0xff3a2a, 2.2), new THREE.Color(0.01, 0.01, 0.01)];
    for (let i = 0; i < this.leds.length; i++) {
      const on = this.rng.next() < 0.4;
      this.ledMesh.setColorAt(i, on ? palette[this.rng.next() < 0.7 ? 0 : Math.floor(this.rng.next() * 3)] : palette[3]);
    }
    this.ledMesh.instanceColor.needsUpdate = true;
  }

  /**
   * Per-frame level animation (doors excluded; handled by the door manager).
   * @param {number} dt - Delta seconds.
   * @param {number} time - Elapsed seconds.
   * @param {Object} ctx - playerPosition, cameraPosition, cameraForward.
   * @returns {void}
   */
  update(dt, time, ctx) {
    this.animations.forEach((fn) => fn(dt, time, ctx));
    if (this.ledMesh) { this.ledTimer -= dt; if (this.ledTimer <= 0) { this.ledTimer = 0.22; this._randomizeLeds(); } }
  }
}

/** Automatic sliding door (checkpoint gates, elevators) that can be locked until unlocked by an interaction. */
class SlidingDoor {
  /**
   * @param {LevelBuilder} lb - Owning level builder.
   * @param {Object} o - x, z, alongX, width, height, locked, permanent.
   */
  constructor(lb, { x, z, alongX, width, height = 2.8, locked = false, permanent = false }) {
    this.levelIndex = lb.levelIndex; this.width = width; this.alongX = alongX; this.locked = locked; this.permanent = permanent;
    this.center = new THREE.Vector3(x, lb.baseY + 1, z);
    this.open = 0; this.lastTarget = 0;
    const material = lb.services.materials.get('doorMetal');
    const size = alongX ? [width / 2, height, 0.2] : [0.2, height, width / 2];
    this.leaves = [1, -1].map(() => {
      const leaf = new THREE.Mesh(SHARED_GEOMETRY.box, material);
      leaf.scale.set(...size); leaf.castShadow = true; leaf.receiveShadow = true; lb.group.add(leaf); return leaf;
    });
    this.statusMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    const status = new THREE.Mesh(SHARED_GEOMETRY.box, this.statusMaterial);
    status.scale.set(alongX ? 0.5 : 0.06, 0.09, alongX ? 0.06 : 0.5);
    status.position.set(x, height + 0.12, z); lb.group.add(status);
    this.base = { x, z, height };
    this.collider = alongX ? lb.addCollider(x - width / 2, z - 0.2, x + width / 2, z + 0.2) : lb.addCollider(x - 0.2, z - width / 2, x + 0.2, z + width / 2);
    this._refreshStatus();
    lb.doors.push(this);
    this._layout();
  }

  /**
   * Updates the status light colour (red locked / green ready).
   * @returns {void}
   */
  _refreshStatus() { this.statusMaterial.color.copy(this.locked ? hdrColor(0xff3322, 2.4) : hdrColor(0x33ff77, 2.2)); }

  /**
   * Unlocks the door.
   * @returns {void}
   */
  unlock() { this.locked = false; this._refreshStatus(); }

  /**
   * Positions both leaves according to the current opening amount.
   * @returns {void}
   */
  _layout() {
    const { x, z, height } = this.base, offset = this.width / 4 + this.open * (this.width / 2);
    this.leaves.forEach((leaf, i) => {
      const s = i === 0 ? 1 : -1;
      if (this.alongX) leaf.position.set(x + s * offset, height / 2, z); else leaf.position.set(x, height / 2, z + s * offset);
    });
  }

  /**
   * Animates the door and toggles its collider.
   * @param {number} dt - Delta seconds.
   * @param {THREE.Vector3} playerPosition - Player world position.
   * @param {number} level - Active level.
   * @param {Object} world - CONFIG.world.
   * @param {function():void} onToggle - Callback fired when the door starts opening/closing.
   * @returns {void}
   */
  update(dt, playerPosition, level, world, onToggle) {
    const near = level === this.levelIndex && !this.locked && Math.hypot(playerPosition.x - this.center.x, playerPosition.z - this.center.z) < world.gateTriggerRadius;
    const target = near ? 1 : 0;
    if (target !== this.lastTarget) { this.lastTarget = target; if (level === this.levelIndex) onToggle(); }
    this.open = MathUtil.damp(this.open, target, world.doorOpenSharpness, dt);
    if (Math.abs(this.open - target) < 0.002) this.open = target;
    this.collider.enabled = this.open < 0.8;
    this._layout();
  }
}

/** Library of prop builders. Each takes a LevelBuilder and queues parts relative to a rotated origin. */

   * Office desk with monitor. User sits on the +z (local) side.

   * @returns {void}
   */
  desk(lb, x, z, rot = 0, screenColor = 0x4fd0c0) {
    lb.boxAt('wood', x, z, rot, [0, 0.74, 0], [1.5, 0.05, 0.75], { color: 0xb09078 });
    lb.boxAt('darkMetal', x, z, rot, [-0.7, 0.37, 0], [0.05, 0.74, 0.65]);

    lb.boxAt('plastic', x, z, rot, [0, 0.77, 0.15], [0.42, 0.015, 0.14], { color: 0x1c2126 });

  partition(lb, x, z, rot, len) {

    lb.footprint(x, z, rot, len + 0.1, 0.95);
  },
  /**
   * Vending machine with an energy-drink interaction.
   * @param {LevelBuilder} lb - Builder.
   * @param {number} x - X.
   * @param {number} z - Z.
   * @param {number} rot - Yaw (front faces local +z).
   * @param {Object} actions - Action handlers.
   * @returns {void}
   */
  vending(lb, x, z, rot, actions) {
    lb.boxAt('paint', x, z, rot, [0, 0.95, 0], [0.95, 1.9, 0.8], { color: 0x8c2b2b });
    lb.boxAt('emissive', x, z, rot, [0, 1.15, 0.41], [0.7, 1.15, 0.02], { color: hdrColor(0xffd9a0, 1.7), cast: false });
    lb.boxAt('darkMetal', x, z, rot, [0, 0.25, 0.41], [0.7, 0.12, 0.03]);
    lb.footprint(x, z, rot, 0.95, 0.8);
    const [ix, iz] = lb.local(x, z, rot, 0, 0.9);
    lb.registerLight(ix, 1.4, iz, { color: 0xffd9a0, intensity: 6, distance: 5 });
    lb.interact({ x: ix, z: iz, y: 1, actionKey: 'action.drink', mode: 'hold', holdSeconds: CONFIG.items.energyDrink.holdSeconds, cooldownSeconds: CONFIG.items.energyDrink.cooldownSeconds, radius: 1.5, onActivate: () => actions.drinkEnergy() });
  },
  /**
   * Row of lockers.
   * @param {LevelBuilder} lb - Builder.
   * @param {number} x - Row centre x.
   * @param {number} z - Row centre z.
   * @param {number} rot - Yaw (doors face local +z).
   * @param {number} count - Number of lockers.
   * @param {number} [color] - Paint colour.
   * @returns {void}
   */
  lockers(lb, x, z, rot, count, color = 0x4d5b68) {
    const w = 0.5;
    for (let i = 0; i < count; i++) {
      const dx = (i - (count - 1) / 2) * w;
      lb.boxAt('metal', x, z, rot, [dx, 0.95, 0], [w - 0.02, 1.9, 0.5], { color });
      lb.boxAt('darkMetal', x, z, rot, [dx, 1.5, 0.255], [0.3, 0.02, 0.01], { cast: false });
      lb.boxAt('darkMetal', x, z, rot, [dx + 0.15, 1.0, 0.26], [0.03, 0.12, 0.02], { cast: false });
    }
    lb.footprint(x, z, rot, count * w, 0.5);
  },
  /**
   * Bunk bed (two mattresses, ladder).
   * @param {LevelBuilder} lb - Builder.
   * @param {number} x - X.
   * @param {number} z - Z.
   * @param {number} rot - Yaw (length along local z).
   * @param {number} [blanket] - Blanket colour.
   * @returns {void}
   */
  bunk(lb, x, z, rot, blanket = 0x3b5a73) {
    for (const [dx, dz] of [[-0.46, -1.0], [0.46, -1.0], [-0.46, 1.0], [0.46, 1.0]]) lb.boxAt('darkMetal', x, z, rot, [dx, 0.95, dz], [0.06, 1.9, 0.06]);
    for (const y of [0.45, 1.3]) {
      lb.boxAt('darkMetal', x, z, rot, [0, y - 0.08, 0], [0.96, 0.04, 2.06]);
      lb.boxAt('fabric', x, z, rot, [0, y, 0], [0.88, 0.14, 1.98], { color: blanket });
      lb.boxAt('fabric', x, z, rot, [0, y + 0.1, -0.8], [0.55, 0.1, 0.32], { color: 0xcfd4d8 });
    }

  medkit(lb, x, y, z, actions) {
    const group = new THREE.Group(); group.position.set(x, y + 0.1, z);

  elevatorCab(lb, x, targetLevel, actions) {

    lb.box('emissive', x, 3.43, 13.15, 1.6, 0.04, 0.4, { color: hdrColor(0xffe6c0, 3), cast: false });
    lb.box('darkMetal', x, 0.05, 13.15, 2.2, 0.1, 2.3, { cast: false });
    lb.registerLight(x, 3.0, 13.2, { color: 0xffe6c0, intensity: 16, distance: 7 });
    const down = targetLevel === 1;
    lb.interact({ x, z: 12.6, y: 1, radius: 2.4, actionKey: down ? 'action.elevatorDown' : 'action.elevatorUp', mode: 'hold', holdSeconds: CONFIG.items.elevator.holdSeconds, onActivate: () => actions.rideElevator(targetLevel) });
  },
  /**
   * Holding cell with bars, bed and toilet.
   * @param {LevelBuilder} lb - Builder.
   * @param {number} x0 - Cell min x.
   * @param {number} x1 - Cell max x.
   * @param {number} z0 - Front (bars) z.
   * @param {number} z1 - Back wall z.
   * @returns {void}
   */
  cell(lb, x0, x1, z0, z1) {
    const mid = (x0 + x1) / 2, gap = 0.75;
    for (const [a, b] of [[x0 + 0.1, mid - gap], [mid + gap, x1 - 0.1]]) {
      for (let x = a + 0.05; x < b; x += 0.16) lb.cylinder('darkMetal', x, 1.3, z0, 0.04, 2.6, { cast: false });
      lb.box('darkMetal', (a + b) / 2, 2.6, z0, b - a, 0.08, 0.08); lb.box('darkMetal', (a + b) / 2, 0.05, z0, b - a, 0.08, 0.08);
      lb.addCollider(a, z0 - 0.08, b, z0 + 0.08);
    }
    lb.box('paint', mid - 1.2, 0.35, z1 - 1.1, 1.0, 0.2, 2.0, { color: 0x56616b, solid: true });
    lb.box('metal', x1 - 0.5, 0.3, z1 - 0.4, 0.4, 0.6, 0.5, { solid: true });
  },
  /**
   * Containment statue (anomaly that turns toward the player when unobserved).
   * @param {LevelBuilder} lb - Builder.
   * @param {number} x - X.
   * @param {number} z - Z.
   * @returns {void}
   */
  statue(lb, x, z) {
    const material = lb.services.materials.get('wallConcrete');
    const group = new THREE.Group(); group.position.set(x, 0, z);
    const part = (sx, sy, sz, px, py, pz, rx = 0, rz = 0) => {
      const m = new THREE.Mesh(SHARED_GEOMETRY.box, material); m.scale.set(sx, sy, sz); m.position.set(px, py, pz); m.rotation.set(rx, 0, rz); m.castShadow = true; group.add(m);
    };
    part(0.22, 0.85, 0.24, -0.14, 0.43, 0); part(0.22, 0.85, 0.24, 0.14, 0.43, 0.05);
    part(0.56, 0.7, 0.3, 0, 1.2, 0); part(0.22, 0.28, 0.24, 0, 1.7, 0.02);
    part(0.12, 0.7, 0.14, -0.38, 1.2, 0.2, -1.1, 0.1); part(0.12, 0.7, 0.14, 0.38, 1.25, 0.05, 0, -0.15);
    const eyeMaterial = new THREE.MeshBasicMaterial({ color: hdrColor(0xff2a1a, 3), toneMapped: false });
    for (const s of [-1, 1]) { const e = new THREE.Mesh(SHARED_GEOMETRY.box, eyeMaterial); e.scale.set(0.04, 0.025, 0.02); e.position.set(s * 0.06, 1.72, 0.14); group.add(e); }
    lb.group.add(group);
    lb.box('hazard', x, 0.008, z, 2.2, 0.016, 2.2, { cast: false });
    const toPlayer = new THREE.Vector3(), toCam = new THREE.Vector3();
    lb.animations.push((dt, time, ctx) => {
      toCam.set(x, lb.baseY + 1.2, z).sub(ctx.cameraPosition).normalize();
      const looking = toCam.dot(ctx.cameraForward) > 0.82;
      if (!looking) { toPlayer.set(ctx.playerPosition.x - x, 0, ctx.playerPosition.z - z); group.rotation.y = Math.atan2(toPlayer.x, toPlayer.z); }
    });
  },
  /**
   * Levitating anomalous orb with rotating rings and orbiting sparkles.
   * @param {LevelBuilder} lb - Builder.
   * @param {number} x - X.
   * @param {number} z - Z.
   * @param {number} orbitMotesCount - Number of orbiting motes.
   * @returns {void}
   */
  orb(lb, x, z, orbitMotesCount) {
    const y = 1.8, group = new THREE.Group(); group.position.set(x, y, z);
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 16), new THREE.MeshBasicMaterial({ color: hdrColor(0xff4fd8, 3.5), toneMapped: false }));
    group.add(core);
    const rings = [0, 1].map((i) => {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55 + i * 0.18, 0.012, 8, 48), new THREE.MeshBasicMaterial({ color: hdrColor(i ? 0x4ff0ff : 0xff9af0, 3), toneMapped: false }));
      group.add(ring); return ring;
    });
    lb.group.add(group);
    lb.cylinder('emissive', x, 0.01, z, 3.2, 0.02, { color: hdrColor(0xff4fd8, 1.4), cast: false });
    const source = lb.registerLight(x, y, z, { color: 0xff5ae0, intensity: 28, distance: 14 });
    lb.services.flicker.add(source, null, new THREE.Color(), 'slowPulse');
    const motes = new MoteField({ count: orbitMotesCount, box: [1.3, 1.6, 1.3], color: 0xff9cf0, intensity: 3, size: 0.045, speed: 1.2, orbit: true, center: new THREE.Vector3(x, lb.baseY + y, z), seed: 31 });
    lb.group.add(motes.points);
    lb.animations.push((dt, time) => {
      group.position.y = y + Math.sin(time * 1.2) * 0.1; core.scale.setScalar(1 + Math.sin(time * 3) * 0.05);
      rings[0].rotation.set(time * 0.8, time * 0.5, 0); rings[1].rotation.set(time * -0.6, 0.4, time * 0.7);
    });
  }
};

/** Builds both levels of the facility and exposes lookup helpers. */
class FacilityBuilder {
  /**
   * @param {Object} services - Shared services (materials, lightPool, flicker, interactions, actions, world, lighting, particles).
   */
  constructor(services) { this.services = services; this.levels = []; }

  /**
   * Builds the full facility.
   * @returns {LevelBuilder[]} Levels indexed by level id.
   */
  build() {
    this.levels.push(this._buildSurface());
    this.levels.push(this._buildSublevel());
    this.levels.forEach((level) => level.finalize());
    return this.levels;
