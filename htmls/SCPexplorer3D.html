/** Detects nearby interactables and resolves tap / hold activation. */
class InteractionSystem {
  /**
   * @param {Object} config - CONFIG.interaction.
   */
  constructor(config) {
    this.config = config; this.items = []; this.holdTarget = null; this.progress = 0;
    this.lockUntilRelease = false; this.pressQueued = false; this.onCooldownAttempt = null;
  }
  /**
   * Registers an interactable.
   * @param {Object} def - level, position, actionKey, mode ('tap'|'hold'), holdSeconds, cooldownSeconds, radius, isAvailable, onActivate.
   * @returns {Object} The stored record.
   */
  register(def) {
    const item = { mode: 'tap', holdSeconds: this.config.defaultHoldSeconds, cooldownSeconds: 0, radius: this.config.radius, cooldownUntil: 0, isAvailable: () => true, ...def };
    this.items.push(item);
    return item;
  }
  /** Queues a tap press (called from the input event). @returns {void} */
  queuePress() { this.pressQueued = true; }
  /**
   * Updates the closest target and hold progress.
   * @param {number} dt - Delta seconds.
   * @param {THREE.Vector3} playerPosition - Player position.
   * @param {number} level - Active level.
   * @param {boolean} isDown - Whether the interact action is held.
   * @param {number} time - Elapsed seconds.
   * @returns {?{item:Object,progress:number}} Prompt data or null.
   */
  update(dt, playerPosition, level, isDown, time) {
    let best = null, bestDist = Infinity;
    for (const item of this.items) {
      if (item.level !== level || !item.isAvailable()) continue;
      const d = Math.hypot(item.position.x - playerPosition.x, item.position.z - playerPosition.z);
      if (d < item.radius && d < bestDist) { best = item; bestDist = d; }
    }
    const pressed = this.pressQueued; this.pressQueued = false;
    if (!isDown) { this.lockUntilRelease = false; this.progress = 0; }
    if (!best) { this.holdTarget = null; this.progress = 0; return null; }
    if (best !== this.holdTarget) { this.holdTarget = best; this.progress = 0; }
    const coolingDown = best.cooldownUntil > time;
    if (best.mode === 'tap') { if (pressed) this._activate(best, time, coolingDown); }
    else if (isDown && !this.lockUntilRelease) {
      this.progress += dt / Math.max(0.01, best.holdSeconds);
      if (this.progress >= 1) { this.progress = 0; this.lockUntilRelease = true; this._activate(best, time, coolingDown); }
    }
    return { item: best, progress: this.progress };
  }
  /**
   * Fires an interactable's handler, applying cooldowns.
   * @param {Object} item - Interactable.
   * @param {number} time - Elapsed seconds.
   * @param {boolean} coolingDown - True if still on cooldown.
   * @returns {void}
   */
  _activate(item, time, coolingDown) {
    if (coolingDown) { if (this.onCooldownAttempt) this.onCooldownAttempt(); return; }
    const result = item.onActivate();
    if (result !== false && item.cooldownSeconds > 0) item.cooldownUntil = time + item.cooldownSeconds;
  }
}

/** Player locomotion, stamina and vitals. */
class PlayerController {
  /**
   * @param {Object} config - CONFIG (player, stamina, health sections are read).
   */
  constructor(config) {
    this.cfg = config.player; this.staminaCfg = config.stamina; this.healthCfg = config.health;
    this.position = new THREE.Vector3(this.cfg.spawn.x, 0, this.cfg.spawn.z);
    this.velocity = new THREE.Vector3();
    this.facingYaw = this.cfg.spawn.yaw + Math.PI; this.yawRate = 0;
    this.stamina = this.staminaCfg.max; this.health = this.healthCfg.max;
    this.exhausted = false; this.regenTimer = 0; this.isSprinting = false; this.speed = 0;
  }

  /**
   * Resolves circle-vs-AABB collisions in the XZ plane.
   * @param {THREE.Vector3} pos - Position (modified in place).
   * @param {number} radius - Circle radius.
   * @param {Object[]} colliders - Collider list.
   * @returns {void}
   */
  static resolveCollisions(pos, radius, colliders) {
    for (let pass = 0; pass < 3; pass++) {
      for (const c of colliders) {
        if (!c.enabled || pos.x < c.minX - radius || pos.x > c.maxX + radius || pos.z < c.minZ - radius || pos.z > c.maxZ + radius) continue;
        const cx = MathUtil.clamp(pos.x, c.minX, c.maxX), cz = MathUtil.clamp(pos.z, c.minZ, c.maxZ);
        const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
        if (d2 >= radius * radius) continue;
        if (d2 > 1e-8) { const d = Math.sqrt(d2), push = (radius - d) / d; pos.x += dx * push; pos.z += dz * push; }
        else {
          const left = pos.x - c.minX, right = c.maxX - pos.x, up = pos.z - c.minZ, down = c.maxZ - pos.z, m = Math.min(left, right, up, down);
          if (m === left) pos.x = c.minX - radius; else if (m === right) pos.x = c.maxX + radius; else if (m === up) pos.z = c.minZ - radius; else pos.z = c.maxZ + radius;
        }
      }
    }
  }

  /**
   * Advances movement, sprint and stamina.
   * @param {number} dt - Delta seconds.
   * @param {InputManager} input - Input source.
   * @param {number} cameraYaw - Camera yaw (movement is camera relative).
   * @param {Object[]} colliders - Colliders of the active level.
   * @param {boolean} enabled - False freezes input (paused/reading).
   * @returns {void}
   */
  update(dt, input, cameraYaw, colliders, enabled) {
    const fwd = enabled ? (input.isActionDown('moveForward') ? 1 : 0) - (input.isActionDown('moveBackward') ? 1 : 0) : 0;
    const strafe = enabled ? (input.isActionDown('moveRight') ? 1 : 0) - (input.isActionDown('moveLeft') ? 1 : 0) : 0;
    const moving = fwd !== 0 || strafe !== 0;
    let dirX = 0, dirZ = 0;
    if (moving) {
      dirX = -Math.sin(cameraYaw) * fwd + Math.cos(cameraYaw) * strafe;
      dirZ = -Math.cos(cameraYaw) * fwd - Math.sin(cameraYaw) * strafe;
      const len = Math.hypot(dirX, dirZ); dirX /= len; dirZ /= len;
    }
    this._updateStamina(dt, moving && enabled && input.isActionDown('sprint'));
    const targetSpeed = moving ? (this.isSprinting ? this.cfg.sprintSpeed : this.cfg.walkSpeed) : 0;
    const sharp = moving ? this.cfg.acceleration : this.cfg.deceleration;
    this.velocity.x = MathUtil.damp(this.velocity.x, dirX * targetSpeed, sharp, dt);
    this.velocity.z = MathUtil.damp(this.velocity.z, dirZ * targetSpeed, sharp, dt);
    this.position.x += this.velocity.x * dt; this.position.z += this.velocity.z * dt;
    PlayerController.resolveCollisions(this.position, this.cfg.radius, colliders);
    this.speed = Math.hypot(this.velocity.x, this.velocity.z);
    const previousYaw = this.facingYaw;
    if (this.speed > 0.25) this.facingYaw = MathUtil.dampAngle(this.facingYaw, Math.atan2(this.velocity.x, this.velocity.z), this.cfg.turnSharpness, dt);
    this.yawRate = MathUtil.clamp(((((this.facingYaw - previousYaw + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) / Math.max(dt, 1e-4), -12, 12);
  }

  /**
   * Handles sprint eligibility, drain, regeneration and exhaustion.
   * @param {number} dt - Delta seconds.
   * @param {boolean} wantsSprint - Sprint key held while moving.
   * @returns {void}
   */
  _updateStamina(dt, wantsSprint) {
    const c = this.staminaCfg;
    this.isSprinting = wantsSprint && !this.exhausted && this.stamina > 0;
    if (this.isSprinting) {
      this.stamina = Math.max(0, this.stamina - c.drainPerSecond * dt); this.regenTimer = c.regenDelaySeconds;
      if (this.stamina <= 0) { this.exhausted = true; this.isSprinting = false; }
    } else {
      this.regenTimer -= dt;
      if (this.regenTimer <= 0) this.stamina = Math.min(c.max, this.stamina + c.regenPerSecond * dt);
      if (this.exhausted && this.stamina >= c.exhaustedRecoverAt) this.exhausted = false;
    }
  }

  /**
   * Moves the player instantly.
   * @param {number} x - X.
   * @param {number} y - World floor height.
   * @param {number} z - Z.
   * @param {number} cameraYaw - Camera yaw; the character faces the same direction.
   * @returns {void}
   */
  teleport(x, y, z, cameraYaw) { this.position.set(x, y, z); this.velocity.set(0, 0, 0); this.facingYaw = cameraYaw + Math.PI; }
  /**
   * Restores stamina (and clears exhaustion if above the recover threshold).
   * @param {number} amount - Stamina points.
   * @returns {void}
   */
  restoreStamina(amount) { this.stamina = Math.min(this.staminaCfg.max, this.stamina + amount); if (this.stamina >= this.staminaCfg.exhaustedRecoverAt) this.exhausted = false; }
  /**
   * Heals the player.
   * @param {number} amount - Health points.
   * @returns {void}
   */
  heal(amount) { this.health = Math.min(this.healthCfg.max, this.health + amount); }
  /**
   * Applies damage.
   * @param {number} amount - Health points.
   * @returns {void}
   */
  damage(amount) { this.health = Math.max(0, this.health - amount); }
}

/** Orbit camera with shoulder offset, wall collision and first-person mode. */
class ThirdPersonCamera {
  /**
   * @param {THREE.PerspectiveCamera} camera - Camera to drive.
   * @param {Object} config - CONFIG.camera.
   * @param {number} initialYaw - Starting yaw.
   */
  constructor(camera, config, initialYaw) {
    this.camera = camera; this.cfg = config; this.yaw = initialYaw; this.pitch = config.defaultPitch;
    this.currentDistance = config.distance; this.firstPerson = false; this.fov = camera.fov;
    this.lookDir = new THREE.Vector3(); this._pivot = new THREE.Vector3(); this._probe = new THREE.Vector3();
  }
  /**
   * Applies mouse look.
   * @param {number} dx - Mouse delta x (pixels).
   * @param {number} dy - Mouse delta y (pixels).
   * @param {number} sensitivity - User sensitivity multiplier.
   * @returns {void}
   */
  applyLook(dx, dy, sensitivity) {
    const k = this.cfg.baseSensitivity * sensitivity;
    this.yaw -= dx * k;
    this.pitch = MathUtil.clamp(this.pitch - dy * k, this.cfg.minPitch, this.cfg.maxPitch);
  }
  /**
   * Tests whether a point lies inside any enabled collider (inflated by padding).
   * @param {THREE.Vector3} p - Point.
   * @param {Object[]} colliders - Colliders.
   * @returns {boolean} True if blocked.
   */
  _blocked(p, colliders) {
    const pad = this.cfg.collisionPadding;
    for (const c of colliders) if (c.enabled && p.x > c.minX - pad && p.x < c.maxX + pad && p.z > c.minZ - pad && p.z < c.maxZ + pad) return true;
    return false;
  }
  /**
   * Updates camera transform.
   * @param {number} dt - Delta seconds.
   * @param {THREE.Vector3} target - Player position (feet).
   * @param {Object[]} colliders - Active level colliders.
   * @param {number} floorY - World floor height.
   * @param {number} ceilingY - World ceiling height above which the camera may not go.
   * @param {number} sprintBlend - 0..1 sprint amount for FOV kick.
   * @param {number} baseFov - User FOV.
   * @returns {void}
   */
  update(dt, target, colliders, floorY, ceilingY, sprintBlend, baseFov) {
    const cfg = this.cfg, cam = this.camera;
    const cp = Math.cos(this.pitch);
    this.lookDir.set(-Math.sin(this.yaw) * cp, Math.sin(this.pitch), -Math.cos(this.yaw) * cp);
    this.fov = MathUtil.damp(this.fov, baseFov + cfg.sprintFovBoost * sprintBlend, cfg.fovSharpness, dt);
    if (Math.abs(cam.fov - this.fov) > 0.01) { cam.fov = this.fov; cam.updateProjectionMatrix(); }
    if (this.firstPerson) {
      cam.position.set(target.x, target.y + cfg.firstPersonHeight, target.z);
      cam.lookAt(cam.position.clone().add(this.lookDir)); return;
    }
    const pivot = this._pivot.set(target.x + Math.cos(this.yaw) * cfg.shoulderOffset, target.y + cfg.pivotHeight, target.z - Math.sin(this.yaw) * cfg.shoulderOffset);
    let limit = cfg.distance;
    for (let d = cfg.collisionStep; d <= cfg.distance; d += cfg.collisionStep) {
      this._probe.copy(pivot).addScaledVector(this.lookDir, -d);
      if (this._probe.y < floorY + 0.18 || this._probe.y > ceilingY - 0.15 || this._blocked(this._probe, colliders)) { limit = Math.max(cfg.minDistance, d - cfg.collisionStep); break; }
    }
    const sharp = limit < this.currentDistance ? cfg.snapInSharpness : cfg.easeOutSharpness;
    this.currentDistance = MathUtil.damp(this.currentDistance, limit, sharp, dt);
    cam.position.copy(pivot).addScaledVector(this.lookDir, -this.currentDistance);
    cam.lookAt(pivot);
  }
}

/** Auto-generated settings panel driven by CONFIG.settingsSchema. */
class SettingsPanel {
  /**
   * @param {SettingsStore} settings - Settings store.
   * @param {Object[]} schema - Settings schema.
   */
  constructor(settings, schema) {
    this.root = $('#screen-settings'); this.list = $('#settings-list');
    schema.forEach((def) => this._addRow(settings, def));
  }
  /**
   * Creates one row.
   * @param {SettingsStore} settings - Store.
   * @param {Object} def - Schema entry.
   * @returns {void}
   */
  _addRow(settings, def) {
    const row = document.createElement('div'); row.className = 'setting-row';
    const label = document.createElement('label'); label.textContent = t(def.labelKey);
    const input = document.createElement('input'); const value = document.createElement('span'); value.className = 'setting-value';
    if (def.type === 'toggle') {

    } else {
      Object.assign(input, { type: 'range', min: def.min, max: def.max, step: def.step, value: settings.get(def.id) });
      value.textContent = Number(input.value).toFixed(2);
      input.addEventListener('input', () => { const v = parseFloat(input.value); settings.set(def.id, v); value.textContent = v.toFixed(2); });
    }
    row.append(label, input, value); this.list.appendChild(row);

  /** Hides the panel. @returns {void} */

/** Small top-down minimap showing zones, hazards and the player. */
class Minimap {
  /**
   * @param {HTMLCanvasElement} canvas - Target canvas.
   * @param {LevelBuilder[]} levels - Levels (zones are read from them).
   */
  constructor(canvas, levels) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.levels = levels; this.visible = true;
    this.bounds = levels.map((lv) => {
      const b = { x0: Infinity, z0: Infinity, x1: -Infinity, z1: -Infinity };
      lv.zones.forEach((z) => { b.x0 = Math.min(b.x0, z.x0); b.z0 = Math.min(b.z0, z.z0); b.x1 = Math.max(b.x1, z.x1); b.z1 = Math.max(b.z1, z.z1); });
      return b;
    });
  }
  /**
   * Redraws the map.
   * @param {number} level - Active level.
   * @param {THREE.Vector3} playerPosition - Player position.
   * @param {number} facingYaw - Character facing (rotation.y).
   * @param {string} activeZoneId - Id of the current zone.
   * @returns {void}
   */
  draw(level, playerPosition, facingYaw, activeZoneId) {
    this.canvas.style.display = this.visible ? 'block' : 'none';
    if (!this.visible) return;
    const { ctx, canvas } = this, b = this.bounds[level], pad = 8;
    const s = Math.min((canvas.width - pad * 2) / (b.x1 - b.x0), (canvas.height - pad * 2) / (b.z1 - b.z0));
    const ox = (canvas.width - (b.x1 - b.x0) * s) / 2, oz = (canvas.height - (b.z1 - b.z0) * s) / 2;
    const px = (x) => ox + (x - b.x0) * s, pz = (z) => oz + (z - b.z0) * s;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    this.levels[level].zones.forEach((z) => {
      ctx.fillStyle = z.id === activeZoneId ? 'rgba(232,116,42,0.28)' : 'rgba(46,60,74,0.6)';
      ctx.strokeStyle = '#3a4b5c'; ctx.lineWidth = 1;
      ctx.fillRect(px(z.x0), pz(z.z0), (z.x1 - z.x0) * s, (z.z1 - z.z0) * s); ctx.strokeRect(px(z.x0), pz(z.z0), (z.x1 - z.x0) * s, (z.z1 - z.z0) * s);
    });
    this.levels[level].hazards.forEach((h) => { ctx.fillStyle = 'rgba(80,220,110,0.25)'; ctx.fillRect(px(h.x0), pz(h.z0), (h.x1 - h.x0) * s, (h.z1 - h.z0) * s); });
    ctx.save(); ctx.translate(px(playerPosition.x), pz(playerPosition.z)); ctx.rotate(-facingYaw + Math.PI);
    ctx.fillStyle = '#e8742a'; ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(4, 5); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

/** Adaptive resolution controller that tries to hold the target frame rate. */
class PerformanceGovernor {
  /**
   * @param {Object} config - CONFIG.performance.
   */
  constructor(config) { this.config = config; this.frames = 0; this.elapsed = 0; this.fps = config.targetFps; this.autoFactor = 1; this.goodSeconds = 0; }
  /**
   * Records a frame and adapts the resolution factor once per sample window.
   * @param {number} dt - Delta seconds.
   * @param {boolean} adaptive - Whether adaptation is enabled.
   * @param {number} userScale - User render scale.
   * @returns {number} Effective render scale.
   */
  update(dt, adaptive, userScale) {
    const c = this.config;
    this.frames++; this.elapsed += dt;
    if (this.elapsed >= c.sampleSeconds) {
      this.fps = this.frames / this.elapsed; this.frames = 0; this.elapsed = 0;
      if (adaptive) {
        if (this.fps < c.lowerBelowFps) { this.autoFactor = Math.max(c.minScale / userScale, this.autoFactor - c.step); this.goodSeconds = 0; }
        else if (this.fps > c.raiseAboveFps) { this.goodSeconds += c.sampleSeconds; if (this.goodSeconds >= c.raiseAfterSeconds && this.autoFactor < 1) { this.autoFactor = Math.min(1, this.autoFactor + c.step * 0.5); this.goodSeconds = 0; } }
        else this.goodSeconds = 0;
      } else this.autoFactor = 1;
    }
    return Math.max(c.minScale, Math.min(userScale, userScale * this.autoFactor));
  }
}

/* ============================== 11. GAME ORCHESTRATOR ============================== */

/** Wires every subsystem together and runs the main loop. */
class Game {
  constructor() {
    this.state = 'loading'; this.level = 0; this.time = 0; this.lastNow = performance.now();
    this.flashlightOn = false; this.outdoorBlend = 0; this.lightning = { timer: 8, t: 99, flash: 0 };
    this.currentZone = null; this.environmentKey = ''; this.transitioning = false; this.hazardToastTimer = 0; this.minimapTimer = 0;
    this.settings = new SettingsStore(CONFIG.defaultSettings);
    this._initRenderer(); this._initScene(); this._initServices(); this._buildWorld(); this._initCharacter();
    this._initPostFx(); this._bakeProbes(); this._initUi(); this._bindEvents();
    this.onResize();
    this.state = 'menu';
    $('#title-status').textContent = t('menu.ready'); $('#btn-start').disabled = false;
    requestAnimationFrame((now) => this._frame(now));
  }

  /** Creates the renderer and camera. @returns {void} */
  _initRenderer() {
    this.canvas = $('#game-canvas');
    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: false, powerPreference: 'high-performance' });
    this.renderer.shadowMap.enabled = true; this.renderer.shadowMap.type = THREE.PCFSoftShadowMap; this.renderer.shadowMap.autoUpdate = false;
    this.renderer.setClearColor(0x000000, 1);
    this.camera = new THREE.PerspectiveCamera(this.settings.get('fov'), innerWidth / innerHeight, CONFIG.render.near, CONFIG.render.far);
    this.camera.layers.enable(1);
  }

  /** Creates scene, global lights, sky and weather. @returns {void} */
  _initScene() {
    const L = CONFIG.lighting;
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(L.fog.indoorColor, L.fog.indoorDensity);
    this.hemisphere = new THREE.HemisphereLight(L.hemisphere.skyColor, L.hemisphere.groundColor, L.hemisphere.indoor);
    this.moon = new THREE.DirectionalLight(L.moon.color, 0);
    this.moon.castShadow = true; this.moon.shadow.mapSize.set(L.moon.shadowSize, L.moon.shadowSize);
    const e = L.moon.shadowExtent; Object.assign(this.moon.shadow.camera, { left: -e, right: e, top: e, bottom: -e, near: 1, far: 120 });
    this.moon.shadow.bias = -0.0004; this.moon.shadow.normalBias = 0.05;
    const F = L.flashlight;
    this.flashlight = new THREE.SpotLight(F.color, 0, F.distance, F.angle, F.penumbra, F.decay);
    this.flashlight.castShadow = true; this.flashlight.shadow.mapSize.set(F.shadowSize, F.shadowSize);
    this.flashlight.shadow.camera.near = 0.3; this.flashlight.shadow.camera.far = F.distance; this.flashlight.shadow.bias = -0.0005; this.flashlight.shadow.normalBias = 0.03;
    this.scene.add(this.hemisphere, this.moon, this.moon.target, this.flashlight, this.flashlight.target);
    this.sky = new SkyDome(); this.scene.add(this.sky.mesh);
    this.rain = new RainSystem(CONFIG.particles.rain); this.scene.add(this.rain.group);
    const D = CONFIG.particles.dust;
    this.dust = new MoteField({ count: D.count, box: D.box, color: 0xcfe0ff, intensity: 1.2, size: 0.028, speed: 1, opacity: 0.55, follow: true });
    this.scene.add(this.dust.points);
  }

  /** Creates shared services (materials, lights, input, audio, interactions). @returns {void} */
  _initServices() {
    this.reflectionUniforms = { tReflection: { value: null }, uReflMatrix: { value: new THREE.Matrix4() }, uReflEnabled: { value: 0 } };
    this.textureFactory = new TextureFactory(this.renderer.capabilities.getMaxAnisotropy());
    this.materials = new MaterialLibrary(this.textureFactory, this.reflectionUniforms);
    this.lightPool = new DynamicLightPool(this.scene, CONFIG.lighting);
    this.flicker = new FlickerController();
    this.interactions = new InteractionSystem(CONFIG.interaction);
    this.interactions.onCooldownAttempt = () => this.hud && this.hud.toast(t('toast.cooldown'));
    this.audio = new AudioManager(CONFIG.audio);
    this.input = new InputManager(this.canvas, CONFIG.keybinds);
    this.governor = new PerformanceGovernor(CONFIG.performance);
    this.player = new PlayerController(CONFIG);
    this.camRig = new ThirdPersonCamera(this.camera, CONFIG.camera, CONFIG.player.spawn.yaw);
    this.probes = new EnvironmentProbes(this.renderer, this.scene, CONFIG.render.probeSize);
  }

  /**
   * Gameplay actions invoked by interactables (decoupled from level construction).
   * @returns {Object} Action handler map.
   */
  _createActions() {
    return {
      readDocument: (docKey) => { this.docViewer.open(docKey); this.state = 'reading'; this.audio.playPickup(); },
      drinkEnergy: () => { const a = CONFIG.items.energyDrink.staminaRestore; this.player.restoreStamina(a); this.hud.toast(t('toast.stamina', { amount: a })); this.audio.playPickup(); return true; },
      useMedkit: (pickup) => {
        if (this.player.health >= CONFIG.health.max) { this.hud.toast(t('toast.healthFull')); return false; }
        const a = CONFIG.items.medkit.healAmount; this.player.heal(a); pickup.consumed = true; pickup.group.visible = false;
        this.hud.toast(t('toast.healed', { amount: a })); this.audio.playPickup(); return true;
      },
      unlockDoor: (door) => { door.unlock(); this.hud.toast(t('toast.unlocked')); this.audio.playPickup(); },
      denyAccess: () => this.hud.toast(t('toast.denied')),
      rideElevator: (targetLevel) => this._rideElevator(targetLevel)
    };
  }

  /** Builds both facility levels. @returns {void} */
  _buildWorld() {
    this.actions = this._createActions();
    this.facility = new FacilityBuilder({
      materials: this.materials, lightPool: this.lightPool, flicker: this.flicker, interactions: this.interactions,
      actions: this.actions, world: CONFIG.world, lighting: CONFIG.lighting
    });
    this.levels = this.facility.build();
    this.levels.forEach((lv) => this.scene.add(lv.group));
    this.levels[1].group.visible = false;
    this.player.position.y = 0;
  }

  /** Builds the anime girl and her animator. @returns {void} */
  _initCharacter() {
    this.rig = new AnimeCharacterFactory(CONFIG.character).create();
    this.scene.add(this.rig.root);
    this.animator = new CharacterAnimator(this.rig, CONFIG.character, CONFIG.player);
    this.animator.onFootstep = (sprinting) => this.audio.playFootstep(sprinting);
  }

  /** Creates the reflector and post-processor. @returns {void} */
  _initPostFx() {
    this.reflector = new PlanarReflector(this.reflectionUniforms, CONFIG.reflection.clipBias);
    this.post = new PostProcessor(this.renderer, this.settings, CONFIG.postFx);
  }

  /** Bakes environment probes for indoor, outdoor and sublevel. @returns {void} */
  _bakeProbes() {
    this.rig.root.visible = false;
    const spots = [['indoor0', 0, new THREE.Vector3(-1, 1.6, 0)], ['outdoor0', 0, new THREE.Vector3(47, 1.6, 9)], ['indoor1', 1, new THREE.Vector3(-1, CONFIG.world.sublevelOffsetY + 1.6, 0)]];
    for (const [key, level, position] of spots) {
      this._applyLevelVisibility(level);
      this.flicker.update(0.5); this.lightPool.update(0, position, level, true);
      this.probes.bake(key, position);

    this._applyLevelVisibility(0);
    this.lightPool.update(0, this.camera.position, 0, true);
    this.rig.root.visible = true;
    this._setEnvironment('indoor0');
  }

  /**
   * Shows one level group (and the sky only on the surface).
   * @param {number} level - Level index.
   * @returns {void}
   */
  _applyLevelVisibility(level) { this.levels.forEach((lv, i) => { lv.group.visible = i === level; }); this.sky.mesh.visible = level === 0; }

  /**
   * Switches scene.environment to a baked probe.
   * @param {string} key - Probe key.
   * @returns {void}
   */
  _setEnvironment(key) { if (key !== this.environmentKey) { this.environmentKey = key; this.scene.environment = this.probes.get(key); } }

  /** Creates HUD, settings, documents and minimap and localizes the DOM. @returns {void} */
  _initUi() {
    Localization.applyToDom(document);
    this.hud = new Hud(this.input, CONFIG.ui);
    const lines = this.hud.buildControls();
    $('#title-controls').innerHTML = lines.map((l) => `<li>${l.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</li>`).join('');
    this.docViewer = new DocumentViewer();
    this.settingsPanel = new SettingsPanel(this.settings, CONFIG.settingsSchema);
    this.minimap = new Minimap(this.hud.el.minimap, this.levels);
    this.settings.subscribe((key, value) => { if (key === 'volume') this.audio.setVolume(value); });
    this.audio.setVolume(this.settings.get('volume'));
    this.hud.setLocation(0, 'zone.lobby');
  }

  /** Binds DOM and input events. @returns {void} */
  _bindEvents() {
    window.addEventListener('resize', () => this.onResize());
    $('#btn-start').addEventListener('click', () => this.beginPlay());
    $('#btn-resume').addEventListener('click', () => this.resume());
    $('#btn-doc-close').addEventListener('click', () => this.closeDocument());
    this.input.onActionPressed = (action) => this.onAction(action);
    this.input.onPointerLockLost = () => { if (this.state === 'playing' || this.state === 'reading') this.pause(); };
  }

  /**
   * Handles one-shot input actions.
   * @param {string} action - Action name.
   * @returns {void}
   */
  onAction(action) {
    if (this.state === 'reading') { if (action === 'interact' || action === 'openSettings') this.closeDocument(); return; }
    if (action === 'openSettings') { if (this.state === 'playing') this.pause(); else if (this.state === 'paused') this.resume(); return; }
    if (this.state !== 'playing') return;
    if (action === 'interact') this.interactions.queuePress();
    else if (action === 'flashlight') { this.flashlightOn = !this.flashlightOn; this.hud.toast(t(this.flashlightOn ? 'toast.flashlightOn' : 'toast.flashlightOff')); }
    else if (action === 'toggleView') { this.camRig.firstPerson = !this.camRig.firstPerson; this.hud.toast(t(this.camRig.firstPerson ? 'toast.firstPerson' : 'toast.thirdPerson')); }
    else if (action === 'toggleMute') { this.audio.setMuted(!this.audio.muted); this.hud.toast(t(this.audio.muted ? 'toast.muted' : 'toast.unmuted')); }
    else if (action === 'toggleMinimap') this.minimap.visible = !this.minimap.visible;
  }

  /** Starts gameplay from the title screen. @returns {void} */
  beginPlay() {
    this.audio.start();
    $('#screen-title').classList.add('hidden'); this.hud.show();
    this.state = 'playing'; this.input.requestPointerLock();
  }
  /** Pauses and opens settings. @returns {void} */
  pause() { this.state = 'paused'; this.docViewer.close(); this.settingsPanel.show(); this.input.releasePointerLock(); }
  /** Resumes gameplay. @returns {void} */
  resume() { this.settingsPanel.hide(); this.state = 'playing'; this.input.requestPointerLock(); }
  /** Closes the document viewer. @returns {void} */
  closeDocument() { this.docViewer.close(); if (this.state === 'reading') this.state = 'playing'; }

  /**
   * Fades to black, moves the player to the other level's elevator, and fades back in.
   * @param {number} targetLevel - Destination level.
   * @returns {void}
   */
  _rideElevator(targetLevel) {
    if (this.transitioning) return;
    this.transitioning = true;
    const fade = $('#fade-overlay'), ms = CONFIG.items.elevator.fadeSeconds * 1000;
    fade.style.opacity = '1'; this.audio.playDoor();
    setTimeout(() => {
      this.setLevel(targetLevel);
      this.player.teleport(-1, this.levels[targetLevel].baseY, 13.2, 0);
      this.camRig.yaw = 0; this.camRig.pitch = CONFIG.camera.defaultPitch;
      this.audio.playElevatorDing();
      setTimeout(() => { fade.style.opacity = '0'; this.transitioning = false; }, ms * 0.6);
    }, ms);
  }

  /**
   * Activates a level.
   * @param {number} level - Level index.
   * @returns {void}
   */
  setLevel(level) {
    this.level = level; this._applyLevelVisibility(level); this.post.hasPrev = false;
    this.lightPool.update(0, this.player.position, level, true); this.currentZone = null;
  }

  /** Resize handler. @returns {void} */
  onResize() {
    const pr = Math.min(window.devicePixelRatio || 1, CONFIG.render.maxPixelRatio);
    this.pixelRatio = pr; this.renderer.setPixelRatio(pr); this.renderer.setSize(innerWidth, innerHeight, false);
    this.camera.aspect = innerWidth / innerHeight; this.camera.updateProjectionMatrix();
  }

  /**
   * Animation frame callback.
   * @param {number} now - High-resolution timestamp.
   * @returns {void}
   */
  _frame(now) {
    requestAnimationFrame((n) => this._frame(n));
    const dt = Math.min(0.05, (now - this.lastNow) / 1000); this.lastNow = now;
    if (dt <= 0) return;
    this.time += dt;
    this._update(dt); this._render(dt);
  }

  /**
   * Updates simulation, environment and UI.
   * @param {number} dt - Delta seconds.
   * @returns {void}
   */
  _update(dt) {
    const look = this.input.consumeMouseDelta(), playing = this.state === 'playing';
    if (playing && !this.transitioning) this.camRig.applyLook(look.x, look.y, this.settings.get('mouseSensitivity'));
    const level = this.levels[this.level], p = this.player;
    p.update(dt, this.input, this.camRig.yaw, level.colliders, playing && !this.transitioning);
    p.position.y = level.baseY;
    this.levels.forEach((lv) => lv.doors.forEach((door) => door.update(dt, p.position, this.level, CONFIG.world, () => this.audio.playDoor())));

    const zone = this.facility.getZoneAt(this.level, p.position.x, p.position.z);
    if (zone !== this.currentZone) { this.currentZone = zone; this.hud.setLocation(this.level, zone ? zone.nameKey : 'zone.unknown'); }
    const outdoor = !!(zone && zone.outdoor);
    this.outdoorBlend = MathUtil.damp(this.outdoorBlend, outdoor ? 1 : 0, 2.2, dt);
    this._setEnvironment(this.level === 1 ? 'indoor1' : (outdoor ? 'outdoor0' : 'indoor0'));

    if (playing) { this._updateHazards(dt, level); this.hud.setPrompt(this.interactions.update(dt, p.position, this.level, this.input.isActionDown('interact'), this.time)); }
    else if (this.state !== 'reading') this.hud.setPrompt(null);
    if (p.health <= 0 && !this.transitioning) this._respawn();

    const ceilingY = level.baseY + (outdoor ? 14 : CONFIG.world.wallHeight);
    this.camRig.update(dt, p.position, level.colliders, level.baseY, ceilingY, this.animator.sprintBlend, this.settings.get('fov'));
    this.camera.updateMatrixWorld();
    const camForward = this.camRig.lookDir;

    this.rig.root.position.copy(p.position); this.rig.root.rotation.y = p.facingYaw; this.rig.root.visible = !this.camRig.firstPerson;
    this.animator.update(dt, { speed: p.speed, isSprinting: p.isSprinting, yawRate: p.yawRate, flashlightOn: this.flashlightOn });

    this._updateLighting(dt, camForward);
    this.flicker.update(this.time);
    this.lightPool.update(dt, this.camera.position, this.level);
    level.update(dt, this.time, { playerPosition: p.position, cameraPosition: this.camera.position, cameraForward: camForward });
    this._updateParticles();

    this.audio.setRainLevel(this.settings.get('rainDensity') * this.outdoorBlend);
    this.hud.setVitals(p.health, CONFIG.health.max, p.stamina, CONFIG.stamina.max, p.exhausted);
    this.hud.update(dt);
    this.minimapTimer -= dt;
    if (this.minimapTimer <= 0) { this.minimapTimer = CONFIG.ui.minimapIntervalSeconds; this.minimap.draw(this.level, p.position, p.facingYaw, zone ? zone.id : ''); }
  }

  /**
   * Applies hazard damage when standing in a hazard zone.
   * @param {number} dt - Delta seconds.
   * @param {LevelBuilder} level - Active level.
   * @returns {void}
   */
  _updateHazards(dt, level) {
    const p = this.player.position;
    const hazard = level.hazards.find((h) => p.x >= h.x0 && p.x <= h.x1 && p.z >= h.z0 && p.z <= h.z1);
    this.hazardToastTimer -= dt;
    if (!hazard) return;
    this.player.damage(hazard.dps * dt);
    this.hud.flashDamage(CONFIG.hazards.damageFlashSeconds);
    if (this.hazardToastTimer <= 0) { this.hud.toast(t('toast.toxic')); this.hazardToastTimer = 3; }
  }

  /** Sends the player back to the lobby after death. @returns {void} */
  _respawn() {
    this.transitioning = true;
    const fade = $('#fade-overlay'); fade.style.opacity = '1';
    setTimeout(() => {
      this.setLevel(0); const s = CONFIG.player.spawn;
      this.player.teleport(s.x, 0, s.z, s.yaw); this.camRig.yaw = s.yaw;
      this.player.health = CONFIG.health.max * 0.5; this.player.stamina = CONFIG.stamina.max;
      this.hud.toast(t('toast.respawn'));
      setTimeout(() => { fade.style.opacity = '0'; this.transitioning = false; }, 400);
    }, CONFIG.health.respawnDelaySeconds * 1000);
  }

  /**
   * Updates global lights, fog, lightning, flashlight.
   * @param {number} dt - Delta seconds.
   * @param {THREE.Vector3} camForward - Camera look direction.
   * @returns {void}
   */
  _updateLighting(dt, camForward) {
    const L = CONFIG.lighting, b = this.outdoorBlend, shadows = this.settings.get('shadows');
    const lg = this.lightning; lg.timer -= dt; lg.t += dt;
    if (lg.timer <= 0) { lg.timer = L.lightning.minInterval + Math.random() * (L.lightning.maxInterval - L.lightning.minInterval); lg.t = 0; if (b > 0.3) this.audio.playThunder(0.4 + Math.random() * 1.4); }
    lg.flash = Math.exp(-lg.t * 5) * (0.55 + 0.45 * Math.sin(lg.t * 55)) * (lg.t < 1.2 ? 1 : 0);
    this.moon.intensity = (L.moon.intensity + lg.flash * L.lightning.flashStrength) * b;
    this.moon.shadow.autoUpdate = shadows && b > 0.02;
    this.moon.target.position.copy(this.player.position);
    this.moon.position.copy(this.player.position).add(new THREE.Vector3(0.35, 1, 0.25).normalize().multiplyScalar(L.moon.height));
    this.hemisphere.intensity = MathUtil.lerp(L.hemisphere.indoor, L.hemisphere.outdoor, b) + lg.flash * 0.6 * b;
    this.scene.fog.density = MathUtil.lerp(L.fog.indoorDensity, L.fog.outdoorDensity, b);
    this.scene.fog.color.setHex(L.fog.indoorColor).lerp(new THREE.Color(L.fog.outdoorColor), b);
    this.sky.update(this.camera.position, lg.flash * b);
    this.flashFrame = lg.flash * b;

    const F = L.flashlight, on = this.flashlightOn;
    const head = this.player.position.clone(); head.y += 1.5;
    head.x += Math.cos(this.camRig.yaw) * 0.18; head.z -= Math.sin(this.camRig.yaw) * 0.18;
    const aim = this.camera.position.clone().addScaledVector(camForward, 30);
    this.flashlight.position.copy(this.camRig.firstPerson ? this.camera.position : head);
    this.flashlight.target.position.copy(aim);
    this.flashlight.intensity = MathUtil.damp(this.flashlight.intensity, on ? F.intensity : 0, 18, dt);
    this.flashlight.shadow.autoUpdate = on && shadows;
  }

  /** Updates particle uniforms and weather placement. @returns {void} */
  _updateParticles() {
    ParticleUniforms.uTime.value = this.time;
    const h = this.post.size ? this.post.size.h : innerHeight;
    ParticleUniforms.uScale.value = (h * 0.5) / Math.tan(THREE.MathUtils.degToRad(this.camera.fov) / 2);
    this.dust.update(this.camera.position);
    this.rain.update(this.camera.position, this.levels[0].baseY, this.level === 0 ? this.settings.get('rainDensity') * this.outdoorBlend : 0);
  }

  /**
   * Renders the frame (reflection pass + post-processed scene).
   * @param {number} dt - Delta seconds.
   * @returns {void}
   */
  _render(dt) {
    const s = this.settings;
    const scale = this.governor.update(dt, s.get('adaptiveResolution'), s.get('renderScale'));
    const w = Math.floor(innerWidth * this.pixelRatio * scale), h = Math.floor(innerHeight * this.pixelRatio * scale);
    this.post.resize(w, h);
    const reflectionScale = s.get('reflectionScale');
    if (reflectionScale > 0.01) { this.reflector.resize(w * reflectionScale, h * reflectionScale); this.reflector.render(this.renderer, this.scene, this.camera, this.levels[this.level].baseY); }
    else this.reflectionUniforms.uReflEnabled.value = 0;
    const characterPosition = this.camRig.firstPerson ? null : this.player.position.clone().setY(this.player.position.y + 1.0);
    this.post.render(this.scene, this.camera, { time: this.time, focusDistance: this.camRig.firstPerson ? 6 : this.camRig.currentDistance + 0.4, characterPosition, flash: this.flashFrame || 0 });
    this.hud.setFps(s.get('showFps') ? `${Math.round(this.governor.fps)} FPS  ·  ${Math.round(scale * 100)}%` : null);
  }
}

/* ============================== BOOTSTRAP ============================== */

window.addEventListener('load', () => {
  Localization.applyToDom(document);
  setTimeout(() => {
    try { window.scpGame = new Game(); }
    catch (err) { console.error(err); $('#title-status').textContent = `Initialization failed: ${err.message}`; }
  }, 40);
});
</script>
