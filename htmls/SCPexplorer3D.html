<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCP Foundation — Site-19 Explorer</title>
<style>
:root{
  color-scheme: dark;
  --bg:#06080b; --panel:rgba(11,15,19,.88); --panel-solid:#0d1217; --border:#25313c; --border-strong:#38485a;
  --text:#c8d2dc; --muted:#7d8b98; --accent:#e8742a; --accent-2:#3fb6a8; --danger:#d2433b;
  --stamina:#4aa8f0; --health:#d24a4a; --track:#161d24;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:13px;user-select:none;-webkit-user-select:none}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
.hidden{display:none !important}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom)) 16px}
#hud-location{position:absolute;left:16px;top:calc(14px + var(--safe-top));padding:8px 12px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent)}
#hud-level{color:var(--muted);font-size:11px;letter-spacing:.12em}
#hud-zone{font-size:15px;letter-spacing:.08em;margin-top:2px;color:var(--text)}
#hud-fps{position:absolute;right:16px;top:calc(142px + var(--safe-top));color:var(--muted);font-size:11px;text-align:right}
#minimap{position:absolute;right:16px;top:calc(14px + var(--safe-top));background:var(--panel);border:1px solid var(--border);width:200px;height:120px}
#hud-bars{position:absolute;left:16px;bottom:calc(18px + var(--safe-bottom));width:min(300px,52vw);display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.bar .track{height:9px;background:var(--track);border:1px solid var(--border)}
.bar .fill{height:100%;width:100%;transition:background-color .2s}
.fill.health{background:var(--health)} .fill.stamina{background:var(--stamina)} .fill.exhausted{background:#7a5a2a}
.bar-value{text-align:right;color:var(--text)}
#hud-controls{position:absolute;right:16px;bottom:calc(18px + var(--safe-bottom));font-size:11px;color:var(--muted);line-height:1.65;text-align:right;
  padding:8px 12px;background:var(--panel);border:1px solid var(--border)}
#hud-prompt{position:absolute;left:50%;bottom:calc(120px + var(--safe-bottom));transform:translateX(-50%);padding:10px 18px;background:var(--panel);border:1px solid var(--border-strong);text-align:center;min-width:240px}
#prompt-text{font-size:14px;letter-spacing:.06em}
#prompt-track{height:4px;background:var(--track);margin-top:8px}
#prompt-fill{height:100%;width:0;background:var(--accent)}
#hud-toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:8px 16px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent-2);opacity:0;transition:opacity .25s;font-size:13px;letter-spacing:.05em}
#hud-toast.show{opacity:1}
#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(200,210,220,.45)}
#damage-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at center,rgba(120,10,10,0) 40%,rgba(150,15,15,.55) 100%);z-index:5}
#fade-overlay{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .5s;z-index:30}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px;
  background:radial-gradient(ellipse at center,rgba(4,6,9,.78),rgba(3,4,6,.96))}
.panel{background:var(--panel-solid);border:1px solid var(--border-strong);padding:26px 30px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 0 60px rgba(0,0,0,.7)}
.title-panel{text-align:center;border-top:3px solid var(--accent)}
.title-panel h1{margin:6px 0 2px;font-size:34px;letter-spacing:.28em;font-weight:700}
.title-panel h2{margin:0 0 18px;font-size:12px;letter-spacing:.3em;color:var(--muted);font-weight:400}
.title-panel p{color:var(--muted);line-height:1.6}
.title-panel ul{list-style:none;padding:0;margin:16px 0;text-align:left;color:var(--text);line-height:1.8;font-size:12px;border-top:1px solid var(--border);padding-top:12px}
.hint{font-size:11px}
button{font:inherit;letter-spacing:.14em;color:var(--text);background:#141b22;border:1px solid var(--border-strong);padding:11px 26px;cursor:pointer;pointer-events:auto}
button:hover:not(:disabled){background:#1b2530;border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.settings-panel h2,.doc-panel h3{margin:0 0 14px;letter-spacing:.2em;font-size:15px;color:var(--accent)}
.setting-row{display:grid;grid-template-columns:1fr 170px 46px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.setting-row input[type=range]{width:100%;accent-color:var(--accent);background:transparent}
.setting-row input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;justify-self:start}
.setting-value{text-align:right;color:var(--muted)}
.row{display:flex;justify-content:flex-end;margin-top:16px}
.doc-panel{border-left:3px solid var(--accent-2)}
#doc-body{line-height:1.75;color:var(--text);white-space:pre-wrap;margin:0 0 18px;font-size:13px}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud" class="hidden">
  <div id="hud-location"><div id="hud-level"></div><div id="hud-zone"></div></div>
  <canvas id="minimap" width="200" height="120"></canvas>
  <div id="hud-fps"></div>
  <div id="hud-bars">
    <div class="bar"><span data-i18n="hud.health"></span><div class="track"><div id="health-fill" class="fill health"></div></div><span id="health-value" class="bar-value"></span></div>
    <div class="bar"><span data-i18n="hud.stamina"></span><div class="track"><div id="stamina-fill" class="fill stamina"></div></div><span id="stamina-value" class="bar-value"></span></div>
  </div>
  <div id="hud-controls"></div>
  <div id="hud-prompt" class="hidden"><div id="prompt-text"></div><div id="prompt-track"><div id="prompt-fill"></div></div></div>
  <div id="hud-toast"></div>
  <div id="crosshair"></div>
</div>
<div id="damage-overlay"></div>
<div id="fade-overlay"></div>

<div id="screen-title" class="screen">
  <div class="panel title-panel">
    <h1 data-i18n="game.title"></h1>
    <h2 data-i18n="game.subtitle"></h2>
    <p id="title-status" data-i18n="menu.loading"></p>
    <button id="btn-start" disabled data-i18n="menu.start"></button>
    <ul id="title-controls"></ul>
    <p class="hint" data-i18n="menu.pointerHint"></p>
  </div>
</div>

<div id="screen-settings" class="screen hidden">
  <div class="panel settings-panel">
    <h2 data-i18n="settings.title"></h2>
    <div id="settings-list"></div>
    <div class="row"><button id="btn-resume" data-i18n="menu.resume"></button></div>
  </div>
</div>

<div id="screen-document" class="screen hidden">
  <div class="panel doc-panel">
    <h3 id="doc-title"></h3>
    <p id="doc-body"></p>
    <div class="row"><button id="btn-doc-close" data-i18n="doc.close"></button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
'use strict';
/* =====================================================================================
 *  SCP FOUNDATION — SITE-19 EXPLORER
 *  Architecture overview (top to bottom):
 *   0  Utilities & freezing helpers
 *   1  CONFIG (all tunables) and STRINGS (all displayed text) + Localization
 *   2  Input, Audio, Settings store
 *   3  Procedural textures & materials (world-space UV mapping, planar reflection hook)
 *   4  Lighting (dynamic light pool, flicker) and environment probes
 *   5  Particles (rain, dust, sparks), sky dome
 *   6  Rendering pipeline (planar reflector, post-processing: DOF, motion blur, bloom, grade)
 *   7  Anime character (toon model, outline, procedural animation)
 *   8  World construction (batched level builder, props, doors, facility layout)
 *   9  Gameplay (interaction, player, camera, hazards)
 *  10  UI (HUD, documents, settings, minimap) and performance governor
 *  11  Game orchestrator and bootstrap
 * ===================================================================================== */

/* ============================== 0. UTILITIES ============================== */

/**
 * Recursively freezes an object so configuration cannot be mutated at runtime.
 * @param {Object} obj - Object (or array) to freeze.
 * @returns {Object} The same object, deeply frozen.
 */
function deepFreeze(obj) {
  Object.values(obj).forEach((value) => {
    if (value && typeof value === 'object' && !Object.isFrozen(value)) deepFreeze(value);
  });
  return Object.freeze(obj);
}

/** Small collection of numeric helpers used across the code base. */
const MathUtil = {
  /**
   * Clamps a value into a range.
   * @param {number} value - Input value.
   * @param {number} min - Lower bound.
   * @param {number} max - Upper bound.
   * @returns {number} Clamped value.
   */
  clamp(value, min, max) { return Math.min(max, Math.max(min, value)); },
  /**
   * Linear interpolation.
   * @param {number} a - Start value.
   * @param {number} b - End value.
   * @param {number} t - Blend factor (0..1).
   * @returns {number} Interpolated value.
   */
  lerp(a, b, t) { return a + (b - a) * t; },
  /**
   * Frame-rate independent exponential smoothing toward a target.
   * @param {number} current - Current value.
   * @param {number} target - Target value.
   * @param {number} sharpness - Higher is faster (1/seconds).
   * @param {number} dt - Delta time in seconds.
   * @returns {number} New smoothed value.
   */
  damp(current, target, sharpness, dt) { return current + (target - current) * (1 - Math.exp(-sharpness * dt)); },
  /**
   * Smoothly interpolates an angle along the shortest arc.
   * @param {number} current - Current angle (radians).
   * @param {number} target - Target angle (radians).
   * @param {number} sharpness - Smoothing sharpness.
   * @param {number} dt - Delta time in seconds.
   * @returns {number} New angle in radians.
   */
  dampAngle(current, target, sharpness, dt) {
    const twoPi = Math.PI * 2;
    const delta = ((((target - current + Math.PI) % twoPi) + twoPi) % twoPi) - Math.PI;
    return current + delta * (1 - Math.exp(-sharpness * dt));
  },
  /**
   * Hermite smoothstep.
   * @param {number} edge0 - Lower edge.
   * @param {number} edge1 - Upper edge.
   * @param {number} x - Input value.
   * @returns {number} Smoothed value in 0..1.
   */
  smoothstep(edge0, edge1, x) {
    const t = MathUtil.clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }
};

/** Deterministic pseudo random generator (mulberry32) so procedural content is reproducible. */
class SeededRandom {
  /**
   * @param {number} seed - Integer seed.
   */
  constructor(seed) { this.state = seed >>> 0; }
  /**
   * Produces the next random number.
   * @returns {number} Float in [0, 1).
   */
  next() {
    let t = (this.state += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  /**
   * Random float within a range.
   * @param {number} min - Inclusive lower bound.
   * @param {number} max - Exclusive upper bound.
   * @returns {number} Random float.
   */
  range(min, max) { return min + (max - min) * this.next(); }
}

/**
 * Creates an HDR (greater than 1) colour, used for emissive instances that should bloom.
 * @param {number} hex - Base colour as 0xRRGGBB.
 * @param {number} strength - Multiplier applied to the linear colour.
 * @returns {THREE.Color} New colour instance.
 */
function hdrColor(hex, strength) { return new THREE.Color(hex).multiplyScalar(strength); }

/**
 * Converts a '#rrggbb' string to an [r,g,b] array of 0..255 integers.
 * @param {string} hex - CSS hex colour.
 * @returns {number[]} RGB triplet.
 */
function hexToRgb(hex) {
  const value = parseInt(hex.slice(1), 16);
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}

  performance: { targetFps: 60, sampleSeconds: 1, lowerBelowFps: 54, raiseAboveFps: 58, raiseAfterSeconds: 6, step: 0.08, minScale: 0.55 },
  ui: { toastSeconds: 2.4, minimapIntervalSeconds: 0.1 },

/** Localization helper that resolves keys from STRINGS with parameter substitution and English fallback. */
const Localization = {
  locale: 'en',
  /**
   * Looks up a string and substitutes {placeholders}.
   * @param {string} key - String table key.
   * @param {Object} [params] - Placeholder values.
   * @returns {string} Localized string (or the key itself if missing).
   */
  t(key, params) {
    const table = STRINGS[this.locale] || STRINGS.en;
    let text = table[key] !== undefined ? table[key] : (STRINGS.en[key] !== undefined ? STRINGS.en[key] : key);
    if (params) text = text.replace(/\{(\w+)\}/g, (match, name) => (params[name] !== undefined ? params[name] : match));
    return text;
  },
  /**
   * Fills every element carrying a data-i18n attribute with its translated text.
   * @param {ParentNode} root - DOM subtree to translate.
   * @returns {void}
   */
  applyToDom(root) {
    root.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = this.t(el.dataset.i18n); });
  }
};
/** Shorthand for Localization.t. */
const t = (key, params) => Localization.t(key, params);

/** Collects keyboard + mouse input, exposes action-based queries and handles pointer lock. */
class InputManager {
  /**
   * @param {HTMLCanvasElement} canvas - Element that captures the mouse.
   * @param {Object<string,string[]>} keybinds - Action → key code list.
   */
  constructor(canvas, keybinds) {
    this.canvas = canvas;
    this.keybinds = keybinds;
    this.heldCodes = new Set();
    this.codeToActions = new Map();
    this.mouseDeltaX = 0;
    this.mouseDeltaY = 0;
    this.isPointerLocked = false;
    this.isDragging = false;
    this.onPointerLockLost = null;
    this.onActionPressed = null;
    for (const [action, codes] of Object.entries(keybinds)) {
      for (const code of codes) {
        if (!this.codeToActions.has(code)) this.codeToActions.set(code, []);
        this.codeToActions.get(code).push(action);
      }
    }
    this._bindEvents();
  }

  /**
   * Registers all DOM listeners.
   * @returns {void}
   */
  _bindEvents() {
    window.addEventListener('keydown', (e) => this._onKeyDown(e));
    window.addEventListener('keyup', (e) => this.heldCodes.delete(e.code));
    window.addEventListener('blur', () => { this.heldCodes.clear(); this.isDragging = false; });
    this.canvas.addEventListener('mousedown', (e) => this._onMouseDown(e));
    window.addEventListener('mouseup', (e) => this._onMouseUp(e));
    window.addEventListener('mousemove', (e) => this._onMouseMove(e));
    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('pointerlockchange', () => this._onPointerLockChange());
  }

  /**
   * Handles key presses: tracks held keys and fires one-shot action events.
   * @param {KeyboardEvent} e - Keyboard event.
   * @returns {void}
   */
  _onKeyDown(e) {
    const actions = this.codeToActions.get(e.code);
    if (!actions) return;
    e.preventDefault();
    if (!e.repeat && this.onActionPressed) actions.forEach((action) => this.onActionPressed(action));
    this.heldCodes.add(e.code);
  }

  /**
   * Handles mouse button presses (also mapped as 'Mouse0', 'Mouse1', ...).
   * @param {MouseEvent} e - Mouse event.
   * @returns {void}
   */
  _onMouseDown(e) {
    const code = `Mouse${e.button}`;
    this.heldCodes.add(code);
    if (!this.isPointerLocked) this.isDragging = true;
    const actions = this.codeToActions.get(code);
    if (actions && this.onActionPressed) actions.forEach((action) => this.onActionPressed(action));
  }

  /**
   * Handles mouse button releases.
   * @param {MouseEvent} e - Mouse event.
   * @returns {void}
   */
  _onMouseUp(e) { this.heldCodes.delete(`Mouse${e.button}`); this.isDragging = false; }

  /**
   * Accumulates mouse movement while the pointer is captured or dragged.
   * @param {MouseEvent} e - Mouse event.
   * @returns {void}
   */
  _onMouseMove(e) {
    if (!this.isPointerLocked && !this.isDragging) return;
    this.mouseDeltaX += e.movementX || 0;
    this.mouseDeltaY += e.movementY || 0;
  }

  /**
   * Tracks pointer-lock state and notifies when the user escapes it.
   * @returns {void}
   */
  _onPointerLockChange() {
    const locked = document.pointerLockElement === this.canvas;
    const lost = this.isPointerLocked && !locked;
    this.isPointerLocked = locked;
    if (lost && this.onPointerLockLost) this.onPointerLockLost();
  }

  /**
   * Requests pointer capture (silently ignored when the browser forbids it).
   * @returns {void}
   */
  requestPointerLock() {
    try {
      const result = this.canvas.requestPointerLock();
      if (result && typeof result.catch === 'function') result.catch(() => {});
    } catch (err) { /* sandboxed environment: drag-look fallback is used */ }
  }

  /**
   * Releases pointer capture if active.
   * @returns {void}
   */
  releasePointerLock() { if (document.pointerLockElement) document.exitPointerLock(); }

  /**
   * Checks whether any key bound to an action is currently held.
   * @param {string} action - Action name from CONFIG.keybinds.
   * @returns {boolean} True when held.
   */
  isActionDown(action) { return this.keybinds[action].some((code) => this.heldCodes.has(code)); }

  /**
   * Returns and resets the accumulated mouse delta.
   * @returns {{x:number,y:number}} Pixels moved since last call.
   */
  consumeMouseDelta() {
    const delta = { x: this.mouseDeltaX, y: this.mouseDeltaY };
    this.mouseDeltaX = 0; this.mouseDeltaY = 0;
    return delta;
  }

  /**
   * Returns the human readable label for the first key of an action.
   * @param {string} action - Action name.
   * @returns {string} Label such as 'E' or 'LMB'.
   */
  getKeyLabel(action) { return InputManager.formatCode(this.keybinds[action][0]); }

  /**
   * Formats all keys of an action, e.g. 'W / ↑'.
   * @param {string} action - Action name.
   * @returns {string} Joined label list.
   */
  getAllKeyLabels(action) { return this.keybinds[action].map(InputManager.formatCode).join(' / '); }

  /**
   * Converts a KeyboardEvent.code into a short label.
   * @param {string} code - Key code.
   * @returns {string} Display label.
   */
  static formatCode(code) {
    const special = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', ShiftLeft: 'Shift', ShiftRight: 'Shift', Mouse0: 'LMB', Escape: 'Esc' };
    return special[code] || code.replace(/^Key/, '');
  }
}

/** Procedural WebAudio: ambience, rain, footsteps, doors, thunder. No external assets required. */
class AudioManager {
  /**
   * @param {Object} config - CONFIG.audio section.
   */
  constructor(config) {
    this.config = config;
    this.context = null;
    this.master = null;
    this.rainGain = null;
    this.noiseBuffer = null;
    this.muted = false;
    this.volume = config.masterVolume;
  }

  /**
   * Creates (or resumes) the audio graph. Must be called from a user gesture.
   * @returns {void}
   */
  start() {
    if (this.context) { this.context.resume(); return; }
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      this.context = new Ctor();
    } catch (err) { return; }
    const ctx = this.context;
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.volume;
    this.master.connect(ctx.destination);
    this.noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const data = this.noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    this._startDrone();
    this._startRain();
  }

  /**
   * Starts the low electrical hum + ventilation bed.
   * @returns {void}
   */
  _startDrone() {
    const ctx = this.context;
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass'; lowpass.frequency.value = 220;
    const droneGain = ctx.createGain();
    droneGain.gain.value = this.config.droneGain;
    [[50, 'sine'], [100.6, 'triangle'], [151, 'sine']].forEach(([freq, type], i) => {
      const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = i === 0 ? 1 : 0.35;
      osc.connect(g); g.connect(lowpass); osc.start();
    });
    lowpass.connect(droneGain); droneGain.connect(this.master);
    const vent = ctx.createBufferSource(); vent.buffer = this.noiseBuffer; vent.loop = true;
    const ventFilter = ctx.createBiquadFilter(); ventFilter.type = 'lowpass'; ventFilter.frequency.value = 380;
    const ventGain = ctx.createGain(); ventGain.gain.value = 0.045;
    vent.connect(ventFilter); ventFilter.connect(ventGain); ventGain.connect(this.master); vent.start();
  }

  /**
   * Starts the rain bed (silent until setRainLevel raises it).
   * @returns {void}
   */
  _startRain() {
    const ctx = this.context;
    const source = ctx.createBufferSource(); source.buffer = this.noiseBuffer; source.loop = true;
    const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 3400; band.Q.value = 0.45;
    this.rainGain = ctx.createGain(); this.rainGain.gain.value = 0;
    source.connect(band); band.connect(this.rainGain); this.rainGain.connect(this.master); source.start();
  }

  /**
   * Sets rain loudness.
   * @param {number} level - 0..1 rain intensity.
   * @returns {void}
   */
  setRainLevel(level) {
    if (this.rainGain) this.rainGain.gain.setTargetAtTime(level * this.config.rainGain, this.context.currentTime, 0.3);
  }

  /**
   * Sets master volume.
   * @param {number} value - 0..1 volume.
   * @returns {void}
   */
  setVolume(value) {
    this.volume = value;
    if (this.master && !this.muted) this.master.gain.setTargetAtTime(value, this.context.currentTime, 0.05);
  }

  /**
   * Mutes or unmutes all output.
   * @param {boolean} muted - Desired mute state.
   * @returns {void}
   */
  setMuted(muted) {
    this.muted = muted;
    if (this.master) this.master.gain.setTargetAtTime(muted ? 0 : this.volume, this.context.currentTime, 0.05);
  }

  /**
   * Plays a short filtered noise burst.
   * @param {Object} o - Options: duration, freq, freqEnd, q, gain, type, delay.
   * @returns {void}
   */
  _noiseBurst({ duration, freq, freqEnd = freq, q = 1, gain, type = 'bandpass', delay = 0 }) {
    if (!this.context) return;
    const ctx = this.context, start = ctx.currentTime + delay;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer;
    const filter = ctx.createBiquadFilter(); filter.type = type; filter.Q.value = q;
    filter.frequency.setValueAtTime(freq, start); filter.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), start + duration);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, start); env.gain.exponentialRampToValueAtTime(gain, start + 0.012);
    env.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    src.connect(filter); filter.connect(env); env.connect(this.master);
    src.start(start, Math.random()); src.stop(start + duration + 0.05);
  }

  /**
   * Plays a sine tone with exponential decay.
   * @param {number} freq - Frequency in Hz.
   * @param {number} duration - Length in seconds.
   * @param {number} gain - Peak gain.
   * @param {number} [delay] - Start delay in seconds.
   * @returns {void}
   */
  _tone(freq, duration, gain, delay = 0) {
    if (!this.context) return;
    const ctx = this.context, start = ctx.currentTime + delay;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
    const env = ctx.createGain();
    env.gain.setValueAtTime(gain, start); env.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(env); env.connect(this.master); osc.start(start); osc.stop(start + duration + 0.05);
  }

  /**
   * Plays a footstep.
   * @param {boolean} isSprinting - Louder and sharper when sprinting.
   * @returns {void}
   */
  playFootstep(isSprinting) {
    const gain = isSprinting ? this.config.footstepSprintGain : this.config.footstepWalkGain;
    this._noiseBurst({ duration: 0.09, freq: 520 + Math.random() * 180, freqEnd: 180, q: 0.8, gain, type: 'lowpass' });
  }
  /**
   * Plays the elevator arrival chime.
   * @returns {void}
   */
  playElevatorDing() { this._tone(880, 1.1, 0.08); this._tone(1320, 1.4, 0.05, 0.12); }
  /**
   * Plays a pneumatic door sweep.
   * @returns {void}
   */
  playDoor() { this._noiseBurst({ duration: 0.45, freq: 1800, freqEnd: 400, q: 0.7, gain: 0.07 }); }
  /**
   * Plays an item pickup blip.
   * @returns {void}
   */
  playPickup() { this._tone(660, 0.18, 0.06); this._tone(990, 0.22, 0.05, 0.08); }
  /**
   * Plays a rumble of thunder after a delay.
   * @param {number} delay - Seconds until the thunder starts.
   * @returns {void}
   */
  playThunder(delay) { this._noiseBurst({ duration: 2.8, freq: 360, freqEnd: 50, q: 0.5, gain: 0.35, type: 'lowpass', delay }); }
}

/** Observable key-value store for user adjustable settings (persisted when storage is available). */
class SettingsStore {
  /**
   * @param {Object} defaults - Default values (CONFIG.defaultSettings).
   */
  constructor(defaults) {
    this.values = { ...defaults };
    this.listeners = new Set();
    this._load();
  }
  /**
   * Reads one setting.
   * @param {string} key - Setting id.
   * @returns {*} Current value.
   */
  get(key) { return this.values[key]; }
  /**
   * Writes one setting, persists, and notifies subscribers.
   * @param {string} key - Setting id.
   * @param {*} value - New value.
   * @returns {void}
   */
  set(key, value) {
    this.values[key] = value;
    this.listeners.forEach((fn) => fn(key, value));
    try { localStorage.setItem('scp-explorer-settings', JSON.stringify(this.values)); } catch (err) { /* storage unavailable */ }
  }
  /**
   * Subscribes to changes.
   * @param {function(string,*):void} listener - Callback receiving (key, value).
   * @returns {function():void} Unsubscribe function.
   */
  subscribe(listener) { this.listeners.add(listener); return () => this.listeners.delete(listener); }
  /**
   * Loads persisted values, ignoring unknown keys.
   * @returns {void}
   */
  _load() {
    try {
      const saved = JSON.parse(localStorage.getItem('scp-explorer-settings') || '{}');
      Object.keys(saved).forEach((key) => { if (key in this.values && typeof saved[key] === typeof this.values[key]) this.values[key] = saved[key]; });
    } catch (err) { /* ignore */ }
  }
}

/* ============================== 3. TEXTURES & MATERIALS ============================== */

/**
 * Draws soft circular splats (wrapping around the edges so the texture tiles seamlessly).
 * @param {CanvasRenderingContext2D} ctx - Target context.
 * @param {number} size - Canvas size in pixels.
 * @param {SeededRandom} rng - Random source.
 * @param {Object} o - count, minR, maxR, tone [min,max gray], alpha.
 * @returns {void}
 */
function drawSplats(ctx, size, rng, { count, minR, maxR, tone, alpha }) {
  for (let i = 0; i < count; i++) {
    const x = rng.next() * size, y = rng.next() * size, r = rng.range(minR, maxR);
    const g = Math.floor(rng.range(tone[0], tone[1]));
    ctx.fillStyle = `rgba(${g},${g},${g},${alpha})`;
    for (const ox of [-size, 0, size]) {
      for (const oy of [-size, 0, size]) {
        const px = x + ox, py = y + oy;
        if (px + r < 0 || px - r > size || py + r < 0 || py - r > size) continue;
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

/**
 * Fills a canvas with a flat colour.
 * @param {CanvasRenderingContext2D} ctx - Target context.
 * @param {number} size - Canvas size.
 * @param {string} color - CSS colour.
 * @returns {void}
 */
function fillCanvas(ctx, size, color) { ctx.fillStyle = color; ctx.fillRect(0, 0, size, size); }

/** Recipes describing how to paint each surface type (colour, height → normal map, roughness). */
const SurfaceRecipes = {
  /**
   * Weathered concrete.
   * @param {string} base - Base CSS colour.
   * @returns {Object} Recipe.
   */
  concrete(base) {
    return {
      normalStrength: 2.2,
      color(ctx, s, rng) {
        fillCanvas(ctx, s, base);
        drawSplats(ctx, s, rng, { count: 220, minR: s * 0.02, maxR: s * 0.1, tone: [20, 200], alpha: 0.045 });
        drawSplats(ctx, s, rng, { count: 1600, minR: 0.6, maxR: 1.8, tone: [10, 220], alpha: 0.22 });
      },
      height(ctx, s, rng) { fillCanvas(ctx, s, '#808080'); drawSplats(ctx, s, rng, { count: 900, minR: 1, maxR: 4, tone: [40, 220], alpha: 0.25 }); },
      rough(ctx, s, rng) { fillCanvas(ctx, s, '#d6d6d6'); drawSplats(ctx, s, rng, { count: 160, minR: s * 0.02, maxR: s * 0.09, tone: [150, 255], alpha: 0.12 }); }
    };
  },
  /**
   * Grid of tiles (optionally alternating for a checker pattern).
   * @param {Object} o - base, alt, grout colours; count per texture; variance %; gloss/groutRough 0..255.
   * @returns {Object} Recipe.
   */
  tiles({ base, alt = null, grout, count = 4, variance = 10, gloss = 60, groutRough = 210 }) {
    return {
      normalStrength: 3,
      color(ctx, s, rng) {
        fillCanvas(ctx, s, grout);
        const cell = s / count, gap = Math.max(2, s / 170);
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            const rgb = hexToRgb(alt && (row + col) % 2 ? alt : base);
            const k = 1 + rng.range(-variance, variance) / 100;
            ctx.fillStyle = `rgb(${Math.min(255, rgb[0] * k) | 0},${Math.min(255, rgb[1] * k) | 0},${Math.min(255, rgb[2] * k) | 0})`;
            ctx.fillRect(col * cell + gap, row * cell + gap, cell - gap * 2, cell - gap * 2);
          }
        }
        drawSplats(ctx, s, rng, { count: 500, minR: 0.6, maxR: 2.2, tone: [0, 120], alpha: 0.14 });
      },
      height(ctx, s) {
        fillCanvas(ctx, s, '#101010');
        const cell = s / count, gap = Math.max(2, s / 170);
        ctx.fillStyle = '#b8b8b8';
        for (let row = 0; row < count; row++) for (let col = 0; col < count; col++) ctx.fillRect(col * cell + gap, row * cell + gap, cell - gap * 2, cell - gap * 2);
      },
      rough(ctx, s, rng) {
        fillCanvas(ctx, s, `rgb(${groutRough},${groutRough},${groutRough})`);
        const cell = s / count, gap = Math.max(2, s / 170);
        ctx.fillStyle = `rgb(${gloss},${gloss},${gloss})`;
        for (let row = 0; row < count; row++) for (let col = 0; col < count; col++) ctx.fillRect(col * cell + gap, row * cell + gap, cell - gap * 2, cell - gap * 2);
        drawSplats(ctx, s, rng, { count: 260, minR: 2, maxR: 14, tone: [gloss, 200], alpha: 0.1 });
      }
    };
  },
  /**
   * Dense low-pile carpet.
   * @param {string} base - Base CSS colour.
   * @returns {Object} Recipe.
   */
  carpet(base) {
    return {
      normalStrength: 1.6,
      color(ctx, s, rng) { fillCanvas(ctx, s, base); drawSplats(ctx, s, rng, { count: 5200, minR: 0.5, maxR: 1.3, tone: [0, 140], alpha: 0.3 }); },
      height(ctx, s, rng) { fillCanvas(ctx, s, '#808080'); drawSplats(ctx, s, rng, { count: 5200, minR: 0.5, maxR: 1.2, tone: [30, 230], alpha: 0.4 }); },
      rough(ctx, s) { fillCanvas(ctx, s, '#f2f2f2'); }
    };
  },
  /**
   * Horizontal wooden planks.
   * @param {string} base - Base CSS colour.
   * @returns {Object} Recipe.
   */
  wood(base) {
    const planks = 6;
    return {
      normalStrength: 1.8,
      color(ctx, s, rng) {
        const rgb = hexToRgb(base), h = s / planks;
        for (let i = 0; i < planks; i++) {
          const k = 1 + rng.range(-0.18, 0.18);
          ctx.fillStyle = `rgb(${rgb[0] * k | 0},${rgb[1] * k | 0},${rgb[2] * k | 0})`;
          ctx.fillRect(0, i * h, s, h - 2);
          ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, i * h + h - 2, s, 2);
          for (let g = 0; g < 26; g++) { ctx.fillStyle = `rgba(0,0,0,${rng.range(0.03, 0.1)})`; ctx.fillRect(0, i * h + rng.next() * h, s, 1); }
        }
      },
      height(ctx, s, rng) { fillCanvas(ctx, s, '#909090'); const h = s / planks; ctx.fillStyle = '#202020'; for (let i = 0; i < planks; i++) ctx.fillRect(0, i * h + h - 2, s, 2); drawSplats(ctx, s, rng, { count: 300, minR: 1, maxR: 3, tone: [60, 200], alpha: 0.12 }); },
      rough(ctx, s) { fillCanvas(ctx, s, '#a0a0a0'); }
    };
  },
  /**
   * Diamond tread steel plate.
   * @returns {Object} Recipe.
   */
  metalPlate() {
    const drawTread = (ctx, s, a, b) => {
      const cell = s / 12;
      for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
        ctx.strokeStyle = (x + y) % 2 ? a : b; ctx.lineWidth = 3;
        ctx.beginPath();
        if ((x + y) % 2) { ctx.moveTo(x * cell + 3, y * cell + cell - 3); ctx.lineTo(x * cell + cell - 3, y * cell + 3); } else { ctx.moveTo(x * cell + 3, y * cell + 3); ctx.lineTo(x * cell + cell - 3, y * cell + cell - 3); }
        ctx.stroke();
      }
    };
    return {
      normalStrength: 3.5,
      color(ctx, s, rng) { fillCanvas(ctx, s, '#2f353b'); drawTread(ctx, s, '#59616a', '#59616a'); drawSplats(ctx, s, rng, { count: 900, minR: 0.6, maxR: 1.6, tone: [0, 100], alpha: 0.2 }); },
      height(ctx, s) { fillCanvas(ctx, s, '#303030'); drawTread(ctx, s, '#f0f0f0', '#f0f0f0'); },
      rough(ctx, s, rng) { fillCanvas(ctx, s, '#808080'); drawSplats(ctx, s, rng, { count: 200, minR: 3, maxR: 18, tone: [90, 200], alpha: 0.1 }); }
    };
  },
  /**
   * Wet paving slabs with glossy puddles (roughness 0 in puddles).
   * @returns {Object} Recipe.
   */
  pavement() {
    const slabs = 3;
    const gridPass = (ctx, s, fillBase, lineColor) => {
      fillCanvas(ctx, s, fillBase); ctx.fillStyle = lineColor; const c = s / slabs;
      for (let i = 0; i < slabs; i++) { ctx.fillRect(i * c, 0, 3, s); ctx.fillRect(0, i * c, s, 3); }
    };
    return {
      normalStrength: 2.5,
      color(ctx, s, rng) { gridPass(ctx, s, '#3a4046', '#15181b'); drawSplats(ctx, s, rng, { count: 260, minR: s * 0.02, maxR: s * 0.1, tone: [10, 170], alpha: 0.05 }); drawSplats(ctx, s, rng, { count: 1300, minR: 0.6, maxR: 1.6, tone: [0, 190], alpha: 0.2 }); },
      height(ctx, s, rng) { gridPass(ctx, s, '#909090', '#101010'); drawSplats(ctx, s, rng, { count: 700, minR: 1, maxR: 3.5, tone: [60, 220], alpha: 0.18 }); },
      rough(ctx, s, rng) {
        fillCanvas(ctx, s, '#6a6a6a');
        for (let i = 0; i < 9; i++) {
          const x = rng.next() * s, y = rng.next() * s, r = rng.range(s * 0.08, s * 0.2);
          for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) {
            const px = x + ox, py = y + oy;
            if (px + r < 0 || px - r > s || py + r < 0 || py - r > s) continue;
            const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
            grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(0.7, 'rgba(0,0,0,0.9)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
    };
  },
  /**
   * Prefabricated wall panels with seams and rivets.
   * @param {string} base - Base CSS colour.
   * @returns {Object} Recipe.
   */
  wallPanel(base) {
    return {
      normalStrength: 2.4,
      color(ctx, s, rng) {
        fillCanvas(ctx, s, base);
        drawSplats(ctx, s, rng, { count: 120, minR: s * 0.03, maxR: s * 0.14, tone: [20, 150], alpha: 0.05 });
        const c = s / 4;
        for (let i = 0; i < 4; i++) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(i * c, 0, 3, s); ctx.fillRect(0, i * c, s, 3); }
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (const [dx, dy] of [[12, 12], [c - 14, 12], [12, c - 14], [c - 14, c - 14]]) { ctx.beginPath(); ctx.arc(i * c + dx, j * c + dy, 2.4, 0, Math.PI * 2); ctx.fill(); }
      },
      height(ctx, s) {
        fillCanvas(ctx, s, '#a0a0a0'); const c = s / 4; ctx.fillStyle = '#202020';
        for (let i = 0; i < 4; i++) { ctx.fillRect(i * c, 0, 4, s); ctx.fillRect(0, i * c, s, 4); }
      },
      rough(ctx, s, rng) { fillCanvas(ctx, s, '#c8c8c8'); drawSplats(ctx, s, rng, { count: 100, minR: s * 0.02, maxR: s * 0.1, tone: [120, 230], alpha: 0.1 }); }
    };
  },
  /**
   * Yellow/black hazard stripes.
   * @returns {Object} Recipe.
   */
  hazard() {
    return {
      normalStrength: 1,
      color(ctx, s) {
        fillCanvas(ctx, s, '#15181b'); ctx.fillStyle = '#c4971c';
        for (let k = -s; k < s * 2; k += 64) { ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + 32, 0); ctx.lineTo(k + 32 - s, s); ctx.lineTo(k - s, s); ctx.closePath(); ctx.fill(); }
      },
      rough(ctx, s) { fillCanvas(ctx, s, '#9a9a9a'); }
    };
  }
};

/** Generates THREE textures (colour / normal / roughness) from SurfaceRecipes. */
class TextureFactory {
  /**
   * @param {number} maxAnisotropy - GPU maximum anisotropy (clamped to 8).
   */
  constructor(maxAnisotropy) { this.maxAnisotropy = Math.min(8, maxAnisotropy); this.rng = new SeededRandom(1337); }

  /**
   * Builds the texture set for a recipe.
   * @param {Object} recipe - Entry of SurfaceRecipes.
   * @param {number} [size] - Texture resolution in pixels.
   * @returns {{map:THREE.Texture,normalMap:?THREE.Texture,roughnessMap:?THREE.Texture}} Textures.
   */
  createSurface(recipe, size = 512) {
    const makeCanvas = () => { const c = document.createElement('canvas'); c.width = c.height = size; return c; };
    const colorCanvas = makeCanvas();
    recipe.color(colorCanvas.getContext('2d'), size, this.rng);
    const result = { map: this._toTexture(colorCanvas, true), normalMap: null, roughnessMap: null };
    if (recipe.height) {
      const heightCanvas = makeCanvas();
      recipe.height(heightCanvas.getContext('2d'), size, this.rng);
      result.normalMap = this._toTexture(this._heightToNormal(heightCanvas, recipe.normalStrength || 2), false);
    }
    if (recipe.rough) {
      const roughCanvas = makeCanvas();
      recipe.rough(roughCanvas.getContext('2d'), size, this.rng);
      result.roughnessMap = this._toTexture(roughCanvas, false);
    }
    return result;
  }

  /**
   * Wraps a canvas in a tiling texture.
   * @param {HTMLCanvasElement} canvas - Source canvas.
   * @param {boolean} isColor - True for sRGB colour data.
   * @returns {THREE.CanvasTexture} Texture.
   */
  _toTexture(canvas, isColor) {
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.anisotropy = this.maxAnisotropy;
    if (isColor) texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }

  /**
   * Converts a grayscale height canvas into a tangent-space normal map (Sobel filter, wrapping).
   * @param {HTMLCanvasElement} heightCanvas - Height source.
   * @param {number} strength - Bump intensity.
   * @returns {HTMLCanvasElement} Normal-map canvas.
   */
  _heightToNormal(heightCanvas, strength) {
    const size = heightCanvas.width;
    const src = heightCanvas.getContext('2d').getImageData(0, 0, size, size).data;
    const out = document.createElement('canvas'); out.width = out.height = size;
    const outCtx = out.getContext('2d');
    const image = outCtx.createImageData(size, size);
    const sample = (x, y) => src[(((y + size) % size) * size + ((x + size) % size)) * 4] / 255;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const dx = (sample(x + 1, y - 1) + 2 * sample(x + 1, y) + sample(x + 1, y + 1) - sample(x - 1, y - 1) - 2 * sample(x - 1, y) - sample(x - 1, y + 1)) * strength;
        const dy = (sample(x - 1, y + 1) + 2 * sample(x, y + 1) + sample(x + 1, y + 1) - sample(x - 1, y - 1) - 2 * sample(x, y - 1) - sample(x + 1, y - 1)) * strength;
        const inv = 1 / Math.sqrt(dx * dx + dy * dy + 1);
        const i = (y * size + x) * 4;
        image.data[i] = (-dx * inv * 0.5 + 0.5) * 255;
        image.data[i + 1] = (dy * inv * 0.5 + 0.5) * 255;
        image.data[i + 2] = (inv * 0.5 + 0.5) * 255;
        image.data[i + 3] = 255;
      }
    }
    outCtx.putImageData(image, 0, 0);
    return out;
  }
}

/** GLSL patches that retrofit MeshStandardMaterial with world-space UVs and planar floor reflections. */
const MaterialPatches = {
  /**
   * Applies world-space box-projected texture coordinates (works with instancing, no UV authoring needed)
   * and optionally blends in the planar reflection texture.
   * @param {THREE.MeshStandardMaterial} material - Material to patch.
   * @param {number} uvScale - Texture repeats per world metre.
   * @param {?{uniforms:Object,strength:number}} reflection - Shared reflection uniforms and strength, or null.
   * @returns {void}
   */
  applyWorldMapping(material, uvScale, reflection) {
    material.customProgramCacheKey = () => `worldmap-${reflection ? 'refl' : 'plain'}`;
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uWorldUvScale = { value: uvScale };
      let vertexCommon = '#include <common>\nuniform float uWorldUvScale;\n';
      let vertexTail = `#include <project_vertex>
        vec4 bmWorld = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          bmWorld = instanceMatrix * bmWorld;
        #endif
        bmWorld = modelMatrix * bmWorld;
        vec3 bmN = abs(objectNormal);
        vec2 bmUv = (bmN.x > bmN.y && bmN.x > bmN.z) ? bmWorld.zy : ((bmN.y > bmN.z) ? bmWorld.xz : bmWorld.xy);
        bmUv *= uWorldUvScale;
        #ifdef USE_MAP
          vMapUv = bmUv;
        #endif
        #ifdef USE_NORMALMAP
          vNormalMapUv = bmUv;
        #endif
        #ifdef USE_ROUGHNESSMAP
          vRoughnessMapUv = bmUv;
        #endif
      `;
      let fragmentCommon = '#include <common>\n';
      let fragmentTail = '#include <opaque_fragment>';
      if (reflection) {
        shader.uniforms.tReflection = reflection.uniforms.tReflection;
        shader.uniforms.uReflMatrix = reflection.uniforms.uReflMatrix;
        shader.uniforms.uReflEnabled = reflection.uniforms.uReflEnabled;
        shader.uniforms.uReflStrength = { value: reflection.strength };
        vertexCommon += 'uniform mat4 uReflMatrix;\nvarying vec4 vReflUv;\n';
        vertexTail += 'vReflUv = uReflMatrix * vec4(bmWorld.xyz, 1.0);\n';
        fragmentCommon += 'uniform sampler2D tReflection;\nuniform float uReflEnabled;\nuniform float uReflStrength;\nvarying vec4 vReflUv;\n';
        fragmentTail = `
          if (uReflEnabled > 0.5) {
            vec3 viewDir = normalize(vViewPosition);
            float fresnel = 0.07 + 0.93 * pow(1.0 - clamp(dot(viewDir, normal), 0.0, 1.0), 4.0);
            float gloss = clamp(1.0 - roughnessFactor, 0.0, 1.0);
            vec2 ruv = vReflUv.xy / vReflUv.w + normal.xy * 0.03 * (0.25 + gloss);
            float blur = roughnessFactor * 0.014 + 0.0012;
            vec3 refl = texture2D(tReflection, ruv).rgb * 0.4;
            refl += texture2D(tReflection, ruv + vec2(blur, 0.0)).rgb * 0.15;
            refl += texture2D(tReflection, ruv - vec2(blur, 0.0)).rgb * 0.15;
            refl += texture2D(tReflection, ruv + vec2(0.0, blur)).rgb * 0.15;
            refl += texture2D(tReflection, ruv - vec2(0.0, blur)).rgb * 0.15;
            outgoingLight += refl * gloss * gloss * fresnel * uReflStrength;
          }
          #include <opaque_fragment>
        `;
      }
      shader.vertexShader = shader.vertexShader.replace('#include <common>', vertexCommon).replace('#include <project_vertex>', vertexTail);
      shader.fragmentShader = shader.fragmentShader.replace('#include <common>', fragmentCommon).replace('#include <opaque_fragment>', fragmentTail);
    };
  }
};

/** Creates and stores every material used by the world. */
class MaterialLibrary {
  /**
   * @param {TextureFactory} textureFactory - Procedural texture generator.
   * @param {Object} reflectionUniforms - Shared uniforms {tReflection,uReflMatrix,uReflEnabled}.
   */
  constructor(textureFactory, reflectionUniforms) {
    this.textures = textureFactory;
    this.reflectionUniforms = reflectionUniforms;
    this.materials = new Map();
    this._defineAll();
  }

  /**
   * Fetches a material by key.
   * @param {string} key - Material name.
   * @returns {THREE.Material} The material.
   */
  get(key) {
    const material = this.materials.get(key);
    if (!material) throw new Error(`Unknown material: ${key}`);
    return material;
  }

  /**
   * Creates a textured, world-mapped standard material.
   * @param {string} key - Storage key.
   * @param {Object} recipe - SurfaceRecipes entry.
   * @param {Object} o - uvScale, roughness, metalness, color, reflection, envMapIntensity, size.
   * @returns {void}
   */
  _worldMapped(key, recipe, { uvScale, roughness = 1, metalness = 0, color = 0xffffff, reflection = 0, envMapIntensity = 0.5, size = 512 }) {
    const surface = this.textures.createSurface(recipe, size);
    const material = new THREE.MeshStandardMaterial({ map: surface.map, normalMap: surface.normalMap, roughnessMap: surface.roughnessMap, roughness, metalness, color, envMapIntensity });
    MaterialPatches.applyWorldMapping(material, uvScale, reflection > 0 ? { uniforms: this.reflectionUniforms, strength: reflection } : null);
    this.materials.set(key, material);
  }

  /**
   * Creates a plain material.
   * @param {string} key - Storage key.
   * @param {Object} params - Constructor parameters.
   * @param {Function} [Ctor] - Material class.
   * @returns {void}
   */
  _plain(key, params, Ctor = THREE.MeshStandardMaterial) { this.materials.set(key, new Ctor(params)); }

  /**
   * Defines the full material palette.
   * @returns {void}
   */
  _defineAll() {
    const R = SurfaceRecipes;
    this._worldMapped('wallPanel', R.wallPanel('#69747f'), { uvScale: 1 / 2.4, roughness: 0.9 });
    this._worldMapped('wallConcrete', R.concrete('#5b6167'), { uvScale: 1 / 2.2, roughness: 0.95 });
    this._worldMapped('wallTile', R.tiles({ base: '#78858c', grout: '#3a4247', count: 6, variance: 8, gloss: 130, groutRough: 220 }), { uvScale: 1 / 2.4, roughness: 0.8 });
    this._worldMapped('ceiling', R.tiles({ base: '#4a5057', grout: '#262a2e', count: 4, variance: 6, gloss: 200, groutRough: 230 }), { uvScale: 1 / 2.4, roughness: 0.95 });
    this._worldMapped('floorLobby', R.tiles({ base: '#2d3338', grout: '#121517', count: 4, variance: 8, gloss: 40 }), { uvScale: 1 / 2.4, reflection: 1.0, envMapIntensity: 0.9 });
    this._worldMapped('floorCorridor', R.tiles({ base: '#454d54', grout: '#1a1d20', count: 4, variance: 8, gloss: 55 }), { uvScale: 1 / 2.4, reflection: 0.9, envMapIntensity: 0.8 });
    this._worldMapped('floorOffice', R.carpet('#2a3441'), { uvScale: 1 / 1.6, roughness: 1 });
    this._worldMapped('floorCafeteria', R.tiles({ base: '#8a9096', alt: '#2e353b', grout: '#15181a', count: 8, variance: 5, gloss: 70 }), { uvScale: 1 / 2.4, reflection: 0.7, envMapIntensity: 0.7 });
    this._worldMapped('floorArmoury', R.metalPlate(), { uvScale: 1 / 1.6, reflection: 0.35, envMapIntensity: 0.6 });
    this._worldMapped('floorDorm', R.wood('#6b5340'), { uvScale: 1 / 1.6, reflection: 0.3, envMapIntensity: 0.5 });
    this._worldMapped('floorMedical', R.tiles({ base: '#86939a', grout: '#4f595e', count: 4, variance: 5, gloss: 50 }), { uvScale: 1 / 2.4, reflection: 0.75, envMapIntensity: 0.7 });
    this._worldMapped('floorStorage', R.concrete('#4b5056'), { uvScale: 1 / 2.2, reflection: 0.2, envMapIntensity: 0.4 });
    this._worldMapped('floorCourtyard', R.pavement(), { uvScale: 1 / 3.6, reflection: 1.25, envMapIntensity: 1.0 });
    this._worldMapped('floorSub', R.tiles({ base: '#252b30', grout: '#0d0f11', count: 4, variance: 8, gloss: 38 }), { uvScale: 1 / 2.4, reflection: 1.0, envMapIntensity: 0.9 });
    this._worldMapped('floorCell', R.concrete('#383d42'), { uvScale: 1 / 2.2, reflection: 0.25, envMapIntensity: 0.4 });
    this._worldMapped('wood', R.wood('#8a6a50'), { uvScale: 1 / 1.2, roughness: 0.75 });
    this._worldMapped('hazard', R.hazard(), { uvScale: 1 / 1.28, roughness: 0.8, size: 256 });
    this._plain('paint', { color: 0xffffff, roughness: 0.82, metalness: 0.0 });
    this._plain('plastic', { color: 0xffffff, roughness: 0.42, metalness: 0.05 });
    this._plain('metal', { color: 0xaab2ba, roughness: 0.36, metalness: 0.9 });
    this._plain('darkMetal', { color: 0x2b3137, roughness: 0.45, metalness: 0.75 });
    this._plain('fabric', { color: 0xffffff, roughness: 1.0, metalness: 0.0 });
    this._plain('foliage', { color: 0xffffff, roughness: 0.9, metalness: 0.0 });
    this._plain('emissive', { color: 0xffffff, toneMapped: false }, THREE.MeshBasicMaterial);
    this._plain('doorMetal', { color: 0x38414a, roughness: 0.4, metalness: 0.8, envMapIntensity: 1.0 });
    this._plain('glass', { color: 0x9fcad6, roughness: 0.04, metalness: 0.0, transparent: true, opacity: 0.16, envMapIntensity: 2.0, depthWrite: false, side: THREE.DoubleSide });
  }
}

/* ============================== 4. LIGHTING ============================== */

/**
 * Pool of real PointLights that is re-assigned every fraction of a second to the light sources nearest the
 * player. Hundreds of fixtures can exist in the world while the GPU only ever shades a constant, small number
 * of lights (the shader never recompiles because the pool size is fixed).
 */
class DynamicLightPool {
  /**
   * @param {THREE.Scene} scene - Scene receiving the pooled lights.
   * @param {Object} config - CONFIG.lighting section.
   */
  constructor(scene, config) {
    this.config = config;
    this.sources = [];
    this.timer = 0;
    this.pool = [];
    for (let i = 0; i < config.dynamicLightCount; i++) {
      const light = new THREE.PointLight(0xffffff, 0, config.lightDistance, 2);
      scene.add(light);
      this.pool.push({ light, source: null, weight: 0, target: 0 });
    }
  }

  /**
   * Registers a light source (a fixture that can be picked up by the pool).
   * @param {number} level - Level index the fixture belongs to.
   * @param {THREE.Vector3} position - World position.
   * @param {Object} o - color, intensity, distance.
   * @returns {Object} Source record (mutate .scale to dim/flicker).
   */
  register(level, position, { color = 0xffffff, intensity = 30, distance = this.config.lightDistance } = {}) {
    const source = { level, position: position.clone(), color: new THREE.Color(color), intensity, distance, scale: 1, dist: 0 };
    this.sources.push(source);
    return source;
  }

  /**
   * Re-selects the nearest sources and eases light intensities.
   * @param {number} dt - Delta seconds.
   * @param {THREE.Vector3} focus - Position to be closest to (camera/player).
   * @param {number} level - Active level index.
   * @param {boolean} [force] - Apply selection immediately without easing (used for probe baking).
   * @returns {void}
   */
  update(dt, focus, level, force = false) {
    this.timer -= dt;
    if (this.timer <= 0 || force) { this.timer = this.config.selectionIntervalSeconds; this._select(focus, level); }
    const k = force ? 1 : 1 - Math.exp(-this.config.weightSharpness * dt);
    for (const entry of this.pool) {
      entry.weight += (entry.target - entry.weight) * k;
      const src = entry.source;
      entry.light.intensity = src ? src.intensity * src.scale * entry.weight : 0;
    }
  }

  /**
   * Chooses the nearest sources of the active level and assigns them to pool lights.
   * @param {THREE.Vector3} focus - Reference position.
   * @param {number} level - Active level.
   * @returns {void}
   */
  _select(focus, level) {
    const candidates = [];
    for (const s of this.sources) { if (s.level === level) { s.dist = s.position.distanceTo(focus); candidates.push(s); } }
    candidates.sort((a, b) => a.dist - b.dist);
    const count = this.pool.length;
    const limit = candidates.length > count ? candidates[count].dist : Infinity;
    const chosen = candidates.slice(0, count);
    const free = this.pool.filter((entry) => !chosen.includes(entry.source));
    const kept = new Set(this.pool.filter((entry) => chosen.includes(entry.source)).map((entry) => entry.source));
    for (const src of chosen) {
      if (kept.has(src)) { const entry = this.pool.find((e) => e.source === src); entry.target = limit === Infinity ? 1 : 1 - MathUtil.smoothstep(limit * 0.7, limit, src.dist); continue; }
      const entry = free.pop();
      entry.source = src; entry.weight = 0; entry.target = 1;
      entry.light.position.copy(src.position); entry.light.color.copy(src.color); entry.light.distance = src.distance;
    }
    for (const entry of free) { entry.target = 0; if (entry.weight < 0.01) entry.source = null; }
  }
}

/** Animates fixtures that flicker, buzz or pulse (faulty lights, red alarms, anomalous glow). */
class FlickerController {
  constructor() { this.items = []; }
  /**
   * Adds a flickering fixture.
   * @param {Object} source - Light source record from DynamicLightPool.register.
   * @param {?THREE.Mesh} mesh - Visible emissive mesh (MeshBasicMaterial) or null.
   * @param {THREE.Color} baseColor - Emissive colour at full brightness.
   * @param {string} pattern - 'faulty' | 'buzz' | 'pulse' | 'slowPulse'.
   * @param {number} [phase] - Time offset.
   * @returns {void}
   */
  add(source, mesh, baseColor, pattern, phase = 0) { this.items.push({ source, mesh, baseColor, pattern, phase, value: 1 }); }

  /**
   * Evaluates a flicker pattern.
   * @param {string} pattern - Pattern name.
   * @param {number} time - Time in seconds.
   * @returns {number} Brightness 0..1.
   */
  static evaluate(pattern, time) {
    switch (pattern) {
      case 'faulty': return (Math.sin(time * 37) * Math.sin(time * 11.3) > 0.62 || (time * 0.37) % 1 > 0.94) ? 0.04 : 1;
      case 'buzz': return 0.86 + 0.14 * Math.sin(time * 61) * Math.sin(time * 7.3);
      case 'pulse': return 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(time * 3.2));
      default: return 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(time * 1.1));
    }
  }

  /**
   * Updates all flickering fixtures.
   * @param {number} time - Elapsed time in seconds.
   * @returns {void}
   */
  update(time) {
    for (const item of this.items) {
      item.value = FlickerController.evaluate(item.pattern, time + item.phase);
      item.source.scale = item.value;
      if (item.mesh) item.mesh.material.color.copy(item.baseColor).multiplyScalar(item.value);
    }
  }
}

/** Bakes small cube-map probes so metals/glass pick up a believable environment. */
class EnvironmentProbes {
  /**
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @param {THREE.Scene} scene - Scene to capture.
   * @param {number} size - Cube face size.
   */
  constructor(renderer, scene, size) {
    this.renderer = renderer; this.scene = scene; this.size = size;
    this.pmrem = new THREE.PMREMGenerator(renderer);
    this.textures = new Map();
  }
  /**
   * Captures the scene from a point and stores a prefiltered environment texture.
   * @param {string} key - Probe name.
   * @param {THREE.Vector3} position - World capture position.
   * @returns {void}
   */
  bake(key, position) {
    const target = new THREE.WebGLCubeRenderTarget(this.size, { type: THREE.HalfFloatType });
    const camera = new THREE.CubeCamera(0.1, 120, target);
    camera.children.forEach((c) => c.layers.enable(1));
    camera.position.copy(position);
    this.scene.add(camera);
    this.renderer.shadowMap.needsUpdate = true;
    camera.update(this.renderer, this.scene);
    this.scene.remove(camera);
    this.textures.set(key, this.pmrem.fromCubemap(target.texture).texture);
    target.dispose();
  }
  /**
   * Retrieves a baked probe texture.
   * @param {string} key - Probe name.
   * @returns {?THREE.Texture} Texture or null.
   */
  get(key) { return this.textures.get(key) || null; }
}

/* ============================== 5. PARTICLES & SKY ============================== */

/** Uniforms shared by every particle material (time and pixel scale for point sizes). */
const ParticleUniforms = { uTime: { value: 0 }, uScale: { value: 1000 } };

/** GPU driven floating motes / orbiting sparkles / soft fog puffs (all animation happens in the vertex shader). */
class MoteField {
  /**
   * @param {Object} o - count, box [x,y,z], color, intensity, size, speed, opacity, orbit (bool), follow (bool), center (Vector3).
   */
  constructor({ count, box, color, intensity = 1, size = 0.03, speed = 1, opacity = 1, orbit = false, follow = false, center = new THREE.Vector3(), seed = 5 }) {
    const rng = new SeededRandom(seed);
    const seeds = new Float32Array(count * 4);
    for (let i = 0; i < seeds.length; i++) seeds[i] = rng.next();
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
    this.follow = follow;
    this.material = new THREE.ShaderMaterial({
      uniforms: {
        uTime: ParticleUniforms.uTime, uScale: ParticleUniforms.uScale,
        uCenter: { value: center.clone() }, uBox: { value: new THREE.Vector3(...box) },
        uColor: { value: new THREE.Color(color) }, uIntensity: { value: intensity }, uSize: { value: size },
        uSpeed: { value: speed }, uOpacity: { value: opacity }, uMode: { value: orbit ? 1 : 0 }
      },
      vertexShader: `
        uniform float uTime, uScale, uSize, uSpeed, uMode; uniform vec3 uCenter, uBox; attribute vec4 aSeed; varying float vAlpha;
        void main() {
          vec3 p;
          if (uMode < 0.5) {
            vec3 drift = vec3(sin(uTime*0.3*uSpeed+aSeed.w*20.0), sin(uTime*0.23*uSpeed+aSeed.w*11.0)*0.5, cos(uTime*0.27*uSpeed+aSeed.w*17.0))*0.6;
            vec3 w = aSeed.xyz*uBox + drift; w.y += uTime*0.03*uSpeed*aSeed.w;
            vec3 rel = mod(w - uCenter + uBox*0.5, uBox) - uBox*0.5; p = uCenter + rel;
          } else {
            float a = uTime*uSpeed*(0.4+aSeed.w) + aSeed.x*6.2831; float r = uBox.x*(0.35+aSeed.y*0.65);
            p = uCenter + vec3(cos(a)*r, (aSeed.z-0.5)*uBox.y + sin(a*1.7+aSeed.w*9.0)*0.3, sin(a)*r);
          }
          vec4 mv = viewMatrix*vec4(p,1.0); gl_Position = projectionMatrix*mv;
          float tw = 0.5 + 0.5*sin(uTime*(1.5+aSeed.w*3.0)+aSeed.w*40.0);
          gl_PointSize = max(1.0, uSize*(0.6+aSeed.w*0.8)*uScale/max(0.1,-mv.z));
          vAlpha = (0.25+0.75*tw)*smoothstep(0.2,1.5,-mv.z);
        }`,
      fragmentShader: `
        uniform vec3 uColor; uniform float uIntensity, uOpacity; varying float vAlpha;
        void main() { float d = length(gl_PointCoord-0.5)*2.0; float a = smoothstep(1.0,0.0,d); gl_FragColor = vec4(uColor*uIntensity, a*a*vAlpha*uOpacity); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.points = new THREE.Points(geometry, this.material);
    this.points.frustumCulled = false;
  }
  /**
   * Re-centres follow-camera fields.
   * @param {THREE.Vector3} cameraPosition - Camera world position.
   * @returns {void}
   */
  update(cameraPosition) { if (this.follow) this.material.uniforms.uCenter.value.copy(cameraPosition); }
}

/** Burst of falling sparks from a damaged fixture; brightness gate is driven from JS. */
class SparkEmitter {
  /**
   * @param {THREE.Vector3} origin - World emitter position.
   * @param {number} floorY - World height at which sparks vanish.
   * @param {number} count - Number of sparks.
   */
  constructor(origin, floorY, count) {
    const rng = new SeededRandom(77);
    const seeds = new Float32Array(count * 4);
    for (let i = 0; i < seeds.length; i++) seeds[i] = rng.next();
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
    this.material = new THREE.ShaderMaterial({
      uniforms: { uTime: ParticleUniforms.uTime, uScale: ParticleUniforms.uScale, uOrigin: { value: origin.clone() }, uFloor: { value: floorY }, uActive: { value: 1 } },
      vertexShader: `
        uniform float uTime, uScale, uFloor, uActive; uniform vec3 uOrigin; attribute vec4 aSeed; varying float vAlpha;
        void main() {
          float life = fract(uTime*0.9 + aSeed.w);
          vec3 vel = vec3(aSeed.x-0.5, aSeed.y*0.8+0.2, aSeed.z-0.5)*vec3(3.0,4.0,3.0);
          vec3 p = uOrigin + vel*life + vec3(0.0,-4.9*life*life,0.0);
          vec4 mv = viewMatrix*vec4(p,1.0); gl_Position = projectionMatrix*mv;
          gl_PointSize = max(1.0, 0.05*uScale/max(0.1,-mv.z));
          vAlpha = (1.0-life)*uActive*step(uFloor,p.y);
        }`,
      fragmentShader: `varying float vAlpha; void main(){ float d=length(gl_PointCoord-0.5)*2.0; gl_FragColor=vec4(vec3(3.5,1.7,0.5), smoothstep(1.0,0.0,d)*vAlpha); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.points = new THREE.Points(geometry, this.material);
    this.points.frustumCulled = false;
  }
  /**
   * Sets spark intensity (follows the fixture flicker).
   * @param {number} value - 0..1.
   * @returns {void}
   */
  setActive(value) { this.material.uniforms.uActive.value = value; }
}

/** Camera-following rain: GPU streaks plus ripple splashes on the ground. */
class RainSystem {
  /**
   * @param {Object} config - CONFIG.particles.rain.
   */
  constructor(config) {
    this.config = config;
    this.group = new THREE.Group();
    this.group.visible = false;
    const rng = new SeededRandom(2024);
    const n = config.streakCount;
    const pos = new Float32Array(n * 6), end = new Float32Array(n * 2), seed = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) {
      const x = rng.next(), y = rng.next(), z = rng.next(), s = rng.next();
      pos.set([x, y, z, x, y, z], i * 6); end[i * 2] = 0; end[i * 2 + 1] = 1; seed[i * 2] = seed[i * 2 + 1] = s;
    }
    const streakGeo = new THREE.BufferGeometry();
    streakGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    streakGeo.setAttribute('aEnd', new THREE.BufferAttribute(end, 1));
    streakGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    this.streakUniforms = {
      uTime: ParticleUniforms.uTime, uCenter: { value: new THREE.Vector3() }, uBox: { value: new THREE.Vector3(...config.box) },
      uSpeed: { value: config.speed }, uLen: { value: config.length }, uIntensity: { value: 1 }, uGround: { value: 0 }
    };
    this.streaks = new THREE.LineSegments(streakGeo, new THREE.ShaderMaterial({
      uniforms: this.streakUniforms,
      vertexShader: `
        uniform float uTime, uSpeed, uLen, uIntensity, uGround; uniform vec3 uCenter, uBox; attribute float aEnd, aSeed; varying float vAlpha;
        void main() {
          float fall = uTime*uSpeed*(0.85+0.3*aSeed);
          float y = mod(position.y*uBox.y - fall, uBox.y);
          vec3 w; w.x = uCenter.x + mod(position.x*uBox.x - uCenter.x + 0.5*uBox.x, uBox.x) - 0.5*uBox.x;
          w.z = uCenter.z + mod(position.z*uBox.z - uCenter.z + 0.5*uBox.z, uBox.z) - 0.5*uBox.z;
          w.y = uGround + y; w.x += aEnd*uLen*0.12; w.y += aEnd*uLen;
          if (aSeed > uIntensity) w = vec3(1.0e5);
          gl_Position = projectionMatrix*viewMatrix*vec4(w,1.0);
          vAlpha = (1.0 - aEnd*0.85)*0.42;
        }`,
      fragmentShader: 'varying float vAlpha; void main(){ gl_FragColor = vec4(0.62,0.72,0.88,vAlpha); }',
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    this.streaks.frustumCulled = false;
    const m = config.splashCount;
    const sp = new Float32Array(m * 3), ss = new Float32Array(m * 4);
    for (let i = 0; i < ss.length; i++) ss[i] = rng.next();
    const splashGeo = new THREE.BufferGeometry();
    splashGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    splashGeo.setAttribute('aSeed', new THREE.BufferAttribute(ss, 4));
    this.splashUniforms = {
      uTime: ParticleUniforms.uTime, uScale: ParticleUniforms.uScale, uCenter: { value: new THREE.Vector3() },
      uBox: { value: new THREE.Vector3(config.box[0] * 0.5, 1, config.box[2] * 0.5) }, uIntensity: { value: 1 }, uGround: { value: 0 }
    };
    this.splashes = new THREE.Points(splashGeo, new THREE.ShaderMaterial({
      uniforms: this.splashUniforms,
      vertexShader: `
        uniform float uTime, uScale, uIntensity, uGround; uniform vec3 uCenter, uBox; attribute vec4 aSeed; varying float vPhase;
        void main() {
          float phase = fract(uTime*(0.9+aSeed.w*0.8) + aSeed.z*7.0); vPhase = phase;
          vec3 p; p.x = uCenter.x + mod(aSeed.x*uBox.x - uCenter.x + 0.5*uBox.x, uBox.x) - 0.5*uBox.x;
          p.z = uCenter.z + mod(aSeed.y*uBox.z - uCenter.z + 0.5*uBox.z, uBox.z) - 0.5*uBox.z; p.y = uGround + 0.03;
          if (aSeed.w > uIntensity) p = vec3(1.0e5);
          vec4 mv = viewMatrix*vec4(p,1.0); gl_Position = projectionMatrix*mv;
          gl_PointSize = max(1.0, (0.05+phase*0.28)*uScale/max(0.1,-mv.z));
        }`,
      fragmentShader: `
        varying float vPhase;
        void main() { float d = length(gl_PointCoord-0.5)*2.0; float ring = smoothstep(0.18,0.0,abs(d-vPhase)); gl_FragColor = vec4(vec3(0.6,0.7,0.9), ring*(1.0-vPhase)*0.55); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    this.splashes.frustumCulled = false;
    this.group.add(this.streaks, this.splashes);
  }
  /**
   * Updates rain placement and density.
   * @param {THREE.Vector3} cameraPosition - Camera position (rain volume is centred on it).
   * @param {number} groundY - World height of the ground plane.
   * @param {number} intensity - 0..1 fraction of drops drawn (0 hides the system).
   * @returns {void}
   */
  update(cameraPosition, groundY, intensity) {
    this.group.visible = intensity > 0.01;
    if (!this.group.visible) return;
    for (const u of [this.streakUniforms, this.splashUniforms]) { u.uCenter.value.copy(cameraPosition); u.uIntensity.value = intensity; u.uGround.value = groundY; }
  }
}

/** Stormy sky dome with animated clouds and lightning flash. */
class SkyDome {
  constructor() {
    this.uniforms = { uTime: ParticleUniforms.uTime, uFlash: { value: 0 } };
    this.mesh = new THREE.Mesh(new THREE.SphereGeometry(100, 24, 16), new THREE.ShaderMaterial({
      uniforms: this.uniforms, side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position.z=gl_Position.w; }',
      fragmentShader: `
        uniform float uTime, uFlash; varying vec3 vDir;
        float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y); }
        float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
        void main() {
          float h = clamp(vDir.y, 0.0, 1.0);
          vec3 col = mix(vec3(0.07,0.09,0.12), vec3(0.012,0.017,0.03), pow(h,0.5));
          vec2 cuv = vDir.xz/(vDir.y+0.35);
          float c = fbm(cuv*1.3 + vec2(uTime*0.012, uTime*0.007));
          col = mix(col, vec3(0.16,0.18,0.22), smoothstep(0.35,0.85,c)*0.65*smoothstep(0.0,0.2,vDir.y));
          col += vec3(0.5,0.6,0.85)*uFlash*(0.25+c);
          gl_FragColor = vec4(col,1.0);
        }`
    }));
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = -10;
  }
  /**
   * Keeps the dome centred on the camera and applies lightning brightness.
   * @param {THREE.Vector3} cameraPosition - Camera position.
   * @param {number} flash - Lightning flash amount.
   * @returns {void}
   */
  update(cameraPosition, flash) { this.mesh.position.copy(cameraPosition); this.uniforms.uFlash.value = flash; }
}

/* ============================== 6. RENDER PIPELINE ============================== */

/**
 * Planar mirror used by glossy floors. Renders the scene from the camera mirrored in the horizontal plane
 * y = planeY (oblique near-plane clipping) into a low-resolution half-float texture.
 */
class PlanarReflector {
  /**
   * @param {Object} uniforms - Shared uniform objects consumed by floor materials.
   * @param {number} clipBias - Oblique clip bias.
   */
  constructor(uniforms, clipBias) {
    this.uniforms = uniforms;
    this.clipBias = clipBias;
    this.target = null;
    this.virtualCamera = new THREE.PerspectiveCamera();
    this.textureMatrix = new THREE.Matrix4();
    this.size = { w: 0, h: 0 };
    this._tmp = { normal: new THREE.Vector3(0, 1, 0), plane: new THREE.Vector3(), cam: new THREE.Vector3(), view: new THREE.Vector3(), look: new THREE.Vector3(), tgt: new THREE.Vector3(), rot: new THREE.Matrix4(), clip: new THREE.Vector4(), q: new THREE.Vector4(), plane4: new THREE.Plane() };
  }

  /**
   * (Re)creates the render target at a given size.
   * @param {number} width - Pixel width.
   * @param {number} height - Pixel height.
   * @returns {void}
   */
  resize(width, height) {
    width = Math.max(16, width | 0); height = Math.max(16, height | 0);
    if (this.size.w === width && this.size.h === height) return;
    if (this.target) this.target.dispose();
    this.target = new THREE.WebGLRenderTarget(width, height, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });
    this.size = { w: width, h: height };
    this.uniforms.tReflection.value = this.target.texture;
  }

  /**
   * Renders the mirrored view and updates shared uniforms.
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @param {THREE.Scene} scene - Scene to draw.
   * @param {THREE.PerspectiveCamera} camera - Main camera.
   * @param {number} planeY - World height of the mirror plane.
   * @returns {boolean} True if a reflection was produced.
   */
  render(renderer, scene, camera, planeY) {
    const T = this._tmp, vc = this.virtualCamera;
    T.cam.setFromMatrixPosition(camera.matrixWorld);
    if (T.cam.y <= planeY + 0.05 || !this.target) { this.uniforms.uReflEnabled.value = 0; return false; }
    T.plane.set(0, planeY, 0);
    T.rot.extractRotation(camera.matrixWorld);
    T.view.subVectors(T.plane, T.cam).reflect(T.normal).negate().add(T.plane);
    T.look.set(0, 0, -1).applyMatrix4(T.rot).add(T.cam);
    T.tgt.subVectors(T.plane, T.look).reflect(T.normal).negate().add(T.plane);
    vc.position.copy(T.view);
    vc.up.set(0, 1, 0).applyMatrix4(T.rot).reflect(T.normal);
    vc.lookAt(T.tgt);
    vc.near = camera.near; vc.far = camera.far;
    vc.updateMatrixWorld();
    vc.matrixWorldInverse.copy(vc.matrixWorld).invert();
    vc.projectionMatrix.copy(camera.projectionMatrix);
    this.textureMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
    this.textureMatrix.multiply(vc.projectionMatrix).multiply(vc.matrixWorldInverse);
    T.plane4.setFromNormalAndCoplanarPoint(T.normal, T.plane).applyMatrix4(vc.matrixWorldInverse);
    T.clip.set(T.plane4.normal.x, T.plane4.normal.y, T.plane4.normal.z, T.plane4.constant);
    const e = vc.projectionMatrix.elements;
    T.q.x = (Math.sign(T.clip.x) + e[8]) / e[0];
    T.q.y = (Math.sign(T.clip.y) + e[9]) / e[5];
    T.q.z = -1; T.q.w = (1 + e[10]) / e[14];
    T.clip.multiplyScalar(2 / T.clip.dot(T.q));
    e[2] = T.clip.x; e[6] = T.clip.y; e[10] = T.clip.z + 1 - this.clipBias; e[14] = T.clip.w;
    const previousTarget = renderer.getRenderTarget();
    renderer.setRenderTarget(this.target);
    renderer.clear();
    renderer.render(scene, vc);
    renderer.setRenderTarget(previousTarget);
    this.uniforms.uReflMatrix.value.copy(this.textureMatrix);
    this.uniforms.uReflEnabled.value = 1;
    return true;
  }
}

/** Shared vertex shader for full-screen passes. */
const FULLSCREEN_VERTEX = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const FULLSCREEN_GEOMETRY = new THREE.PlaneGeometry(2, 2);
const FULLSCREEN_CAMERA = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/** One full-screen shader pass. */
class FullscreenPass {
  /**
   * @param {string} fragmentShader - GLSL fragment source.
   * @param {Object} uniforms - Uniform map.
   * @param {Object} [defines] - Preprocessor defines.
   */
  constructor(fragmentShader, uniforms, defines = {}) {
    this.material = new THREE.ShaderMaterial({ vertexShader: FULLSCREEN_VERTEX, fragmentShader, uniforms, defines, depthTest: false, depthWrite: false });
    this.scene = new THREE.Scene();
    const mesh = new THREE.Mesh(FULLSCREEN_GEOMETRY, this.material);
    mesh.frustumCulled = false;
    this.scene.add(mesh);
  }
  /**
   * Draws the pass.
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @param {?THREE.WebGLRenderTarget} target - Output target (null = screen).
   * @returns {void}
   */
  render(renderer, target) { renderer.setRenderTarget(target); renderer.render(this.scene, FULLSCREEN_CAMERA); }
}

/**
 * HDR post-processing chain: MSAA scene → depth of field → bloom (bright/blur) →
 * composite (depth-reprojection motion blur, exposure, ACES tone-map, grade, vignette, grain).
 */
class PostProcessor {
  /**
   * @param {THREE.WebGLRenderer} renderer - Renderer.
   * @param {SettingsStore} settings - User settings.
   * @param {Object} config - CONFIG.postFx.
   */
  constructor(renderer, settings, config) {
    this.renderer = renderer; this.settings = settings; this.config = config;
    this.targets = {};
    this.prevViewProj = new THREE.Matrix4();
    this.viewProj = new THREE.Matrix4();
    this.invViewProj = new THREE.Matrix4();
    this.hasPrev = false;
    this._tmpVec = new THREE.Vector3();
    this._buildPasses();
  }

  /**
   * Creates all shader passes.
   * @returns {void}
   */
  _buildPasses() {
    const cfg = this.config;
    this.dofUniforms = { tColor: { value: null }, tDepth: { value: null }, uTexel: { value: new THREE.Vector2() }, uNear: { value: 0.1 }, uFar: { value: 100 }, uFocus: { value: 3.3 }, uRange: { value: cfg.dofFocusRange }, uMaxBlur: { value: 0 } };
    this.dofPass = new FullscreenPass(`
      uniform sampler2D tColor, tDepth; uniform vec2 uTexel; uniform float uNear, uFar, uFocus, uRange, uMaxBlur; varying vec2 vUv;
      float linearDepth(float d){ float z = d*2.0-1.0; return (2.0*uNear*uFar)/(uFar+uNear - z*(uFar-uNear)); }
      float cocAt(vec2 uv){ float dist = linearDepth(texture2D(tDepth, uv).x);
        float far = clamp((dist-uFocus)/uRange, 0.0, 1.0); float near = clamp((uFocus-dist)/(uFocus*0.8), 0.0, 1.0); return max(far, near*0.8); }
      void main(){
        vec4 base = texture2D(tColor, vUv); float coc = cocAt(vUv); float radius = coc*uMaxBlur;
        if (radius < 0.4) { gl_FragColor = base; return; }
        vec3 acc = base.rgb; float wsum = 1.0;
        for (int i = 0; i < DOF_TAPS; i++) {
          float fi = float(i)+1.0; float r = sqrt(fi/float(DOF_TAPS)); float a = fi*2.39996323;
          vec2 suv = vUv + vec2(cos(a), sin(a))*r*radius*uTexel;
          float w = clamp(cocAt(suv)/max(coc, 0.001), 0.1, 1.0);
          acc += texture2D(tColor, suv).rgb*w; wsum += w;
        }
        gl_FragColor = vec4(acc/wsum, 1.0);
      }`, this.dofUniforms, { DOF_TAPS: cfg.dofTaps });

    this.brightUniforms = { tColor: { value: null }, uTexel: { value: new THREE.Vector2() }, uThreshold: { value: cfg.bloomThreshold }, uKnee: { value: cfg.bloomKnee } };
    this.brightPass = new FullscreenPass(`
      uniform sampler2D tColor; uniform vec2 uTexel; uniform float uThreshold, uKnee; varying vec2 vUv;
      vec3 prefilter(vec3 c){ float br = max(c.r, max(c.g, c.b)); float soft = clamp(br-uThreshold+uKnee, 0.0, 2.0*uKnee); soft = soft*soft/(4.0*uKnee+1e-4);
        return c*(max(soft, br-uThreshold)/max(br, 1e-4)); }
      void main(){
        vec3 c = prefilter(texture2D(tColor, vUv+uTexel*vec2(-1.0,-1.0)).rgb) + prefilter(texture2D(tColor, vUv+uTexel*vec2(1.0,-1.0)).rgb)
               + prefilter(texture2D(tColor, vUv+uTexel*vec2(-1.0,1.0)).rgb) + prefilter(texture2D(tColor, vUv+uTexel*vec2(1.0,1.0)).rgb);
        gl_FragColor = vec4(min(c*0.25, vec3(12.0)), 1.0);
      }`, this.brightUniforms);

    this.blurUniforms = { tColor: { value: null }, uDir: { value: new THREE.Vector2(1, 0) } };
    this.blurPass = new FullscreenPass(`
      uniform sampler2D tColor; uniform vec2 uDir; varying vec2 vUv;
      void main(){
        vec3 c = texture2D(tColor, vUv).rgb*0.227027;
        c += (texture2D(tColor, vUv+uDir*1.3846).rgb + texture2D(tColor, vUv-uDir*1.3846).rgb)*0.3162162;
        c += (texture2D(tColor, vUv+uDir*3.2308).rgb + texture2D(tColor, vUv-uDir*3.2308).rgb)*0.0702703;
        gl_FragColor = vec4(c, 1.0);
      }`, this.blurUniforms);

    this.compositeUniforms = {
      tColor: { value: null }, tDepth: { value: null }, tBloom: { value: null },
      uInvViewProj: { value: this.invViewProj }, uPrevViewProj: { value: this.prevViewProj },
      uMotionStrength: { value: 0 }, uMotionMaxUv: { value: cfg.motionBlurMaxUv }, uMaskCenter: { value: new THREE.Vector2(0.5, 0.45) }, uMaskRadius: { value: 0 },
      uExposure: { value: 1 }, uBloomStrength: { value: 0 }, uVignette: { value: 0.5 }, uGrain: { value: 0.2 }, uTime: { value: 0 }, uAspect: { value: 1 }, uFlash: { value: 0 }
    };
    this.compositePass = new FullscreenPass(`
      uniform sampler2D tColor, tDepth, tBloom; uniform mat4 uInvViewProj, uPrevViewProj;
      uniform float uMotionStrength, uMotionMaxUv, uMaskRadius, uExposure, uBloomStrength, uVignette, uGrain, uTime, uAspect, uFlash; uniform vec2 uMaskCenter; varying vec2 vUv;
      vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
      vec3 toSrgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4))-0.055, step(vec3(0.0031308), c)); }
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        vec3 col = texture2D(tColor, vUv).rgb;
        if (uMotionStrength > 0.001) {
          float depth = texture2D(tDepth, vUv).x;
          vec4 wp = uInvViewProj*vec4(vUv*2.0-1.0, depth*2.0-1.0, 1.0); wp /= wp.w;
          vec4 pc = uPrevViewProj*wp; vec2 prevUv = (pc.xy/pc.w)*0.5+0.5;
          vec2 vel = (vUv-prevUv)*uMotionStrength; float len = length(vel);
          if (len > uMotionMaxUv) vel *= uMotionMaxUv/len;
          vec2 d = (vUv-uMaskCenter)*vec2(uAspect, 1.0);
          vel *= smoothstep(uMaskRadius*0.7, uMaskRadius*1.25, length(d));
          if (length(vel) > 0.0004) {
            vec3 acc = col;
            for (int i = 1; i < MB_SAMPLES; i++) { float f = float(i)/float(MB_SAMPLES-1) - 0.5; acc += texture2D(tColor, vUv + vel*f).rgb; }
            col = acc/float(MB_SAMPLES);
          }
        }
        col += texture2D(tBloom, vUv).rgb*uBloomStrength;
        col *= uExposure; col += vec3(0.02,0.03,0.05)*uFlash;
        col = aces(col);
        float luma = dot(col, vec3(0.299,0.587,0.114)); col = mix(vec3(luma), col, 1.06); col *= vec3(0.98,1.0,1.03);
        col = toSrgb(col);
        float vig = smoothstep(0.35, 0.98, length((vUv-0.5)*vec2(uAspect*0.78, 1.0)));
        col *= 1.0 - vig*uVignette;
        col += (hash(vUv*vec2(1920.0,1080.0)+fract(uTime)*91.7)-0.5)*uGrain*0.07;
        gl_FragColor = vec4(col, 1.0);
      }`, this.compositeUniforms, { MB_SAMPLES: cfg.motionBlurSamples });
  }

  /**
   * Creates a half-float render target.
   * @param {number} w - Width.
   * @param {number} h - Height.
   * @param {Object} [o] - depth: attach a depth texture, samples: MSAA samples.
   * @returns {THREE.WebGLRenderTarget} Target.
   */
